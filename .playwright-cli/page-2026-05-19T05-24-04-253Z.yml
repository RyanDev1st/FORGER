          - heading "Corrective Retrieval Augmented Generation" [level=1] [ref=e43]
          - generic [ref=e44]:
            - link "Shi-Qi Yan" [ref=e45] [cursor=pointer]:
              - /url: https://arxiv.org/search/cs?searchtype=author&query=Yan,+S
            - text: ","
            - link "Jia-Chen Gu" [ref=e46] [cursor=pointer]:
