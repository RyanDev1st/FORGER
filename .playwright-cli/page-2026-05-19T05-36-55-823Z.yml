          - heading "Retrieval-Augmented Generation with Conflicting Evidence" [level=1] [ref=e43]
          - generic [ref=e44]:
            - link "Han Wang" [ref=e45] [cursor=pointer]:
              - /url: https://arxiv.org/search/cs?searchtype=author&query=Wang,+H
            - text: ","
            - link "Archiki Prasad" [ref=e46] [cursor=pointer]:
