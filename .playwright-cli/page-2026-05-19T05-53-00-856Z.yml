              - text: )
            - text: suitable for questions targeting broad issues and themes where there is no ground-truth answer. This approach first uses one LLM to generate a diverse set of global sensemaking questions based on corpus-specific use cases, before using a second LLM to judge the answers of two different RAG systems using predefined criteria (defined in
            - link "Section 3.3" [ref=e141] [cursor=pointer]:
              - /url: https://arxiv.org/html/2404.16130v2#S3.SS3
            - text: ). We use this approach to compare GraphRAG to vector RAG on two representative real-world text datasets. Results show GraphRAG strongly outperforms vector RAG when using GPT-4 as the LLM.
