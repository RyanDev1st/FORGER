            - heading "3.3 Criteria for Evaluating Global Sensemaking" [level=3] [ref=e688]:
              - generic [ref=e689]: "3.3"
              - text: Criteria for Evaluating Global Sensemaking
            - paragraph [ref=e691]: Given the lack of gold standard answers to our activity-based sensemaking questions, we adopt the head-to-head comparison approach using an LLM evaluator that judges relative performance according to specific criteria. We designed three target criteria capturing qualities that are desirable for global sensemaking activities.
            - generic [ref=e692]:
              - paragraph [ref=e693]:
                - link "Appendix F" [ref=e694] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.16130v2#A6
                - text: "shows the prompts for our head-to-head measures computed using an LLM evaluator, summarized as:"
              - list [ref=e695]:
                - listitem [ref=e696]:
                  - text: •
                  - paragraph [ref=e698]:
                    - emphasis [ref=e699]: Comprehensiveness
                    - text: . How much detail does the answer provide to cover all aspects and details of the question?
                - listitem [ref=e700]:
                  - text: •
                  - paragraph [ref=e702]:
                    - emphasis [ref=e703]: Diversity
                    - text: . How varied and rich is the answer in providing different perspectives and insights on the question?
                - listitem [ref=e704]:
                  - text: •
                  - paragraph [ref=e706]:
                    - emphasis [ref=e707]: Empowerment
                    - text: . How well does the answer help the reader understand and make informed judgments about the topic?
            - paragraph [ref=e709]:
              - text: Furthermore, we use a “control criterion” called
              - emphasis [ref=e710]: Directness
              - text: that answers
              - emphasis [ref=e711]: “How specifically and clearly does the answer address the question?”
              - text: . In plain terms, directness evaluates the concision of an answer in a generic sense that applies to any generated LLM summarization. We include it to behave as a reference against which we can judge the soundness of results for the other criteria. Since directness is effectively in opposition to comprehensiveness and diversity, we would not expect any method to win across all four criteria.
            - paragraph [ref=e713]:
              - text: In our evaluations, the LLM is provided with the question, the generated answers from two competing systems, and prompted to compare the two answers according to the criterion before giving a final judgment of which answer is preferred. The LLM either indicates a winner; or, it returns a tie if they are fundamentally similar. To account for the inherent stochasticity of LLM generation, we run each comparison with multiple replicates and average the results across replicates and questions. An illustration of LLM assessment for answers to a sample question can be found in
              - link "Appendix D" [ref=e714] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.16130v2#A4
              - text: .
