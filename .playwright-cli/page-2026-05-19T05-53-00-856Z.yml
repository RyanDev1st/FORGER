          - heading "Appendix C Context Window Selection" [level=2] [ref=e4011]:
            - generic [ref=e4012]: Appendix C
            - text: Context Window Selection
          - paragraph [ref=e4014]:
            - text: The effect of context window size on any particular task is unclear, especially for models like gpt-4-turbo with a large context size of 128k tokens. Given the potential for information to be “lost in the middle” of longer contexts
            - generic [ref=e4015]:
              - text: (Liu et al.,,
              - link "2023" [ref=e4016] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.16130v2#bib.bib33
              - text: ; Kuratov et al.,,
              - link "2024" [ref=e4017] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.16130v2#bib.bib29
              - text: )
            - text: ", we wanted to explore the effects of varying the context window size for our combinations of datasets, questions, and metrics. In particular, our goal was to determine the optimum context size for our baseline condition (SS) and then use this uniformly for all query-time LLM use. To that end, we tested four context window sizes: 8k, 16k, 32k and 64k. Surprisingly, the smallest context window size tested (8k) was universally better for all comparisons on comprehensiveness (average win rate of 58.1%), while performing comparably with larger context sizes on diversity (average win rate = 52.4%), and empowerment (average win rate = 51.3%). Given our preference for more comprehensive and diverse answers, we therefore used a fixed context window size of 8k tokens for the final evaluation."
