        - generic [ref=e3823]:
          - heading "Appendix A Entity and Relationship Extraction Approach" [level=2] [ref=e3824]:
            - generic [ref=e3825]: Appendix A
            - text: Entity and Relationship Extraction Approach
          - generic [ref=e3826]:
            - paragraph [ref=e3827]: "The following prompts, designed for GPT-4, are used in the default GraphRAG initialization pipeline:"
            - list [ref=e3828]:
              - listitem [ref=e3829]:
                - text: •
                - paragraph [ref=e3831]:
                  - link "Default Graph Extraction Prompt" [ref=e3832] [cursor=pointer]:
                    - /url: https://github.com/microsoft/graphrag/blob/6d21ef268377e319a165ca2250bd6841737df1ad/graphrag/prompts/index/entity_extraction.py#L6
              - listitem [ref=e3833]:
                - text: •
                - paragraph [ref=e3835]:
                  - link "Claim Extraction Prompt" [ref=e3836] [cursor=pointer]:
                    - /url: https://github.com/microsoft/graphrag/blob/6d21ef268377e319a165ca2250bd6841737df1ad/graphrag/prompts/index/claim_extraction.py#L1
          - generic [ref=e3837]:
            - heading "A.1 Entity Extraction" [level=3] [ref=e3838]:
              - generic [ref=e3839]: A.1
              - text: Entity Extraction
            - paragraph [ref=e3841]:
              - text: We do this using a multipart LLM prompt that first identifies all
              - emphasis [ref=e3842]: entities
              - text: in the text, including their name, type, and description, before identifying all
              - emphasis [ref=e3843]: relationships
              - text: between clearly related entities, including the source and target entities and a description of their relationship. Both kinds of element instance are output in a single list of delimited tuples.
          - generic [ref=e3844]:
            - heading "A.2 Self-Reflection" [level=3] [ref=e3845]:
              - generic [ref=e3846]: A.2
              - text: Self-Reflection
            - paragraph [ref=e3848]:
              - text: The choice of prompt engineering techniques has a strong impact on the quality of knowledge graph extraction
              - generic [ref=e3849]:
                - text: (Zhu et al.,,
                - link "2024" [ref=e3850] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.16130v2#bib.bib79
                - text: )
              - text: ", and different techniques have different costs in terms of tokens consumed and generated by the model."
              - emphasis [ref=e3851]: Self-reflection
              - text: is a prompt engineering technique where the LLM generates an answer, and is then prompted to evaluate its output for correctness, clarity, or completeness, then finally generate an improved response based on that evaluation
              - generic [ref=e3852]:
                - text: (Huang et al.,,
                - link "2023" [ref=e3853] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.16130v2#bib.bib20
                - text: ; Shinn et al.,,
                - link "2024" [ref=e3854] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.16130v2#bib.bib57
                - text: ; Wang et al.,,
                - link "2022" [ref=e3855] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.16130v2#bib.bib67
                - text: ; Madaan et al.,,
                - link "2024" [ref=e3856] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.16130v2#bib.bib35
                - text: )
              - text: . We leverage self-reflection in knowledge graph extraction, and explore ways how removing self-reflection affects performance and cost.
            - paragraph [ref=e3858]:
              - text: Using larger chunk size is less costly in terms of calls to the LLM. However, the LLM tends to extract few entities from chunks of larger size. For example, in a sample dataset (HotPotQA,
              - link "Yang et al.," [ref=e3860] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.16130v2#bib.bib70
              - text: ","
              - link "2018" [ref=e3862] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.16130v2#bib.bib70
              - text: ), GPT-4 extracted almost twice as many entity references when the chunk size was 600 tokens than when it was 2400. To address this issue, we deploy a self-reflection prompt engineering approach. After entities are extracted from a chunk, we provide the extracted entities back to the LLM, prompting it to “glean” any entities that it may have missed. This is a multi-stage process in which we first ask the LLM to assess whether all entities were extracted, using a logit bias of 100 to force a yes/no decision. If the LLM responds that entities were missed, then a continuation indicating that “MANY entities were missed in the last extraction” encourages the LLM to detect these missing entities. This approach allows us to use larger chunk sizes without a drop in quality (
              - link "Figure 3" [ref=e3863] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.16130v2#A1.F3
              - text: ) or the forced introduction of noise. We interate self-reflection steps up to a specified maximum number of times.
