    - generic [ref=e4807]:
      - heading "Instructions for reporting errors" [level=2] [ref=e4808]
      - paragraph [ref=e4809]: "We are continuing to improve HTML versions of papers, and your feedback helps enhance accessibility and mobile support. To report errors in the HTML that will help us improve conversion and rendering, choose any of the methods listed below:"
      - list [ref=e4810]:
        - listitem [ref=e4811]: Click the "Report Issue" button.
        - listitem [ref=e4812]:
          - text: Open a report feedback form via keyboard, use "
          - strong [ref=e4813]: Ctrl + ?
          - text: "\"."
        - listitem [ref=e4814]: Make a text selection and click the "Report Issue for Selection" button near your cursor.
        - listitem [ref=e4815]: You can use Alt+Y to toggle on and Alt+Shift+Y to toggle off accessible reporting links at each section.
      - paragraph [ref=e4816]:
        - text: Our team has already identified
        - link "the following issues" [ref=e4817] [cursor=pointer]:
          - /url: https://github.com/arXiv/html_feedback/issues
        - text: . We appreciate your time reviewing and reporting rendering errors we may not have found yet. Your efforts will help us improve the HTML versions for all readers, because disability should not be a barrier to accessing research. Thank you for your continued support in championing open access for all.
      - paragraph [ref=e4818]:
        - text: Have a free development cycle? Help support accessibility at arXiv! Our collaborators at LaTeXML maintain a
        - link "list of packages that need conversion" [ref=e4819] [cursor=pointer]:
          - /url: https://github.com/brucemiller/LaTeXML/wiki/Porting-LaTeX-packages-for-LaTeXML
        - text: ", and welcome"
        - link "developer contributions" [ref=e4820] [cursor=pointer]:
          - /url: https://github.com/brucemiller/LaTeXML/issues
        - text: .
