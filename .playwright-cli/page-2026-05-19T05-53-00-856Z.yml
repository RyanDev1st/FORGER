        - generic [ref=e3323]:
          - heading "6 Discussion" [level=2] [ref=e3324]:
            - generic [ref=e3325]: "6"
            - text: Discussion
          - generic [ref=e3326]:
            - heading "6.1 Limitations of evaluation approach" [level=3] [ref=e3327]:
              - generic [ref=e3328]: "6.1"
              - text: Limitations of evaluation approach
            - paragraph [ref=e3330]:
              - text: Our evaluation to date has focused on sensemaking questions specific to two corpora each containing approximately 1 million tokens. More work is needed to understand how performance generalizes to datasets from various domains with different use cases. Comparison of fabrication rates, e.g., using approaches like SelfCheckGPT
              - generic [ref=e3331]:
                - text: (Manakul et al.,,
                - link "2023" [ref=e3332] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.16130v2#bib.bib36
                - text: )
              - text: ", would also strengthen the current analysis."
          - generic [ref=e3333]:
            - heading "6.2 Future work" [level=3] [ref=e3334]:
              - generic [ref=e3335]: "6.2"
              - text: Future work
            - paragraph [ref=e3337]: The graph index, rich text annotations, and hierarchical community structure supporting the current GraphRAG approach offer many possibilities for refinement and adaptation. This includes RAG approaches that operate in a more local manner, via embedding-based matching of user queries and graph annotations. In particular, we see potential in hybrid RAG schemes that combine embedding-based matching with just-in-time community report generation before employing our map-reduce summarization mechanisms. This “roll-up” approach could also be extended across multiple levels of the community hierarchy, as well as implemented as a more exploratory “drill down” mechanism that follows the information scent contained in higher-level community summaries.
            - paragraph [ref=e3339]:
              - emphasis [ref=e3340]: Broader impacts
              - text: . As a mechanism for question answering over large document collections, there are risks to downstream sensemaking and decision-making tasks if the generated answers do not accurately represent the source data. System use should be accompanied by clear disclosures of AI use and the potential for errors in outputs. Compared to vector RAG, however, GraphRAG shows promise as a way to mitigate these downstream risks for questions of a global nature, which might otherwise be answered by samples of retrieved facts falsely presented as global summaries.
        - generic [ref=e3341]:
          - heading "7 Conclusion" [level=2] [ref=e3342]:
            - generic [ref=e3343]: "7"
            - text: Conclusion
          - paragraph [ref=e3345]: We have presented GraphRAG, a RAG approach that combines knowledge graph generation and query-focused summarization (QFS) to support human sensemaking over entire text corpora. Initial evaluations show substantial improvements over a vector RAG baseline for both the comprehensiveness and diversity of answers, as well as favorable comparisons to a global but graph-free approach using map-reduce source text summarization. For situations requiring many global queries over the same dataset, summaries of root-level communities in the entity-based graph index provide a data index that is both superior to vector RAG and achieves competitive performance to other global methods at a fraction of the token cost.
