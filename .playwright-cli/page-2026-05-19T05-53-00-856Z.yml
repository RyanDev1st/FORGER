                - text: "}}"
                - text: "---Question---"
                - text: "{question}"
                - text: "---Answer 1---"
                - text: "{answer1}"
                - text: "---Answer 2---"
                - text: "{answer2}"
                - text: "Assess which answer is better according to the following measure:"
                - text: "{criteria}"
