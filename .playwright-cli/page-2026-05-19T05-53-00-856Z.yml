                - text: )
              - text: . While some RAG approaches may use alternative retrieval mechanisms, we collectively refer to the family of conventional approaches as
              - emphasis [ref=e167]: vector RAG
              - text: . GraphRAG contrasts with vector RAG in its ability to answer queries that require global sensemaking over the entire data corpus.
