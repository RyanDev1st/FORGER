                - link "7" [ref=e1009] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2510.14278v1#A1.T7
                - text: reports the QA agent’s performance when restricted to answering from the passages retrieved by our framework that contain the supporting facts. Instead of supplying only the supporting facts, we provide entire passages, and the QA agent reaches performance close to the oracle level. On 2WikiMultiHopQA, the agent achieves 61.17 EM and 54.55 F1, while on HotPotQA it reaches 62.80 EM and 59.26 F1. These results demonstrate that our retrieval framework is able to retrieve passages that are sufficiently informative for accurate answer generation.
