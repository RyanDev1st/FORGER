            - generic [ref=e221]:
              - heading "Evaluation Metrics." [level=4] [ref=e222]
              - paragraph [ref=e224]: "We assess retrieval using standard supporting fact metrics, treating each passage as the retrieval unit. A passage is correct if it contains at least one gold supporting sentence (HotpotQA, 2WikiMultihopQA) or matches a labeled supporting paragraph (MuSiQue, MultiHopRAG). We report Precision (fraction of retrieved passages that are gold) and Recall (fraction of gold passages retrieved), and also track the number of retrieved passages, as compact evidence sets improve efficiency and reduce noise. For HotpotQA and 2WikiMultihopQA, we additionally report fact-wise precision and recall at the sentence level. End-to-end QA is evaluated with Exact Match (EM) and token-level F1. We further measure performance under three conditions: (i) full context, where the QA model sees all retrieved passages including distractors, (ii) retrieved evidence only, using the filtered set from our framework, and (iii) gold evidence only, where the QA agent receives only the labeled supporting facts. This setup enables us to evaluate both retrieval quality and its effect on QA accuracy."
