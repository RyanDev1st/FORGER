                - /url: https://arxiv.org/html/2510.14278v1#S2
              - text: ", including the roles of the Question Analyzer, Selector, and Adder agents, as well as iteration depth (N = 3). We detail prompting strategies for each agent in Appendix"
              - link "B" [ref=e718] [cursor=pointer]:
                - /url: https://arxiv.org/html/2510.14278v1#A2
