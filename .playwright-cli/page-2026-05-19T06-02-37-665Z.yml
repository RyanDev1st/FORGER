        - generic [ref=e134]:
          - heading "2 Methodology" [level=2] [ref=e135]:
            - generic [ref=e136]: "2"
            - text: Methodology
          - paragraph [ref=e138]:
            - text: "We propose PRISM (Precision–Recall Iterative Selection Mechanism), an agentic retrieval framework that decomposes the multi-hop evidence gathering process into a sequence of coordinated steps. PRISM employs three LLM-based agents with distinct roles: the Question Analyzer, which decomposes complex queries into sub-questions; the Selector, which filters candidate evidence to maximize precision; and the Adder, which supplements missing evidence to improve recall. Each agent is instantiated as a prompted LLM with instructions tailored to its task. Operating in an iterative loop, these agents collectively produce a compact yet comprehensive set of supporting passages. Figure"
            - link "1" [ref=e139] [cursor=pointer]:
              - /url: https://arxiv.org/html/2510.14278v1#S1.F1
            - text: illustrates the overall architecture and data flow. We provide an illustrative example in the Appendix
            - link "A.3" [ref=e140] [cursor=pointer]:
              - /url: https://arxiv.org/html/2510.14278v1#A1.SS3
            - text: .
          - generic [ref=e141]:
            - heading "2.1 Question Analyzer Agent" [level=3] [ref=e142]:
              - generic [ref=e143]: "2.1"
              - text: Question Analyzer Agent
            - paragraph [ref=e145]:
              - text: Multi-hop questions often intertwine multiple entities, relations, and constraints into a single complex query, making it easy for retrievers or LLMs to chase partial matches or irrelevant context. The Question Analyzer mitigates this risk by decomposing the query into a structured set of sub-questions that make the evidence requirements explicit and define a focused search space for later agents
              - generic [ref=e146]:
                - text: (Fu et al.,
                - link "2021" [ref=e147] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2510.14278v1#bib.bib5
                - text: )
              - text: . This decomposition reduces the chance of missing critical hops while preventing downstream stages from being overwhelmed with loosely relevant candidates. Concretely, we prompt an LLM with a decomposition template that encourages explicit reasoning, and it returns a list of sub-questions, each targeting a distinct factual unit required to answer the original query.
          - generic [ref=e148]:
            - heading "2.2 Selector Agent" [level=3] [ref=e149]:
              - generic [ref=e150]: "2.2"
              - text: Selector Agent
            - paragraph [ref=e152]: "The Selector serves as a precision-focused filter that removes distractors introduced during retrieval. Large corpora inevitably yield passages that share surface-level words with the query but are semantically off-topic, and passing such noise directly to a QA model leads to error propagation and wasted context budget. The Selector mitigates this by enforcing a high bar for inclusion: it anchors the reasoning chain with the relevant passages that are strongly aligned with the sub-questions."
            - paragraph [ref=e154]: Concretely, the agent is prompted with detailed instructions, the sub-questions, and the retrieved passages, and tasked with outputting only those that directly support the query. This filtering stage yields evidence sets with very high precision, ensuring that downstream reasoning operates over reliable, compact inputs and mitigating hallucinations as well as lost-in-the-middle effects. The trade-off, however, is that some relevant passages may be excluded if their connection is less explicit—a limitation addressed by the Adder agent in the next stage.
          - generic [ref=e155]:
            - heading "2.3 Adder Agent" [level=3] [ref=e156]:
              - generic [ref=e157]: "2.3"
              - text: Adder Agent
            - paragraph [ref=e159]: While precision is vital, overly strict filtering risks omitting complementary or bridging facts that are crucial for multi-hop reasoning. The Adder is introduced to counterbalance this risk by explicitly prioritizing recall. Its role is to audit what the Selector left behind and add evidence that fill logical gaps—such as a spouse relation that pairs with a shared-house relation, or a bridging entity connecting two documents. This two-phase design, ensures that the final evidence set is both compact and complete. The instructions for the Adder agent are similar to the Selector’s, but with a different emphasis. We provide it with the same list of candidates, the sub-questions, and additionally indicate which evidence have already been selected by the Selector.
            - paragraph [ref=e161]: "In essence, the Adder is a second pass through the candidates, but primed to look for anything important that was left out. One common scenario is when the answer to the sub-question actually requires combining two facts from different passages. The Selector might pick one of them (e.g. a passage that gives part of the answer), not realizing another evidence from different passage is also needed for the full answer. The Adder, seeing what’s selected and what the question is, can identify the complementary piece. In the ideal outcome, after the Adder, the union of selected + added passages equals the complete set of supporting documents needed for answering the question. If the Selector already did a perfect job, the Adder will simply output nothing new. But if something was missing, the Adder ensures recall goes up. This two-phase selection is analogous to having a strict filter followed by a gentle filter: one says “only keep absolutely sure things”, the next says “don’t leave out anything that might be required”."
          - generic [ref=e162]:
            - heading "2.4 Iteration and Multi-Hop Handling" [level=3] [ref=e163]:
              - generic [ref=e164]: "2.4"
              - text: Iteration and Multi-Hop Handling
            - paragraph [ref=e166]:
              - text: Multi-hop questions typically require reasoning over multiple intermediate facts. After decomposition by the Question Analyzer, we provide the original question and all generated sub-questions together to the Selector and Adder agents. This joint formulation allows the Selector
              - math [ref=e167]:
                - generic [ref=e169]: ⇔
