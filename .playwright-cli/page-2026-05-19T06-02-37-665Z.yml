            - paragraph [ref=e171]:
              - text: The Selector
              - math [ref=e172]:
                - generic [ref=e174]: ⇔
              - text: Adder cycle is repeated for several iterations, with the evidence set refined at each step. At the end of the process, evidences from all iterations are merged and de-duplicated, producing a compact set that typically contains only the essential evidence required for the multi-hop question while maintaining high precision and recall. This final set is then passed to a Answer Generator agent.
          - generic [ref=e175]:
            - heading "2.5 Answer Generator Agent" [level=3] [ref=e176]:
              - generic [ref=e177]: "2.5"
              - text: Answer Generator Agent
            - paragraph [ref=e179]: To demonstrate the overall question answering performance of our retrieval framework we introduce a Answer Generator agent, which produces the answer given the retrieved evidence set using our proposed framework. After the Question Analyzer, Selector, and Adder agents collaboratively construct a compact but comprehensive set of supporting evidence, we provide this context along with the original question to a large language model instructed to generate the final answer. We implement the Answer Generator as a prompted LLM operating in a zero-shot setting, without task-specific fine-tuning. This design choice allows us to directly assess how improvements in retrieval quality translate into downstream QA performance, while avoiding additional supervision or domain adaptation.
