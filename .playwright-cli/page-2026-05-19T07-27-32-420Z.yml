            - heading "What Is Information Foraging?" [level=2] [ref=e182]
            - paragraph [ref=e183]:
              - text: Information foraging is the fundamental theory of how people navigate on the web to satisfy an information need. It essentially says that, when users have a certain information goal, they assess the information that they can extract from any candidate source of information relative to the cost involved in extracting that information and choose one or several candidate sources so that they
              - strong [ref=e184]: "maximize the ratio:"
            - paragraph [ref=e185]:
              - strong [ref=e186]: Rate of gain = Information value / Cost associated with obtaining that information
            - paragraph [ref=e187]: In other words, if people have a question, they will decide which webpage to go to based on (1) how likely it is that the page will provide an answer to their question, and (2) how long it’s going to take to get the answer if they go to that page.
            - paragraph [ref=e188]: (Animal-behavior science shows that a similar type of optimization holds true for animal foraging — hence, the optimal foraging theory that served as source of inspiration for Pirolli and Card. Basically, an animal needs to eat more calories than it expends, or it will starve and ultimately die without offspring. Across many generations, animals have evolved highly optimized food-foraging strategies.)
            - paragraph [ref=e189]:
              - text: In layman terms, information foraging explains
              - link "why people don’t scroll mindlessly" [ref=e190] [cursor=pointer]:
                - /url: https://www.nngroup.com/videos/scrolling-information-foraging/
              - text: "or click on every single link on the page: because they attempt to maximize the rate of gain and"
              - strong [ref=e191]: get as much relevant information in as little time as possible.
              - text: Scrolling or clicking a lot more would probably gain the user more information, but in the user’s estimation, the rate-of-gain ratio would decrease, because the numerator (the information value) would increase too little compared to the increase in the denominator (the interaction cost associated to getting the information).
            - paragraph [ref=e192]:
              - text: You may wonder how people can be so rational as to always take the action that maximizes their gain. After all, we have countless examples of people behaving irrationally, against their own interest. In fact, human behavior can be well described by what Nobel-prize winner Herbert Simon called
              - strong [ref=e193]: bounded rationality.
              - text: Whereas the choices that people make attempt to maximize benefit and minimize cost, humans have a hard time precisely estimating benefit and cost and thus use
              - link "satisficing" [ref=e194] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/satisficing/
              - text: and other
              - link "imperfect heuristics" [ref=e195] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/decision-framing-cognitive-bias-ux-pros/
              - text: to pick the most promising choices. The overall effect is still that of aiming for the highest rate of gain, even if the achieved number may not be the theoretical optimum in every case.
            - paragraph [ref=e196]: Specifically, people have no way of knowing in advance (1) how much information a patch contains; (2) how much time it will take them to extract that information. For a given task, they do know however how much real time they spent so far and how much relevant content they were able to get. In order to choose what source to look at next, they estimate how the rate of gain will change if they choose to explore a specific information source. Of course, the judgment won’t be perfect — it will simply be based on whatever external cues the information source emits.
            - figure "When people attempt to acquire information for an information need, they often look at multiple sources of information (or information patches). At any point in time, they know the real information value they have gotten so far from all the patches they’ve already visited and also the real effort (or time) spent to gather that information. To decide whether a new patch is worth exploring, they estimate how the rate of information gain will change if they choose that patch. The estimate is based the on cues that they receive from the patch about the info value of that patch (information scent) and the perceived effort needed to extract that info. It’s possible that these estimates are in fact wrong and that the real information value and effort associated with a patch are different than the user-perceived information value (or information scent) and effort." [ref=e197]:
              - emphasis [ref=e199]: When people attempt to acquire information for an information need, they often look at multiple sources of information (or information patches). At any point in time, they know the real information value they have gotten so far from all the patches they’ve already visited and also the real effort (or time) spent to gather that information. To decide whether a new patch is worth exploring, they estimate how the rate of information gain will change if they choose that patch. The estimate is based the on cues that they receive from the patch about the info value of that patch (information scent) and the perceived effort needed to extract that info. It’s possible that these estimates are in fact wrong and that the real information value and effort associated with a patch are different than the user-perceived information value (or information scent) and effort.
            - heading "Information Scent" [level=2] [ref=e200]
            - paragraph [ref=e201]:
              - text: How do people estimate how much information they will get from a page before visiting it? That’s where the concept of
              - link "information scent" [ref=e202] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/information-scent/
                - strong [ref=e203]: information scent
              - text: comes into play.
            - paragraph [ref=e204]: "Animals decide which patch to forage on based on (among other things) the scent that they catch from the environment: if the scent signals the food that the animal is interested in, it may decide to pursue it."
            - paragraph [ref=e205]:
              - text: Similarly, as a user searches for information on the web,
              - strong [ref=e206]: she judges the webpages she encounters based on how well suited they are for her goal
              - text: . Each source of information thus emits a “scent” — a signal that tells the forager how likely it is that it contains what she needs.
            - paragraph [ref=e207]: Note that, like in the animal-foraging world where different animals eat different foods, the scent is highly depending on the type of information that the user is interested in. Thus, a carnivore may be attracted by the scent of blood, whereas an herbivore may be completely insensitive to it and maybe prefer the scent of ripe fruit or fresh grass. Similarly, the same source of information can have a great scent for one user because it holds exactly what he’s interested in, but zero scent for a different user with a different information need.
            - paragraph [ref=e208]: What makes the scent of a webpage? When a person lands on that very page, the scent is given by the title, images, and the information that is easily visible above the fold. If the user is searching for dish towels and lands on a site with pictures of strawberries, beer, and candy, she may assume that this page is unlikely to contain what she needs simply because the scent points into a different direction.
            - figure "When someone looking for dish towels lands on a page with pictures of candy, beer, and strawberries, she may justifiably think that she won't find what she needs there, simply because the information-scent cues point in a different direction." [ref=e209]:
              - emphasis [ref=e211]: When someone looking for dish towels lands on a page with pictures of candy, beer, and strawberries, she may justifiably think that she won't find what she needs there, simply because the information-scent cues point in a different direction.
            - paragraph [ref=e212]:
              - text: When a person looks at a link to a page, the scent is given by all the words and images associated with that link. Thus, the same person looking for dish towels may be strongly attracted by a link called
              - emphasis [ref=e213]: Kitchen linens
              - text: next to an apron, a kitchen glove, and several dish towels.
            - figure "The link Kitchen linens and the associated image have strong information scent for the task of looking for dish towels." [ref=e214]:
              - generic [ref=e215]:
                - emphasis [ref=e216]: The link
                - text: Kitchen linens
                - emphasis [ref=e217]: and the associated image have strong information scent for the task of looking for dish towels.
            - heading "Costs of Addressing an Information Need" [level=2] [ref=e218]
            - paragraph [ref=e219]: "Remember that the rate of gain equation above includes two different variables: the information value and the cost of obtaining the information. There are two types of costs associated with obtaining information: (1) the actual time and effort involved in extracting the information from the various information sources, and (2) the opportunity cost — resulting from foregoing the benefits of exploring other documents in favor of the chosen ones."
            - paragraph [ref=e220]: (In a for-pay system, there will be a third cost in terms of the monetary price of each document, but since most websites are free to access, we won’t discuss payments further in this article. The important point is that users’ time and hassle are real costs, even if they don’t come with dollar signs attached.)
            - heading "Opportunity Costs" [level=3] [ref=e221]
            - paragraph [ref=e222]: Whenever users decide to inspect a webpage, they potentially lose the opportunity of looking at something else. That’s why it makes sense that, once users have landed on a page, they quickly extract the gist without spending time delving into the details. Scrolling down and reading every single word on a page is counterproductive — the utility derived from such an action is likely to be too small, whereas moving on and surface-scanning a different page may prove way more profitable.
            - 'heading "Time Costs: Between-Patch and Within-Patch" [level=3] [ref=e223]'
            - paragraph [ref=e224]: The time reflects the effort involved in gathering the information that the user needs.
            - paragraph [ref=e225]: "Looking up information on the web or on a webpage usually involves two types of user actions:"
            - list [ref=e226]:
              - listitem [ref=e227]: "Between-patch activities: Gathering information sources (i.e., patches)"
              - listitem [ref=e228]: "Within-patch activities: Inspecting each patch to extract information from it"
            - paragraph [ref=e229]: For example, if you want to research treatments for the common cold, you may start by running a search on a search engine. The search-results page will offer a set of links that could be potential sources of information. At this stage, you’re working between patches, gathering information sources that you will explore later.
            - paragraph [ref=e230]: Once you have your search results, you will next click on the most promising links and read through their content to extract relevant information. At this stage you are working within the individual patches, inspecting them and extracting the information that is relevant to you.
            - paragraph [ref=e231]:
              - text: Both between-patch and within-patch activities contribute to the overall time to satisfy an information need and both can impact the user experience in many ways. Users can create adaptations that allow them to minimize the time spent between patches or within patches. These adaptations are called
              - strong [ref=e232]: enrichments
              - text: .
            - heading "Enrichments" [level=2] [ref=e233]
            - paragraph [ref=e234]: Both the between-patch time and the within-patch time can be minimized by enrichments.
            - paragraph [ref=e235]:
              - text: An
              - strong [ref=e236]: enrichment
              - text: refers to a user interaction, behavior, or strategy that aims to maximize the
            - paragraph [ref=e237]: utility of the information foraging. It can happen either between patches or within patches.
            - paragraph [ref=e238]: Think of enrichments as an extra tool that users may use in order to forage more efficiently. The tool may be something that they already have in their pocket (such as a learned behavior) or could be built on the spot and tailored to the specific patch (in which case the user must spend time creating it).
            - paragraph [ref=e239]:
              - strong [ref=e240]: Behavior enrichments
              - text: are the tools that users already have acquired and that help them extract information efficiently. These behaviors are adaptations that evolved over time and that proved to be successful in many situations in the past.
            - paragraph [ref=e241]:
              - text: For example, over many interactions with the web, users have devised behaviors that minimize the time spent gathering patches or estimating information value of a patch. Thus, in order to avoid context-switching costs,
              - link "millennials" [ref=e242] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/millennials-digital-natives/
              - text: use
              - link "page parking" [ref=e243] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/multi-tab-page-parking/
              - text: to clearly separate the information-extraction from the information-gathering components of the foraging. Or, in order to save time, users use
              - link "F-pattern scanning" [ref=e244] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/f-shaped-pattern-reading-web-content/
              - text: on web-search results to be able to quickly assess scent without reading the entire test associated with a search result.
            - paragraph [ref=e245]:
              - text: At the patch level, people have devised other scanning patterns (e.g.,
              - link "layer cake" [ref=e246] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/layer-cake-pattern-scanning/
              - text: ) to quickly locate the relevant content. They also tend to ignore
              - link "banners" [ref=e247] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/banner-blindness-old-and-new-findings/
              - text: or the
              - link "right rail" [ref=e248] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/fight-right-rail-blindness/
              - text: — another adaptive behavior in service of maximizing the information gain relative to the time spent on the page.
            - paragraph [ref=e249]:
              - strong [ref=e250]: Interaction enrichments
              - text: require extra effort from the user — these are the tools that the user needs to build on the spot, in order to maximize the efficiency of the information-foraging task.
            - paragraph [ref=e251]: For example, the user can spend time to think of specific keywords that best describe her query, hoping to increase the likelihood of relevant search results. Or she can set a lot of filters. Both of these actions are between-patch enrichments.
            - paragraph [ref=e252]: Within patches, people can also use strategies such as the use of within-page search to quickly locate content that is relevant to them.
            - heading "Good User Experience Can Make Enrichments Unnecessary" [level=2] [ref=e253]
            - paragraph [ref=e254]:
              - text: "Enrichments are risky for the user for two reasons: not only it is the case that some enrichments require users to pay an extra"
              - link "interaction cost" [ref=e255] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/interaction-cost-definition/
              - text: or take upon themselves a larger
              - link "cognitive load" [ref=e256] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/minimize-cognitive-load/
              - text: ", but there is a chance that they won’t be right for the task. For example, a user using an F-pattern to scan a webpage may miss important concepts that don’t appear at the beginning of a paragraph. Or, a person searching for her first lawn mower"
              - link "may not have enough domain knowledge to come up with a set of relevant keywords to search for" [ref=e257] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/search-not-enough/
              - text: .
            - paragraph [ref=e258]: "Now, imagine that the between-patch and the within-patch environment was one step ahead of users and adapted themselves to user needs so that the user didn’t need to create any special enrichments: these environments were already laid out to maximize the efficiency of information foraging. That’s what a good user experience is."
            - paragraph [ref=e259]: A good user experience involves web pages that are designed so that the user can get the maximum relevant information in the minimum amount of time.
            - paragraph [ref=e260]:
              - text: Some optimization is already in place. Indeed, today’s search engines use sophisticated ways to rank the search results so that the most relevant ones appear first. They use common searches and personalize their results so that even if the user doesn’t take the time to refine her query, there is a high chance to get what she wants because the search engine “knows” her or because that’s what most people mean when they run a similar query.
              - link "Autosuggestions for searches" [ref=e261] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/site-search-suggestions/
              - text: also reduce the time of thinking about these enrichments.
            - paragraph [ref=e262]: At the page level, the way in which information is laid out and presented on a well-designed page is suggestive of what’s most likely to be relevant on a page. For example, designers use scanning-friendly formatting such as bulleted lists, bolded keywords, descriptive headlines to help users find the information that is relevant to them.
            - paragraph [ref=e263]: "Of course, the difficult problem is: each user is looking for a different type of food. She has a certain, very specific information goal in mind that may be different than that of your next user. How do you optimize your page layout and the information scent that your page emits so that it works for all users and for all goals?"
            - paragraph [ref=e264]: "The answer is: you don’t. You optimize for the top task that your page or site is supposed to address. That will take care of the many users who will be doing that task. It will also take care of the many users attempting to solve a different task, for whom your page is irrelevant — they won’t be tempted to click on your page."
            - heading "Conclusion" [level=2] [ref=e265]
            - paragraph [ref=e266]: "When people look for information on the web, they attempt to maximize the rate of information gain over time: they want to get as much information as possible in the minimum amount of time. To reduce time, they estimate the information value of a page based on its information scent and use enrichments such as learned behaviors or interactions to improve the chance of quickly getting what they need in their information foraging."
            - heading "Reference" [level=2] [ref=e267]
            - paragraph [ref=e268]:
              - text: P. Pirolli, S. Card. 1999. Information foraging.
              - emphasis [ref=e269]: Psychological Review
              - text: 106, pp. 643-675.
