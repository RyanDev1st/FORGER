              - paragraph [ref=e204]: Using appropriate subject headings enhances your search and will help you to find more results on your topic. This is because subject headings find articles according to their subject, even if the article does not use your chosen key words.
              - paragraph [ref=e205]: You should combine both subject headings and keywords in your search strategy for each of the concepts you identify. This is particularly important if you are undertaking a systematic review or an in-depth piece of work
              - paragraph [ref=e206]: Subject headings may vary between databases, so you need to investigate each database separately to find the subject headings they use. For example, for Medline you can use MeSH (Medical Subject Headings) and for Embase you can use the EMTREE thesaurus.
              - paragraph [ref=e207]:
                - strong [ref=e208]: "SEARCH TIP:"
                - text: In Ovid databases, search for a known key paper by title, select the "complete reference" button to see which subject headings the database indexers have given that article, and consider adding relevant ones to your own search strategy.
              - heading "Use Boolean logic to combine search terms" [level=4] [ref=e209]
              - paragraph [ref=e210]: Boolean operators (AND, OR and NOT) allow you to try different combinations of search terms or subject headings.
              - paragraph [ref=e211]: Databases often show Boolean operators as buttons or drop-down menus that you can click to combine your search terms or results.
              - paragraph [ref=e212]: "The main Boolean operators are:"
              - list [ref=e213]:
                - listitem [ref=e214]: OR
                - listitem [ref=e215]: AND
                - listitem [ref=e216]: NOT
              - paragraph [ref=e217]:
                - text: OR is used to find articles that mention
                - strong [ref=e218]: either
                - text: of the topics you search for.
              - paragraph [ref=e219]:
                - text: AND is used to find articles that mention
                - strong [ref=e220]: both
                - text: of the searched topics.
              - paragraph [ref=e221]: NOT excludes a search term or concept. It should be used with caution as you may inadvertently exclude relevant references.
              - paragraph [ref=e222]: For example, searching for “self-esteem NOT eating disorders” finds articles that mention self-esteem but removes any articles that mention eating disorders.
