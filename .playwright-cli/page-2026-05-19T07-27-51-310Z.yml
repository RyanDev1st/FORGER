            - generic [ref=e124]:
              - paragraph [ref=e125]: A search strategy is an organised structure of key terms used to search a database. The search strategy combines the key concepts of your search question in order to retrieve accurate results.
              - paragraph [ref=e126]: "Your search strategy will account for all:"
              - list [ref=e127]:
                - listitem [ref=e128]: possible search terms;
                - listitem [ref=e129]: keywords and phrases;
                - listitem [ref=e130]: truncated and wildcard variations of search terms; and
                - listitem [ref=e131]: subject headings (where applicable).
              - paragraph [ref=e132]: Each database works differently so you need to adapt your search strategy for each database. You may wish to develop a number of separate search strategies if your research covers several different areas.
              - paragraph [ref=e133]: It is a good idea to test your strategies and refine them after you have reviewed the search results.
              - heading "How a search strategy looks in practice" [level=3] [ref=e134]
              - paragraph [ref=e135]:
                - text: Take a look at this
                - link "example literature search in PsycINFO (PDF)" [ref=e136] [cursor=pointer]:
                  - /url: https://library.leeds.ac.uk/downloads/download/68/literature_searching_example_search_history
                - text: about self-esteem.
              - paragraph [ref=e137]: The example shows the subject heading and keyword searches that have been carried out for each concept within our research question and how they have been combined using Boolean operators. It also shows where keyword techniques like truncation, wildcards and adjacency searching have been used.
              - heading "Search strategy techniques" [level=3] [ref=e138]
              - paragraph [ref=e139]: The next sections show some techniques you can use to develop your search strategy.
              - paragraph [ref=e140]: "Skip straight to:"
              - list [ref=e141]:
                - listitem [ref=e142]:
                  - link "Choosing search terms" [ref=e143] [cursor=pointer]:
                    - /url: "#search terms"
                - listitem [ref=e144]:
                  - link "Searching with keywords" [ref=e145] [cursor=pointer]:
                    - /url: "#keywords"
                - listitem [ref=e146]:
                  - link "Searching for exact phrases" [ref=e147] [cursor=pointer]:
                    - /url: "#exact phrase"
                - listitem [ref=e148]:
                  - link "Using truncated and wildcard searches" [ref=e149] [cursor=pointer]:
                    - /url: "#truncation and wildcard"
                - listitem [ref=e150]:
                  - link "Searching with subject headings" [ref=e151] [cursor=pointer]:
                    - /url: "#subject headings"
                - listitem [ref=e152]:
                  - link "Using Boolean logic" [ref=e153] [cursor=pointer]:
                    - /url: "#boolean logic"
                - listitem [ref=e154]:
                  - link "Citation searching" [ref=e155] [cursor=pointer]:
                    - /url: "#citation searching"
              - heading "Choose search terms" [level=4] [ref=e156]
              - paragraph [ref=e157]: Concepts can be expressed in different ways eg “self-esteem” might be referred to as “self-worth”. Your aim is to consider each of your concepts and come up with a list of the different ways they could be expressed.
              - paragraph [ref=e158]: "To find alternative keywords or phrases for your concepts try the following:"
              - list [ref=e159]:
                - listitem [ref=e160]: Use a thesaurus to identify synonyms.
                - listitem [ref=e161]: Search for your concepts on a search engine like Google Scholar, scanning the results for alternative words and phrases.
                - listitem [ref=e162]: Examine relevant abstracts or articles for alternative words, phrases and subject headings (if the database uses subject headings).
              - paragraph [ref=e163]:
                - text: When you've done this, you should have lists of words and phrases for each concept as in this
                - link "completed PICO model (PDF)" [ref=e164] [cursor=pointer]:
                  - /url: https://library.leeds.ac.uk/downloads/download/11/completed_pico_concept_map
                - text: or this
                - link "example concept map (PDF)." [ref=e165] [cursor=pointer]:
                  - /url: https://library.leeds.ac.uk/downloads/download/69/literature_searching_example_concept_map
              - paragraph [ref=e166]: "Watch this short video on how to plan a search and generating good search terms:"
              - paragraph [ref=e167]:
