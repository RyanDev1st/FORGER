              - heading "Citation searching" [level=4] [ref=e227]
              - paragraph [ref=e228]: Citation searching is a method to find articles that have been cited by other publications.
              - paragraph [ref=e229]: "Use citation searching (or cited reference searching) to:"
              - list [ref=e230]:
                - listitem [ref=e231]: find out whether articles have been cited by other authors
                - listitem [ref=e232]: find more recent papers on the same or similar subject
                - listitem [ref=e233]: discover how a known idea or innovation has been confirmed, applied, improved, extended, or corrected
                - listitem [ref=e234]: help make your literature review more comprehensive.
              - paragraph [ref=e235]: "You can use cited reference searching in:"
