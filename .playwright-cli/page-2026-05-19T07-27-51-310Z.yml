              - heading "Use adjacency searching for more accurate results" [level=4] [ref=e189]
              - paragraph [ref=e190]: You can specify how close two words appear together in your search strategy. This can make your results more relevant; generally the closer two words appear to each other, the closer the relationship is between them.
              - paragraph [ref=e191]: Commands for adjacency searching differ among databases, so make sure you consult database guides.
              - paragraph [ref=e192]:
                - text: In OvidSP databases (like Medline), searching for “physician
                - strong [ref=e193]: ADJ3
                - text: relationship” will find both
                - strong [ref=e194]: physician
                - text: and
                - strong [ref=e195]: relationship
                - text: within
                - strong [ref=e196]: two
                - text: major words of each other, in any order. This finds more papers than "physician relationship".
              - paragraph [ref=e197]: Using this adjacency retrieves papers with phrases like "physician patient relationship", "patient physician relationship", "relationship of the physician to the patient" and so on.
              - heading "Searching with subject headings" [level=4] [ref=e198]
              - paragraph [ref=e199]: Database subject headings are controlled vocabulary terms that a database uses to describe what an article is about.
              - paragraph [ref=e200]: "Watch this video to learn more about using subject headings in database searching:"
              - paragraph [ref=e201]:
                - iframe [ref=e203]:
                  - generic [active] [ref=f5e1]:
                    - generic "YouTube Video Player" [ref=f5e3]
