              - paragraph [ref=e170]: As you search and scan articles and abstracts, you may discover different key terms to enhance your search strategy.
              - paragraph [ref=e171]: Using truncation and wildcards can save you time and effort by finding alternative keywords.
              - heading "Search with keywords" [level=4] [ref=e172]
              - paragraph [ref=e173]: Keywords are free text words and phrases. Database search strategies use a combination of free text and subject headings (where applicable).
              - paragraph [ref=e174]: A keyword search usually looks for your search terms in the title and abstract of a reference. You may wish to search in title fields only if you want a small number of specific results.
              - paragraph [ref=e175]: Some databases will find the exact word or phrase, so make sure your spelling is accurate or you will miss references.
              - heading "Search for the exact phrase" [level=4] [ref=e176]
              - paragraph [ref=e177]: If you want words to appear next to each other in an exact phrase, use quotation marks, eg “self-esteem”.
              - paragraph [ref=e178]: Phrase searching decreases the number of results you get and makes your results more relevant. Most databases allow you to search for phrases, but check the database guide if you are unsure.
              - heading "Truncation and wildcard searches" [level=4] [ref=e179]
              - paragraph [ref=e180]: You can use truncated and wildcard searches to find variations of your search term. Truncation is useful for finding singular and plural forms of words and variant endings.
              - paragraph [ref=e181]: Many databases use an asterisk (*) as their truncation symbol. Check the database help section if you are not sure which symbol to use. For example, “therap*” will find therapy, therapies, therapist or therapists.
              - paragraph [ref=e182]: A wildcard finds variant spellings of words. Use it to search for a single character, or no character. Check the database help section to see which symbol to use as a wildcard.
              - paragraph [ref=e183]: "Wildcards are useful for finding British and American spellings, for example: “behavio?r” in Medline will find both behaviour and behavior."
              - paragraph [ref=e184]: There are sometimes different symbols to find a variable single character. For example, in the Medline database, “wom#n” will find woman and also women.
              - paragraph [ref=e185]: "Watch this video to learn more about searching using truncation and wildcards:"
