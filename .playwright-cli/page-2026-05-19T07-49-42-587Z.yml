        - heading "PRISMA-Scoping Reviews" [level=1] [ref=e39]
        - paragraph [ref=e40]: The PRISMA extension for scoping reviews (PRISMA-ScR) was published in 2018. The checklist contains 20 essential reporting items and 2 optional items to include when completing a scoping review. Scoping reviews serve to synthesize evidence and assess the scope of literature on a topic. Among other objectives, scoping reviews help determine whether a systematic review of the literature is warranted.
