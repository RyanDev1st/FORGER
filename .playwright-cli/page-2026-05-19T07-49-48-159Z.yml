            - paragraph [ref=e112]:
              - generic [ref=e114]:
                - text: Evidence synthesis refers to any method of identifying, selecting, and combining results from multiple studies. For help selecting a methodology, try our
                - link "review methodology decision tree." [ref=e115] [cursor=pointer]:
                  - /url: https://guides.library.cornell.edu/ld.php?content_id=52561085
                  - strong [ref=e116]: review methodology decision tree.
                - strong [ref=e117]
                - text: "Types of evidence synthesis include:"
            - heading "Systematic Review" [level=4] [ref=e118]:
              - generic [ref=e121]: Systematic Review
            - list [ref=e122]:
              - listitem [ref=e123]:
                - generic [ref=e125]:
                  - text: Systematically and transparently collect and categorize
                  - generic [ref=e126]: existing evidence on a broad question of scientific, policy or management importance.
              - listitem [ref=e127]:
                - generic [ref=e131]: Compares, evaluates, and synthesizes evidence in a search for the effect of an intervention.
              - listitem [ref=e132]:
                - generic [ref=e136]: Time-intensive and often take months to a year or more to complete.
              - listitem [ref=e137]:
                - generic [ref=e141]: The most commonly referred to type of evidence synthesis. Sometimes confused as a blanket term for other types of reviews.
            - heading "Literature (Narrative) Review" [level=4] [ref=e142]:
              - generic [ref=e145]: Literature (Narrative) Review
            - list [ref=e146]:
              - listitem [ref=e147]:
                - generic [ref=e148]: A broad term referring to reviews with a wide scope and non-standardized methodology.
              - listitem [ref=e149]:
                - generic [ref=e150]: Search strategies, comprehensiveness, and time range covered will vary and do not follow an established protocol.
            - heading "Scoping Review or Evidence Map" [level=4] [ref=e151]:
              - generic [ref=e153]: Scoping Review or Evidence Map
            - list [ref=e154]:
              - listitem [ref=e155]:
                - generic [ref=e157]:
                  - text: Systematically and transparently collect and categorize
                  - generic [ref=e158]: existing evidence on a broad question of scientific, policy or management importance.
              - listitem [ref=e159]:
                - generic [ref=e160]: Seeks to identify research gaps and opportunities for evidence synthesis rather than searching for the effect of an intervention.
              - listitem [ref=e161]:
                - generic [ref=e163]:
                  - text: May critically evaluate existing evidence, but does not attempt to synthesize the results in the way a systematic review would. (see
                  - link "EE Journal" [ref=e164] [cursor=pointer]:
                    - /url: http://environmentalevidence.org/wp-content/uploads/2014/05/EE_InstructionsforAuthors_SYSTMAPS.pdf
                  - text: and
                  - link "CIFOR" [ref=e165] [cursor=pointer]:
                    - /url: http://www.cifor.org/fileadmin/subsites/ebf/pubs/Guidance_Systematic_Maps.pdf
                  - text: )
              - listitem [ref=e166]:
                - generic [ref=e167]: May take longer than a systematic review.
              - listitem [ref=e168]:
                - generic [ref=e170]:
                  - text: See
                  - link "Arksey and O'Malley (2005)" [ref=e171] [cursor=pointer]:
                    - /url: http://www.tandfonline.com/doi/abs/10.1080/1364557032000119616#.VucAb-ZWLwA
                  - text: for methodological guidance.
            - heading "Rapid Review" [level=4] [ref=e172]:
              - generic [ref=e174]: Rapid Review
            - list [ref=e175]:
              - listitem [ref=e176]:
                - generic [ref=e177]: Applies Systematic Review methodology within a time-constrained setting.
              - listitem [ref=e178]:
                - generic [ref=e179]: Employs methodological "shortcuts" (limiting search terms for example) at the risk of introducing bias.
              - listitem [ref=e180]:
                - generic [ref=e181]: Useful for addressing issues needing quick decisions, such as developing policy recommendations.
              - listitem [ref=e182]:
                - generic [ref=e184]:
                  - text: See
