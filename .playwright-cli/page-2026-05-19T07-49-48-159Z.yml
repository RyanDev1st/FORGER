            - heading "Umbrella Review" [level=4] [ref=e186]:
              - generic [ref=e188]: Umbrella Review
            - list [ref=e189]:
              - listitem [ref=e190]:
                - generic [ref=e191]: Reviews other systematic reviews on a topic.
              - listitem [ref=e192]:
                - generic [ref=e194]: Often defines a broader question than is typical of a traditional systematic review.
              - listitem [ref=e195]:
                - generic [ref=e197]: Most useful when there are competing interventions to consider.
            - heading "Meta-analysis" [level=4] [ref=e198]:
              - generic [ref=e200]: Meta-analysis
            - list [ref=e201]:
              - listitem [ref=e202]:
                - generic [ref=e203]: Statistical technique for combining the findings from disparate quantitative studies.
              - listitem [ref=e204]:
                - generic [ref=e206]: Uses statistical methods to objectively evaluate, synthesize, and summarize results.
              - listitem [ref=e207]:
                - generic [ref=e209]: May be conducted independently or as part of a systematic review.
