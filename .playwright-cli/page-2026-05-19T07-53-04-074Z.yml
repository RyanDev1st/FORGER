        - 'heading "Evaluating Information: Strategy: SIFT" [level=1] [ref=e62]'
      - generic [ref=e64]:
        - paragraph [ref=e75]:
          - 'img "SIFT Infographic: S - Stop, I - Investigate the source, F - Find Trusted Coverage, T - Trace claims, quotes and media to the original source." [ref=e76]'
        - generic [ref=e77]:
          - generic [ref=e79]:
            - generic [ref=e82]:
              - heading "1. Stop" [level=2] [ref=e83]
              - generic [ref=e86]:
                - paragraph [ref=e87]:
                  - text: Before you start investigating the credibility of a source, take a moment to reflect on what you already know about the reputation and trustworthiness of the source (e.g., website, organization, publication, author). Also consider our familiarity about the subject or claim.
                  - text: "Questions to ask:"
                - list [ref=e88]:
                  - listitem [ref=e89]: Is this a source you trust?
                  - listitem [ref=e90]: How does the source make you feel? Is it trying to elicit an emotional response?
                  - listitem [ref=e91]: What do you know about the source already? What is its reputation?
                - paragraph [ref=e92]:
                  - strong [ref=e93]: "Green flag:"
                  - text: If you are familiar with the source, and know from previous experience that it is credible and trustworthy, you can skip the additional three steps and use the information.
            - generic [ref=e96]:
              - heading "3. Find" [level=2] [ref=e97]
              - generic [ref=e100]:
                - paragraph [ref=e101]: "If your investigation into the source in step 2 is inconclusive you need to seek corroboration in other, more trusted, sources. Steps to take:"
                - list [ref=e102]:
                  - listitem [ref=e103]: Verify information on fact-checking websites.
                  - listitem [ref=e104]:
                    - text: Check reputable news sources (the UW Libraries
                    - link "news databases" [ref=e105] [cursor=pointer]:
                      - /url: https://guides.lib.uw.edu/research/news/enews
                    - text: will be helpful) to see how they have covered the issue or event.
                  - listitem [ref=e106]:
                    - text: If your original source makes scholarly, scientific, or medical claims, check for coverage of the topic in more trustworthy, peer-reviewed, sources such as scholarly articles (the UW Libraries
                    - link "academic databases" [ref=e107] [cursor=pointer]:
                      - /url: https://guides.lib.uw.edu/az/databases
                    - text: will be helpful).
                - paragraph [ref=e108]
                - paragraph [ref=e109]:
                  - strong [ref=e110]: Red Flag
                  - text: "(source may not be reliable): No corroborating sources or sources provide conflicting information."
                - paragraph [ref=e111]
          - generic [ref=e113]:
            - generic [ref=e116]:
              - heading "2. Investigate" [level=2] [ref=e117]
              - generic [ref=e120]:
                - paragraph [ref=e121]: "Before you read the information source, find out about the producers of the information. This is especially important if you aren't familiar with the website, organization, publication, or author. Steps to take:"
                - list [ref=e122]:
                  - listitem [ref=e123]: Check if there is an "about" section. What is the explicit purpose of the site? Are there political agendas or biases? You may still want to use the source but take into account the biases.
                  - listitem [ref=e124]:
                    - text: Find information about the organization or publication in
                    - link "Wikipedia" [ref=e125] [cursor=pointer]:
                      - /url: https://www.wikipedia.org/
                    - text: .
                  - listitem [ref=e126]: Check the author. What is their background? What else have they written? If the source is a social media post, check the author's profile page for clues.
                - paragraph [ref=e127]
                - paragraph [ref=e128]: This information will help you determine if the source is credible, trustworthy, and significant.
                - paragraph [ref=e129]
            - generic [ref=e132]:
              - heading "4. Trace" [level=2] [ref=e133]
              - generic [ref=e136]:
                - paragraph [ref=e137]: "If after the first 3 SIFT steps you are still unsure about your information source, attempt to find the original sources of the claims, quotes, and media used. Steps to take:"
                - list [ref=e138]:
                  - listitem [ref=e139]: Google keywords and quotes from the source to find other stories. check the date stamp to find earlier versions.
                  - listitem [ref=e140]:
                    - text: For images, try a
                    - link "reverse image search" [ref=e141] [cursor=pointer]:
                      - /url: https://www.semrush.com/blog/reverse-image-search/
                    - text: .
                  - listitem [ref=e142]: If there are hyperlinks or a bibliography, go to these sources and see if they support the claims.
                - paragraph [ref=e143]:
                  - strong [ref=e144]: Red flag
                  - text: "(source is not reliable): Quotes are cherry-picked and taken out of context. Images are faked (created by AI), altered, or mis-attributed (different place or date). Hyperlinked sources do not support claims or are themselves untrustworthy."
