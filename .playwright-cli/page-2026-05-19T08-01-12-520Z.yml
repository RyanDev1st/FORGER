        - article [ref=e198]:
          - generic [ref=e204]:
            - paragraph [ref=e205]: Holger J Schünemann, Gunn E Vist, Julian PT Higgins, Nancy Santesso, Jonathan J Deeks, Paul Glasziou, Elie A Akl, Gordon H Guyatt; on behalf of the Cochrane GRADEing Methods Group
            - paragraph [ref=e206]:
              - strong [ref=e207]: "Key Points:"
            - list [ref=e208]:
              - listitem [ref=e209]: This chapter provides guidance on interpreting the results of synthesis in order to communicate the conclusions of the review effectively.
              - listitem [ref=e210]: Methods are presented for computing, presenting and interpreting relative and absolute effects for dichotomous outcome data, including the number needed to treat (NNT).
              - listitem [ref=e211]: For continuous outcome measures, review authors can present summary results for studies using natural units of measurement or as minimal important differences when all studies use the same scale. When studies measure the same construct but with different scales, review authors will need to find a way to interpret the standardized mean difference, or to use an alternative effect measure for the meta-analysis such as the ratio of means.
              - listitem [ref=e212]: Review authors should not describe results as ‘statistically significant’, ‘not statistically significant’ or ‘non-significant’ or unduly rely on thresholds for P values, but report the confidence interval together with the exact P value.
              - listitem [ref=e213]: Review authors should not make recommendations about healthcare decisions, but they can – after describing the certainty of evidence and the balance of benefits and harms – highlight different actions that might be consistent with particular patterns of values and preferences and other factors that determine a decision such as cost.
            - paragraph [ref=e214]:
              - text: "Cite this chapter as: Schünemann HJ, Vist GE, Higgins JP, Santesso N, Deeks JJ, Glasziou P, Akl EA, Guyatt GH. Chapter 15: Interpreting results and drawing conclusions [last updated August 2023]. In: Higgins JP, Thomas J, Chandler J, Cumpston M, Li T, Page MJ, et al, editor(s)."
              - emphasis [ref=e215]: Cochrane Handbook for Systematic Reviews of Interventions
              - text: version 6.5. Cochrane, 2024. Available from
              - emphasis [ref=e216]: cochrane.org/handbook
              - text: .
            - heading "15.1 Introduction#section-15-1" [level=2] [ref=e217]
            - paragraph [ref=e218]: "The purpose of Cochrane reviews is to facilitate healthcare decisions by patients and the general public, clinicians, guideline developers, administrators and policy makers. They also inform future research. A clear statement of findings, a considered discussion and a clear presentation of the authors’ conclusions are, therefore, important parts of the review. In particular, the following issues can help people make better informed decisions and increase the usability of Cochrane reviews:"
            - list [ref=e219]:
              - listitem [ref=e220]: information on all important outcomes, including adverse outcomes;
              - listitem [ref=e221]: the certainty of the evidence for each of these outcomes, as it applies to specific populations and specific interventions; and
              - listitem [ref=e222]: clarification of the manner in which particular values and preferences may bear on the desirable and undesirable consequences of the intervention.
            - paragraph [ref=e223]:
              - text: A ‘Summary of findings’ table, described in
              - link "Chapter 14" [ref=e224] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14
              - link ", Section 14.1" [ref=e225] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14#section-14-1
              - text: ", provides key pieces of information about health benefits and harms in a quick and accessible format. It is highly desirable that review authors include a ‘Summary of findings’ table in Cochrane reviews alongside a sufficient description of the studies and meta-analyses to support its contents. This description includes the rating of the certainty of evidence, also called the quality of the evidence or confidence in the estimates of the effects, which is expected in all Cochrane reviews."
            - paragraph [ref=e226]: "‘Summary of findings’ tables are usually supported by full evidence profiles which include the detailed ratings of the evidence (Guyatt et al 2011a, Guyatt et al 2013a, Guyatt et al 2013b, Santesso et al 2016). The Discussion section of the text of the review provides space to reflect and consider the implications of these aspects of the review’s findings. Cochrane reviews include five standard subheadings to ensure the Discussion section places the review in an appropriate context: ‘Summary of main results (benefits and harms)’; ‘Potential biases in the review process’; ‘Overall completeness and applicability of evidence’; ‘Certainty of the evidence’; and ‘Agreements and disagreements with other studies or reviews’. Following the Discussion, the Authors’ conclusions section is divided into two standard subsections: ‘Implications for practice’ and ‘Implications for research’. The assessment of the certainty of evidence facilitates a structured description of the implications for practice and research."
            - paragraph [ref=e227]: Because Cochrane reviews have an international audience, the Discussion and Authors’ conclusions should, so far as possible, assume a broad international perspective and provide guidance for how the results could be applied in different settings, rather than being restricted to specific national or local circumstances. Cultural differences and economic differences may both play an important role in determining the best course of action based on the results of a Cochrane review. Furthermore, individuals within societies have widely varying values and preferences regarding health states, and use of societal resources to achieve particular health states. For all these reasons, and because information that goes beyond that included in a Cochrane review is required to make fully informed decisions, different people will often make different decisions based on the same evidence presented in a review.
            - paragraph [ref=e228]: Thus, review authors should avoid specific recommendations that inevitably depend on assumptions about available resources, values and preferences, and other factors such as equity considerations, feasibility and acceptability of an intervention. The purpose of the review should be to present information and aid interpretation rather than to offer recommendations. The discussion and conclusions should help people understand the implications of the evidence in relation to practical decisions and apply the results to their specific situation. Review authors can aid this understanding of the implications by laying out different scenarios that describe certain value structures.
            - paragraph [ref=e229]: "In this chapter, we address first one of the key aspects of interpreting findings that is also fundamental in completing a ‘Summary of findings’ table: the certainty of evidence related to each of the outcomes. We then provide a more detailed consideration of issues around applicability and around interpretation of numerical results, and provide suggestions for presenting authors’ conclusions."
            - heading "15.2 Issues of indirectness and applicability#section-15-2" [level=2] [ref=e230]
            - heading "15.2.1 The role of the review author#section-15-2-1" [level=3] [ref=e231]
            - paragraph [ref=e232]: “A leap of faith is always required when applying any study findings to the population at large” or to a specific person. “In making that jump, one must always strike a balance between making justifiable broad generalizations and being too conservative in one’s conclusions” (Friedman et al 1985). In addition to issues about risk of bias and other domains determining the certainty of evidence, this leap of faith is related to how well the identified body of evidence matches the posed PICO (Population, Intervention, Comparator(s) and Outcome) question. As to the population, no individual can be entirely matched to the population included in research studies. At the time of decision, there will always be differences between the study population and the person or population to whom the evidence is applied; sometimes these differences are slight, sometimes large.
            - paragraph [ref=e233]: "The terms applicability, generalizability, external validity and transferability are related, sometimes used interchangeably and have in common that they lack a clear and consistent definition in the classic epidemiological literature (Schünemann et al 2013). However, all of the terms describe one overarching theme: whether or not available research evidence can be directly used to answer the health and healthcare question at hand, ideally supported by a judgement about the degree of confidence in this use (Schünemann et al 2013). GRADE’s certainty domains include a judgement about ‘indirectness’ to describe all of these aspects including the concept of direct versus indirect comparisons of different interventions (Atkins et al 2004, Guyatt et al 2008, Guyatt et al 2011b)."
            - paragraph [ref=e234]:
              - text: To address adequately the extent to which a review is relevant for the purpose to which it is being put, there are certain things the review author must do, and certain things the user of the review must do to assess the degree of indirectness. Cochrane and the GRADE Working Group suggest using a very structured framework to address indirectness. We discuss here and in
              - link "Chapter 14" [ref=e235] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14
              - text: what the review author can do to help the user. Cochrane review authors must be extremely clear on the population, intervention and outcomes that they intend to address.
              - link "Chapter 14, Section 14.1.2" [ref=e236] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14#section-14-1-2
              - text: ", also emphasizes a crucial step: the specification of all patient-important outcomes relevant to the intervention strategies under comparison."
            - paragraph [ref=e237]:
              - text: In considering whether the effect of an intervention applies equally to all participants, and whether different variations on the intervention have similar effects, review authors need to make a priori hypotheses about possible effect modifiers, and then examine those hypotheses (see
              - link "Chapter 10, Section 10.10" [ref=e238] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-10
              - text: and
              - link "Section 10.11" [ref=e239] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-11
              - text: ). If they find apparent subgroup effects, they must ultimately decide whether or not these effects are credible (Sun et al 2012). Differences between subgroups, particularly those that correspond to differences between studies, should be interpreted cautiously. Some chance variation between subgroups is inevitable so, unless there is good reason to believe that there is an interaction, review authors should not assume that the subgroup effect exists. If, despite due caution, review authors judge subgroup effects in terms of relative effect estimates as credible (i.e. the effects differ credibly), they should conduct separate meta-analyses for the relevant subgroups, and produce separate ‘Summary of findings’ tables for those subgroups.
            - paragraph [ref=e240]:
              - text: The user of the review will be challenged with ‘individualization’ of the findings, whether they seek to apply the findings to an individual patient or a policy decision in a specific context. For example, even if relative effects are similar across subgroups, absolute effects will differ according to baseline risk. Review authors can help provide this information by identifying identifiable groups of people with varying baseline risks in the ‘Summary of findings’ tables, as discussed in
              - link "Chapter 14, Section 14.1.3" [ref=e241] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14#section-14-1-3
              - text: . Users can then identify their specific case or population as belonging to a particular risk group, if relevant, and assess their likely magnitude of benefit or harm accordingly. A description of the identifying prognostic or baseline risk factors in a brief scenario (e.g. age or gender) will help users of a review further.
            - paragraph [ref=e242]: Another decision users must make is whether their individual case or population of interest is so different from those included in the studies that they cannot use the results of the systematic review and meta-analysis at all. Rather than rigidly applying the inclusion and exclusion criteria of studies, it is better to ask whether or not there are compelling reasons why the evidence should not be applied to a particular patient. Review authors can sometimes help decision makers by identifying important variation where divergence might limit the applicability of results (Rothwell 2005, Schünemann et al 2006, Guyatt et al 2011b, Schünemann et al 2013), including biologic and cultural variation, and variation in adherence to an intervention.
            - paragraph [ref=e243]: In addressing these issues, review authors cannot be aware of, or address, the myriad of differences in circumstances around the world. They can, however, address differences of known importance to many people and, importantly, they should avoid assuming that other people’s circumstances are the same as their own in discussing the results and drawing conclusions.
            - heading "15.2.2 Biological variation#section-15-2-2" [level=3] [ref=e244]
            - paragraph [ref=e245]: Issues of biological variation that may affect the applicability of a result to a reader or population include divergence in pathophysiology (e.g. biological differences between women and men that may affect responsiveness to an intervention) and divergence in a causative agent (e.g. for infectious diseases such as malaria, which may be caused by several different parasites). The discussion of the results in the review should make clear whether the included studies addressed all or only some of these groups, and whether any important subgroup effects were found.
            - heading "15.2.3 Variation in context#section-15-2-3" [level=3] [ref=e246]
            - paragraph [ref=e247]:
              - text: Some interventions, particularly non-pharmacological interventions, may work in some contexts but not in others; the situation has been described as program by context interaction (Hawe et al 2004). Contextual factors might pertain to the host organization in which an intervention is offered, such as the expertise, experience and morale of the staff expected to carry out the intervention, the competing priorities for the clinician’s or staff’s attention, the local resources such as service and facilities made available to the program and the status or importance given to the program by the host organization. Broader context issues might include aspects of the
              - emphasis [ref=e248]
              - text: system within which the host organization operates, such as the fee or payment structure for healthcare providers and the local insurance system. Some interventions, in particular complex interventions (see
              - link "Chapter 17" [ref=e249] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-17
              - text: ), can be only partially implemented in some contexts, and this requires judgements about indirectness of the intervention and its components for readers in that context (Schünemann 2013).
            - paragraph [ref=e250]:
              - text: Contextual factors may also pertain to the characteristics of the target group or population,
              - emphasis [ref=e251]
              - text: such as cultural and linguistic diversity, socio-economic position, rural/urban setting. These factors may mean that a particular style of care or relationship evolves between service providers and consumers that may or may not match the values and technology of the program.
            - paragraph [ref=e252]: For many years these aspects have been acknowledged when decision makers have argued that results of evidence reviews from other countries do not apply in their own country or setting. Whilst some programmes/interventions have been successfully transferred from one context to another, others have not (Resnicow et al 1993, Lumley et al 2004, Coleman et al 2015). Review authors should be cautious when making generalizations from one context to another. They should report on the presence (or otherwise) of context-related information in intervention studies, where this information is available.
            - heading "15.2.4 Variation in adherence#section-15-2-4" [level=3] [ref=e253]
            - paragraph [ref=e254]: Variation in the adherence of the recipients and providers of care can limit the certainty in the applicability of results. Predictable differences in adherence can be due to divergence in how recipients of care perceive the intervention (e.g. the importance of side effects), economic conditions or attitudes that make some forms of care inaccessible in some settings, such as in low-income countries (Dans et al 2007). It should not be assumed that high levels of adherence in closely monitored randomized trials will translate into similar levels of adherence in normal practice.
            - heading "15.2.5 Variation in values and preferences#section-15-2-5" [level=3] [ref=e255]
            - paragraph [ref=e256]:
              - text: Decisions about healthcare management strategies and options involve trading off health benefits and harms. The right choice may differ for people with different values and preferences (i.e. the importance people place on the outcomes and interventions), and it is important that decision makers ensure that decisions are consistent with a patient or population’s values and preferences. The importance placed on outcomes, together with other factors, will influence whether the recipients of care will or will not accept an option that is offered (Alonso-Coello et al 2016) and, thus, can be one factor influencing adherence. In Section
              - link "15.6" [ref=e257] [cursor=pointer]:
                - /url: "#section-15-6"
              - text: ", we describe how the review author can help this process and the limits of supporting decision making based on intervention reviews."
            - heading "15.3 Interpreting results of statistical analyses#section-15-3" [level=2] [ref=e258]
            - heading "15.3.1 Confidence intervals#section-15-3-1" [level=3] [ref=e259]
            - paragraph [ref=e260]: Results for both individual studies and meta-analyses are reported with a point estimate together with an associated confidence interval. For example, ‘The odds ratio was 0.75 with a 95% confidence interval of 0.70 to 0.80’. The point estimate (0.75) is the best estimate of the magnitude and direction of the experimental intervention’s effect compared with the comparator intervention. The confidence interval describes the uncertainty inherent in any estimate, and describes a range of values within which we can be reasonably sure that the true effect actually lies. If the confidence interval is relatively narrow (e.g. 0.70 to 0.80), the effect size is known precisely. If the interval is wider (e.g. 0.60 to 0.93) the uncertainty is greater, although there may still be enough precision to make decisions about the utility of the intervention. Intervals that are very wide (e.g. 0.50 to 1.10) indicate that we have little knowledge about the effect and this imprecision affects our certainty in the evidence, and that further information would be needed before we could draw a more certain conclusion.
            - paragraph [ref=e261]:
              - text: A 95% confidence interval is often interpreted as indicating a range within which we can be 95% certain that the true effect lies. This statement is a loose interpretation, but is useful as a rough guide. The strictly correct interpretation of a confidence interval is based on the hypothetical notion of considering the results that would be obtained if the study were repeated many times. If a study were repeated infinitely often, and on each occasion a 95% confidence interval calculated, then 95% of these intervals would contain the true effect (see Section
              - link "15.3.3" [ref=e262] [cursor=pointer]:
                - /url: "#section-15-3-3"
              - text: for further explanation).
            - paragraph [ref=e263]: The width of the confidence interval for an individual study depends to a large extent on the sample size. Larger studies tend to give more precise estimates of effects (and hence have narrower confidence intervals) than smaller studies. For continuous outcomes, precision depends also on the variability in the outcome measurements (i.e. how widely individual results vary between people in the study, measured as the standard deviation); for dichotomous outcomes it depends on the risk of the event (more frequent events allow more precision, and narrower confidence intervals), and for time-to-event outcomes it also depends on the number of events observed. All these quantities are used in computation of the standard errors of effect estimates from which the confidence interval is derived.
            - paragraph [ref=e264]:
              - text: The width of a confidence interval for a meta-analysis depends on the precision of the individual study estimates and on the number of studies combined. In addition, for random-effects models, precision will decrease with increasing heterogeneity and confidence intervals will widen correspondingly (see
              - link "Chapter 10, Section 10.10.4" [ref=e265] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-10-4
              - text: ). As more studies are added to a meta-analysis the width of the confidence interval usually decreases. However, if the additional studies increase the heterogeneity in the meta-analysis and a random-effects model is used, it is possible that the confidence interval width will increase.
            - paragraph [ref=e266]:
              - text: Confidence intervals and point estimates have different interpretations in fixed-effect and random-effects models. While the fixed-effect estimate and its confidence interval address the question ‘what is the best (single) estimate of the effect?’, the random-effects estimate assumes there to be a distribution of effects, and the estimate and its confidence interval address the question ‘what is the best estimate of the average effect?’ A confidence interval may be reported for any level of confidence (although they are most commonly reported for 95%, and sometimes 90% or 99%). For example, the odds ratio of 0.80 could be reported with an 80% confidence interval of 0.73 to 0.88; a 90% interval of 0.72 to 0.89; and a 95% interval of 0.70 to 0.92. As the confidence level
              - emphasis [ref=e267]
              - text: increases, the confidence interval widens.
            - paragraph [ref=e268]:
              - text: There is logical correspondence between the confidence interval and the P value (see Section
              - link "15.3.3" [ref=e269] [cursor=pointer]:
                - /url: "#section-15-3-3"
              - text: ). The 95% confidence interval for an effect will exclude the null value (such as an odds ratio of 1.0 or a risk difference of 0) if and only if the test of significance yields a P value of less than 0.05. If the P value is exactly 0.05, then either the upper or lower limit of the 95% confidence interval will be at the null value. Similarly, the 99% confidence interval will exclude the null if and only if the test of significance yields a P value of less than 0.01.
            - paragraph [ref=e270]: Together, the point estimate and confidence interval provide information to assess the effects of the intervention on the outcome. For example, suppose that we are evaluating an intervention that reduces the risk of an event and we decide that it would be useful only if it reduced the risk of an event from 30% by at least 5 percentage points to 25% (these values will depend on the specific clinical scenario and outcomes, including the anticipated harms). If the meta-analysis yielded an effect estimate of a reduction of 10 percentage points with a tight 95% confidence interval, say, from 7% to 13%, we would be able to conclude that the intervention was useful since both the point estimate and the entire range of the interval exceed our criterion of a reduction of 5% for net health benefit. However, if the meta-analysis reported the same risk reduction of 10% but with a wider interval, say, from 2% to 18%, although we would still conclude that our best estimate of the intervention effect is that it provides net benefit, we could not be so confident as we still entertain the possibility that the effect could be between 2% and 5%. If the confidence interval was wider still, and included the null value of a difference of 0%, we would still consider the possibility that the intervention has no effect on the outcome whatsoever, and would need to be even more sceptical in our conclusions.
            - paragraph [ref=e271]:
              - text: Review authors may use the same general approach to conclude that an intervention is
              - emphasis [ref=e272]: not
              - text: useful. Continuing with the above example where the criterion for an important difference that should be achieved to provide more benefit than harm is a 5% risk difference, an effect estimate of 2% with a 95% confidence interval of 1% to 4% suggests that the intervention does not provide net health benefit.
            - heading "15.3.2 P values and statistical significance#section-15-3-2" [level=3] [ref=e273]
            - paragraph [ref=e274]:
              - text: A P value is the standard result of a statistical test, and is the probability of obtaining the observed effect (or larger) under a ‘null hypothesis’. In the context of Cochrane reviews there are two commonly used statistical tests. The first is a test of overall effect (a Z-test), and its null hypothesis is that there is no overall effect of the experimental intervention compared with the comparator on the outcome of interest. The second is the (Chi
              - superscript [ref=e275]: "2"
              - text: ) test for heterogeneity, and its null hypothesis is that there are no differences in the intervention effects across studies.
            - paragraph [ref=e276]:
              - text: A P value that is very small indicates that the observed effect is very unlikely to have arisen purely by chance, and therefore provides evidence against the null hypothesis. It has been common practice to interpret a P value by examining whether it is smaller than particular threshold values. In particular, P values less than 0.05 are often reported as ‘statistically significant’, and interpreted as being small enough to justify rejection of the null hypothesis. However, the 0.05 threshold is an arbitrary one that became commonly used in medical and psychological research largely because P values were determined by comparing the test statistic against tabulations of specific percentage points of statistical distributions. If review authors decide to present a P value with the results of a meta-analysis, they should report a precise P value (as calculated by most statistical software), together with the 95% confidence interval.
              - strong [ref=e277]: Review authors should not describe results as ‘statistically significant’, ‘not statistically significant’ or ‘non-significant’ or unduly rely on thresholds for P values
              - text: ", but report the confidence interval together with the exact P value (see"
              - link "MECIR Box 15.3.a" [ref=e278] [cursor=pointer]:
                - /url: "#mecir-box-15-3-a"
              - text: ).
            - paragraph [ref=e279]:
              - text: We discuss interpretation of the test for heterogeneity in
              - link "Chapter 10, Section 10.10.2" [ref=e280] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-10-2
              - text: ; the remainder of this section refers mainly to tests for an overall effect. For tests of an overall effect, the computation of P involves both the effect estimate and precision of the effect estimate (driven largely by sample size). As precision increases, the range of plausible effects that could occur by chance is reduced. Correspondingly, the statistical significance of an effect of a particular magnitude will usually be greater (the P value will be smaller) in a larger study than in a smaller study.
            - paragraph [ref=e281]: P values are commonly misinterpreted in two ways. First, a moderate or large P value (e.g. greater than 0.05) may be misinterpreted as evidence that the intervention has no effect on the outcome. There is an important difference between this statement and the correct interpretation that there is a high probability that the observed effect on the outcome is due to chance alone. To avoid such a misinterpretation, review authors should always examine the effect estimate and its 95% confidence interval.
            - paragraph [ref=e282]:
              - text: The second misinterpretation is to assume that a result with a small P value for the summary effect estimate implies that an experimental intervention has an important benefit. Such a misinterpretation is more likely to occur in large studies and meta-analyses that accumulate data over dozens of studies and thousands of participants. The P value addresses the question of whether the experimental intervention effect is precisely nil; it does not examine whether the effect is of a magnitude of importance to potential recipients of the intervention. In a large study, a small P value may represent the detection of a trivial effect that may not lead to net health benefit when compared with the potential harms (i.e. harmful effects on other important outcomes). Again, inspection of the point estimate and confidence interval helps correct interpretations (see Section
              - link "15.3.1" [ref=e283] [cursor=pointer]:
                - /url: "#section-15-3-1"
              - text: ).
            - paragraph [ref=e284]:
              - strong [ref=e285]: MECIR Box 15.3.a
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e286]:
              - rowgroup [ref=e287]:
                - 'row "C72: Interpreting results (Mandatory)" [ref=e288]':
                  - 'cell "C72: Interpreting results (Mandatory)" [ref=e289]':
                    - emphasis [ref=e290]: "C72:"
                    - text: Interpreting results (
                    - strong [ref=e291]: Mandatory
                    - text: )
                - row "Focus interpretation of results on estimates of effect and their confidence intervals, avoiding use of a distinction between “statistically significant” and “statistically non-significant\". Authors commonly mistake a lack of evidence of effect as evidence of a lack of effect." [ref=e292]:
                  - cell "Focus interpretation of results on estimates of effect and their confidence intervals, avoiding use of a distinction between “statistically significant” and “statistically non-significant\"." [ref=e293]:
                    - emphasis [ref=e294]: Focus interpretation of results on estimates of effect and their confidence intervals, avoiding use of a distinction between “statistically significant” and “statistically non-significant"
                    - text: .
                  - cell "Authors commonly mistake a lack of evidence of effect as evidence of a lack of effect." [ref=e295]
            - heading "15.3.3 Relation between confidence intervals, statistical significance and certainty of evidence#section-15-3-3" [level=3] [ref=e296]
            - paragraph [ref=e297]:
              - text: The confidence interval (and imprecision) is only one domain that influences overall uncertainty about effect estimates. Uncertainty resulting from imprecision (i.e. statistical uncertainty) may be no less important than uncertainty from indirectness, or any other GRADE domain, in the context of decision making (Schünemann 2016). Thus, the extent to which interpretations of the confidence interval described in Sections
              - link "15.3.1" [ref=e298] [cursor=pointer]:
                - /url: "#section-15-3-1"
              - text: and
              - link "15.3.2" [ref=e299] [cursor=pointer]:
                - /url: "#section-15-3-2"
              - text: correspond to conclusions about overall certainty of the evidence for the outcome of interest depends on these other domains. If there are no concerns about other domains that determine the certainty of the evidence (i.e. risk of bias, inconsistency, indirectness or publication bias), then the interpretation in Sections
              - link "15.3.1" [ref=e300] [cursor=pointer]:
                - /url: "#section-15-3-1"
              - text: and
              - link "15.3.2" [ref=e301] [cursor=pointer]:
                - /url: "#section-15-3-2"
              - text: . about the relation of the confidence interval to the true effect may be carried forward to the overall certainty. However, if there are concerns about the other domains that affect the certainty of the evidence, the interpretation about the true effect needs to be seen in the context of further uncertainty resulting from those concerns.
            - paragraph [ref=e302]:
              - text: For example, nine randomized controlled trials in almost 6000 cancer patients indicated that the administration of heparin reduces the risk of venous thromboembolism (VTE), with a risk ratio of 43% (95% CI 19% to 60%) (Akl et al 2011a). For patients with a plausible baseline risk of approximately 4.6% per year, this relative effect suggests that heparin leads to an absolute risk reduction of 20 fewer VTEs (95% CI 9 fewer to 27 fewer) per 1000 people per year (Akl et al 2011a). Now consider that the review authors or those applying the evidence in a guideline have lowered the certainty in the evidence as a result of indirectness. While the confidence intervals would remain unchanged, the certainty in that confidence interval and in the point estimate as reflecting the truth for the question of interest will be lowered. In fact, the certainty range will have unknown width so there will be unknown likelihood of a result within that range because of this indirectness. The lower the certainty in the evidence, the less we know about the width of the certainty range, although methods for quantifying risk of bias and understanding potential direction of bias may offer insight when lowered certainty is due to risk of bias. Nevertheless, decision makers must consider this uncertainty, and must do so in relation to the effect measure that is being evaluated (e.g. a relative or absolute measure). We will describe the impact on interpretations for dichotomous outcomes in Section
              - link "15.4" [ref=e303] [cursor=pointer]:
                - /url: "#section-15-4"
              - text: .
            - heading "15.4 Interpreting results from dichotomous outcomes (including numbers needed to treat)#section-15-4" [level=2] [ref=e304]
            - heading "15.4.1 Relative and absolute risk reductions#section-15-4-1" [level=3] [ref=e305]
            - paragraph [ref=e306]:
              - text: Clinicians may be more inclined to prescribe an intervention that reduces the relative risk of death by 25% than one that reduces the risk of death by 1 percentage point, although both presentations of the evidence may relate to the same benefit (i.e. a reduction in risk from 4% to 3%). The former refers to the
              - emphasis [ref=e307]: relative
              - text: reduction in risk and the latter to the
              - emphasis [ref=e308]: absolute
              - text: reduction in risk. As described in
              - link "Chapter 6, Section 6.4.1" [ref=e309] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-06#section-6-4-1
              - text: ", there are several measures for comparing dichotomous outcomes in two groups. Meta-analyses are usually undertaken using risk ratios (RR), odds ratios (OR) or risk differences (RD), but there are several alternative ways of expressing results."
            - paragraph [ref=e310]:
              - strong [ref=e311]: Relative risk reduction
              - text: "(RRR) is a convenient way of re-expressing a risk ratio as a percentage reduction:"
            - generic [ref=e312]: Image
            - paragraph [ref=e313]: For example, a risk ratio of 0.75 translates to a relative risk reduction of 25%, as in the example above.
            - paragraph [ref=e314]:
              - text: The risk difference is often referred to as the
              - strong [ref=e315]: absolute risk reduction
              - text: (ARR) or absolute risk increase (ARI), and may be presented as a percentage (e.g. 1%), as a decimal (e.g. 0.01), or as account (e.g. 10 out of 1000). We consider different choices for presenting absolute effects in Section
              - link "15.4.3" [ref=e316] [cursor=pointer]:
                - /url: "#section-15-4-3"
              - text: . We then describe computations for obtaining these numbers from the results of individual studies and of meta-analyses in Section
              - link "15.4.4" [ref=e317] [cursor=pointer]:
                - /url: "#section-15-4-4"
              - text: .
            - heading "15.4.2 Number needed to treat (NNT)#section-15-4-2" [level=3] [ref=e318]
            - paragraph [ref=e319]:
              - text: The
              - strong [ref=e320]: number needed to treat
              - text: "(NNT) is a common alternative way of presenting information on the effect of an intervention. The NNT is defined as the expected number of people who need to receive the experimental rather than the comparator intervention for one additional person to either incur or avoid an event (depending on the direction of the result) in a given time frame. Thus, for example, an NNT of 10 can be interpreted as ‘it is expected that one additional (or less) person will incur an event for every 10 participants receiving the experimental intervention rather than comparator over a given time frame’. It is important to be clear that:"
            - list [ref=e321]:
              - listitem [ref=e322]:
                - text: since the NNT is derived from the risk difference, it is still a
                - emphasis [ref=e323]: comparative
                - text: measure of effect (experimental versus a specific comparator) and not a general property of a single intervention; and
              - listitem [ref=e324]:
                - text: the NNT gives an ‘expected value’. For example, NNT = 10 does not imply that one additional event
                - emphasis [ref=e325]: will
                - text: occur in each and every group of 10 people.
            - paragraph [ref=e326]: NNTs can be computed for both beneficial and detrimental events, and for interventions that cause both improvements and deteriorations in outcomes. In all instances NNTs are expressed as positive whole numbers. Some authors use the term ‘number needed to harm’ (NNH) when an intervention leads to an adverse outcome, or a decrease in a positive outcome, rather than improvement. However, this phrase can be misleading (most notably, it can easily be read to imply the number of people who will experience a harmful outcome if given the intervention), and it is strongly recommended that ‘number needed to harm’ and ‘NNH’ are avoided. The preferred alternative is to use phrases such as ‘number needed to treat for an additional beneficial outcome’ (NNTB) and ‘number needed to treat for an additional harmful outcome’ (NNTH) to indicate direction of effect.
            - paragraph [ref=e327]: As NNTs refer to events, their interpretation needs to be worded carefully when the binary outcome is a dichotomization of a scale-based outcome. For example, if the outcome is pain measured on a ‘none, mild, moderate or severe’ scale it may have been dichotomized as ‘none or mild’ versus ‘moderate or severe’. It would be inappropriate for an NNT from these data to be referred to as an ‘NNT for pain’. It is an ‘NNT for moderate or severe pain’.
            - paragraph [ref=e328]:
              - text: We consider different choices for presenting absolute effects in Section
              - link "15.4.3" [ref=e329] [cursor=pointer]:
                - /url: "#section-15-4-3"
              - text: . We then describe computations for obtaining these numbers from the results of individual studies and of meta-analyses in Section
              - link "15.4.4" [ref=e330] [cursor=pointer]:
                - /url: "#section-15-4-4"
              - text: .
            - heading "15.4.3 Expressing risk differences#section-15-4-3" [level=3] [ref=e331]
            - paragraph [ref=e332]:
              - text: Users of reviews are liable to be influenced by the choice of statistical presentations of the evidence. Hoffrage and colleagues suggest that physicians’ inferences about statistical outcomes are more appropriate when they deal with ‘natural frequencies’ – whole numbers of people, both treated and untreated (e.g. treatment results in a drop from 20 out of 1000 to 10 out of 1000 women having breast cancer) – than when effects are presented as percentages (e.g. 1% absolute reduction in breast cancer risk) (Hoffrage et al 2000). Probabilities may be more difficult to understand than frequencies, particularly when events are rare. While standardization may be important in improving the presentation of research evidence (and participation in healthcare decisions), current evidence suggests that the presentation of natural frequencies for expressing differences in absolute risk is best understood by consumers of healthcare information (Akl et al 2011b). This evidence provides the rationale for presenting absolute risks in ‘Summary of findings’ tables as numbers of people with events per 1000 people receiving the intervention (see
              - link "Chapter 14" [ref=e333] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14
              - text: ).
            - paragraph [ref=e334]:
              - text: RRs and RRRs remain crucial because relative effects tend to be substantially more stable across risk groups than absolute effects (see
              - link "Chapter 10, Section 10.4.3" [ref=e335] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-4-3
              - text: ). Review authors can use their own data to study this consistency (Cates 1999, Smeeth et al 1999). Risk differences from studies are least likely to be consistent across baseline event rates; thus, they are rarely appropriate for computing numbers needed to treat in systematic reviews. If a relative effect measure (OR or RR) is chosen for meta-analysis, then a comparator group risk needs to be specified as part of the calculation of an RD or NNT. In addition, if there are several different groups of participants with different levels of risk, it is crucial to express absolute benefit for each clinically identifiable risk group, clarifying the time period to which this applies. Studies in patients with differing severity of disease, or studies with different lengths of follow-up will almost certainly have different comparator group risks. In these cases, different comparator group risks lead to different RDs and NNTs (except when the intervention has no effect). A recommended approach is to re-express an odds ratio or a risk ratio as a variety of RD or NNTs across a range of assumed comparator risks (ACRs) (McQuay and Moore 1997, Smeeth et al 1999). Review authors should bear these considerations in mind not only when constructing their ‘Summary of findings’ table, but also in the text of their review.
            - paragraph [ref=e336]: For example, a review of oral anticoagulants to prevent stroke presented information to users by describing absolute benefits for various baseline risks (Aguilar and Hart 2005, Aguilar et al 2007). They presented their principal findings as “The inherent risk of stroke should be considered in the decision to use oral anticoagulants in atrial fibrillation patients, selecting those who stand to benefit most for this therapy” (Aguilar and Hart 2005). Among high-risk atrial fibrillation patients with prior stroke or transient ischaemic attack who have stroke rates of about 12% (120 per 1000) per year, warfarin prevents about 70 strokes yearly per 1000 patients, whereas for low-risk atrial fibrillation patients (with a stroke rate of about 2% per year or 20 per 1000), warfarin prevents only 12 strokes. This presentation helps users to understand the important impact that typical baseline risks have on the absolute benefit that they can expect.
            - heading "15.4.4 Computations#section-15-4-4" [level=3] [ref=e337]
            - paragraph [ref=e338]:
              - text: Direct computation of risk difference (RD) or a number needed to treat (NNT) depends on the summary statistic (odds ratio, risk ratio or risk differences) available from the study or meta-analysis. When expressing results of meta-analyses, review authors should use, in the computations, whatever statistic they determined to be the most appropriate summary for meta-analysis (see
              - link "Chapter 10, Section 10.4.3" [ref=e339] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-4-3
              - text: ). Here we present calculations to obtain RD as a reduction in the number of participants per 1000. For example, a risk difference of –0.133 corresponds to 133
              - emphasis [ref=e340]: fewer
              - text: participants with the event per 1000.
            - paragraph [ref=e341]: RDs and NNTs should not be computed from the aggregated total numbers of participants and events across the trials. This approach ignores the randomization within studies, and may produce seriously misleading results if there is unbalanced randomization in any of the studies. Using the pooled result of a meta-analysis is more appropriate. When computing NNTs, the values obtained are by convention always rounded up to the next whole number.
            - heading "15.4.4.1 Computing NNT from a risk difference (RD)#section-15-4-4-1" [level=4] [ref=e342]
            - paragraph [ref=e343]: A NNT may be computed from a risk difference as
            - generic [ref=e344]: Image
            - paragraph [ref=e345]:
              - text: where the vertical bars (‘absolute value of’) in the denominator indicate that any minus sign should be ignored. It is convention to round the NNT up to the nearest whole number. For example, if the risk difference is –0.12 the NNT is 9; if the risk difference is –0.22 the NNT is 5. Cochrane review authors should qualify the NNT as referring to benefit (improvement) or harm by denoting the NNT as NNTB or NNTH. Note that this approach, although feasible, should be used only for the results of a meta-analysis of risk differences. In most cases meta-analyses will be undertaken using a relative measure of effect (RR or OR), and those statistics should be used to calculate the NNT (see Section
              - link "15.4.4.2" [ref=e346] [cursor=pointer]:
                - /url: "#section-15-4-4-2"
              - text: and
              - link "15.4.4.3" [ref=e347] [cursor=pointer]:
                - /url: "#section-15-4-4-3"
              - text: ).
            - heading "15.4.4.2 Computing risk differences or NNT from a risk ratio#section-15-4-4-2" [level=4] [ref=e348]
            - paragraph [ref=e349]: "To aid interpretation of the results of a meta-analysis of risk ratios, review authors may compute an absolute risk reduction or NNT. In order to do this, an assumed comparator risk (ACR) (otherwise known as a baseline risk, or risk that the outcome of interest would occur with the comparator intervention) is required. It will usually be appropriate to do this for a range of different ACRs. The computation proceeds as follows:"
            - generic [ref=e350]: Image
            - generic [ref=e351]: Image
            - paragraph [ref=e352]: "As an example, suppose the risk ratio is RR = 0.92, and an ACR = 0.3 (300 per 1000) is assumed. Then the effect on risk is 24 fewer per 1000:"
            - generic [ref=e353]: Image
            - paragraph [ref=e354]: "The NNT is 42:"
            - generic [ref=e355]: Image
            - heading "15.4.4.3 Computing risk differences or NNT from an odds ratio#section-15-4-4-3" [level=4] [ref=e356]
            - paragraph [ref=e357]: "Review authors may wish to compute a risk difference or NNT from the results of a meta-analysis of odds ratios. In order to do this, an ACR is required. It will usually be appropriate to do this for a range of different ACRs. The computation proceeds as follows:"
            - generic [ref=e358]: Image
            - paragraph [ref=e359]
            - generic [ref=e360]: Image
            - paragraph [ref=e361]: "As an example, suppose the odds ratio is OR = 0.73, and a comparator risk of ACR = 0.3 is assumed. Then the effect on risk is 62 fewer per 1000:"
            - generic [ref=e362]: Image
            - paragraph [ref=e363]
            - generic [ref=e364]: Image
            - paragraph [ref=e365]
            - generic [ref=e366]: Image
            - paragraph [ref=e367]: "The NNT is 17:"
            - generic [ref=e368]: Image
            - paragraph [ref=e369]
            - generic [ref=e370]: Image
            - paragraph [ref=e371]
            - generic [ref=e372]: Image
            - heading "15.4.4.4 Computing risk ratio from an odds ratio#section-15-4-4-4" [level=4] [ref=e373]
            - paragraph [ref=e374]: Because risk ratios are easier to interpret than odds ratios, but odds ratios have favourable mathematical properties, a review author may decide to undertake a meta-analysis based on odds ratios, but to express the result as a summary risk ratio (or relative risk reduction). This requires an ACR. Then
            - generic [ref=e375]: Image
            - paragraph [ref=e376]: It will often be reasonable to perform this transformation using the median comparator group risk from the studies in the meta-analysis.
            - heading "15.4.4.5 Computing confidence limits#section-15-4-4-5" [level=4] [ref=e377]
            - paragraph [ref=e378]: Confidence limits for RDs and NNTs may be calculated by applying the above formulae to the upper and lower confidence limits for the summary statistic (RD, RR or OR) (Altman 1998). Note that this confidence interval does not incorporate uncertainty around the ACR.
            - paragraph [ref=e379]: If the 95% confidence interval of OR or RR includes the value 1, one of the confidence limits will indicate benefit and the other harm. Thus, appropriate use of the words ‘fewer’ and ‘more’ is required for each limit when presenting results in terms of events. For NNTs, the two confidence limits should be labelled as NNTB and NNTH to indicate the direction of effect in each case. The confidence interval for the NNT will include a ‘discontinuity’, because increasingly smaller risk differences that approach zero will lead to NNTs approaching infinity. Thus, the confidence interval will include both an infinitely large NNTB and an infinitely large NNTH.
            - heading "15.5 Interpreting results from continuous outcomes (including standardized mean differences)#section-15-5" [level=2] [ref=e380]
            - heading "15.5.1 Meta-analyses with continuous outcomes#section-15-5-1" [level=3] [ref=e381]
            - paragraph [ref=e382]: Review authors should describe in the study protocol how they plan to interpret results for continuous outcomes. When outcomes are continuous, review authors have a number of options to present summary results. These options differ if studies report the same measure that is familiar to the target audiences, studies report the same or very similar measures that are less familiar to the target audiences, or studies report different measures.
            - heading "15.5.2 Meta-analyses with continuous outcomes using the same measure#section-15-5-2" [level=3] [ref=e383]
            - paragraph [ref=e384]:
              - text: If all studies have used the same familiar units, for instance, results are expressed as durations of events, such as symptoms for conditions including diarrhoea, sore throat, otitis media, influenza or duration of hospitalization, a meta-analysis may generate a summary estimate in those units, as a difference in mean response (see, for instance, the row summarizing results for duration of diarrhoea in
              - link "Chapter 14, Figure 14.1.b" [ref=e385] [cursor=pointer]:
                - /url: /node/106#figure-14.1.b
              - text: and the row summarizing oedema in
              - link "Chapter 14, Figure 14.1.a" [ref=e386] [cursor=pointer]:
                - /url: /node/106#figure-14.1.a
              - text: ). For such outcomes, the ‘Summary of findings’ table should include a difference of means between the two interventions. However, when units of such outcomes may be difficult to interpret, particularly when they relate to rating scales (again, see the oedema row of
              - link "Chapter 14, Figure 14.1.a" [ref=e387] [cursor=pointer]:
                - /url: /node/106#figure-14.1.a
              - text: ). ‘Summary of findings’ tables should include the minimum and maximum of the scale of measurement, and the direction. Knowledge of the smallest change in instrument score that patients perceive is important – the minimal important difference (MID) – and can greatly facilitate the interpretation of results (Guyatt et al 1998, Schünemann and Guyatt 2005). Knowing the MID allows review authors and users to place results in context. Review authors should state the MID – if known – in the Comments column of their ‘Summary of findings’ table. For example, the chronic respiratory questionnaire has possible scores in health-related quality of life ranging from 1 to 7 and 0.5 represents a well-established MID (Jaeschke et al 1989, Schünemann et al 2005).
            - heading "15.5.3 Meta-analyses with continuous outcomes using different measures#section-15-5-3" [level=3] [ref=e388]
            - paragraph [ref=e389]:
              - text: When studies have used different instruments to measure the same construct, a standardized mean difference (SMD) may be used in meta-analysis for combining continuous data. Without guidance, clinicians and patients may have little idea how to interpret results presented as SMDs. Review authors should therefore consider issues of interpretability when planning their analysis at the protocol stage and should consider whether there will be suitable ways to re-express the SMD or whether alternative effect measures, such as a ratio of means, or possibly as minimal important difference units (Guyatt et al 2013b) should be used.
              - link "Table 15.5.a" [ref=e390] [cursor=pointer]:
                - /url: "#table-15-5-a"
              - text: and the following sections describe these options.
            - paragraph [ref=e391]:
              - strong [ref=e392]: Table 15.5.a
              - text: Approaches and their implications to presenting results of continuous variables when primary studies have used different instruments to measure the same construct. Adapted from Guyatt et al (2013b)
