            - heading "15.5.3.4 Ratio of means#section-15-5-3-4" [level=4] [ref=e840]
            - paragraph [ref=e841]:
              - text: A more frequently used approach is based on calculation of a ratio of means between the intervention and comparator groups (Friedrich et al 2008) as discussed in
              - link "Chapter 6, Section 6.5.1.3" [ref=e842] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-06#section-6-5-1-3
              - text: . Interpretational advantages of this approach include the ability to pool studies with outcomes expressed in different units directly, to avoid the vulnerability of heterogeneous populations that limits approaches that rely on SD units, and for ease of clinical interpretation (row 2,
              - link "Table 15.5.a" [ref=e843] [cursor=pointer]:
                - /url: "#table-15-5-a"
              - text: and
              - link "Table 15.5.b" [ref=e844] [cursor=pointer]:
                - /url: "#table-15-5-b"
              - text: ). This method is currently designed for post-intervention scores only. However, it is possible to calculate a ratio of change scores if both intervention and comparator groups change in the same direction in each relevant study, and this ratio may sometimes be informative.
            - paragraph [ref=e845]:
              - text: Limitations to this approach include its limited applicability to change scores (since it is unlikely that both intervention and comparator group changes are in the same direction in all studies) and the possibility of misleading results if the comparator group mean is very small, in which case even a modest difference from the intervention group will yield a large and therefore misleading ratio of means. It also requires that separate ratios of means be calculated for each included study, and then entered into a generic inverse variance meta-analysis (see
              - link "Chapter 10, Section 10.3" [ref=e846] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-3
              - text: ).
            - paragraph [ref=e847]:
              - text: The ratio of means approach illustrated in
              - link "Table 15.5.b" [ref=e848] [cursor=pointer]:
                - /url: "#table-15-5-b"
              - text: suggests a relative reduction in pain of only 13%, meaning that those receiving steroids have a pain severity 87% of those in the comparator group, an effect that might be considered modest.
            - heading "15.5.3.5 Presenting continuous results as minimally important difference units#section-15-5-3-5" [level=4] [ref=e849]
            - paragraph [ref=e850]:
              - text: To express results in MID units, review authors have two options. First, they can be combined across studies in the same way as the SMD, but instead of dividing the mean difference of each study by its SD, review authors divide by the MID associated with that outcome (Johnston et al 2010, Guyatt et al 2013b). Instead of SD units, the pooled results represent MID units (row 3,
              - link "Table 15.5.a" [ref=e851] [cursor=pointer]:
                - /url: "#table-15-5-a"
              - text: and
              - link "Table 15.5.b" [ref=e852] [cursor=pointer]:
                - /url: "#table-15-5-b"
              - text: ), and may be more easily interpretable. This approach avoids the problem of varying SDs across studies that may distort estimates of effect in approaches that rely on the SMD. The approach, however, relies on having well-established MIDs. The approach is also risky in that a difference less than the MID may be interpreted as trivial when a substantial proportion of patients may have achieved an important benefit.
            - paragraph [ref=e853]:
              - text: The other approach makes a simple conversion (not shown in
              - link "Table 15.5.b" [ref=e854] [cursor=pointer]:
                - /url: "#table-15-5-b"
              - text: ), before undertaking the meta-analysis, of the means and SDs from each study to means and SDs on the scale of a particular familiar instrument whose MID is known. For example, one can rescale the mean and SD of other chronic respiratory disease instruments (e.g. rescaling a 0 to 100 score of an instrument) to a the 1 to 7 score in Chronic Respiratory Disease Questionnaire (CRQ) units (by assuming 0 equals 1 and 100 equals 7 on the CRQ). Given the MID of the CRQ of 0.5, a mean difference in change of 0.71 after rescaling of all studies suggests a substantial effect of the intervention (Guyatt et al 2013b). This approach, presenting in units of the most familiar instrument, may be the most desirable when the target audiences have extensive experience with that instrument, particularly if the MID is well established.
            - heading "15.6 Drawing conclusions#section-15-6" [level=2] [ref=e855]
            - heading "15.6.1 Conclusions sections of a Cochrane review#section-15-6-1" [level=3] [ref=e856]
            - paragraph [ref=e857]: Authors’ conclusions in a Cochrane review are divided into implications for practice and implications for research. While Cochrane reviews about interventions can provide meaningful information and guidance for practice, decisions about the desirable and undesirable consequences of healthcare options require evidence and judgements for criteria that most Cochrane reviews do not provide (Alonso-Coello et al 2016). In describing the implications for practice and the development of recommendations, however, review authors may consider the certainty of the evidence, the balance of benefits and harms, and assumed values and preferences.
            - heading "15.6.2 Implications for practice#section-15-6-2" [level=3] [ref=e858]
            - paragraph [ref=e859]: Drawing conclusions about the practical usefulness of an intervention entails making trade-offs, either implicitly or explicitly, between the estimated benefits, harms and the values and preferences. Making such trade-offs, and thus making specific recommendations for an action in a specific context, goes beyond a Cochrane review and requires additional evidence and informed judgements that most Cochrane reviews do not provide (Alonso-Coello et al 2016). Such judgements are typically the domain of clinical practice guideline developers for which Cochrane reviews will provide crucial information (Graham et al 2011, Schünemann et al 2014, Zhang et al 2018a). Thus, authors of Cochrane reviews should not make recommendations.
            - paragraph [ref=e860]:
              - text: If review authors feel compelled to lay out actions that clinicians and patients could take, they should – after describing the certainty of evidence and the balance of benefits and harms – highlight different actions that might be consistent with particular patterns of values and preferences. Other factors that might influence a decision should also be highlighted, including any known factors that would be expected to modify the effects of the intervention, the baseline risk or status of the patient, costs and who bears those costs, and the availability of resources. Review authors should ensure they consider all patient-important outcomes, including those for which limited data may be available. In the context of public health reviews the focus may be on population-important outcomes as the target may be an entire (non-diseased) population and include outcomes that are not measured in the population receiving an intervention (e.g. a reduction of transmission of infections from those receiving an intervention). This process implies a high level of explicitness in judgements about values or preferences attached to different outcomes and the certainty of the related evidence (Zhang et al 2018b, Zhang et al 2018c); this and a full cost-effectiveness analysis is beyond the scope of most Cochrane reviews (although they might well be used for such analyses; see
              - link "Chapter 20" [ref=e861] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-20
              - text: ).
            - paragraph [ref=e862]: "A review on the use of anticoagulation in cancer patients to increase survival (Akl et al 2011a) provides an example for laying out clinical implications for situations where there are important trade-offs between desirable and undesirable effects of the intervention: “The decision for a patient with cancer to start heparin therapy for survival benefit should balance the benefits and downsides and integrate the patient’s values and preferences. Patients with a high preference for a potential survival prolongation, limited aversion to potential bleeding, and who do not consider heparin (both UFH or LMWH) therapy a burden may opt to use heparin, while those with aversion to bleeding may not.”"
            - heading "15.6.3 Implications for research#section-15-6-3" [level=3] [ref=e863]
            - paragraph [ref=e864]: "The second category for authors’ conclusions in a Cochrane review is implications for research. To help people make well-informed decisions about future healthcare research, the ‘Implications for research’ section should comment on the need for further research, and the nature of the further research that would be most desirable. It is helpful to consider the population, intervention, comparison and outcomes that could be addressed, or addressed more effectively in the future, in the context of the certainty of the evidence in the current review (Brown et al 2006):"
            - list [ref=e865]:
              - listitem [ref=e866]: "P (Population): diagnosis, disease stage, comorbidity, risk factor, sex, age, ethnic group, specific inclusion or exclusion criteria, clinical setting;"
              - listitem [ref=e867]: "I (Intervention): type, frequency, dose, duration, prognostic factor;"
              - listitem [ref=e868]: "C (Comparison): placebo, routine care, alternative treatment/management;"
              - listitem [ref=e869]: "O (Outcome): which clinical or patient-related outcomes will the researcher need to measure, improve, influence or accomplish? Which methods of measurement should be used?"
            - paragraph [ref=e870]:
              - text: While Cochrane review authors will find the PICO domains helpful, the domains of the GRADE certainty framework further support understanding and describing what additional research will improve the certainty in the available evidence. Note that as the certainty of the evidence is likely to vary by outcome, these implications will be specific to certain outcomes in the review.
              - link "Table 15.6.a" [ref=e871] [cursor=pointer]:
                - /url: "#table-15-6-a"
              - text: shows how review authors may be aided in their interpretation of the body of evidence and drawing conclusions about future research and practice.
            - paragraph [ref=e872]:
              - strong [ref=e873]: Table 15.6.a
              - text: Implications for research and practice suggested by individual GRADE domains
