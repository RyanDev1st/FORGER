              - text: Crude (arithmetic) means of the post-operative pain mean responses across all five trials when transformed to a 100-point scale.
            - heading "15.5.3.3 Re-expressing SMDs through dichotomization and transformation to relative and absolute measures#section-15-5-3-3" [level=4] [ref=e606]
            - paragraph [ref=e607]:
              - text: A third approach (row 1c,
              - link "Table 15.5.a" [ref=e608] [cursor=pointer]:
                - /url: "#table-15-5-a"
              - text: and
              - link "Table 15.5.b" [ref=e609] [cursor=pointer]:
                - /url: "#table-15-5-b"
              - text: ) relies on converting the continuous measure into a dichotomy and thus allows calculation of relative and absolute effects on a binary scale. A transformation of a SMD to a (log) odds ratio is available, based on the assumption that an underlying continuous variable has a logistic distribution with equal standard deviation in the two intervention groups, as discussed in
              - link "Chapter 10, Section 10.6" [ref=e610] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-6
              - text: (Furukawa 1999, Guyatt et al 2013b). The assumption is unlikely to hold exactly and the results must be regarded as an approximation. The log odds ratio is estimated as
            - generic [ref=e611]: Image
            - paragraph [ref=e612]:
              - text: (or approximately 1.81✕SMD). The resulting odds ratio can then be presented as normal, and in a ‘Summary of findings’ table, combined with an assumed comparator group risk to be expressed as an absolute risk difference. The comparator group risk in this case would refer to the proportion of people who have achieved a specific value of the continuous outcome. In randomized trials this can be interpreted as the proportion who have improved by some (specified) amount (responders), for instance by 5 points on a 0 to 100 scale.
              - link "Table 15.5.c" [ref=e613] [cursor=pointer]:
                - /url: "#table-15-5-c"
              - text: shows some illustrative results from this method. The risk differences can then be converted to NNTs or to people per thousand using methods described in Section
              - link "15.4.4" [ref=e614] [cursor=pointer]:
                - /url: "#section-15-4-4"
              - text: .
