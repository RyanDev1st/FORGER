            - heading "15.5.3.1 Presenting and interpreting SMDs using generic effect size estimates#section-15-5-3-1" [level=4] [ref=e440]
            - paragraph [ref=e441]:
              - text: The SMD expresses the intervention effect in standard units rather than the original units of measurement. The SMD is the difference in mean effects between the experimental and comparator groups divided by the pooled standard deviation of participants’ outcomes, or external SDs when studies are very small (see
              - link "Chapter 6, Section 6.5.1.2" [ref=e442] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-06#section-6-5-1-2
              - text: ). The value of a SMD thus depends on both the size of the effect (the difference between means) and the standard deviation of the outcomes (the inherent variability among participants or based on an external SD).
            - paragraph [ref=e443]:
              - text: If review authors use the SMD, they might choose to present the results directly as SMDs (row 1a,
              - link "Table 15.5.a" [ref=e444] [cursor=pointer]:
                - /url: "#table-15-5-a"
              - text: and
              - link "Table 15.5.b" [ref=e445] [cursor=pointer]:
                - /url: "#table-15-5-b"
              - text: "). However, absolute values of the intervention and comparison groups are typically not useful because studies have used different measurement instruments with different units. Guiding rules for interpreting SMDs (or ‘Cohen’s effect sizes’) exist, and have arisen mainly from researchers in the social sciences (Cohen 1988). One example is as follows: 0.2 represents a small effect, 0.5 a moderate effect and 0.8 a large effect (Cohen 1988). Variations exist (e.g. <0.40=small, 0.40 to 0.70=moderate, >0.70=large). Review authors might consider including such a guiding rule in interpreting the SMD in the text of the review, and in summary versions such as the Comments column of a ‘Summary of findings’ table. However, some methodologists believe that such interpretations are problematic because"
              - emphasis [ref=e446]: patient
              - text: importance of a finding is context-dependent and not amenable to generic statements.
            - heading "15.5.3.2 Re-expressing SMDs using a familiar instrument#section-15-5-3-2" [level=4] [ref=e447]
            - paragraph [ref=e448]:
              - text: The second possibility for interpreting the SMD is to express it in the units of one or more of the specific measurement instruments used by the included studies (row 1b,
              - link "Table 15.5.a" [ref=e449] [cursor=pointer]:
                - /url: "#table-15-5-a"
              - text: and
              - link "Table 15.5.b" [ref=e450] [cursor=pointer]:
                - /url: "#table-15-5-b"
              - text: ). The approach is to calculate an absolute difference in means by multiplying the SMD by an estimate of the SD associated with the most familiar instrument. To obtain this SD, a reasonable option is to calculate a weighted average across all intervention groups of all studies that used the selected instrument (preferably a pre-intervention or post-intervention SD as discussed in
              - link "Chapter 10, Section 10.5.2" [ref=e451] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-5-2
              - text: ). To better reflect among-person variation in practice, or to use an instrument not represented in the meta-analysis, it may be preferable to use a standard deviation from a representative observational study. The summary effect is thus re-expressed in the original units of that particular instrument and the clinical relevance and impact of the intervention effect can be interpreted using that familiar instrument.
            - paragraph [ref=e452]:
              - text: "The same approach of re-expressing the results for a familiar instrument can also be used for other standardized effect measures such as when standardizing by MIDs (Guyatt et al 2013b): see Section"
              - link "15.5.3.5" [ref=e453] [cursor=pointer]:
                - /url: "#section-15-5-3-5"
              - text: .
            - paragraph [ref=e454]
