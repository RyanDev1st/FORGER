              - strong [ref=e1104]: Ovid search syntax
              - text: "(for Box 4.4.d above):"
            - generic [ref=e1105]: exp denotes an ‘exploded’ index term (Emtree indexing term);
            - generic [ref=e1106]: / denotes an index term (Emtree indexing term);
