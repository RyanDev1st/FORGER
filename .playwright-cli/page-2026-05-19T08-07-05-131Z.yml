                      - strong [ref=e786]: Reports retrieved
                  - cell "Reports not retrieved" [ref=e787]:
                    - paragraph [ref=e788]:
                      - strong [ref=e789]: Reports not retrieved
                - row "Relevant reports Relevant reports retrieved (a) Relevant reports not retrieved (b)" [ref=e790]:
                  - cell "Relevant reports" [ref=e791]:
                    - strong [ref=e792]: Relevant reports
