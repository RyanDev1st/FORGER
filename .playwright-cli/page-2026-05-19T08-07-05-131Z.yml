            - paragraph [ref=e1111]:
              - text: The InterTASC Information Specialists’ Sub-Group Search Filter Resource offers a collection of
              - link "search filters" [ref=e1112] [cursor=pointer]:
                - /url: https://sites.google.com/a/york.ac.uk/issg-search-filters-resource/home
              - text: ", focusing predominantly on methodological search filters and providing critical appraisals of some of these filters. The site includes, amongst others, filters for identifying systematic reviews, randomized and non-randomized studies and qualitative research in a range of databases and across a range of service providers ("
              - link "Glanville et al 2006" [ref=e1113] [cursor=pointer]:
                - /url: "#_ENREF_108"
              - text: ).
            - paragraph [ref=e1114]:
              - text: Increasingly, machine learning models for selected study designs (classifiers) such as randomized controlled trials are built into systematic review software such as EPPI-Reviewer (
              - link "https://eppi.ioe.ac.uk/CMS/Portals/35/machine_learning_in_eppi-reviewer_v_7_web_version.pdf" [ref=e1115] [cursor=pointer]:
                - /url: https://eppi.ioe.ac.uk/CMS/Portals/35/machine_learning_in_eppi-reviewer_v_7_web_version.pdf
              - text: ) and Covidence (
              - link "https://www.covidence.org/blog/let-machine-learning-find-the-randomized-controlled-trials-faster" [ref=e1116] [cursor=pointer]:
                - /url: https://www.covidence.org/blog/let-machine-learning-find-the-randomized-controlled-trials-faster
              - text: ), or can be designed within systematic review software such as DistillerSR (
              - link "https://www.distillersr.com/products/modules" [ref=e1117] [cursor=pointer]:
                - /url: https://www.distillersr.com/products/modules
              - text: (
              - link "Marshall et al 2023" [ref=e1118] [cursor=pointer]:
                - /url: "#_ENREF_179"
              - text: ). When using the study design classifiers that are available within systematic review software, it is probably best to ensure that the search strategies used to identify studies from databases do not also contain study design filters. A systematic review of ten varied studies that used supervised machine learning to identify “high-quality clinical articles” reported that machine learning, largely using gold standard sets of records from the ACP Journal Club, achieved a best balance sensitivity of 95% with 86% precision in one study (
              - link "Abdelkader et al 2021" [ref=e1119] [cursor=pointer]:
                - /url: "#_ENREF_3"
              - text: ). Other studies had higher sensitivity but lower precision. The authors noted that this is a fast-moving field, although it is hampered by the lack of large reference sets of known relevant RCTs. Details of other publications reporting the development of machine classifiers for identifying cluster randomized trials and “scientifically rigorous” research can be found on the
              - link "machine learning classifiers page" [ref=e1120] [cursor=pointer]:
                - /url: https://sites.google.com/a/york.ac.uk/issg-search-filters-resource/home/built-in-filters
              - text: of the InterTASC Information Specialists’ Sub-Group Search Filter Resource.
            - paragraph [ref=e1121]:
              - text: Search filter performance is discussed further in a detailed report (
              - link "Lefebvre et al 2017" [ref=e1122] [cursor=pointer]:
                - /url: "#_ENREF_167"
              - text: ). For further discussion around the design and use of search filters, see the online
              - link "Technical Supplement" [ref=e1123] [cursor=pointer]:
                - /url: https://engage.cochrane.org/
              - text: . Further evidence-based information about search filters generally and for specific types of studies can be found on the
              - link "SuRe Info portal" [ref=e1124] [cursor=pointer]:
                - /url: https://sites.google.com/york.ac.uk/sureinfo
              - text: ", which is updated twice per year ("
              - link "Isojarvi and Glanville 2021" [ref=e1125] [cursor=pointer]:
                - /url: "#_ENREF_143"
              - text: ).
            - paragraph [ref=e1126]:
              - strong [ref=e1127]: MECIR Box 4.4.f
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e1128]:
              - rowgroup [ref=e1129]:
                - 'row "C34: Using search filters (Highly desirable)" [ref=e1130]':
                  - 'cell "C34: Using search filters (Highly desirable)" [ref=e1131]':
                    - emphasis [ref=e1132]: C34
                    - text: ": Using search filters ("
                    - strong [ref=e1133]: Highly desirable
                    - text: )
                - row "Use specially designed and tested search filters where appropriate including the Cochrane Highly Sensitive Search Strategies for identifying randomized trials in MEDLINE, but do not use filters in pre-filtered databases e.g. do not use a randomized trial filter in CENTRAL or a systematic review filter in DARE. Inappropriate or inadequate search strategies may fail to identify records that are included in bibliographic databases. Search filters should be used with caution. They should be assessed not only for the reliability of their development and reported performance, but also for their current accuracy, relevance and effectiveness given the frequent interface and indexing changes affecting databases." [ref=e1134]:
                  - cell "Use specially designed and tested search filters where appropriate including the Cochrane Highly Sensitive Search Strategies for identifying randomized trials in MEDLINE, but do not use filters in pre-filtered databases e.g. do not use a randomized trial filter in CENTRAL or a systematic review filter in DARE." [ref=e1135]:
                    - emphasis [ref=e1136]: Use specially designed and tested search filters where appropriate including the Cochrane Highly Sensitive Search Strategies for identifying randomized trials in MEDLINE, but do not use filters in pre-filtered databases e.g. do not use a randomized trial filter in CENTRAL or a systematic review filter in DARE.
                  - cell "Inappropriate or inadequate search strategies may fail to identify records that are included in bibliographic databases. Search filters should be used with caution. They should be assessed not only for the reliability of their development and reported performance, but also for their current accuracy, relevance and effectiveness given the frequent interface and indexing changes affecting databases." [ref=e1137]
            - paragraph [ref=e1138]
            - heading "4.4.8 Peer review of search strategies#section-4-4-8" [level=3] [ref=e1139]
            - paragraph [ref=e1140]:
              - text: It is strongly recommended that search strategies be peer reviewed before the searches are run. Peer review of search strategies is increasingly recognized as a necessary step in designing and executing high-quality search strategies to identify studies for possible inclusion in systematic reviews (
              - link "Folb et al 2020" [ref=e1141] [cursor=pointer]:
                - /url: "#_ENREF_94"
              - text: ","
              - link "Neilson 2021" [ref=e1142] [cursor=pointer]:
                - /url: "#_ENREF_196"
              - text: ). As discussed elsewhere (
              - link "Lefebvre and Duffy 2021" [ref=e1143] [cursor=pointer]:
                - /url: "#_ENREF_168"
              - text: "), the following organizations and documents advocate peer review of searches: The Agency for Healthcare Research and Quality (AHRQ) in the US, the Campbell Collaboration, the Centre for Reviews and Dissemination in the UK, the European Network for Health Technology Assessment (EUnetHTA), the Institute for Quality and Efficiency in Health Care (IQWiG) in Germany, the Institute of Medicine in the US, the National Institute of Health and Care Excellence (NICE) in the UK, the Preferred Reporting Items for Systematic reviews and Meta-Analyses – Extension for Searches (PRISMA-S Extension) and the PRISMA 2020 explanation and elaboration documents ("
              - link "Centre for Reviews and Dissemination 2009" [ref=e1144] [cursor=pointer]:
                - /url: "#_ENREF_41"
              - text: ","
              - link "Institute of Medicine 2011" [ref=e1145] [cursor=pointer]:
                - /url: "#_ENREF_140"
              - text: ","
              - link "Agency for Healthcare Research and Quality 2014" [ref=e1146] [cursor=pointer]:
                - /url: "#_ENREF_4"
              - text: ","
              - link "National Institute for Health and Care Excellence (NICE) 2014" [ref=e1147] [cursor=pointer]:
                - /url: "#_ENREF_195"
              - text: ","
              - link "EUnetHTA JA3WP6B2-2 Authoring Team 2019" [ref=e1148] [cursor=pointer]:
                - /url: "#_ENREF_85"
              - text: ","
              - link "The Methods Group of the Campbell Collaboration 2019" [ref=e1149] [cursor=pointer]:
                - /url: "#_ENREF_266"
              - text: ","
              - link "Page et al 2021a" [ref=e1150] [cursor=pointer]:
                - /url: "#_ENREF_209"
              - text: ","
              - link "Rethlefsen et al 2021" [ref=e1151] [cursor=pointer]:
                - /url: "#_ENREF_223"
              - text: ","
              - link "Institute for Quality and Efficiency in Health Care 2023" [ref=e1152] [cursor=pointer]:
                - /url: "#_ENREF_139"
              - text: ","
              - link "MacDonald et al 2024" [ref=e1153] [cursor=pointer]:
                - /url: "#_ENREF_173"
              - text: ). Additionally, the Campbell Collaboration includes an item on peer review of search strategies in its Information Retrieval Methods Group Checklist in its searching guidance (
              - link "MacDonald et al 2024" [ref=e1154] [cursor=pointer]:
                - /url: "#_ENREF_173"
              - text: ).
            - paragraph [ref=e1155]:
              - text: Studies have shown that errors occur in the search strategies underpinning systematic reviews and that search strategies are not always conducted or reported to a high standard (
              - link "Sampson and McGowan 2006" [ref=e1156] [cursor=pointer]:
                - /url: "#_ENREF_236"
              - text: ","
              - link "Mullins et al 2014" [ref=e1157] [cursor=pointer]:
                - /url: "#_ENREF_194"
              - text: ","
              - link "Layton 2017" [ref=e1158] [cursor=pointer]:
                - /url: "#_ENREF_162"
              - text: ","
              - link "Salvador-Olivan et al 2019" [ref=e1159] [cursor=pointer]:
                - /url: "#_ENREF_233"
              - text: ","
              - link "Masterson and Martinez-Silveira 2022" [ref=e1160] [cursor=pointer]:
                - /url: "#_ENREF_180"
              - text: ","
              - link "Ramirez et al 2022" [ref=e1161] [cursor=pointer]:
                - /url: "#_ENREF_220"
              - text: ). This has also been shown to be the case within some Cochrane reviews (
              - link "Franco et al 2018" [ref=e1162] [cursor=pointer]:
                - /url: "#_ENREF_95"
              - text: ","
              - link "Lyon et al 2022" [ref=e1163] [cursor=pointer]:
                - /url: "#_ENREF_218"
              - text: ). The PRISMA-S Extension states that authors “should strongly consider having the search strategy peer reviewed by an experienced searcher, informational specialist, or librarian” (
              - link "Rethlefsen et al 2021" [ref=e1164] [cursor=pointer]:
                - /url: "#_ENREF_223"
              - text: ) and encourages authors to consider using the Peer Review of Electronic Search Strategies (PRESS) Guideline Statement and Checklist (
              - link "McGowan et al 2016b" [ref=e1165] [cursor=pointer]:
                - /url: "#_ENREF_184"
              - text: ). Research has shown that peer review using a specially designed checklist can improve the quality of searches both in systematic reviews (
              - link "Relevo and Paynter 2012" [ref=e1166] [cursor=pointer]:
                - /url: "#_ENREF_221"
              - text: ","
              - link "Spry et al 2013" [ref=e1167] [cursor=pointer]:
                - /url: "#_ENREF_258"
              - text: ) and in rapid reviews (
              - link "Spry et al 2013" [ref=e1168] [cursor=pointer]:
                - /url: "#_ENREF_258"
              - text: ","
              - link "Spry and Mierzwinski-Urban 2018" [ref=e1169] [cursor=pointer]:
                - /url: "#_ENREF_259"
              - text: ). An evidence-based checklist such as the PRESS Evidence-Based Checklist should be used to assess which elements are important in peer review of electronic search strategies (
              - link "McGowan et al 2016a" [ref=e1170] [cursor=pointer]:
                - /url: "#_ENREF_183"
              - text: ","
              - link "McGowan et al 2016b" [ref=e1171] [cursor=pointer]:
                - /url: "#_ENREF_184"
              - text: ). The PRESS Checklist covers not only the technical accuracy of the strategy (line numbers, spellings, etc.), but also whether the search strategy addresses all relevant aspects of the protocol and has interpreted the research question appropriately. Recently, a
              - link "Search Submission and Peer Review Assessment form" [ref=e1172] [cursor=pointer]:
                - /url: http://www.cda-amc.ca/sites/default/files/PRESS_Peer_Review_Electronic_Search_Strate/Table_10_PRESS.pdf
              - text: has been made available within the PRESS materials, to improve the peer review process.
            - paragraph [ref=e1173]:
              - text: It is recommended that authors provide information on the search strategy development and peer review processes. The PRISMA 2020 explanation and elaboration article and the PRISMA-S Extension provide guidance on how and where authors should describe the processes used to develop and validate or peer review the search strategy (
              - link "Page et al 2021a" [ref=e1174] [cursor=pointer]:
                - /url: "#_ENREF_209"
              - text: ","
              - link "Rethlefsen et al 2021" [ref=e1175] [cursor=pointer]:
                - /url: "#_ENREF_223"
              - text: ). For example, the PRISMA 2020 explanation and elaboration article (
              - link "Page et al 2021a" [ref=e1176] [cursor=pointer]:
                - /url: "#_ENREF_209"
              - text: ) states that “the description of the search strategy development process might include details of the approaches used to identify keywords, synonyms, or subject indexing terms used in the search strategies or any processes used to validate or peer review the search strategies”, and “if the search strategy was peer reviewed, report the peer review process used and specify any tool used, such as the Peer Review of Electronic Search Strategies (PRESS) checklist” (
              - link "McGowan et al 2016b" [ref=e1177] [cursor=pointer]:
                - /url: "#_ENREF_184"
              - text: "). In the example for Item 7 (Search strategy) of the PRISMA 2020 checklist, the authors propose using the following statement: “The strategy was developed by an information specialist and the final strategies were peer reviewed by an experienced information specialist within our team” ("
              - link "Page et al 2021b" [ref=e1178] [cursor=pointer]:
                - /url: "#_ENREF_210"
              - text: ). The PRISMA-S Extension (
              - link "Rethlefsen et al 2021" [ref=e1179] [cursor=pointer]:
                - /url: "#_ENREF_223"
              - text: ") advocates that the use of peer review be reported and described in the methods section, and proposes the following statement in Item 14 (Peer review: Describe any search peer review process): “The strategies were peer reviewed by another senior information specialist prior to execution using the PRESS Checklist” ("
              - link "McGowan et al 2016b" [ref=e1180] [cursor=pointer]:
                - /url: "#_ENREF_184"
              - text: ). For Cochrane reviews, the names, credentials, and institutions of the peer reviewers of the search strategies should be noted in the review (with their permission) in the Acknowledgments section.
            - paragraph [ref=e1181]:
              - text: Further evidence-based information about peer reviewing search strategies can be found on the
              - link "SuRe Info portal" [ref=e1182] [cursor=pointer]:
                - /url: https://sites.google.com/york.ac.uk/sureinfo
              - text: ", which is updated twice per year ("
              - link "Isojarvi and Glanville 2021" [ref=e1183] [cursor=pointer]:
                - /url: "#_ENREF_143"
              - text: ).
            - heading "4.4.9 Alerts#section-4-4-9" [level=3] [ref=e1184]
            - paragraph [ref=e1185]: Alerts, also called literature surveillance services, ‘push’ services or SDIs (selective dissemination of information), are an excellent method of staying up to date with the medical literature currently being published and with other resources such as trials register resources, as a supplement to designing and running specific searches for specific reviews. In practice, alerts are based on a previously developed search strategy, which is saved in a personal account on the database platform (e.g. ‘My EBSCOhost – search alerts’ on EBSCO, ‘My Searches & Alerts’ on Ovid and ‘MyNCBI – saved searches’ on PubMed). These saved strategies filter the content as the database (or other resource) is being updated with new information. The account owner is notified (usually via email) when new or updated publications or records meeting their specified search parameters are added to the database (or other resource). In the case of PubMed, the alert can be set up to be delivered weekly or monthly, or in real-time and can comprise email or RSS feeds.
            - paragraph [ref=e1186]:
              - text: For review authors, alerts are a useful tool to help monitor their review topic area after the original search has been conducted. By following an alert, authors can become aware of a new study that might meet the review’s eligibility criteria, and decide either to include it in the review immediately or to mention it in the review’s ‘studies awaiting classification’ section, for inclusion during the next review update (see online
              - link "Chapter IV" [ref=e1187] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-iv
              - text: ). Authors should consider setting up alerts so that the review can be as current as possible at the time of publication.
            - paragraph [ref=e1188]:
              - text: Another way of attempting to stay current with the literature as it emerges is by using alerts based on journal tables of contents (TOCs). These usually cannot be specifically tailored to the information needs in the same way as search strategies developed to cover a specific topic. They can, however, be a good way of trying to keep up to date on a more general level by monitoring what is currently being published in journals of interest. Many journals, even those that are available by subscription only, offer TOC alert services free of charge. In addition, a number of publishers and organizations offer TOC services (see online
              - link "Technical Supplement" [ref=e1189] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: ). Use of TOCs is not proposed as a single alternative to the various other methods of study identification necessary for undertaking systematic reviews, rather as a supplementary method (See also
              - link "Chapter 22" [ref=e1190] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22
              - text: ", Sections"
              - link "22.2" [ref=e1191] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22#section-22-2
              - text: and
              - link "22.3" [ref=e1192] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22#section-22-3
              - text: for a discussion of new technologies to support evidence surveillance in the context of ‘living’ systematic reviews).
            - paragraph [ref=e1193]: As mentioned above, alerts should also be considered for sources beyond databases and journal TOCs, such as trials register resources and regulatory information.
            - heading "4.4.10 Timing of searches#section-4-4-10" [level=3] [ref=e1194]
            - paragraph [ref=e1195]:
              - text: The published review should be as up to date as possible. Searches for all the relevant sources (databases, trials registers, etc.) should be rerun prior to publication, if the initial search date is more than 12 months (preferably six months) from the intended publication date (see
              - link "MECIR Box 4.4.g" [ref=e1196] [cursor=pointer]:
                - /url: "#mecir-box-4.4.g"
              - text: ). The results should also be screened to identify potentially eligible studies. Ideally, the studies should be incorporated fully in the review. If not, then the potentially eligible studies will need to be reported as references under ‘studies awaiting classification’ (or under ‘ongoing studies’ if they are not yet completed).
            - paragraph [ref=e1197]:
              - strong [ref=e1198]: MECIR Box 4.4.g
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e1199]:
              - rowgroup [ref=e1200]:
                - 'row "C37: Rerunning searches (Mandatory)" [ref=e1201]':
                  - 'cell "C37: Rerunning searches (Mandatory)" [ref=e1202]':
                    - emphasis [ref=e1203]:
                      - text: C37
                      - strong [ref=e1204]: ":"
                    - text: Rerunning searches (
                    - strong [ref=e1205]: Mandatory
                    - text: )
                - row "Rerun or update searches for all relevant sources within 12 months before publication of the review or review update, and screen the results for potentially eligible studies. The published review should be as up to date as possible. The search must be rerun close to publication, if the initial search date is more than 12 months (preferably six months) from the intended publication date, and the results screened for potentially eligible studies. Ideally, the studies should be incorporated fully in the review. If not, then the potentially eligible studies will need to be reported, at a minimum as a reference under ‘Studies awaiting classification’ (or ‘Ongoing studies’ if they have not yet completed)." [ref=e1206]:
                  - cell "Rerun or update searches for all relevant sources within 12 months before publication of the review or review update, and screen the results for potentially eligible studies." [ref=e1207]:
                    - emphasis [ref=e1208]: Rerun or update searches for all relevant sources within 12 months before publication of the review or review update, and screen the results for potentially eligible studies.
                  - cell "The published review should be as up to date as possible. The search must be rerun close to publication, if the initial search date is more than 12 months (preferably six months) from the intended publication date, and the results screened for potentially eligible studies. Ideally, the studies should be incorporated fully in the review. If not, then the potentially eligible studies will need to be reported, at a minimum as a reference under ‘Studies awaiting classification’ (or ‘Ongoing studies’ if they have not yet completed)." [ref=e1209]
                - 'row "C38: Incorporating findings from rerun searches (Highly desirable)" [ref=e1210]':
                  - 'cell "C38: Incorporating findings from rerun searches (Highly desirable)" [ref=e1211]':
                    - emphasis [ref=e1212]:
                      - text: C38
                      - strong [ref=e1213]: ":"
                    - text: Incorporating findings from rerun searches (
                    - strong [ref=e1214]: Highly desirable
                    - text: )
                - row "Fully incorporate any studies identified in the rerun or update of the search within 12 months before publication of the review or review update. The published review should be as up to date as possible. After the rerun of the search, the decision whether to incorporate any new studies fully into the review will need to be balanced against the delay in publication." [ref=e1215]:
                  - cell "Fully incorporate any studies identified in the rerun or update of the search within 12 months before publication of the review or review update." [ref=e1216]:
                    - emphasis [ref=e1217]: Fully incorporate any studies identified in the rerun or update of the search within 12 months before publication of the review or review update.
                  - cell "The published review should be as up to date as possible. After the rerun of the search, the decision whether to incorporate any new studies fully into the review will need to be balanced against the delay in publication." [ref=e1218]
            - heading "4.4.11 When to stop searching#section-4-4-11" [level=3] [ref=e1219]
            - paragraph [ref=e1220]:
              - text: Developing a search within a database is often an iterative and exploratory process. It involves exploring trade-offs between search terms and assessing their overall impact on the sensitivity and precision of the search. It is often difficult to decide in a scientific or objective way when a search is complete and search strategy development can stop. The ability to decide when to stop typically develops through experience of developing many strategies. Suggestions for stopping rules have been made around the retrieval of new records, for example to stop if adding in a series of new terms to a database search strategy yields no new relevant records, or if precision falls below a particular cut-off point (
              - link "Chilcott et al 2003" [ref=e1221] [cursor=pointer]:
                - /url: "#_ENREF_45"
              - text: "). Stopping might also be appropriate when the removal of terms or concepts results in missing relevant records. Another consideration is the amount of evidence that has already accrued: in topics where evidence is scarce, authors might need to be more cautious about deciding when to stop searching. Although methods have been described to assist with deciding when to stop developing the search, there has been little formal evaluation of the approaches ("
              - link "Arber et al" [ref=e1222] [cursor=pointer]:
                - /url: "#_ENREF_7"
              - text: ","
              - link "Booth 2010" [ref=e1223] [cursor=pointer]:
                - /url: "#_ENREF_20"
              - text: ).
            - paragraph [ref=e1224]:
              - text: Research has demonstrated that searches within databases may miss relevant studies and that careful attention should be paid to achieving a sensitive search strategy since there may always be room for improvement (
              - link "Matthews et al 1999" [ref=e1225] [cursor=pointer]:
                - /url: "#_ENREF_181"
              - text: ","
              - link "Savoie et al 2003" [ref=e1226] [cursor=pointer]:
                - /url: "#_ENREF_240"
              - text: ","
              - link "Booth 2016a" [ref=e1227] [cursor=pointer]:
                - /url: "#_ENREF_21"
              - text: ). At a basic level, investigation is needed as to whether a strategy is performing adequately. One simple test is to check whether the search is finding the publications that have been recommended as key publications or that have been included in other similar reviews (
              - link "Cooper et al 2018b" [ref=e1228] [cursor=pointer]:
                - /url: "#_ENREF_55"
              - text: ","
              - link "EUnetHTA JA3WP6B2-2 Authoring Team 2019" [ref=e1229] [cursor=pointer]:
                - /url: "#_ENREF_85"
              - text: ). It is not enough, however, for the strategy to find only those records, otherwise this might be a sign that the strategy is biased towards known studies and other relevant records might be being missed. In addition, citation searches (see online
              - link "Technical Supplement Section 1.1.4" [ref=e1230] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: ) and reference checking (see online
              - link "Technical Supplement Section 1.3.4" [ref=e1231] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: ) are useful checks of strategy performance. If those additional methods are finding documents that the searches have already retrieved, but that the team did not necessarily know about in advance, then this is one sign that the strategy might be performing adequately. Also, an evidence-based checklist such as the PRESS Evidence-Based Checklist (
              - link "McGowan et al 2016b" [ref=e1232] [cursor=pointer]:
                - /url: "#_ENREF_184"
              - text: ) should be used to assess whether the search strategy is adequate (see
              - link "Section 4.4.8" [ref=e1233] [cursor=pointer]:
                - /url: "#section-4-4-8"
              - text: ). If some of the PRESS dimensions seem to be missing without adequate explanation or arouse concerns, then the search may not yet be complete.
            - paragraph [ref=e1234]:
              - text: Statistical techniques can be used to assess performance, such as capture-recapture (
              - link "Spoor et al 1996" [ref=e1235] [cursor=pointer]:
                - /url: "#_ENREF_257"
              - text: ","
              - link "Ferrante di Ruffano et al 2012" [ref=e1236] [cursor=pointer]:
                - /url: "#_ENREF_92"
              - text: ), also known as capture-mark-recapture (
              - link "Kastner et al 2009" [ref=e1237] [cursor=pointer]:
                - /url: "#_ENREF_150"
              - text: ","
              - link "Lane et al 2013" [ref=e1238] [cursor=pointer]:
                - /url: "#_ENREF_161"
              - text: ), or the relative recall technique (
              - link "Sampson et al 2006" [ref=e1239] [cursor=pointer]:
                - /url: "#_ENREF_235"
              - text: ","
              - link "Sampson and McGowan 2011" [ref=e1240] [cursor=pointer]:
                - /url: "#_ENREF_238"
              - text: ). Kastner suggests the capture-mark-recapture technique merits further investigation since it could be used to estimate the number of studies in a literature prospectively and to determine where to stop searches once suitable cut-off levels have been identified. Kastner’s approach involves searching databases, conducting record selection, calculating capture-mark-recapture and then making decisions about whether further searches are necessary. This would entail potentially an iterative search and selection process. Capture-recapture needs results from at least two searches to estimate the number of missed studies. Further investigation of published prospective techniques seems warranted to learn more about the potential benefits.
            - paragraph [ref=e1241]:
              - text: Relative recall (
              - link "Sampson et al 2006" [ref=e1242] [cursor=pointer]:
                - /url: "#_ENREF_235"
              - text: ","
              - link "Sampson and McGowan 2011" [ref=e1243] [cursor=pointer]:
                - /url: "#_ENREF_238"
              - text: ) requires a range of searches to have been conducted so that the relevant studies have been built up by a set of sensitive searches. The performance of the individual searches can then be assessed in each individual database by determining how many of the studies that were deemed eligible for the evidence synthesis and were indexed within a database, can be found by the database search used to populate the synthesis. If a search in a database did not perform well and missed many studies, then that search strategy is likely to have been suboptimal. If the search strategy found most of the studies that were available to be found in the database, then it was likely to have been a sensitive strategy. Assessments of precision could also be made, but these mostly inform future search approaches since they cannot affect the searches and record assessment already undertaken. Relative recall may be most useful at the end of the search process since it relies on the achievement of several searches to make judgements about the overall performance of strategies.
            - paragraph [ref=e1244]:
              - text: Citation searches (see online
              - link "Technical Supplement" [ref=e1245] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: ) are another way to assess whether the search is complete. Citation searches, conducted using the included (eligible) studies identified after a series of searches, may reveal additional relevant studies. If the citation searches yield a large number of additional relevant records, this may suggest that the original searches were not optimal and should be revisited.
            - paragraph [ref=e1246]:
              - text: In evidence synthesis involving qualitative data, searching is often more organic and intertwined with the analysis such that the searching stops when new information ceases to be identified (
              - link "Booth 2016b" [ref=e1247] [cursor=pointer]:
                - /url: "#_ENREF_22"
              - text: ). The reasons for stopping need to be documented and it is suggested that explanations or justifications for stopping may centre around saturation (
              - link "Booth 2016b" [ref=e1248] [cursor=pointer]:
                - /url: "#_ENREF_22"
              - text: ). Further information on searches for qualitative evidence can be found in
              - link "Chapter 21" [ref=e1249] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-21
              - text: .
            - paragraph [ref=e1250]:
              - text: In searches for complex topics or in those types of review where there are different approaches to the completeness of study identification, exhaustive structured searches of bibliographic databases may not be the highest priority and so the issue of knowing when to stop may take on a different focus (
              - link "Cooper et al 2018b" [ref=e1251] [cursor=pointer]:
                - /url: "#_ENREF_55"
              - text: ","
              - link "Cooper et al 2022b" [ref=e1252] [cursor=pointer]:
                - /url: "#_ENREF_61"
              - text: ). A range of approaches to stopping searches specific to living reviews has been suggested (
              - link "Heron et al 2023" [ref=e1253] [cursor=pointer]:
                - /url: "#_ENREF_127"
              - text: ).
            - heading "4.5 Documenting and reporting the search process#section-4-5" [level=2] [ref=e1254]
            - paragraph [ref=e1255]:
              - text: Review authors should document the search process in enough detail to ensure that it can be reported correctly in the review (see
              - link "MECIR Box 4.5.a" [ref=e1256] [cursor=pointer]:
                - /url: "#mecir-box-4.5.a"
              - text: ). The searches of all resources should be reproducible to the extent that this is possible. By documenting the search process, we refer to internal record-keeping, which is distinct from reporting the search process in the review (discussed in online
              - link "Chapter III" [ref=e1257] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-iii
              - text: ).
            - paragraph [ref=e1258]:
              - strong [ref=e1259]: MECIR Box 4.5.a
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e1260]:
              - rowgroup [ref=e1261]:
                - 'row "C36: Documenting the search process (Mandatory)" [ref=e1262]':
                  - 'cell "C36: Documenting the search process (Mandatory)" [ref=e1263]':
                    - emphasis [ref=e1264]:
                      - text: C36
                      - strong [ref=e1265]: ":"
                    - text: Documenting the search process (
                    - strong [ref=e1266]: Mandatory
                    - text: )
                - row "Document the search process in enough detail to ensure that it can be reported correctly in the review. The search process (including the sources searched, when, by whom, and using which terms) needs to be documented in enough detail throughout the process to ensure that it can be reported correctly in the review, to the extent that all the searches of all the databases are reproducible." [ref=e1267]:
                  - cell "Document the search process in enough detail to ensure that it can be reported correctly in the review." [ref=e1268]:
                    - emphasis [ref=e1269]: Document the search process in enough detail to ensure that it can be reported correctly in the review.
                  - cell "The search process (including the sources searched, when, by whom, and using which terms) needs to be documented in enough detail throughout the process to ensure that it can be reported correctly in the review, to the extent that all the searches of all the databases are reproducible." [ref=e1270]
            - paragraph [ref=e1271]:
              - text: Medical/healthcare librarians and information specialists involved with the review should draft, or at least comment on, the search strategy sections of the review prior to publication (
              - link "Pauwels et al 2024" [ref=e1272] [cursor=pointer]:
                - /url: "#_ENREF_213"
              - text: ).
            - paragraph [ref=e1273]:
              - text: Suboptimal reporting of systematic review search activities and methods has been observed (
              - link "Sampson et al 2008" [ref=e1274] [cursor=pointer]:
                - /url: "#_ENREF_237"
              - text: ","
              - link "Roundtree et al 2009" [ref=e1275] [cursor=pointer]:
                - /url: "#_ENREF_230"
              - text: ","
              - link "Niederstadt and Droste 2010" [ref=e1276] [cursor=pointer]:
                - /url: "#_ENREF_199"
              - text: ","
              - link "Shamsi et al 2020" [ref=e1277] [cursor=pointer]:
                - /url: "#_ENREF_246"
              - text: ","
              - link "Rethlefsen et al 2024" [ref=e1278] [cursor=pointer]:
                - /url: "#_ENREF_225"
              - text: ). In one report, ninety percent of systematic reviews failed to report search methods adequately (
              - link "de Kock et al 2020" [ref=e1279] [cursor=pointer]:
                - /url: "#_ENREF_67"
              - text: ). Research has also shown a lack of compliance with guidance in the Handbook with respect to search strategy description in published Cochrane reviews (
              - link "Sampson and McGowan 2006" [ref=e1280] [cursor=pointer]:
                - /url: "#_ENREF_236"
              - text: ","
              - link "Yoshii et al 2009" [ref=e1281] [cursor=pointer]:
                - /url: "#_ENREF_291"
              - text: ","
              - link "Wasiak et al 2017" [ref=e1282] [cursor=pointer]:
                - /url: "#_ENREF_282"
              - text: ","
              - link "Franco et al 2018" [ref=e1283] [cursor=pointer]:
                - /url: "#_ENREF_95"
              - text: ","
              - link "Nguyen et al 2022" [ref=e1284] [cursor=pointer]:
                - /url: "#_ENREF_198"
              - text: ","
              - link "Uttley et al 2023" [ref=e1285] [cursor=pointer]:
                - /url: "#_ENREF_276"
              - text: ). The lack of consensus regarding optimal reporting has been a challenge with respect to the values of transparency and reproducibility (
              - link "Rethlefsen et al 2024" [ref=e1286] [cursor=pointer]:
                - /url: "#_ENREF_225"
              - text: ). The PRISMA-Search (PRISMA-S) Extension (
              - link "Rethlefsen et al 2021" [ref=e1287] [cursor=pointer]:
                - /url: "#_ENREF_223"
              - text: ), an extension to the PRISMA Statement (
              - link "Page et al 2021b" [ref=e1288] [cursor=pointer]:
                - /url: "#_ENREF_210"
              - text: ","
              - link "Page et al 2021a" [ref=e1289] [cursor=pointer]:
                - /url: "#_ENREF_209"
              - text: "), addresses the reporting of search strategies in systematic reviews. PRISMA-S (together with the major revision of PRISMA itself) provides enough detail and specific examples for systematic review authors to report search methods and information sources in a clear, reproducible way. In Box 2 of the PRISMA 2020 guidance under “Noteworthy changes to the PRISMA 2009 statement” the guidance has been strengthened to stipulate: “Modification of the ‘Search’ item to recommend authors present full search strategies for all databases, registers and websites searched, not just at least one database (see item #7)”. This brings the PRISMA 2020 guidance more into line with Cochrane standards for reporting of search strategies. Further PRISMA-related guidance has been published relating to tracking records and completion of the PRISMA flow diagram ("
              - link "Rethlefsen and Page 2022" [ref=e1290] [cursor=pointer]:
                - /url: "#_ENREF_224"
              - text: ).
            - paragraph [ref=e1291]:
              - text: There is also a recommendation in the PRISMA 2020 guidance (see item 27) that “authors state whether data used in the review are publicly available and if so, where they can be accessed” (
              - link "Page et al 2021a" [ref=e1292] [cursor=pointer]:
                - /url: "#_ENREF_209"
              - text: ). These recommendations may influence record keeping practices of searchers. Additionally, a proposed data structure for transparent and repeatable reporting of bibliographic searching has been published (
              - link "Haddaway et al 2022" [ref=e1293] [cursor=pointer]:
                - /url: "#_ENREF_119"
              - text: ).
            - paragraph [ref=e1294]:
              - text: It is recommended that review authors seek guidance from a medical/healthcare librarian or information specialist at the earliest opportunity with respect to documenting the search process (
              - link "Rethlefsen et al 2015" [ref=e1295] [cursor=pointer]:
                - /url: "#_ENREF_222"
              - text: ","
              - link "Faggion et al 2016" [ref=e1296] [cursor=pointer]:
                - /url: "#_ENREF_89"
              - text: ","
              - link "Meert et al 2016" [ref=e1297] [cursor=pointer]:
                - /url: "#_ENREF_185"
              - text: ","
              - link "Pauwels et al 2024" [ref=e1298] [cursor=pointer]:
                - /url: "#_ENREF_213"
              - text: ","
              - link "Pawliuk et al 2024" [ref=e1299] [cursor=pointer]:
                - /url: "#_ENREF_214"
              - text: ). For Cochrane reviews, the bibliographic database search strategies should all be copied and pasted into the search strategies supplementary material exactly as run and in full, together with the search set numbers and the total number of records retrieved by each search strategy. The search strategies should not be re-typed, because this can introduce errors. The same process, to the extent that it is possible, is also good practice for searches of trials registers and other sources, where the interface used, such as introductory or advanced, should also be specified. Creating a report of the search process can be accomplished through methodical documentation of the steps taken by the searcher. This need not be onerous if suitable record keeping is performed during the process of the search, but it can be nearly impossible to recreate post hoc. Many database interfaces have facilities for search strategies to be saved online or to be emailed; an offline copy in text format should also be saved. For some databases, taking and saving a screenshot of the search may be the most practical approach (
              - link "Rader et al 2014" [ref=e1300] [cursor=pointer]:
                - /url: "#_ENREF_219"
              - text: ).
            - paragraph [ref=e1301]:
              - text: Documenting the searching of sources other than databases, including the search terms used, is also required if searches are to be reproducible (
              - link "Atkinson et al 2015" [ref=e1302] [cursor=pointer]:
                - /url: "#_ENREF_9"
              - text: ","
              - link "Chow 2015" [ref=e1303] [cursor=pointer]:
                - /url: "#_ENREF_46"
              - text: ","
              - link "Witkowski and Aldhouse 2015" [ref=e1304] [cursor=pointer]:
                - /url: "#_ENREF_285"
              - text: ","
              - link "Booth et al 2020b" [ref=e1305] [cursor=pointer]:
                - /url: "#_ENREF_25"
              - text: ","
              - link "Hirt et al 2024a" [ref=e1306] [cursor=pointer]:
                - /url: "#_ENREF_130"
              - text: ). Guidance on terminology, application, and reporting of citation searching has recently been published (the TARCiS statement) (
              - link "Hirt et al 2024a" [ref=e1307] [cursor=pointer]:
                - /url: "#_ENREF_130"
              - text: ).
            - paragraph [ref=e1308]:
              - text: Details about contacting experts or manufacturers, searching reference lists, scanning websites, and decisions about search iterations can be produced as an appendix in the final document and used for future updates. The purpose of search documentation is transparency, internal assessment, and reference for any future update. It is important to plan how to record searching of sources other than databases since some activities (contacting experts, reference list searching, and forward citation searching) will occur later on in the review process after the database results have been screened (
              - link "Rader et al 2014" [ref=e1309] [cursor=pointer]:
                - /url: "#_ENREF_219"
              - text: ). The searcher should record any correspondence on key decisions and report a summary of this correspondence alongside the search strategy in a search narrative. The narrative describes the major decisions that shaped the strategy and can give a peer reviewer an insight into the rationale for the search approach (
              - link "Craven and Levay 2011" [ref=e1310] [cursor=pointer]:
                - /url: "#_ENREF_64"
              - text: ). A worked example of a search narrative is available (
              - link "Cooper et al 2018a" [ref=e1311] [cursor=pointer]:
                - /url: "#_ENREF_54"
              - text: ).
            - paragraph [ref=e1312]:
              - text: It is particularly important to save locally or file print copies of any information found on the internet, such as information about ongoing and/or unpublished trials, as this information may no longer be accessible at the time the review is written. Local copies should be stored in a structured way to allow retrieval when needed. There are also web-based tools which archive webpage content for future reference, such as
              - link "WebCite" [ref=e1313] [cursor=pointer]:
                - /url: http://www.webcitation.org
              - text: (
              - link "Eysenbach and Trudel 2005" [ref=e1314] [cursor=pointer]:
                - /url: "#_ENREF_88"
              - text: ). The results of web searches will not be reproducible to the same extent as bibliographic database searches because web content and search engine algorithms frequently change, and search results can differ between users due to a general move towards localization and personalization (
              - link "Cooper et al 2021a" [ref=e1315] [cursor=pointer]:
                - /url: "#_ENREF_58"
              - text: ). It is still important, however, to document the search process to ensure that the methods used can be transparently reported (
              - link "Briscoe 2018" [ref=e1316] [cursor=pointer]:
                - /url: "#_ENREF_32"
              - text: ). In cases where a search engine retrieves more results than it is practical to screen in full (it is rarely practical to search thousands of web results, as the precision of web searches is likely to be relatively low), the number of results that are documented and reported should be the number that were screened rather than the total number (
              - link "Dellavalle et al 2003" [ref=e1317] [cursor=pointer]:
                - /url: "#_ENREF_69"
              - text: ","
              - link "Bramer 2016" [ref=e1318] [cursor=pointer]:
                - /url: "#_ENREF_27"
              - text: ).
            - paragraph [ref=e1319]:
              - text: Decisions should be documented for all records identified by the search. Details of the flow of studies from the number(s) of references identified in the search to the number of studies included in the review will need to be reported in the final review, ideally using a flow diagram such as that proposed in the PRISMA guidance (see online
              - link "Chapter III" [ref=e1320] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-iii
              - text: ); these can be generated using software including Covidence, DistillerSR, EPPI-Reviewer, the METAGEAR package for R, the PRISMA Flow Diagram Generator, and RevMan. A table of ‘Characteristics of excluded studies’ will also need to be presented (see Section
              - link "4.6.5" [ref=e1321] [cursor=pointer]:
                - /url: "#section-4-6-5"
              - text: ). Numbers of records are sufficient for exclusions based on initial screening of titles and abstracts. Broad categorizations are sufficient for records classed as potentially eligible during an initial screen of the full text. Authors will need to decide for each review when to map records to studies (if multiple records refer to one study). The flow diagram records initially the total number of records retrieved from various sources, then the total number of studies to which these records relate. Review authors need to match the various records to the various studies in order to complete the flow diagram correctly. Lists of included and excluded studies must be based on studies rather than records (see also Section
              - link "4.6.1" [ref=e1322] [cursor=pointer]:
                - /url: "#section-4-6-1"
              - text: ).
            - paragraph [ref=e1323]:
              - text: Further evidence-based information about documenting and reporting the search process can be found on the
              - link "SuRe Info portal" [ref=e1324] [cursor=pointer]:
                - /url: https://sites.google.com/york.ac.uk/sureinfo
              - text: ", which is updated twice per year ("
              - link "Isojarvi and Glanville 2021" [ref=e1325] [cursor=pointer]:
                - /url: "#_ENREF_143"
              - text: ).
            - heading "4.6 Selecting studies#section-4-6" [level=2] [ref=e1326]
            - heading "4.6.1 Studies (not reports) as the unit of interest#section-4-6-1" [level=3] [ref=e1327]
            - paragraph [ref=e1328]: A Cochrane review is a review of studies that meet pre-specified eligibility criteria. Since each study may have been reported in several articles, abstracts or other reports, an extensive search for studies for the review may identify many reports for each potentially relevant study. Two distinct processes are therefore required to determine which studies can be included in the review. One is to link together multiple reports of the same study; and the other is to use the information available in the various reports to determine which studies are eligible for inclusion. Although sometimes there is a single report for each study, it should never be assumed that this is the case.
            - paragraph [ref=e1329]:
              - text: As well as the studies that inform the systematic review, other studies will also be identified and these should be recorded or tagged as they are encountered, so that they can be listed in the relevant tables in the review (see
              - link "Section 4.6.3" [ref=e1330] [cursor=pointer]:
                - /url: "#section-4-6-3"
              - text: ).
            - heading "4.6.2 Identifying multiple reports from the same study#section-4-6-2" [level=3] [ref=e1331]
            - paragraph [ref=e1332]:
              - text: Duplicate publication can introduce substantial biases if studies are inadvertently included more than once in a meta-analysis (
              - link "Tramèr et al 1997" [ref=e1333] [cursor=pointer]:
                - /url: "#_ENREF_270"
              - text: ). Duplicate publication can take various forms, ranging from identical manuscripts to reports describing different outcomes of the study or results at different time points (
              - link "von Elm et al 2004" [ref=e1334] [cursor=pointer]:
                - /url: "#_ENREF_278"
              - text: ). The number of participants may differ in the different publications. It can be difficult to detect duplicate publication and some ‘detective work’ by the review authors may be required.
            - paragraph [ref=e1335]: "Some of the most useful criteria for comparing reports are:"
            - list [ref=e1336]:
              - listitem [ref=e1337]:
                - text: trial identification numbers (e.g. ClinicalTrials.gov Identifier (NCT number); ISRCTN; Universal Trial Number (UTN) (assigned by the ICTRP); other identifiers such as those from the sponsor) (
                - link "Liu et al 2022" [ref=e1338] [cursor=pointer]:
                  - /url: "#_ENREF_171"
                - text: ","
                - link "Smalheiser and Holt 2022" [ref=e1339] [cursor=pointer]:
                  - /url: "#_ENREF_251"
                - text: );
              - listitem [ref=e1340]: author names (most duplicate reports have one or more authors in common, although this is not always the case);
              - listitem [ref=e1341]: location and setting (particularly if institutions, such as hospitals, are named);
              - listitem [ref=e1342]: specific details of the interventions (e.g. dose, frequency);
              - listitem [ref=e1343]: numbers of participants and baseline data; and
              - listitem [ref=e1344]: date and duration of the study (which can also clarify whether different sample sizes are due to different periods of recruitment).
            - paragraph [ref=e1345]: Where uncertainties remain after considering these and other factors, it may be necessary to correspond with the authors of the reports and/or the principal investigators of the studies for unpublished data.
            - paragraph [ref=e1346]:
              - text: Multiple reports of the same study should be collated, so that each study, rather than each report, is the unit of interest in the review (see
              - link "MECIR Box 4.6.a" [ref=e1347] [cursor=pointer]:
                - /url: "#mecir-box-4.6.a"
              - text: ). Review authors will need to choose and justify which report (the primary report) to use as a source for study results, particularly if two reports include conflicting results. They should not discard other (secondary) reports, since they may contain additional outcome measures and valuable information about the design and conduct of the study.
            - paragraph [ref=e1348]:
              - strong [ref=e1349]: MECIR Box 4.6.a
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e1350]:
              - rowgroup [ref=e1351]:
                - 'row "C42: Collating multiple reports (Mandatory)" [ref=e1352]':
                  - 'cell "C42: Collating multiple reports (Mandatory)" [ref=e1353]':
                    - emphasis [ref=e1354]:
                      - text: C42
                      - strong [ref=e1355]: ":"
                    - text: Collating multiple reports (
                    - strong [ref=e1356]: Mandatory
                    - text: )
                - row "Collate multiple reports of the same study, so that each study, rather than each report, is the unit of interest in the review. It is wrong to consider multiple reports of the same study as if they are multiple studies. Secondary reports of a study should not be discarded, however, since they may contain valuable information about the design and conduct. Review authors must choose and justify which report to use as a source for study results." [ref=e1357]:
                  - cell "Collate multiple reports of the same study, so that each study, rather than each report, is the unit of interest in the review." [ref=e1358]:
                    - emphasis [ref=e1359]: Collate multiple reports of the same study, so that each study, rather than each report, is the unit of interest in the review.
                  - cell "It is wrong to consider multiple reports of the same study as if they are multiple studies. Secondary reports of a study should not be discarded, however, since they may contain valuable information about the design and conduct. Review authors must choose and justify which report to use as a source for study results." [ref=e1360]
            - heading "4.6.3 A typical process for selecting studies#section-4-6-3" [level=3] [ref=e1361]
            - paragraph [ref=e1362]: "A typical process for selecting studies for inclusion in a review is as follows (the planned process should be detailed in the protocol for the review):"
            - list [ref=e1363]:
              - listitem [ref=e1364]:
                - strong [ref=e1365]: Merge search results
                - text: from different sources using reference management software, and remove duplicate records of the same report (i.e. records reporting the same journal title, volume and page numbers).
              - listitem [ref=e1366]:
                - strong [ref=e1367]: Examine titles and abstracts
                - text: to remove obviously irrelevant reports (authors should generally be over-inclusive at this stage).
              - listitem [ref=e1368]:
                - strong [ref=e1369]: Retrieve the full text
                - text: of the potentially relevant reports.
              - listitem [ref=e1370]:
                - strong [ref=e1371]: Link together multiple reports
                - text: of the same study (see Section
                - link "4.6.2" [ref=e1372] [cursor=pointer]:
                  - /url: "#section-4-6-2"
                - text: ).
              - listitem [ref=e1373]:
                - strong [ref=e1374]: Examine full-text reports
                - text: for compliance of studies with eligibility criteria.
              - listitem [ref=e1375]:
                - strong [ref=e1376]: Correspond with investigators
                - text: ", where appropriate, to clarify study eligibility (it may be appropriate to request further information, such as missing methods information or results, at the same time). If study data remain incomplete/unobtainable those studies should be tagged/recorded as incomplete, and should be listed in the table of ‘Characteristics of studies awaiting classification’ in the review."
              - listitem [ref=e1377]:
                - strong [ref=e1378]: Make final decisions on study inclusion
                - text: and proceed to data collection.
              - listitem [ref=e1379]:
                - strong [ref=e1380]: Tag or record
                - text: (i) any ongoing studies, so that they can be added to the ongoing studies table, and (ii) any completed or terminated studies (including any that are presumed to be completed based on the information available) but not yet reported, so that they can be added to either the included studies table or the table of studies awaiting classification, depending on whether the study clearly meets the review’s eligibility criteria.
            - paragraph [ref=e1381]:
              - text: Note that studies should not be omitted from a review solely on the basis of measured outcome data not being reported (see
              - link "MECIR Box 4.6.b" [ref=e1382] [cursor=pointer]:
                - /url: "#mecir-box-4.6.b"
              - text: and
              - link "Chapter 13" [ref=e1383] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-13
              - text: ).
            - paragraph [ref=e1384]:
              - strong [ref=e1385]: MECIR Box 4.6.b
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e1386]:
              - rowgroup [ref=e1387]:
                - 'row "C40: Excluding studies without useable data (Mandatory)" [ref=e1388]':
                  - 'cell "C40: Excluding studies without useable data (Mandatory)" [ref=e1389]':
                    - emphasis [ref=e1390]:
                      - text: C40
                      - strong [ref=e1391]: ":"
                    - text: Excluding studies without useable data (
                    - strong [ref=e1392]: Mandatory
                    - text: )
                - row "Include studies in the review irrespective of whether measured outcome data are reported in a ‘usable’ way. Systematic reviews typically should seek to include all relevant participants who have been included in eligible study designs of the relevant interventions and had the outcomes of interest measured. Reviews must not exclude studies solely on the basis of reporting of the outcome data, since this may introduce bias due to selective outcome reporting and risk undermining the systematic review process. While such studies cannot be included in meta-analyses, the implications of their omission should be considered. Note that studies may legitimately be excluded because outcomes were not measured. Furthermore, issues may be different for adverse effects outcomes, since the pool of studies may be much larger and it can be difficult to assess whether such outcomes were measured." [ref=e1393]:
                  - cell "Include studies in the review irrespective of whether measured outcome data are reported in a ‘usable’ way." [ref=e1394]:
                    - emphasis [ref=e1395]: Include studies in the review irrespective of whether measured outcome data are reported in a ‘usable’ way.
                  - cell "Systematic reviews typically should seek to include all relevant participants who have been included in eligible study designs of the relevant interventions and had the outcomes of interest measured. Reviews must not exclude studies solely on the basis of reporting of the outcome data, since this may introduce bias due to selective outcome reporting and risk undermining the systematic review process. While such studies cannot be included in meta-analyses, the implications of their omission should be considered. Note that studies may legitimately be excluded because outcomes were not measured. Furthermore, issues may be different for adverse effects outcomes, since the pool of studies may be much larger and it can be difficult to assess whether such outcomes were measured." [ref=e1396]
            - heading "4.6.4 Implementation of the selection process#section-4-6-4" [level=3] [ref=e1397]
            - paragraph [ref=e1398]:
              - text: Decisions about which studies to include in a review are among the most influential decisions that are made in the review process and they involve judgement. Use (at least) two people working independently to determine whether each study meets the eligibility criteria. Ideally, screening of titles and abstracts to remove irrelevant reports should also be done in duplicate by two people working independently (although it is acceptable that this initial screening of titles and abstracts is undertaken by only one person). It is essential, however, that two people working independently are used to make a final determination as to whether each study considered possibly eligible after title/abstract screening meets the eligibility criteria based on the full text of the study report(s) (see
              - link "MECIR Box 4.6.c" [ref=e1399] [cursor=pointer]:
                - /url: "#mecir-box-4.6.c"
              - text: ).
            - paragraph [ref=e1400]:
              - strong [ref=e1401]: MECIR Box 4.6.c
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e1402]:
              - rowgroup [ref=e1403]:
                - 'row "C39: Making inclusion decisions (Mandatory)" [ref=e1404]':
                  - 'cell "C39: Making inclusion decisions (Mandatory)" [ref=e1405]':
                    - emphasis [ref=e1406]:
                      - text: C39
                      - strong [ref=e1407]: ":"
                    - text: Making inclusion decisions (
                    - strong [ref=e1408]: Mandatory
                    - text: )
                - row "Use (at least) two people working independently to determine whether each study meets the eligibility criteria, and define in advance the process for resolving disagreements. Duplicating the study selection process reduces both the risk of making mistakes and the possibility that selection is influenced by a single person’s biases. The inclusion decisions should be based on the full texts of potentially eligible studies when possible, usually after an initial screen of titles and abstracts. It is desirable, but not mandatory, that two people undertake this initial screening, working independently." [ref=e1409]:
                  - cell "Use (at least) two people working independently to determine whether each study meets the eligibility criteria, and define in advance the process for resolving disagreements." [ref=e1410]:
                    - emphasis [ref=e1411]: Use (at least) two people working independently to determine whether each study meets the eligibility criteria, and define in advance the process for resolving disagreements.
                  - cell "Duplicating the study selection process reduces both the risk of making mistakes and the possibility that selection is influenced by a single person’s biases. The inclusion decisions should be based on the full texts of potentially eligible studies when possible, usually after an initial screen of titles and abstracts. It is desirable, but not mandatory, that two people undertake this initial screening, working independently." [ref=e1412]
            - paragraph [ref=e1413]:
              - text: It has been shown that using at least two authors may reduce the possibility that relevant reports will be discarded (
              - link "Edwards et al 2002" [ref=e1414] [cursor=pointer]:
                - /url: "#_ENREF_75"
              - text: ","
              - link "Waffenschmidt et al 2019" [ref=e1415] [cursor=pointer]:
                - /url: "#_ENREF_279"
              - text: ","
              - link "Gartlehner et al 2020" [ref=e1416] [cursor=pointer]:
                - /url: "#_ENREF_103"
              - text: ) although other case reports have suggested single screening approaches may be adequate (
              - link "Doust et al 2005" [ref=e1417] [cursor=pointer]:
                - /url: "#_ENREF_73"
              - text: ","
              - link "Shemilt et al 2016" [ref=e1418] [cursor=pointer]:
                - /url: "#_ENREF_248"
              - text: ). Opportunities for screening efficiencies seem likely to become available through promising developments in single human screening in combination with machine learning approaches (
              - link "O'Mara-Eves et al 2015" [ref=e1419] [cursor=pointer]:
                - /url: "#_ENREF_206"
              - text: ).
            - paragraph [ref=e1420]:
              - text: Experts in a particular area frequently have pre-formed opinions that can bias their assessment of both the relevance and validity of articles (
              - link "Cooper and Ribble 1989" [ref=e1421] [cursor=pointer]:
                - /url: "#_ENREF_62"
              - text: ","
              - link "Oxman and Guyatt 1993" [ref=e1422] [cursor=pointer]:
                - /url: "#_ENREF_208"
              - text: ). Thus, while it is important that at least one author is knowledgeable in the area under review, it may be an advantage to have a second author who is not a content expert.
            - paragraph [ref=e1423]: Disagreements about whether a study should be included can generally be resolved by discussion. Often the cause of disagreement is a simple oversight on the part of one of the review authors. When the disagreement is due to a difference in interpretation, this may require arbitration by another person. Occasionally, it will not be possible to resolve disagreements about whether to include a study without additional information. In these cases, authors may choose to categorize the study in their review as one that is awaiting assessment until the additional information is obtained from the study authors or investigators.
            - paragraph [ref=e1424]: A single failed eligibility criterion is sufficient for a study to be excluded from a review. In practice, therefore, eligibility criteria for each study should be assessed in order of importance, so that the first ‘no’ response can be used as the primary reason for exclusion of the study, and the remaining criteria need not be assessed. The eligibility criteria order may be different in different reviews and they do not always need to be the same.
            - paragraph [ref=e1425]: For most reviews it will be worthwhile to pilot test the eligibility criteria on a sample of reports (say six to eight articles, including ones that are thought to be definitely eligible, definitely not eligible and doubtful). The pilot test can be used to refine and clarify the eligibility criteria, train the people who will be applying them and ensure that the criteria can be applied consistently by more than one person.
            - paragraph [ref=e1426]:
              - text: For Cochrane reviews the selection process must be documented in sufficient detail to be able to complete a flow diagram and a table of ‘Characteristics of excluded studies’ (see
              - link "MECIR Box 4.6.d" [ref=e1427] [cursor=pointer]:
                - /url: "#mecir-box-4.6.d"
              - text: ). During the selection process it is crucial to keep track of the number of references and subsequently the number of studies so that a flow diagram can be constructed. The decisions and reasons for exclusion can be tracked using reference management software, a simple document or spreadsheet, or using specialist systematic review software (see Section
              - link "4.6.6.1" [ref=e1428] [cursor=pointer]:
                - /url: "#section-4-6-6-1"
              - text: ).
            - paragraph [ref=e1429]:
              - strong [ref=e1430]: MECIR Box 4.6.d
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e1431]:
              - rowgroup [ref=e1432]:
                - 'row "C41: Documenting decisions about records identified (Mandatory)" [ref=e1433]':
                  - 'cell "C41: Documenting decisions about records identified (Mandatory)" [ref=e1434]':
                    - emphasis [ref=e1435]:
                      - text: C41
                      - strong [ref=e1436]: ":"
                    - text: Documenting decisions about records identified (
                    - strong [ref=e1437]: Mandatory
                    - text: )
                - row "Document the selection process in sufficient detail to be able to complete a flow diagram and a table of ‘Characteristics of excluded studies’. Decisions should be documented for all records identified by the search. Numbers of records are sufficient for exclusions based on initial screening of titles and abstracts. Broad categorizations are sufficient for records classed as potentially eligible during an initial screen. Studies listed in the table of ‘Characteristics of excluded studies’ should be those that a user might reasonably expect to find in the review. At least one explicit reason for their exclusion must be documented. Authors will need to decide for each review when to map records to studies (if multiple records refer to one study). Lists of included and excluded studies must be based on studies rather than records." [ref=e1438]:
                  - cell "Document the selection process in sufficient detail to be able to complete a flow diagram and a table of ‘Characteristics of excluded studies’." [ref=e1439]:
                    - emphasis [ref=e1440]: Document the selection process in sufficient detail to be able to complete a flow diagram and a table of ‘Characteristics of excluded studies’.
                  - cell "Decisions should be documented for all records identified by the search. Numbers of records are sufficient for exclusions based on initial screening of titles and abstracts. Broad categorizations are sufficient for records classed as potentially eligible during an initial screen. Studies listed in the table of ‘Characteristics of excluded studies’ should be those that a user might reasonably expect to find in the review. At least one explicit reason for their exclusion must be documented. Authors will need to decide for each review when to map records to studies (if multiple records refer to one study). Lists of included and excluded studies must be based on studies rather than records." [ref=e1441]
            - heading "4.6.5 Selecting ‘excluded studies’#section-4-6-5" [level=3] [ref=e1442]
            - paragraph [ref=e1443]: A Cochrane review includes a list of excluded studies called ‘Characteristics of excluded studies’, detailing the specific reason for exclusion for any studies that a reader might plausibly expect to see among the included studies. This covers all studies that may, on the surface, appear to meet the eligibility criteria but which, on further inspection, do not. It also covers those that do not meet all of the criteria but are well known and likely to be thought relevant by some readers. By listing such studies as excluded and giving the primary reason for exclusion, the review authors can show that consideration has been given to these studies. The list of excluded studies should be as brief as possible. It should not list all of the reports that were identified by an extensive search. It should not list studies that obviously do not fulfil the eligibility criteria for the review, such as ‘Types of studies’, ‘Types of participants’, and ‘Types of interventions’. In particular, it should not list studies that are obviously not randomized if the review includes only randomized trials. Based on a sample, undertaken in 2017/2018 by one of the authors (JT), of approximately 60% of the intervention reviews in the Cochrane Library which included randomized trials only, the average number of studies listed in the ‘excluded studies’ table was 30.
            - heading "4.6.6 Software support for selecting studies#section-4-6-6" [level=3] [ref=e1444]
            - paragraph [ref=e1445]: An extensive search for eligible studies in a systematic review can often identify thousands of records that need to be manually screened. Selecting studies from within these records can be a particularly time-consuming, laborious and logistically challenging aspect of conducting a systematic review. These and other challenges have led to the development of various software tools (and approaches for using ‘generic’ tools) that offer support for the selection process.
            - paragraph [ref=e1446]: "Broadly, software to support selecting studies can be classified as:"
            - list [ref=e1447]:
              - listitem [ref=e1448]:
                - text: systems that support the study selection process, typically involving multiple reviewers (see Section
                - link "4.6.6.1" [ref=e1449] [cursor=pointer]:
                  - /url: "#section-4-6-6-1"
                - text: ); and
              - listitem [ref=e1450]:
                - text: tools and techniques based on text mining and/or machine learning, which aim to semi- or fully-automate the selection process (see Section
                - link "4.6.6.2" [ref=e1451] [cursor=pointer]:
                  - /url: "#section-4-6-6-2"
                - text: ).
            - paragraph [ref=e1452]:
              - text: Software to support the selection process, along with other stages of a systematic review, including text mining tools, can be identified using the
              - link "Systematic Review Toolbox" [ref=e1453] [cursor=pointer]:
                - /url: http://systematicreviewtools.com
              - text: (currently unavailable (September 2024)). The Systematic Review Toolbox is a community driven, web-based catalogue of tools that provide support for systematic reviews (
              - link "Marshall and Brereton 2015" [ref=e1454] [cursor=pointer]:
                - /url: "#_ENREF_176"
              - text: ). This service is currently unavailable (September 2024) whilst the developers seek and transition to a new hosting solution.
            - heading "4.6.6.1 Software for managing the selection process#section-4-6-6-1" [level=4] [ref=e1455]
            - paragraph [ref=e1456]: Managing the selection process can be challenging, particularly in a large-scale systematic review that involves multiple reviewers. Basic productivity tools can help (such as word processors, spreadsheets, and reference management software), and several purpose-built systems that support multiple concurrent users are also available that offer support for the study selection process. Software for managing the selection process can be identified using the Systematic Review Toolbox mentioned above. As noted above, this service is currently unavailable (September 2024) whilst the developers seek and transition to a new hosting solution.
            - paragraph [ref=e1457]:
              - text: Compatibility with other software tools used in the review process (such as RevMan) may be a consideration when selecting a tool to support study selection. Covidence and EPPI-Reviewer are Cochrane-preferred tools, and are likely to have the strongest integration with RevMan. Should specialist software not be available, Bramer and colleagues have reported a method for using the widely available software EndNote X7 for managing the screening process (
              - link "Bramer et al 2017" [ref=e1458] [cursor=pointer]:
                - /url: "#_ENREF_29"
              - text: ).
            - heading "4.6.6.2 Automating the selection process#section-4-6-6-2" [level=4] [ref=e1459]
            - paragraph [ref=e1460]:
              - text: Research into automating the study selection process through artificial intelligence (‘AI’), machine learning and text mining has received considerable attention over recent years, resulting in the development of numerous tools and techniques for reviewers to consider. The use of automated tools has the potential to reduce the workload involved with selecting studies significantly (
              - link "Thomas et al 2017" [ref=e1461] [cursor=pointer]:
                - /url: "#_ENREF_267"
              - text: ). For example, research suggests that adopting automation can reduce the need for manual screening by at least 30% and possibly more than 90%, although sometimes at the cost of up to a 5% reduction in sensitivity (
              - link "O'Mara-Eves et al 2015" [ref=e1462] [cursor=pointer]:
                - /url: "#_ENREF_206"
              - text: "). This section discusses these tools in three main areas: a) those that operate across reviews; b) those that use crowdsourcing to reduce reviewer workload; and c) those that operate within individual reviews."
            - paragraph [ref=e1463]:
              - text: a) The first class of tool is machine learning models (or ‘classifiers’) that can be built where sufficient data are available. Of particular practical use to Cochrane review authors is a classifier (the ‘RCT Classifier’) that can identify reports of randomized trials based on titles and abstracts. The classifier is highly accurate because it is built on a large dataset of hundreds of thousands of records screened by
              - link "Cochrane Crowd" [ref=e1464] [cursor=pointer]:
                - /url: https://crowd.cochrane.org/index.php
              - text: ", Cochrane’s citizen science platform, where contributors help to identify and describe health research ("
              - link "Marshall et al 2018a" [ref=e1465] [cursor=pointer]:
                - /url: "#_ENREF_177"
              - text: ","
              - link "Noel-Storr et al 2021a" [ref=e1466] [cursor=pointer]:
                - /url: "#_ENREF_200"
              - text: ","
              - link "Thomas et al 2021" [ref=e1467] [cursor=pointer]:
                - /url: "#_ENREF_268"
              - text: ). Guidance on using the RCT Classifier in Cochrane reviews, for example to exclude studies already flagged as not being randomized trials, or to access Cochrane Crowd to assist with screening, is available from the
              - link "Cochrane Information Specialists’ Handbook" [ref=e1468] [cursor=pointer]:
                - /url: https://training.cochrane.org/resource/cochrane-information-specialists-handbook
              - text: (
              - link "Cochrane Information Specialist Support Team 2021a" [ref=e1469] [cursor=pointer]:
                - /url: "#_ENREF_48"
              - text: ).
            - paragraph [ref=e1470]: An emerging suite of tools built on ‘Large Language Models’ (LLMs) such as ChatGPT may soon offer practical advantages in automating study selection and other parts of the review process. These models promise the possibility of carrying out ‘zero shot learning’, where records can be classified automatically without the need for any specific training. Such approaches may offer substantial benefits, though, at the time of writing in mid-2023, no sufficiently large and valid evaluations are available.
            - paragraph [ref=e1471]:
              - text: b) Cochrane has also implemented a screening workflow called Screen4Me (
              - link "Noel-Storr et al 2021b" [ref=e1472] [cursor=pointer]:
                - /url: "#_ENREF_201"
              - text: ). This workflow incorporates the use of the RCT Classifier and Cochrane Crowd, to identify the RCTs found in authors’ search results. Cochrane author teams conducting intervention reviews that incorporate RCTs can access this workflow via the Cochrane Register of Studies. Author teams wishing to use the Screen4Me workflow should liaise directly with their Cochrane Group. To date (July 2024), Screen4Me has been used in more than 250 Cochrane intervention reviews. Workload reduction in terms of screening burden varies depending on the prevalence of RCTs in the domain area and the sensitivity of the searches conducted. A recent internal, as yet (July 2024) unpublished, evaluation by one of the authors (AN-S) showed a mean reduction in screening workload of 53% (range 26% to 84%). More information on Screen4Me can be found in the
              - link "Cochrane Information Specialists’ Handbook" [ref=e1473] [cursor=pointer]:
                - /url: https://training.cochrane.org/resource/cochrane-information-specialists-handbook
              - text: (
              - link "Cochrane Information Specialist Support Team 2021a" [ref=e1474] [cursor=pointer]:
                - /url: "#_ENREF_48"
              - text: ).
            - paragraph [ref=e1475]:
              - text: c) In addition to learning from large datasets such as those generated by Cochrane Crowd, it is also possible for machine learning models to learn how to apply eligibility criteria within individual reviews. This approach uses a process called ‘active learning’ and it is able to semi-automate study selection by continuously promoting records most likely to be relevant to the top of the results list (
              - link "O'Mara-Eves et al 2015" [ref=e1476] [cursor=pointer]:
                - /url: "#_ENREF_206"
              - text: ). It is difficult for authors to determine in advance when it is safe to stop screening and allow some records to be eliminated automatically without manual assessment. Recent work has suggested that this barrier is not insurmountable, and that it is possible to estimate how many relevant records remain to be found based on the sample already screened (
              - link "Sneyd and Stevenson 2019" [ref=e1477] [cursor=pointer]:
                - /url: "#_ENREF_252"
              - text: ","
              - link "Callaghan and Muller-Hansen 2020" [ref=e1478] [cursor=pointer]:
                - /url: "#_ENREF_36"
              - text: ","
              - link "Li and Kanoulas 2020" [ref=e1479] [cursor=pointer]:
                - /url: "#_ENREF_170"
              - text: ). The automatic elimination of records using this approach has not been recommended for use in Cochrane reviews at the time of writing in mid-2023, since more work is needed to develop and validate safe ‘stopping rules’. This active learning process can still be useful, however, since by prioritizing records for screening in order of relevance, it enables authors to identify the studies that are most likely to be included much earlier in the screening process than would otherwise be possible.
            - paragraph [ref=e1480]:
              - text: Recent developments in this class of tools have seen increased support for keeping living systematic reviews (see also
              - link "Chapter 22" [ref=e1481] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22
              - text: ) up to date. Work is still ongoing, but the COVID-19 pandemic lent an urgency to tool development in order to maintain surveillance on the rapidly evolving evidence base (
              - link "Thomas 2021" [ref=e1482] [cursor=pointer]:
                - /url: "#_ENREF_269"
              - text: ). Evidence surveillance in living systematic reviews may be a fruitful use case for automation, because of the availability of data on which the machine can ‘learn’. Two case studies found that automation to support living reviews in COVID-19 were both accurate and saved manual effort (
              - link "Shemilt et al 2021" [ref=e1483] [cursor=pointer]:
                - /url: "#_ENREF_249"
              - text: ","
              - link "Marshall et al 2023" [ref=e1484] [cursor=pointer]:
                - /url: "#_ENREF_179"
              - text: ).
            - paragraph [ref=e1485]:
              - text: Finally, tools are available that use natural language processing to highlight sentences and key phrases automatically (e.g. PICO elements, trial characteristics, details of randomization) to support the reviewer whilst screening (
              - link "Tsafnat et al 2014" [ref=e1486] [cursor=pointer]:
                - /url: "#_ENREF_271"
              - text: ).
