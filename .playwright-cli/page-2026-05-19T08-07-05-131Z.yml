        - article [ref=e216]:
          - generic [ref=e222]:
            - paragraph [ref=e223]: Carol Lefebvre, Julie Glanville, Simon Briscoe, Robin Featherstone, Anne Littlewood, Maria-Inti Metzendorf, Anna Noel-Storr, Robin Paynter, Tamara Rader, James Thomas, L. Susan Wieland; on behalf of the Cochrane Information Retrieval Methods Group
            - paragraph [ref=e224]:
              - strong [ref=e225]: "Key Points:"
            - list [ref=e226]:
              - listitem [ref=e227]: Review authors should work closely, from the start of the protocol, with an experienced medical/healthcare librarian or information specialist.
              - listitem [ref=e228]: Studies (not reports of studies) are included in Cochrane reviews but identifying reports of studies is currently the most convenient approach to identifying the majority of studies and obtaining information about them and their results.
              - listitem [ref=e229]: The Cochrane Central Register of Controlled Trials (CENTRAL) and MEDLINE, together with Embase (if access to Embase is available to the review team), should be searched for all Cochrane reviews.
              - listitem [ref=e230]: Where available, the Specialized Register(s) of the relevant Cochrane Group(s) should be searched for all Cochrane reviews, either internally within the Cochrane Group or via CENTRAL.
              - listitem [ref=e231]: Trials registers should be searched for all Cochrane reviews and other sources such as regulatory agencies and clinical study reports (CSRs) are increasingly important for identifying study results.
              - listitem [ref=e232]: Searches should aim for high sensitivity, which may result in relatively low precision.
              - listitem [ref=e233]:
                - text: Search strategies should avoid using too many
                - emphasis [ref=e234]: different
                - text: search concepts but a wide variety of search terms should be combined with OR within
                - emphasis [ref=e235]: each
                - text: included concept.
              - listitem [ref=e236]: Both free-text and subject headings (e.g. Medical Subject Headings (MeSH) and Emtree) should be used.
              - listitem [ref=e237]: Published, highly sensitive, validated search filters to identify randomized trials should be considered, such as the Cochrane Highly Sensitive Search Strategies for identifying randomized trials in MEDLINE. The Cochrane filters for Embase and CINAHL may also be considered. Randomized trial and human filters are not required in CENTRAL and should not be used.
            - paragraph [ref=e238]:
              - text: "Cite this chapter as: Lefebvre C, Glanville J, Briscoe S, Featherstone R, Littlewood A, Metzendorf M-I, Noel-Storr A, Paynter R, Rader T, Thomas J, Wieland LS. Chapter 4: Searching for and selecting studies [last updated March 2025]. In: Higgins JP, Thomas J, Chandler J, Cumpston M, Li T, Page MJ, et al, editor(s). Cochrane Handbook for Systematic Reviews of Interventions version 6.5.1 Cochrane, 2025. Available from"
              - emphasis [ref=e239]: cochrane.org/handbook
              - text: .
            - heading "4.1 Introduction#section-4-1" [level=2] [ref=e240]
            - paragraph [ref=e241]: Cochrane reviews take a systematic and comprehensive approach to identifying studies that meet the eligibility criteria for the review. This chapter outlines some general issues in searching for and selecting studies. It describes the main sources of potential studies; and discusses how to plan the search process, design and carry out search strategies, manage referencesand other records found during the search process, correctly document the search process and select studies from the search results.
            - paragraph [ref=e242]: This chapter aims to provide review authors with background information on all aspects of searching for and selecting studies so that they can better understand the search and selection processes. All authors of systematic reviews should, however, identify an experienced medical/healthcare librarian or information specialist to collaborate with on the search process. The chapter also aims to provide advice and guidance for medical/healthcare librarians and information specialists (within and beyond Cochrane) involved in the search process to identify studies for inclusion in systematic reviews.
            - paragraph [ref=e243]:
              - text: This chapter focuses on searching for randomized trials for systematic reviews of interventions. Many of the search principles discussed, however, will also apply to other study designs and review types. This Handbook (for systematic reviews of interventions) contains other chapters which should also be considered. For example, searching for non-randomized studies is discussed in
              - link "Chapter 24" [ref=e244] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-24
              - text: (see also
              - link "Chapter 19" [ref=e245] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-19
              - text: for adverse effects). Other discussion of searching for specific types of evidence appears in chapters dedicated to these types of evidence, such as
              - link "Chapter 17" [ref=e246] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-17
              - text: on intervention complexity,
              - link "Chapter 20" [ref=e247] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-20
              - text: on economic evidence and
              - link "Chapter 21" [ref=e248] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-21
              - text: on qualitative evidence. Furthermore, additional Cochrane Handbooks are in various stages of development, for example diagnostic test accuracy studies (published)(
              - link "Spijker et al 2023" [ref=e249] [cursor=pointer]:
                - /url: "#_ENREF_256"
              - text: ), qualitative evidence (in draft) (
              - link "Stansfield et al 2024" [ref=e250] [cursor=pointer]:
                - /url: "#_ENREF_261"
              - text: ) and prognosis studies (under development).
            - paragraph [ref=e251]:
              - text: An online
              - link "Technical Supplement" [ref=e252] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: to this chapter provides more detail on searching methods.
            - heading "4.2 General issues#section-4-2" [level=2] [ref=e253]
            - heading "4.2.1 Role of the information specialist/librarian#section-4-2-1" [level=3] [ref=e254]
            - paragraph [ref=e255]:
              - text: Medical/healthcare librarians and information specialists have an integral role in the production of Cochrane reviews. There is increasing evidence of the involvement of information specialists in systematic reviews (
              - link "Spencer and Eldredge 2018" [ref=e256] [cursor=pointer]:
                - /url: "#_ENREF_255"
              - text: ","
              - link "Ross-White 2021" [ref=e257] [cursor=pointer]:
                - /url: "#_ENREF_229"
              - text: ","
              - link "Schvaneveldt and Stellrecht 2021" [ref=e258] [cursor=pointer]:
                - /url: "#_ENREF_245"
              - text: ","
              - link "Brunskill and Hanneke 2022" [ref=e259] [cursor=pointer]:
                - /url: "#_ENREF_35"
              - text: ","
              - link "Lê et al 2023" [ref=e260] [cursor=pointer]:
                - /url: "#_ENREF_163"
              - text: ) and evidence to support the improvement in the quality of various aspects of the search process (
              - link "Koffel 2015" [ref=e261] [cursor=pointer]:
                - /url: "#_ENREF_156"
              - text: ","
              - link "Rethlefsen et al 2015" [ref=e262] [cursor=pointer]:
                - /url: "#_ENREF_222"
              - text: ","
              - link "Meert et al 2016" [ref=e263] [cursor=pointer]:
                - /url: "#_ENREF_185"
              - text: ","
              - link "Metzendorf 2016" [ref=e264] [cursor=pointer]:
                - /url: "#_ENREF_186"
              - text: ","
              - link "Aamodt et al 2019" [ref=e265] [cursor=pointer]:
                - /url: "#_ENREF_2"
              - text: ","
              - link "Hameed et al 2020" [ref=e266] [cursor=pointer]:
                - /url: "#_ENREF_122"
              - text: ","
              - link "Schellinger et al 2021" [ref=e267] [cursor=pointer]:
                - /url: "#_ENREF_242"
              - text: ","
              - link "Ghezzi-Kopel et al 2022" [ref=e268] [cursor=pointer]:
                - /url: "#_ENREF_105"
              - text: ","
              - link "Ramirez et al 2022" [ref=e269] [cursor=pointer]:
                - /url: "#_ENREF_220"
              - text: ","
              - link "Pawliuk et al 2024" [ref=e270] [cursor=pointer]:
                - /url: "#_ENREF_214"
              - text: ","
              - link "Giroudon et al 2024" [ref=e271] [cursor=pointer]:
                - /url: "#_ENREF_107"
              - text: ).
            - paragraph [ref=e272]:
              - text: Many Cochrane Groups employ an information specialist to collaborate with authors on the search process. The range of services, however, offered by Cochrane Groups and/or their information specialists varies according to the resources available. Cochrane review authors should, therefore, contact their Cochrane Group or the Central Editorial Service at the earliest stage to find out what advice and level of contribution is available to them. Authors conducting their own searches should seek advice from a Cochrane Information Specialist not only on which sources to search, but also with respect to the exact strategies to be run (see
              - link "Section 4.4" [ref=e273] [cursor=pointer]:
                - /url: "#section-4-4"
              - text: ). If the Cochrane Group does not provide this service or employ an information specialist, we recommend that review authors initially seek guidance from Cochrane Support (
              - link "support@cochrane.org" [ref=e274] [cursor=pointer]:
                - /url: mailto:support@cochrane.org
              - text: ). Otherwise, authors should seek help with their searches from a medical/healthcare librarian or information specialist, preferably one with experience in identifying studies for systematic reviews.
            - paragraph [ref=e275]:
              - text: Cochrane Information Specialists are responsible for working with authors in searching for studies for inclusion in their reviews, and for keeping up to date with Cochrane methodological developments in information retrieval (
              - link "Cochrane Information Specialist Support Team 2021b" [ref=e276] [cursor=pointer]:
                - /url: "#_ENREF_49"
              - text: ). Some Cochrane Information Specialists maintain a Specialized Register for their Group, containing reports of trials relating to the Group’s scope. Within the limits of licensing restrictions, the content of these Group registers is shared with users worldwide via the Cochrane Central Register of Controlled Trials (CENTRAL), part of the Cochrane Library (see Section
              - link "4.3.1.3" [ref=e277] [cursor=pointer]:
                - /url: "#section-4-3-1-3"
              - text: ).
            - paragraph [ref=e278]: "Most Cochrane Groups collaborate with authors in study identification from the early planning stage to the final write-up of the review and any updates. This may include some or all of the following:"
            - list [ref=e279]:
              - listitem [ref=e280]: advising authors on which databases and other sources should be searched for their review;
              - listitem [ref=e281]: designing, or providing guidance on designing, search strategies for the main bibliographic databases and trials registers resources;
              - listitem [ref=e282]: running searches in databases and trials registers resources available to the information specialist;
              - listitem [ref=e283]: saving and collating search results, and sharing them with authors in appropriate formats;
              - listitem [ref=e284]: drafting, or working with authors in drafting, the search methods sections of a Cochrane protocol, review and/or update;
              - listitem [ref=e285]: advising authors on how to run searches in sources other than the main bibliographic databases and trials register resources and how to download results from these sources;
              - listitem [ref=e286]:
                - text: ensuring that the conduct of Cochrane protocols, reviews and updates meets the requirements set out in the
                - link "Methodological Expectations of Cochrane Intervention Reviews (MECIR)" [ref=e287] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/mecir-manual
                - text: relating to searching activities for reviews, and that the reporting aligns with the current reporting guidance for PRISMA (
                - link "Page et al 2021b" [ref=e288] [cursor=pointer]:
                  - /url: "#_ENREF_210"
                - text: ","
                - link "Page et al 2021a" [ref=e289] [cursor=pointer]:
                  - /url: "#_ENREF_209"
                - text: ) and PRISMA-S (
                - link "Rethlefsen et al 2021" [ref=e290] [cursor=pointer]:
                  - /url: "#_ENREF_223"
                - text: );
              - listitem [ref=e291]: organizing translations, or at least organizing data extraction, where required, from studies reported in languages other than English to enable authors to assess these reports for inclusion/exclusion in their reviews;
              - listitem [ref=e292]: obtaining copies of trial reports for review teams when required (within copyright legislation);
              - listitem [ref=e293]: providing advice to and collaborating with author teams on the use of reference management tools and other software used in review production, including review production tools such as Covidence, EPPI-Reviewer and RevMan; and
              - listitem [ref=e294]:
                - text: checking and formatting the references to included and/or excluded studies in line with the
                - link "Cochrane Style Manual" [ref=e295] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/style-manual
                - text: .
            - heading "4.2.2 Minimizing bias#section-4-2-2" [level=3] [ref=e296]
            - paragraph [ref=e297]:
              - text: Systematic reviews require a thorough, objective and reproducible search of a range of sources to identify as many eligible studies as possible (within resource limits). This is a major factor distinguishing systematic reviews from traditional narrative reviews, which helps to minimize bias and achieve more reliable estimates of effects and uncertainties. A search of MEDLINE alone is not considered adequate. Research evidence indicates that not all known published randomized trials are available in MEDLINE and that even if relevant records are in MEDLINE, it can be difficult to retrieve them (see Section
              - link "4.3.1.2" [ref=e298] [cursor=pointer]:
                - /url: "#section-4-3-1-2"
              - text: ).
            - paragraph [ref=e299]: Searching beyond MEDLINE is important not only for ensuring that as many relevant studies as possible are identified, but also to minimize selection bias for those that are found. Relying exclusively on a MEDLINE search may retrieve a set of reports unrepresentative of all reports that would have been identified through a wider or more extensive search of several sources.
            - paragraph [ref=e300]:
              - text: Time and budget restraints require the review team to balance the thoroughness of the search with efficiency in the use of time and funds. The best way of achieving this balance is to be aware of, and try to minimize, the biases such as publication bias and language bias that can result from restricting searches in different ways (see
              - link "Chapter 8" [ref=e301] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-08
              - text: and
              - link "Chapter 13" [ref=e302] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-13
              - text: for further guidance on assessing these biases). Unlike for tasks such as study selection or data extraction, it is not considered necessary (or even desirable) for two people to conduct independent searches in parallel. It is strongly recommended, however, that all search strategies should be peer reviewed, before being run, by a suitably qualified and experienced medical/healthcare librarian or information specialist (see Section
              - link "4.4.8" [ref=e303] [cursor=pointer]:
                - /url: "#section-4-4-8"
              - text: ).
            - heading "4.2.3 Studies versus reports of studies#section-4-2-3" [level=3] [ref=e304]
            - paragraph [ref=e305]:
              - text: Systematic reviews have studies as the primary units of interest and analysis. A single study may have more than one report about it (or record for it), and each of these reports or other records may contribute useful information for the review (see Section
              - link "4.6.1" [ref=e306] [cursor=pointer]:
                - /url: "#section-4-6-1"
              - text: ). For most of the sources listed in Section
              - link "4.3" [ref=e307] [cursor=pointer]:
                - /url: "#section-4-3"
              - text: ", the search process will retrieve individual reports of studies, so that multiple reports of the same study will need to be identified and associated with each other manually by the review authors. There is, however, an increasing number of"
              - emphasis [ref=e308]: study-based
              - text: sources, which link multiple records of the same study together, such as the Cochrane Register of Studies and the Specialized Registers of a number of Cochrane Groups (see online
              - link "Technical Supplement" [ref=e309] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: ), and some other trials registers, regulatory and industry sources. Processes and software to select and group publications by study are discussed in Section
              - link "4.6" [ref=e310] [cursor=pointer]:
                - /url: "#section-4-6"
              - text: .
            - heading "4.2.4 Copyright and licensing#section-4-2-4" [level=3] [ref=e311]
            - paragraph [ref=e312]: All review authors and others involved in Cochrane should adhere to copyright legislation and the terms of licensing agreements for databases and other resources. With respect to searching for studies, this refers in particular to adhering to the terms and conditions of use when searching databases and other resources and downloading records, as well as adhering to copyright legislation when obtaining copies of publications and other records. Review authors should seek guidance on this from a medical/healthcare librarian or information specialist, as copyright legislation varies across jurisdictions and licensing agreements vary across organizations.
            - heading "4.3 Sources to search#section-4-3" [level=2] [ref=e313]
            - paragraph [ref=e314]:
              - text: The sections that follow refer to sources to search for studies for inclusion in intervention reviews, irrespective of the intervention. For more detailed discussion of specific issues around searching for medical devices, please refer to this recent method note (
              - link "Cooper et al 2022a" [ref=e315] [cursor=pointer]:
                - /url: "#_ENREF_60"
              - text: ).
            - heading "4.3.1 Bibliographic databases#section-4-3-1" [level=3] [ref=e316]
            - heading "4.3.1.1 Introduction to bibliographic databases#section-4-3-1-1" [level=4] [ref=e317]
            - paragraph [ref=e318]:
              - emphasis [ref=e319]: For further details on this topic, please refer to Section 1.1. of the online
              - link "Technical Supplement" [ref=e320] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - emphasis [ref=e321]: Technical Supplement
              - emphasis [ref=e322]: and its subsections.
            - paragraph [ref=e323]:
              - text: The search for studies for a Cochrane review should be as extensive as possible in order to reduce the risk of reporting bias and to identify as much relevant evidence as possible (see
              - link "MECIR Box 4.3.a" [ref=e324] [cursor=pointer]:
                - /url: "#mecir-box-4.3.a"
              - text: ). Searches of health-related bibliographic databases are generally the most efficient way to identify an initial set of relevant reports of studies (
              - link "EUnetHTA JA3WP6B2-2 Authoring Team 2019" [ref=e325] [cursor=pointer]:
                - /url: "#_ENREF_85"
              - text: ). Database selection should be guided by the review topic (
              - link "Suarez-Almazor et al 2000" [ref=e326] [cursor=pointer]:
                - /url: "#_ENREF_263"
              - text: ","
              - link "Stevinson and Lawlor 2004" [ref=e327] [cursor=pointer]:
                - /url: "#_ENREF_262"
              - text: ","
              - link "Lorenzetti et al 2014" [ref=e328] [cursor=pointer]:
                - /url: "#_ENREF_172"
              - text: ). Searching two or more databases lowers the risk of missing eligible studies (
              - link "Ewald et al 2022" [ref=e329] [cursor=pointer]:
                - /url: "#_ENREF_87"
              - text: ","
              - link "Boberg-Ans et al 2023" [ref=e330] [cursor=pointer]:
                - /url: "#_ENREF_19"
              - text: ). Especially when topics are specialized, cross-disciplinary, or involve emerging technologies (
              - link "Rice et al 2016" [ref=e331] [cursor=pointer]:
                - /url: "#_ENREF_227"
              - text: ), additional databases may need to be identified and searched (
              - link "Wallace et al 1997" [ref=e332] [cursor=pointer]:
                - /url: "#_ENREF_280"
              - text: ","
              - link "Stevinson and Lawlor 2004" [ref=e333] [cursor=pointer]:
                - /url: "#_ENREF_262"
              - text: ","
              - link "Frandsen et al 2019a" [ref=e334] [cursor=pointer]:
                - /url: "#_ENREF_96"
              - text: ). Methods for determining the coverage and comprehensiveness of bibliographic databases can help authors select appropriate sources for their review topic (
              - link "Brody et al 2023" [ref=e335] [cursor=pointer]:
                - /url: "#_ENREF_33"
              - text: ).
            - paragraph [ref=e336]:
              - strong [ref=e337]: MECIR Box 4.3.a
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e338]:
              - rowgroup [ref=e339]:
                - 'row "C19: Planning the search (Mandatory)" [ref=e340]':
                  - 'cell "C19: Planning the search (Mandatory)" [ref=e341]':
                    - emphasis [ref=e342]:
                      - text: C19
                      - strong [ref=e343]: ":"
                    - text: Planning the search (
                    - strong [ref=e344]: Mandatory
                    - text: )
                - row "Plan in advance the methods to be used for identifying studies. Design searches to capture as many studies as possible that meet the eligibility criteria, ensuring that relevant time periods and sources are covered and not restricted by language or publication status. Searches should be motivated directly by the eligibility criteria for the review, and it is important that all types of eligible studies are considered when planning the search. If searches are restricted by publication status or by language of publication, there is a possibility of publication bias, or language bias (whereby the language of publication is selected in a way that depends on the findings of the study), or both. Removing language restrictions in English language databases is not a good substitute for searching non-English language journals and databases." [ref=e345]:
                  - cell "Plan in advance the methods to be used for identifying studies. Design searches to capture as many studies as possible that meet the eligibility criteria, ensuring that relevant time periods and sources are covered and not restricted by language or publication status." [ref=e346]:
                    - emphasis [ref=e347]: Plan in advance the methods to be used for identifying studies. Design searches to capture as many studies as possible that meet the eligibility criteria, ensuring that relevant time periods and sources are covered and not restricted by language or publication status.
                  - cell "Searches should be motivated directly by the eligibility criteria for the review, and it is important that all types of eligible studies are considered when planning the search. If searches are restricted by publication status or by language of publication, there is a possibility of publication bias, or language bias (whereby the language of publication is selected in a way that depends on the findings of the study), or both. Removing language restrictions in English language databases is not a good substitute for searching non-English language journals and databases." [ref=e348]
                - 'row "C24: Searching general bibliographic databases and CENTRAL (Mandatory)" [ref=e349]':
                  - 'cell "C24: Searching general bibliographic databases and CENTRAL (Mandatory)" [ref=e350]':
                    - emphasis [ref=e351]:
                      - text: C24
                      - strong [ref=e352]: ":"
                    - text: Searching general bibliographic databases and CENTRAL (
                    - strong [ref=e353]: Mandatory
                    - text: )
                - row [ref=e354]:
                  - cell "Search the Cochrane review Group’s (CRG’s) Specialized Register (internally, e.g. via the Cochrane Register of Studies, or externally via CENTRAL). Ensure that CENTRAL, MEDLINE and Embase (if Embase is available to either the CRG or the review author), have been searched (either for the review or for the Review Group’s Specialized Register)." [ref=e355]:
                    - emphasis [ref=e356]: Search the Cochrane review Group’s (CRG’s) Specialized Register (internally, e.g. via the Cochrane Register of Studies, or externally via CENTRAL). Ensure that CENTRAL, MEDLINE and Embase (if Embase is available to either the CRG or the review author), have been searched (either for the review or for the Review Group’s Specialized Register).
                  - cell "Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible. The minimum databases to be covered are the CRG’s Specialized Register (if it exists and was designed to support reviews in this way), CENTRAL, MEDLINE and Embase (if Embase is available to either the CRG or the review author). Expertise may be required to avoid unnecessary duplication of effort. Some, but not all, reports of eligible studies from MEDLINE, Embase and the CRGs’ Specialized Registers are already included in CENTRAL." [ref=e357]
            - paragraph [ref=e358]:
              - text: The three bibliographic databases generally considered to be the most important sources to search for reports of trials are CENTRAL (
              - link "Noel-Storr et al 2020" [ref=e359] [cursor=pointer]:
                - /url: "#_ENREF_203"
              - text: ), MEDLINE (
              - link "Halladay et al 2015" [ref=e360] [cursor=pointer]:
                - /url: "#_ENREF_121"
              - text: ","
              - link "Sampson et al 2016" [ref=e361] [cursor=pointer]:
                - /url: "#_ENREF_239"
              - text: ) and Embase (
              - link "Woods and Trewheellar 1998" [ref=e362] [cursor=pointer]:
                - /url: "#_ENREF_287"
              - text: ","
              - link "Sampson et al 2003" [ref=e363] [cursor=pointer]:
                - /url: "#_ENREF_234"
              - text: ","
              - link "Bai et al 2007" [ref=e364] [cursor=pointer]:
                - /url: "#_ENREF_11"
              - text: ). These databases are described in more detail in Sections
              - link "4.3.1.2" [ref=e365] [cursor=pointer]:
                - /url: "#section-4-3-1-2"
              - text: and
              - link "4.3.1.3" [ref=e366] [cursor=pointer]:
                - /url: "#section-4-3-1-3"
              - text: and in the online
              - link "Technical Supplement" [ref=e367] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: . For Cochrane reviews, CENTRAL, MEDLINE and Embase (if access to Embase is available to the review team) should be searched (see
              - link "MECIR Box 4.3.a" [ref=e368] [cursor=pointer]:
                - /url: "#mecir-box-4.3.a"
              - text: ). These searches may be undertaken specifically for the review, or indirectly by searching the Cochrane Group’s Specialized Register, if it exists and was designed to support reviews in this way.
            - paragraph [ref=e369]:
              - text: Some bibliographic databases, such as MEDLINE and Embase, include abstracts for the majority of recent records. A key advantage of such databases is that they can be searched electronically both for words in the title or abstract and by using the standardized indexing terms, or controlled vocabulary, assigned to each record (see Section
              - link "4.3.1.2" [ref=e370] [cursor=pointer]:
                - /url: "#section-4-3-1-2"
              - text: and
              - link "4.4.4" [ref=e371] [cursor=pointer]:
                - /url: "#section-4-4-4"
              - text: ). In addition to MEDLINE and Embase, Cochrane has developed a database of reports of randomized trials called the Cochrane Central Register of Controlled Trials (CENTRAL), which is published within the
              - emphasis [ref=e372]
              - text: Cochrane Library (see Section
              - link "4.3.1.3" [ref=e373] [cursor=pointer]:
                - /url: "#section-4-3-1-3"
              - text: ).
            - paragraph [ref=e374]:
              - text: Bibliographic databases are available to individuals for a fee (by subscription or on a ‘pay-as-you-go’ basis) or free at the point of use. They may be available through national provisions, site-wide licences at institutions such as universities or hospitals, through professional organizations as part of their membership packages or free-of-charge on the internet. Some international initiatives provide free or low-cost online access to databases (and full-text journals) over the internet. The Health InterNetwork Access to Research Initiative (
              - link "HINARI" [ref=e375] [cursor=pointer]:
                - /url: https://portal.research4life.org/content/hinari
              - text: ) programme, set up by the World Health Organization (WHO) together with major publishers and now part of the Research4Life programme (R4L), provides access to a wide range of databases including the
              - emphasis [ref=e376]
              - text: Cochrane Library
              - emphasis [ref=e377]
              - text: for healthcare professionals in local, not-for-profit institutions in more than 120 countries, areas and territories. The International Network for the Availability of Scientific Publications (
              - link "INASP" [ref=e378] [cursor=pointer]:
                - /url: https://www.inasp.info/
              - text: ) also provides access to a wide range of databases (and journals) including the
              - emphasis [ref=e379]
              - text: Cochrane Library. Electronic Information for Libraries (
              - link "EIFL" [ref=e380] [cursor=pointer]:
                - /url: https://www.eifl.net/page/about
              - text: ) is a similar initiative based on library consortia to support affordable licensing of journals and other sources in more than 50 developing and transition countries in Africa, Asia, Europe and Latin America.
            - paragraph [ref=e381]:
              - text: The online
              - link "Technical Supplement" [ref=e382] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: provides more detailed information about how to search these sources and other databases. The accompanying
              - link "Appendix" [ref=e383] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-appendix-resources
              - text: provides a list of general healthcare databases by region and healthcare databases by subject area. Further evidence-based information about sources to search can be found on the
              - link "SuRe Info portal" [ref=e384] [cursor=pointer]:
                - /url: https://sites.google.com/york.ac.uk/sureinfo/home
              - text: ", which is updated twice per year ("
              - link "Isojarvi and Glanville 2021" [ref=e385] [cursor=pointer]:
                - /url: "#_ENREF_143"
              - text: ).
            - heading "4.3.1.2 MEDLINE and Embase#section-4-3-1-2" [level=4] [ref=e386]
            - paragraph [ref=e387]:
              - text: Cochrane reviews of interventions should include a search of MEDLINE (see
              - link "MECIR Box 4.3.a" [ref=e388] [cursor=pointer]:
                - /url: "#mecir-box-4.3.a"
              - text: ). MEDLINE (as of February 2024) contains approximately 30 million references to journal articles in biomedicine and health from 1946 onwards. More than 5,000 journals in about 40 languages are indexed for MEDLINE (
              - link "US National Library of Medicine" [ref=e389] [cursor=pointer]:
                - /url: "#_ENREF_274"
              - text: ).
            - paragraph [ref=e390]:
              - link "PubMed" [ref=e391] [cursor=pointer]:
                - /url: http://www.ncbi.nlm.nih.gov/pubmed/
              - text: provides access to a free version of MEDLINE that also includes up-to-date citations not yet indexed for MEDLINE (
              - link "US National Library of Medicine 2023" [ref=e392] [cursor=pointer]:
                - /url: "#_ENREF_275"
              - text: ). Additionally, PubMed includes records from journals that are not indexed for MEDLINE and records considered ‘out-of-scope’ from journals that are partially indexed for MEDLINE. Further details about MEDLINE, PubMed and PubMed Central and how they differ are available (
              - link "US National Library of Medicine" [ref=e393] [cursor=pointer]:
                - /url: "#_ENREF_273"
              - text: ).
            - paragraph [ref=e394]: "MEDLINE is also available on subscription from a number of other database vendors/platforms, such as EBSCO, Ovid, ProQuest, STN and Clarivate’s Web of Science. Access is usually ‘free at-the-point-of-use’ to members of the institutions paying the subscriptions (e.g. hospitals and universities). Ovid MEDLINE (segment name ‘MEDALL’) covers all of the available content and metadata in PubMed with a delay of one working day (except during the annual reload, at the end of each year, when Ovid MEDLINE will not match the PubMed baseline). Aside from the MEDLINE records, Ovid includes all content types available in PubMed including: Epub Ahead of Print, In-Process, In-Data-Review & Other Non-Indexed Citations."
            - paragraph [ref=e395]:
              - text: When searching MEDLINE via service providers or interfaces other than Ovid or PubMed, we recommend verification of the exact coverage of the database in relation to PubMed, where no explicit information on this is readily available. Note that MEDLINE (i.e. PubMed) is searched regularly by Cochrane for reports of trials. These records are included in CENTRAL (see online
              - link "Technical Supplement" [ref=e396] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: ).
            - paragraph [ref=e397]:
              - text: Cochrane reviews of interventions should include a search of Embase (if access to Embase is available to the review team) (see
              - link "MECIR Box 4.3.a" [ref=e398] [cursor=pointer]:
                - /url: "#mecir-box-4.3.a"
              - text: ). Embase (as of February 2024) contains more than 40 million records from 1947 onwards, including records from more than 8,000 currently published journals from approximately 100 countries (
              - link "Elsevier 2024a" [ref=e399] [cursor=pointer]:
                - /url: "#_ENREF_82"
              - text: ). Embase now includes all MEDLINE (i.e. PubMed) records, thus, technically, allowing both databases to be searched simultaneously. Further details on the implications of this for searching are available in the online
              - link "Technical Supplement" [ref=e400] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: . There are more than 10 million records in Embase from approximately 3,000 journals that are not indexed in MEDLINE (
              - link "Elsevier 2024a" [ref=e401] [cursor=pointer]:
                - /url: "#_ENREF_82"
              - text: ). Embase Classic provides access to almost two million records digitized from the Excerpta Medica print journals (the original print indexes from which Embase was created) from 1947 to 1973 (
              - link "Elsevier 2024a" [ref=e402] [cursor=pointer]:
                - /url: "#_ENREF_82"
              - text: ","
              - link "Elsevier 2024b" [ref=e403] [cursor=pointer]:
                - /url: "#_ENREF_83"
              - text: ). Embase Classic is only available as an add-on to an Embase subscription. Embase also includes pre-print articles from medRxiv and bioRxiv; see
              - link "Embase Release Notes November 2021" [ref=e404] [cursor=pointer]:
                - /url: https://service.elsevier.com/app/answers/detail/a_id/36864/supporthub/embase/
              - text: .
            - paragraph [ref=e405]:
              - text: Embase is only available by subscription, either directly via Elsevier (as Embase.com) or from other database vendors such as Ovid, ProQuest or STN. It is mandatory for Cochrane intervention reviews to include a search of Embase if access is available to the review team (see
              - link "MECIR Box 4.3.a" [ref=e406] [cursor=pointer]:
                - /url: "#mecir-box-4.3.a"
              - text: ). Note that Embase is searched regularly by Cochrane for reports of trials. These records are included in CENTRAL (see online
              - link "Technical Supplement" [ref=e407] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: ).
            - paragraph [ref=e408]:
              - text: The online
              - link "Technical Supplement" [ref=e409] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: provides guidance on how to search MEDLINE and Embase for reports of trials. The actual degree of reference overlap between MEDLINE and Embase varies widely according to the topic, but studies comparing searches of the two databases have generally concluded that a comprehensive search requires that both databases be searched (
              - link "Lefebvre et al 2008" [ref=e410] [cursor=pointer]:
                - /url: "#_ENREF_165"
              - text: ","
              - link "Bramer et al 2016" [ref=e411] [cursor=pointer]:
                - /url: "#_ENREF_28"
              - text: ) (see
              - link "MECIR Box 4.3.a" [ref=e412] [cursor=pointer]:
                - /url: "#mecir-box-4.3.a"
              - text: ).
            - paragraph [ref=e413]:
              - text: Conversely, two studies examined different samples of Cochrane reviews and identified the databases from which the included studies of these reviews originated (
              - link "Halladay et al 2015" [ref=e414] [cursor=pointer]:
                - /url: "#_ENREF_121"
              - text: ","
              - link "Hartling et al 2016" [ref=e415] [cursor=pointer]:
                - /url: "#_ENREF_123"
              - text: ). Halladay showed that the majority of included studies could be identified via PubMed (range 75% to 92%) and Hartling showed that the majority of included studies could be identified by using a combination of two databases, but the two databases were different in each case. Both studies, one across all healthcare areas (
              - link "Halladay et al 2015" [ref=e416] [cursor=pointer]:
                - /url: "#_ENREF_121"
              - text: ) and the other on child health (
              - link "Hartling et al 2016" [ref=e417] [cursor=pointer]:
                - /url: "#_ENREF_123"
              - text: ), report a minimal extent to which the inclusion of studies not indexed in PubMed altered the meta-analyses. PubMed coverage across systematic review topics has been further evaluated in a study based on a comprehensive sample of Cochrane reviews. It provides further evidence of PubMed’s relatively high coverage (range 68% to 73%), with an emphasis that it is markedly variable across and within specialties (
              - link "Frandsen et al 2019b" [ref=e418] [cursor=pointer]:
                - /url: "#_ENREF_97"
              - text: ","
              - link "Metzendorf and Featherstone 2019" [ref=e419] [cursor=pointer]:
                - /url: "#_ENREF_187"
              - text: ). A study evaluating abbreviated literature searches suggested that a combination of MEDLINE and CENTRAL was sufficient to find the majority of available RCTs on clinical interventions. The authors concluded that, if decision-makers are willing to accept less certainty and a small risk for opposite conclusions, some abbreviated searches are viable options for rapid evidence syntheses. They also concluded, however, that decisions demanding high certainty require comprehensive searches (
              - link "Nussbaumer-Streit et al 2018" [ref=e420] [cursor=pointer]:
                - /url: "#_ENREF_204"
              - text: ). Uncertainty remains about the circumstances under which it is most important to search multiple databases. Comprehensive searches of multiple databases may be more important for public health interventions (
              - link "Levay et al 2022" [ref=e421] [cursor=pointer]:
                - /url: "#_ENREF_169"
              - text: ) and for study designs other than RCTs. The current recommendation of searching multiple databases, therefore, needs to be evaluated further, in order to confirm under which circumstances comprehensive searches of multiple databases are warranted.
            - heading "4.3.1.3 The Cochrane Central Register of Controlled Trials (CENTRAL)#section-4-3-1-3" [level=4] [ref=e422]
            - paragraph [ref=e423]:
              - text: Since its inception, the Cochrane Central Register of Controlled Trials (CENTRAL) has been recognized as the most comprehensive source of reports of randomized trials (
              - link "Egger and Smith 1998" [ref=e424] [cursor=pointer]:
                - /url: "#_ENREF_77"
              - text: ). Two recent studies have reconfirmed the high sensitivity of CENTRAL in identifying randomized controlled trials (
              - link "Noel-Storr et al 2020" [ref=e425] [cursor=pointer]:
                - /url: "#_ENREF_203"
              - text: ","
              - link "Noel-Storr and Wisniewski 2024" [ref=e426] [cursor=pointer]:
                - /url: "#_ENREF_202"
              - text: ). CENTRAL is published as part of the Cochrane Library and is updated monthly. As of April 2024, CENTRAL contains more than 2,000,000 records of reports of trials/trials registry records potentially eligible for inclusion in Cochrane reviews, by far the majority of which are randomized trials (
              - link "Noel-Storr et al 2020" [ref=e427] [cursor=pointer]:
                - /url: "#_ENREF_203"
              - text: ).
            - paragraph [ref=e428]:
              - text: Many of the records in CENTRAL have been identified through systematic searches of MEDLINE, Embase, CINAHL Plus, the Australasian Medical Index, KoreaMed, ClinicalTrials.gov and the trial records available through the WHO International Clinical Trials Registry Portal (see online
              - link "Technical Supplement" [ref=e429] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: ). CENTRAL, however, also includes citations to reports of randomized trials that are not included in MEDLINE, Embase or other bibliographic databases; citations published in many languages; and citations that are available only in conference proceedings or other sources that are difficult to access. It also includes records from trials registers and trials results registers beyond ClinicalTrials.gov and the WHO portal.
            - paragraph [ref=e430]:
              - text: Cochrane Information Specialists have previously conducted comprehensive searches to populate Specialized Registers in their field. The results of these searches were then added to CENTRAL. Only some Cochrane Groups, however, continue to maintain a Specialized Register. For the Cochrane Groups that no longer maintain a Specialized Register, its role has been replaced by the Cochrane Centralised Search Service (
              - link "Noel-Storr et al 2020" [ref=e431] [cursor=pointer]:
                - /url: "#_ENREF_203"
              - text: ). Legacy records from the Specialized Registers that are no longer maintained continue to be available via CENTRAL. Where a Specialized Register is still available, for which sufficiently comprehensive searching has been conducted, and kept up-to-date, a search of the Specialized Register may be conducted instead of separately searching CENTRAL, MEDLINE and Embase for a specific review (but refer to Section 2.2 of the
              - link "Technical Supplement" [ref=e432] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: to this chapter for caveats around this). In these cases, the search will be more precise but the majority of included studies will be identified with lower numbers of records to screen. There will, however, be a time lag between records appearing in databases such as MEDLINE or Embase and their inclusion in a Specialized Register.
            - paragraph [ref=e433]: CENTRAL is available through the Cochrane Library. Many review authors have full access free-of-charge at the point-of-use through national provisions and other similar arrangements, or as part of a paid subscription to the Cochrane Library. All Cochrane Information Specialists have full access to CENTRAL.
            - paragraph [ref=e434]:
              - text: The online
              - link "Technical Supplement" [ref=e435] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: provides information on what is in CENTRAL from MEDLINE, Embase and other sources, as well as guidance on searching CENTRAL.
            - heading "4.3.1.4 Other bibliographic databases#section-4-3-1-4" [level=4] [ref=e436]
            - paragraph [ref=e437]:
              - emphasis [ref=e438]: For further details on this topic, please refer to Section 1.1 of the online
              - link "Technical Supplement" [ref=e439] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - emphasis [ref=e440]: Technical Supplement
              - emphasis [ref=e441]: and its subsections.
            - paragraph [ref=e442]:
              - text: Many countries and regions produce bibliographic databases that focus on the literature produced in those regions and which often include journals and other literature not indexed elsewhere. There are also subject-specific bibliographic databases, such as AMED (allied and complementary medicine), CINAHL (nursing and allied health) and APA PsycInfo (psychology and psychiatry). It is highly desirable that searches be conducted of appropriate national, regional and subject specific bibliographic databases (see
              - link "MECIR Box 4.3.b" [ref=e443] [cursor=pointer]:
                - /url: "#mecir-box-4.3.b"
              - text: ). Further details are provided in the online
              - link "Technical Supplement" [ref=e444] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: .
            - paragraph [ref=e445]:
              - text: Citation indexes are bibliographic databases that record instances where a particular reference is cited, in addition to the standard bibliographic content. Citation indexes can be used to identify studies that are similar to a study report of interest, as it is probable that other reports citing or cited by a study will contain similar or related content. Further details are provided in the online
              - link "Technical Supplement" [ref=e446] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: .
            - paragraph [ref=e447]:
              - strong [ref=e448]: MECIR Box 4.3.b
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e449]:
              - rowgroup [ref=e450]:
                - 'row "C25: Searching specialist bibliographic databases (Highly desirable)" [ref=e451]':
                  - 'cell "C25: Searching specialist bibliographic databases (Highly desirable)" [ref=e452]':
                    - emphasis [ref=e453]:
                      - text: C25
                      - strong [ref=e454]: ":"
                    - text: Searching specialist bibliographic databases (
                    - strong [ref=e455]: Highly desirable
                    - text: )
                - row "Search appropriate national, regional and subject-specific bibliographic databases. Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible. Databases relevant to the review topic should be covered (e.g. CINAHL for nursing-related topics, APA PsycInfo for psychological interventions), and regional databases (e.g. LILACS) should be considered." [ref=e456]:
                  - cell "Search appropriate national, regional and subject-specific bibliographic databases." [ref=e457]:
                    - emphasis [ref=e458]: Search appropriate national, regional and subject-specific bibliographic databases.
                  - cell "Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible. Databases relevant to the review topic should be covered (e.g. CINAHL for nursing-related topics, APA PsycInfo for psychological interventions), and regional databases (e.g. LILACS) should be considered." [ref=e459]
            - heading "4.3.2 Ongoing studies and unpublished data sources#section-4-3-2" [level=3] [ref=e460]
            - paragraph [ref=e461]:
              - emphasis [ref=e462]: For further details on this topic, please refer to Section 1.2 of the online
              - link "Technical Supplement" [ref=e463] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - emphasis [ref=e464]: Technical Supplement
              - emphasis [ref=e465]: and its subsections.
            - paragraph [ref=e466]:
              - text: Initiatives to provide access to ongoing studies and unpublished data constitute a fast-moving field (
              - link "Isojarvi et al 2018" [ref=e467] [cursor=pointer]:
                - /url: "#_ENREF_142"
              - text: ). Review authors should therefore consult a medical/healthcare librarian or information specialist for current advice.
            - paragraph [ref=e468]: It is important to identify ongoing studies, so that when a review is updated these can be assessed for possible inclusion. Awareness of the existence of a possibly relevant ongoing study and its expected completion date might affect not only decisions with respect to when to update a specific review, but also when to aim to complete a review. Information about possibly relevant ongoing studies should be included in the review in the ‘Characteristics of ongoing studies’ table.
            - paragraph [ref=e469]:
              - text: Even when studies are completed or terminated, some are never published. An association between ‘statistically significant’ results and publication has been documented across a number of studies, as summarized in
              - link "Chapter 13" [ref=e470] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-13
              - text: . Finding out about unpublished studies, and including their results in a systematic review when eligible and appropriate (
              - link "Cook et al 1993" [ref=e471] [cursor=pointer]:
                - /url: "#_ENREF_53"
              - text: ), is important for minimizing bias. Several studies and other articles addressing issues around identifying unpublished studies have been published (
              - link "Easterbrook et al 1991" [ref=e472] [cursor=pointer]:
                - /url: "#_ENREF_74"
              - text: ","
              - link "Weber et al 1998" [ref=e473] [cursor=pointer]:
                - /url: "#_ENREF_283"
              - text: ","
              - link "Manheimer and Anderson 2002" [ref=e474] [cursor=pointer]:
                - /url: "#_ENREF_175"
              - text: ","
              - link "MacLean et al 2003" [ref=e475] [cursor=pointer]:
                - /url: "#_ENREF_174"
              - text: ","
              - link "Lee et al 2008" [ref=e476] [cursor=pointer]:
                - /url: "#_ENREF_164"
              - text: ","
              - link "Chan 2012" [ref=e477] [cursor=pointer]:
                - /url: "#_ENREF_42"
              - text: ","
              - link "Schroll et al 2013" [ref=e478] [cursor=pointer]:
                - /url: "#_ENREF_244"
              - text: ","
              - link "Wolfe et al 2013" [ref=e479] [cursor=pointer]:
                - /url: "#_ENREF_286"
              - text: ","
              - link "Chapman et al 2014" [ref=e480] [cursor=pointer]:
                - /url: "#_ENREF_43"
              - text: ","
              - link "Kreis et al 2014" [ref=e481] [cursor=pointer]:
                - /url: "#_ENREF_159"
              - text: ","
              - link "Scherer et al 2015" [ref=e482] [cursor=pointer]:
                - /url: "#_ENREF_243"
              - text: ","
              - link "Hwang et al 2016" [ref=e483] [cursor=pointer]:
                - /url: "#_ENREF_136"
              - text: ","
              - link "Iacobucci 2016" [ref=e484] [cursor=pointer]:
                - /url: "#_ENREF_137"
              - text: ","
              - link "Lampert et al 2016" [ref=e485] [cursor=pointer]:
                - /url: "#_ENREF_160"
              - text: ","
              - link "Campbell et al 2022" [ref=e486] [cursor=pointer]:
                - /url: "#_ENREF_38"
              - text: ","
              - link "Speich et al 2022" [ref=e487] [cursor=pointer]:
                - /url: "#_ENREF_254"
              - text: ).
            - paragraph [ref=e488]:
              - text: There is no easy and reliable single way to obtain information about studies that have been completed or terminated but never published. There have, however, been several important initiatives resulting in better access to studies and their results from sources other than the main bibliographic databases and journals. These include the further development of trials registers and trials results registers (see Section
              - link "4.3.3" [ref=e489] [cursor=pointer]:
                - /url: "#section-4-3-3"
              - text: ), and improved access to regulatory agency sources and clinical study reports (CSRs), which are the very detailed reports prepared by industry for regulatory approval (
              - link "Egilman et al 2021" [ref=e490] [cursor=pointer]:
                - /url: "#_ENREF_80"
              - text: ) (see
              - link "Section 4.3.4" [ref=e491] [cursor=pointer]:
                - /url: "#section-4-3-4"
              - text: ). A study (
              - link "Halfpenny et al 2016" [ref=e492] [cursor=pointer]:
                - /url: "#_ENREF_120"
              - text: ) assessed the value and usability for systematic reviews and network meta-analyses of data from trials registers, CSRs and regulatory authorities, and concluded that data from these sources have the potential to influence systematic review results. Two earlier studies showed that a considerably higher proportion of CSRs prepared for regulatory approval of drugs provided complete information on study methods and results than did trials register records or journal publications (
              - link "Wieseler et al 2012" [ref=e493] [cursor=pointer]:
                - /url: "#_ENREF_284"
              - text: ) and that conventional, publicly available sources (European Public Assessment Reports, journal publications, and trials register records) provide insufficient information on new drugs, especially on patient relevant outcomes in approved subpopulations (
              - link "Köhler et al 2015" [ref=e494] [cursor=pointer]:
                - /url: "#_ENREF_158"
              - text: ).
            - paragraph [ref=e495]:
              - text: An annotated bibliography of published studies addressing searching for unpublished studies and obtaining access to unpublished data is also available (
              - link "Arber et al 2013" [ref=e496] [cursor=pointer]:
                - /url: "#_ENREF_8"
              - text: ). One particular study focused on the contribution of unpublished studies, including dissertations, and studies in languages other than English, to the results of meta-analyses in reviews relevant to children (
              - link "Hartling et al 2017" [ref=e497] [cursor=pointer]:
                - /url: "#_ENREF_124"
              - text: ). They found that, in their sample, unpublished studies and studies in languages other than English rarely had any impact on the results and conclusions of the review. They did, however, concede that inclusion of these study types may have an impact in situations where there are few relevant studies, or where there are ‘questionable vested interests’ in the published literature.
            - paragraph [ref=e498]:
              - text: Asking researchers for information about completed or terminated but never published studies has not always been found to be fruitful (
              - link "Hetherington et al 1989" [ref=e499] [cursor=pointer]:
                - /url: "#_ENREF_128"
              - text: ","
              - link "Horton 1997" [ref=e500] [cursor=pointer]:
                - /url: "#_ENREF_133"
              - text: ) though some researchers have reported that this is an important method for retrieving studies for systematic reviews (
              - link "Royle and Milne 2003" [ref=e501] [cursor=pointer]:
                - /url: "#_ENREF_231"
              - text: ","
              - link "Greenhalgh and Peacock 2005" [ref=e502] [cursor=pointer]:
                - /url: "#_ENREF_115"
              - text: ","
              - link "Reveiz et al 2006" [ref=e503] [cursor=pointer]:
                - /url: "#_ENREF_226"
              - text: ","
              - link "Godolphin et al 2019" [ref=e504] [cursor=pointer]:
                - /url: "#_ENREF_112"
              - text: ). Correspondence can be an important source of information about unpublished studies. It is highly desirable for authors of Cochrane reviews of interventions to contact relevant individuals and organizations for information about unpublished or ongoing studies (see
              - link "MECIR Box 4.3.c" [ref=e505] [cursor=pointer]:
                - /url: "#mecir-box-4.3.c"
              - text: ). Letters of request for information can be used to identify completed or terminated but unpublished studies. One way of doing this is to send a comprehensive list of relevant articles and study records along with the eligibility criteria for the review to the first author of reports of included studies, asking if they know of any additional studies (ongoing, completed or terminated; published or unpublished) that might be relevant. This approach may be especially useful in areas where there are few trials or a limited number of active research groups. It may also be desirable to send the same letter to other experts and pharmaceutical companies and others with an interest in the area. Some review teams set up websites for systematic review projects, listing the studies identified to date and inviting submission of information on studies not already listed. A Cochrane Methodology Review examined studies assessing methods for obtaining unpublished data and concluded that those carrying out systematic reviews should continue to contact authors for missing data and that email contact was more successful than other methods (
              - link "Young and Hopewell 2011" [ref=e506] [cursor=pointer]:
                - /url: "#_ENREF_292"
              - text: ). A study assessed the value of contacting trial authors and concluded that data supplied by authors modified the outcomes of some systematic reviews, but this was poorly reported in the reviews (
              - link "Meursinge Reynders et al 2019" [ref=e507] [cursor=pointer]:
                - /url: "#_ENREF_188"
              - text: ). A further case study evaluated the effectiveness, efficiency, cost and value of contacting study authors in a systematic review and concluded that this was cost-effective in terms of time taken and costs in carrying out this work compared with unique data identified from the authors’ replies (
              - link "Cooper et al 2019" [ref=e508] [cursor=pointer]:
                - /url: "#_ENREF_57"
              - text: ). Another case study of a Cochrane Methodology Review reported that making contact with clinical trials units and trial methodologists provided data for six of the 38 RCTs included in the review, which had not been identified through other search methods (
              - link "Brueton et al 2017" [ref=e509] [cursor=pointer]:
                - /url: "#_ENREF_34"
              - text: ). A further study reported successful outcomes of a digital media strategy to obtain unpublished data from trial authors by contacting them using a combination of email, ResearchGate and LinkedIn (
              - link "Godard-Sebillotte et al 2018" [ref=e510] [cursor=pointer]:
                - /url: "#_ENREF_111"
              - text: ). A study assessed the value of requesting information from drug manufacturers for systematic reviews and concluded that this helped to reduce reporting and publication bias and helped to fill important gaps, sometimes leading to new or altered conclusions, primarily where no other evidence existed (
              - link "McDonagh et al 2018" [ref=e511] [cursor=pointer]:
                - /url: "#_ENREF_182"
              - text: ).
            - paragraph [ref=e512]:
              - strong [ref=e513]: MECIR Box 4.3.c
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e514]:
              - rowgroup [ref=e515]:
                - 'row "C31: Searching by contacting relevant individuals and organizations (Highly desirable)" [ref=e516]':
                  - 'cell "C31: Searching by contacting relevant individuals and organizations (Highly desirable)" [ref=e517]':
                    - emphasis [ref=e518]:
                      - text: C31
                      - strong [ref=e519]: ":"
                    - text: Searching by contacting relevant individuals and organizations (
                    - strong [ref=e520]: Highly desirable
                    - text: )
                - row "Contact relevant individuals and organizations for information about unpublished or ongoing studies. Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible. It is important to identify ongoing studies, so that these can be assessed for possible inclusion when a review is updated." [ref=e521]:
                  - cell "Contact relevant individuals and organizations for information about unpublished or ongoing studies." [ref=e522]:
                    - emphasis [ref=e523]: Contact relevant individuals and organizations for information about unpublished or ongoing studies.
                  - cell "Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible. It is important to identify ongoing studies, so that these can be assessed for possible inclusion when a review is updated." [ref=e524]
            - paragraph [ref=e525]:
              - text: The RIAT (Restoring Invisible and Abandoned Trials) initiative (
              - link "Doshi et al 2013" [ref=e526] [cursor=pointer]:
                - /url: "#_ENREF_71"
              - text: ) aims to address the problems outlined above by offering a methodology that allows others to re-publish mis-reported and to publish unreported trials. Anyone who can access the trial data and document trial abandonment can use this methodology. The
              - link "RIAT Support Center" [ref=e527] [cursor=pointer]:
                - /url: https://restoringtrials.org/whatisriat/
              - text: offers free-of-charge support and competitive funding to researchers interested in this approach. It has also been suggested that legislation such as Freedom of Information Acts (FOIAs) in various countries might be used to gain access to information about unpublished trials (
              - link "Bennett and Jull 2003" [ref=e528] [cursor=pointer]:
                - /url: "#_ENREF_17"
              - text: ","
              - link "MacLean et al 2003" [ref=e529] [cursor=pointer]:
                - /url: "#_ENREF_174"
              - text: ","
              - link "Coyne 2012" [ref=e530] [cursor=pointer]:
                - /url: "#_ENREF_63"
              - text: ","
              - link "Doshi and Jefferson 2016" [ref=e531] [cursor=pointer]:
                - /url: "#_ENREF_72"
              - text: ","
              - link "Yale Law School 2017" [ref=e532] [cursor=pointer]:
                - /url: "#_ENREF_290"
              - text: ). In the US, the FOIA is frequently used to obtain information about the US Department of Health and Human Services (HHS) and its agencies. It has been suggested, in light of growing costs, minimal fees collected and lengthy processing times, that HHS agencies’ FOIA programmes might be made more efficient through greater proactive record disclosure (
              - link "Egilman et al 2019" [ref=e533] [cursor=pointer]:
                - /url: "#_ENREF_79"
              - text: ).
            - heading "4.3.3 Trials registers and trials results registers#section-4-3-3" [level=3] [ref=e534]
            - paragraph [ref=e535]:
              - emphasis [ref=e536]: For further details on this topic, please refer to Section 1.2.1 of the online
              - link "Technical Supplement" [ref=e537] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - emphasis [ref=e538]: Technical Supplement
              - emphasis [ref=e539]: .
            - paragraph [ref=e540]:
              - text: Cochrane reviews of interventions should search relevant trials registers and repositories of results (see
              - link "MECIR Box 4.3.d" [ref=e541] [cursor=pointer]:
                - /url: "#mecir-box-4.3.d"
              - text: ). A recent audit by Cochrane investigators showed that the majority of Cochrane reviews do comply with this standard (
              - link "Berber et al 2019" [ref=e542] [cursor=pointer]:
                - /url: "#_ENREF_18"
              - text: ). It is important to note that trials registers are an important source of information about completed, terminated, and ongoing trials, and an increasingly important source of results for completed and terminated trials, especially those whose results have not been published (
              - link "Fain et al 2018" [ref=e543] [cursor=pointer]:
                - /url: "#_ENREF_90"
              - text: ","
              - link "Zarin et al 2019" [ref=e544] [cursor=pointer]:
                - /url: "#_ENREF_293"
              - text: ","
              - link "Nelson et al 2023" [ref=e545] [cursor=pointer]:
                - /url: "#_ENREF_197"
              - text: ","
              - link "Kaul et al 2024" [ref=e546] [cursor=pointer]:
                - /url: "#_ENREF_152"
              - text: ). Two studies, however, found that the data in trials register records were frequently either inaccurate and/or not kept up to date and that trial completion status was commonly inaccurate (
              - link "Fleminger and Goldacre 2018" [ref=e547] [cursor=pointer]:
                - /url: "#_ENREF_93"
              - text: ","
              - link "Speich et al 2021" [ref=e548] [cursor=pointer]:
                - /url: "#_ENREF_253"
              - text: ). It is recommended, therefore, not to limit searches of trials registers and trials register portals by trial status. Similarly, it was found that the phase of the trial was often not recorded correctly (
              - link "Gresham et al 2022" [ref=e549] [cursor=pointer]:
                - /url: "#_ENREF_116"
              - text: ). It is recommended, therefore, also not to limit searches of trials registers and trials register portals by trial phase.
            - paragraph [ref=e550]:
              - text: Studies have suggested that trials registers are an important source for identifying additional randomized trials (
              - link "Baudard et al 2017" [ref=e551] [cursor=pointer]:
                - /url: "#_ENREF_15"
              - text: ","
              - link "Banno et al 2020" [ref=e552] [cursor=pointer]:
                - /url: "#_ENREF_14"
              - text: ","
              - link "Alqaidoom et al 2023" [ref=e553] [cursor=pointer]:
                - /url: "#_ENREF_6"
              - text: ) and also for identifying additional or discrepant data for published studies (
              - link "Chen et al 2022" [ref=e554] [cursor=pointer]:
                - /url: "#_ENREF_44"
              - text: ","
              - link "Paladin and Pranić 2022" [ref=e555] [cursor=pointer]:
                - /url: "#_ENREF_211"
              - text: ). Although there are many other trials registers and related resources such as portals, those that are considered to be the most important for searching to identify studies for a systematic review are ClinicalTrials.gov and the WHO International Clinical Trials Registry Platform (ICTRP) portal (
              - link "Pansieri et al 2017" [ref=e556] [cursor=pointer]:
                - /url: "#_ENREF_212"
              - text: ). Research has shown that even though ClinicalTrials.gov is included in the WHO ICTRP Search Portal, not all ClinicalTrials.gov records could be successfully retrieved via searches of the ICTRP Search Portal (
              - link "Glanville et al 2014" [ref=e557] [cursor=pointer]:
                - /url: "#_ENREF_110"
              - text: ","
              - link "Hausner 2014" [ref=e558] [cursor=pointer]:
                - /url: "#_ENREF_126"
              - text: ","
              - link "Knelangen et al 2018" [ref=e559] [cursor=pointer]:
                - /url: "#_ENREF_155"
              - text: ). The extent to which this might still be the case with the new ICTRP interface released in its final version in June 2021 and the changes being made under the ClinicalTrials.gov Modernization programme remains to be ascertained. Therefore, the guidance that it is not sufficient to search the ICTRP alone still stands, pending further research. A recent study reviewed the search interfaces of the EU Clinical Trials Register (EUCTR), ClinicalTrials.gov and the WHO ICTRP and offers further insights into how to search these resources (
              - link "Cooper et al 2021b" [ref=e560] [cursor=pointer]:
                - /url: "#_ENREF_59"
              - text: ), as does another recent article (
              - link "Hunter et al 2022" [ref=e561] [cursor=pointer]:
                - /url: "#_ENREF_135"
              - text: ). Guidance for searching these and other trials registers is provided in the online
              - link "Technical Supplement" [ref=e562] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: .
            - paragraph [ref=e563]:
              - text: In addition to Cochrane, other organizations also advocate searching trials registers and/or related portals. These include the Agency for Healthcare Research and Quality (AHRQ) in the US, the European Network for Health Technology Assessment (EUnetHTA), the Institute for Quality and Efficiency in Health Care (IQWiG) in Germany, the Institute of Medicine in the US, and the National Institute of Health and Care Excellence (NICE) in the UK (
              - link "Institute of Medicine 2011" [ref=e564] [cursor=pointer]:
                - /url: "#_ENREF_140"
              - text: ","
              - link "Agency for Healthcare Research and Quality 2014" [ref=e565] [cursor=pointer]:
                - /url: "#_ENREF_4"
              - text: ","
              - link "National Institute for Health and Care Excellence (NICE) 2014" [ref=e566] [cursor=pointer]:
                - /url: "#_ENREF_195"
              - text: ","
              - link "EUnetHTA JA3WP6B2-2 Authoring Team 2019" [ref=e567] [cursor=pointer]:
                - /url: "#_ENREF_85"
              - text: ","
              - link "Institute for Quality and Efficiency in Health Care 2023" [ref=e568] [cursor=pointer]:
                - /url: "#_ENREF_139"
              - text: ).
            - paragraph [ref=e569]:
              - text: There has been an increasing recognition by funders, governments, institutions and investigators of the importance of registering trials at inception and providing access to trial results. Despite perceptions and even assertions to the contrary, however, there is no global, universal, legal requirement to register clinical trials at inception or at any other stage in the process, and no global, universal, legal requirement to publish trial results. The situation is, however, improving and some countries and organizations have introduced such legislation (
              - link "Viergever and Li 2015" [ref=e570] [cursor=pointer]:
                - /url: "#_ENREF_277"
              - text: ) together with plans for sanctions for non-compliance (
              - link "Mirjam Keestra et al 2022" [ref=e571] [cursor=pointer]:
                - /url: "#_ENREF_189"
              - text: ","
              - link "Grabenstein 2023" [ref=e572] [cursor=pointer]:
                - /url: "#_ENREF_114"
              - text: ).
            - paragraph [ref=e573]:
              - text: Efforts have been made by a number of organizations, including organizations representing the pharmaceutical industry and individual pharmaceutical companies, to begin to provide central access to ongoing trials and in some cases trial results on completion, either on a national or international basis. An audit of pharmaceutical companies’ policies on access to trial data, results and methods, however, showed that the commitments made by companies to transparency of trials were highly variable (
              - link "Goldacre et al 2017" [ref=e574] [cursor=pointer]:
                - /url: "#_ENREF_113"
              - text: ). Increasingly, as already noted, trials registers such as ClinicalTrials.gov also contain the results of completed and terminated trials where these have been posted by the investigator(s), not just simply listings of the details of the trial and/or details of associated publications.
            - paragraph [ref=e575]:
              - strong [ref=e576]: MECIR Box 4.3.d
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e577]:
              - rowgroup [ref=e578]:
                - 'row "C27: Searching trials registers (Mandatory)" [ref=e579]':
                  - 'cell "C27: Searching trials registers (Mandatory)" [ref=e580]':
                    - emphasis [ref=e581]:
                      - text: C27
                      - strong [ref=e582]: ":"
                    - text: Searching trials registers (
                    - strong [ref=e583]: Mandatory
                    - text: )
                - row "Search trials registers and repositories of results, where relevant to the topic, through ClinicalTrials.gov, the WHO International Clinical Trials Registry Platform (ICTRP) portal and other sources as appropriate. Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible. Although ClinicalTrials.gov is included as one of the registers within the WHO ICTRP portal, it is recommended that both ClinicalTrials.gov and the ICTRP portal are searched separately due to additional features in ClinicalTrials.gov." [ref=e584]:
                  - cell "Search trials registers and repositories of results, where relevant to the topic, through ClinicalTrials.gov, the WHO International Clinical Trials Registry Platform (ICTRP) portal and other sources as appropriate." [ref=e585]:
                    - emphasis [ref=e586]: Search trials registers and repositories of results, where relevant to the topic, through ClinicalTrials.gov, the WHO International Clinical Trials Registry Platform (ICTRP) portal and other sources as appropriate.
                  - cell "Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible. Although ClinicalTrials.gov is included as one of the registers within the WHO ICTRP portal, it is recommended that both ClinicalTrials.gov and the ICTRP portal are searched separately due to additional features in ClinicalTrials.gov." [ref=e587]
            - heading "4.3.4 Regulatory agency sources and clinical study reports#section-4-3-4" [level=3] [ref=e588]
            - paragraph [ref=e589]:
              - emphasis [ref=e590]: For further details on this topic, please refer to Section 1.2.2 of the online
              - link "Technical Supplement" [ref=e591] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - emphasis [ref=e592]: Technical Supplement
              - emphasis [ref=e593]: .
            - paragraph [ref=e594]:
              - text: A number of organizations, including Cochrane, recommend searching regulatory agency sources for trial information including clinical study reports. Clinical study reports (CSRs) are the reports of clinical trials providing detailed information, submitted in support of marketing authorization applications, on the methods and results or outcomes of clinical trials. The organizations which recommend searching these sources include the Agency for Healthcare Research and Quality (AHRQ) in the US, the Institute for Quality and Efficiency in Health Care (IQWiG) in Germany, and the Institute of Medicine in the US (
              - link "Institute of Medicine 2011" [ref=e595] [cursor=pointer]:
                - /url: "#_ENREF_140"
              - text: ","
              - link "Agency for Healthcare Research and Quality 2014" [ref=e596] [cursor=pointer]:
                - /url: "#_ENREF_4"
              - text: ","
              - link "Institute for Quality and Efficiency in Health Care 2023" [ref=e597] [cursor=pointer]:
                - /url: "#_ENREF_139"
              - text: ). Relevant regulatory agency sources for CSRs or related information include the Australian Therapeutic Goods Administration (TGA), the European Medicines Agency (EMA), Health Canada, the Japanese Pharmaceuticals and Medical Devices Agency (PMDA) and the US Food and Drug Administration (FDA). Details of these are provided in the online
              - link "Technical Supplement" [ref=e598] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: . In addition to providing access to CSRs, regulatory agencies are also a source of trials-register-like records, for example the EMA with respect to the EU Clinical Trials Register, the recently launched European Clinical Trials Information Service/the EU Clinical Trials database, and The European Database on Medical Devices (EUDAMED) (under development); and the FDA with respect to Drugs@FDA and medical devices information from the FDA. These resources are all covered in the online
              - link "Technical Supplement" [ref=e599] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: .
            - paragraph [ref=e600]:
              - text: A study (
              - link "Hodkinson et al 2018" [ref=e601] [cursor=pointer]:
                - /url: "#_ENREF_132"
              - text: ","
              - link "Jefferson et al 2018" [ref=e602] [cursor=pointer]:
                - /url: "#_ENREF_145"
              - text: ) that looked at use of regulatory documents in Cochrane reviews, found that understanding within the Cochrane community was limited and that guidance and support would be required if review authors were to engage with regulatory documents as a source of evidence. Specifically, guidance on how to identify and use data from regulatory sources is needed (
              - link "Jørgensen et al 2018" [ref=e603] [cursor=pointer]:
                - /url: "#_ENREF_148"
              - text: ). For more information about identifying CSRs, see the online
              - link "Technical Supplement" [ref=e604] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: . Further guidance on collecting data from CSRs is provided in
              - link "Chapter 5, Section 5.5.6" [ref=e605] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-05#section-5-5-6
              - text: .
            - heading "4.3.5 Other sources#section-4-3-5" [level=3] [ref=e606]
            - paragraph [ref=e607]:
              - emphasis [ref=e608]: For further details on this topic, please refer to Section 1 of the online
              - link "Technical Supplement" [ref=e609] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - emphasis [ref=e610]: Technical Supplement
              - emphasis [ref=e611]: and its subsections.
            - paragraph [ref=e612]:
              - text: The term ‘grey literature’ is often used to refer to reports published outside of traditional commercial publishing. In particular, review authors consider searching sources such as dissertations and conference abstracts (see
              - link "MECIR Box 4.3.e" [ref=e613] [cursor=pointer]:
                - /url: "#mecir-box-4.3.e"
              - text: ).
            - paragraph [ref=e614]:
              - text: Review authors may also consider searching the internet, handsearching journals and searching full texts of journals electronically where available (see online
              - link "Technical Supplement" [ref=e615] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: for details). They should examine previous reviews on the same topic and check reference lists of included studies and relevant systematic reviews (see
              - link "MECIR Box 4.3.e" [ref=e616] [cursor=pointer]:
                - /url: "#mecir-box-4.3.e"
              - text: ).
            - paragraph [ref=e617]:
              - strong [ref=e618]: MECIR Box 4.3.e
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e619]:
              - rowgroup [ref=e620]:
                - 'row "C28: Searching for grey literature (Highly desirable)" [ref=e621]':
                  - 'cell "C28: Searching for grey literature (Highly desirable)" [ref=e622]':
                    - emphasis [ref=e623]:
                      - text: C28
                      - strong [ref=e624]: ":"
                    - text: Searching for grey literature (
                    - strong [ref=e625]: Highly desirable
                    - text: )
                - row "Search relevant grey literature sources such as reports, dissertations, theses and conference abstracts. Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible." [ref=e626]:
                  - cell "Search relevant grey literature sources such as reports, dissertations, theses and conference abstracts." [ref=e627]:
                    - emphasis [ref=e628]: Search relevant grey literature sources such as reports, dissertations, theses and conference abstracts.
                  - cell "Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible." [ref=e629]
                - 'row "C29: Searching within other reviews (Highly desirable)" [ref=e630]':
                  - 'cell "C29: Searching within other reviews (Highly desirable)" [ref=e631]':
                    - emphasis [ref=e632]:
                      - text: C29
                      - strong [ref=e633]: ":"
                    - text: Searching within other reviews (
                    - strong [ref=e634]: Highly desirable
                    - text: )
                - row "Search within previous reviews on the same topic. Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible." [ref=e635]:
                  - cell "Search within previous reviews on the same topic." [ref=e636]:
                    - emphasis [ref=e637]: Search within previous reviews on the same topic.
                  - cell "Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible." [ref=e638]
                - 'row "C30: Searching reference lists (Mandatory)" [ref=e639]':
                  - 'cell "C30: Searching reference lists (Mandatory)" [ref=e640]':
                    - emphasis [ref=e641]:
                      - text: C30
                      - strong [ref=e642]: ":"
                    - text: Searching reference lists (
                    - strong [ref=e643]: Mandatory
                    - text: )
                - row "Check reference lists in included studies and any relevant systematic reviews identified. Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible." [ref=e644]:
                  - cell "Check reference lists in included studies and any relevant systematic reviews identified." [ref=e645]:
                    - emphasis [ref=e646]: Check reference lists in included studies and any relevant systematic reviews identified.
                  - cell "Searches for studies should be as extensive as possible in order to reduce the risk of publication bias and to identify as much relevant evidence as possible." [ref=e647]
            - heading "4.4 Designing search strategies#section-4-4" [level=2] [ref=e648]
            - heading "4.4.1 Introduction to search strategies#section-4-4-1" [level=3] [ref=e649]
            - paragraph [ref=e650]: This section highlights some of the issues to consider when designing search strategies. Designing search strategies can be complex and the section does not fully address the many complexities in this area. Review teams will benefit from the skills and expertise of a medical/healthcare librarian or information specialist. Many of the issues highlighted relate to both the subject aspects of the search (e.g. the PICO elements) and to the study design (e.g. randomized trials). For a search to be robust, both aspects require attention to be sure that relevant records are not missed.
            - paragraph [ref=e651]: "Issues to consider in planning a search include:"
            - list [ref=e652]:
              - listitem [ref=e653]: the nature or type of the intervention(s) being assessed;
              - listitem [ref=e654]:
                - text: the complexity of the review question and the need to consider additional conceptual frameworks (see
                - link "Chapter 3" [ref=e655] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-03
                - text: and
                - link "Chapter 17" [ref=e656] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-17
                - text: );
              - listitem [ref=e657]:
                - text: the time period when any evaluations of the interventions may have taken place (as specified in the review protocol) (see Section
                - link "4.4.5" [ref=e658] [cursor=pointer]:
                  - /url: "#section-4-4-5"
                - text: );
              - listitem [ref=e659]:
                - text: any geographic considerations, such as the need to search the African Index Medicus for studies relating to African populations or the Chinese literature for studies in Chinese herbal medicine (see online
                - link "Technical Supplement" [ref=e660] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - text: );
              - listitem [ref=e661]:
                - text: whether the review is limited to randomized trials or other study designs are eligible (see
                - link "Chapter 24" [ref=e662] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-24
                - text: );
              - listitem [ref=e663]:
                - text: whether a validated methodological search filter (for specific study designs) is available (see Section
                - link "4.4.7" [ref=e664] [cursor=pointer]:
                  - /url: "#section-4-4-7"
                - text: );
              - listitem [ref=e665]:
                - text: whether unpublished data are to be sought specifically, see Sections
                - link "4.3.2" [ref=e666] [cursor=pointer]:
                  - /url: "#section-4-3-2"
                - text: ","
                - link "4.3.3" [ref=e667] [cursor=pointer]:
                  - /url: "#section-4-3-3"
                - text: and
                - link "4.3.4" [ref=e668] [cursor=pointer]:
                  - /url: "#section-4-3-4"
                - text: ; and
              - listitem [ref=e669]:
                - text: whether the review has specific eligibility criteria around study design to address adverse effects (see
                - link "Chapter 19" [ref=e670] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-19
                - text: ), economic evidence (see
                - link "Chapter 20" [ref=e671] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-20
                - text: ) or qualitative evidence (see
                - link "Chapter 21" [ref=e672] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-21
                - text: ), in which case searches to address these criteria should be undertaken (see
                - link "MECIR Box 4.4.a" [ref=e673] [cursor=pointer]:
                  - /url: "#mecir-box-4.4.a"
                - text: ).
            - paragraph [ref=e674]:
              - text: Further evidence-based information about designing search strategies can be found on the
              - link "SuRe Info portal" [ref=e675] [cursor=pointer]:
                - /url: https://sites.google.com/york.ac.uk/sureinfo/home
              - text: ", which is updated twice per year ("
              - link "Isojarvi and Glanville 2021" [ref=e676] [cursor=pointer]:
                - /url: "#_ENREF_143"
              - text: ).
            - paragraph [ref=e677]:
              - strong [ref=e678]: MECIR Box 4.4.a
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e679]:
              - rowgroup [ref=e680]:
                - 'row "C26: Searching for different types of evidence (Mandatory)" [ref=e681]':
                  - 'cell "C26: Searching for different types of evidence (Mandatory)" [ref=e682]':
                    - emphasis [ref=e683]:
                      - text: C26
                      - strong [ref=e684]: ":"
                    - text: Searching for different types of evidence (
                    - strong [ref=e685]: Mandatory
                    - text: )
                - row "If the review has specific eligibility criteria around study design to address adverse effects, economic issues or qualitative research questions, undertake searches to address them. Sometimes a review will address questions about adverse effects, economic issues or qualitative research using a different set of eligibility criteria from the main (effectiveness) component. In such situations, the searches for evidence must be suitable to identify relevant study designs for these questions. Different searches may need to be conducted for different types of evidence." [ref=e686]:
                  - cell "If the review has specific eligibility criteria around study design to address adverse effects, economic issues or qualitative research questions, undertake searches to address them." [ref=e687]:
                    - emphasis [ref=e688]: If the review has specific eligibility criteria around study design to address adverse effects, economic issues or qualitative research questions, undertake searches to address them.
                  - cell "Sometimes a review will address questions about adverse effects, economic issues or qualitative research using a different set of eligibility criteria from the main (effectiveness) component. In such situations, the searches for evidence must be suitable to identify relevant study designs for these questions. Different searches may need to be conducted for different types of evidence." [ref=e689]
            - heading "4.4.2 Structure of a search strategy#section-4-4-2" [level=3] [ref=e690]
            - paragraph [ref=e691]:
              - text: The starting point for developing a search strategy is to consider the main concepts being examined in a review. This is often referred to as PICO – that is Patient (or Participant or Population or Problem), Intervention, Comparison and Outcomes (
              - link "Richardson et al 1995" [ref=e692] [cursor=pointer]:
                - /url: "#_ENREF_228"
              - text: ","
              - link "Cullen et al 2023" [ref=e693] [cursor=pointer]:
                - /url: "#_ENREF_65"
              - text: ","
              - link "Hateley 2023" [ref=e694] [cursor=pointer]:
                - /url: "#_ENREF_125"
              - text: "): see also"
              - link "Chapter 2" [ref=e695] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-02
              - text: and
              - link "Chapter 3" [ref=e696] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-03
              - text: for guidance on developing and refining PICO definitions that will be operationalized in the search strategy. Examples are provided in the appendices to the
              - link "Cochrane Information Specialists’ Handbook" [ref=e697] [cursor=pointer]:
                - /url: https://training.cochrane.org/resource/cochrane-information-specialists-handbook
              - text: (
              - link "Cochrane Information Specialist Support Team 2021c" [ref=e698] [cursor=pointer]:
                - /url: "#_ENREF_50"
              - text: ). For a Cochrane review of interventions, the review objective should provide the PICO concepts, and the eligibility criteria for studies to be included will further assist in the selection of appropriate subject headings and text words for the search strategy.
            - paragraph [ref=e699]:
              - text: The structure of search strategies in bibliographic databases should be informed by the main concepts of the review (see
              - link "Chapter 3" [ref=e700] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-03
              - text: ), using appropriate elements from PICO and the study design (see
              - link "MECIR Box 4.4.b" [ref=e701] [cursor=pointer]:
                - /url: "#mecir-box-4.4.b"
              - text: ). It is usually unnecessary, however, and may even be undesirable, to search on every aspect of the review’s clinical question (
              - link "Frandsen et al 2020" [ref=e702] [cursor=pointer]:
                - /url: "#_ENREF_98"
              - text: ). Although a research question may specify particular comparators or outcomes, these concepts may not be well described in the title or abstract of an article (or indeed may not be mentioned at all) and are often not well indexed with controlled vocabulary terms such as Medical Subject Headings (MeSH) (
              - link "Tsujimoto et al 2022" [ref=e703] [cursor=pointer]:
                - /url: "#_ENREF_272"
              - text: ")). Therefore, when searching general databases, such as MEDLINE, a search strategy will typically have three sets of terms: (i) terms to search for the health condition of interest, i.e. the population; (ii) terms to search for the intervention(s) evaluated; and (iii) terms to search for the types of study design to be included. Typically, a broad set of search terms will be gathered for each concept and combined with the OR Boolean operator to achieve sensitivity within concepts. The results for each concept are then combined using the AND Boolean operator, to ensure each concept is represented in the final search results."
            - paragraph [ref=e704]:
              - text: It is important to consider the structure of the search strategy on a question-by-question basis. In some cases it may be possible and reasonable to search for the comparator, for example if the comparator is explicitly placebo and reported consistently. In other cases, investigation might show that the outcomes are particularly well defined and consistently reported in abstracts, which might justify the inclusion of the outcomes concept in the search. When searchers are considering including outcomes or comparators in the strategy only because of the volume of records being returned (
              - link "Frandsen et al 2022" [ref=e705] [cursor=pointer]:
                - /url: "#_ENREF_99"
              - text: ), it is worth consulting the range of alternative approaches listed as bullet points below. The advice on whether or not to search for outcomes for adverse effects differs from the advice given above (see
              - link "Chapter 19" [ref=e706] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-19
              - text: ).
            - paragraph [ref=e707]:
              - strong [ref=e708]: MECIR Box 4.4.b
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e709]:
              - rowgroup [ref=e710]:
                - 'row "C32: Structuring search strategies for bibliographic databases (Mandatory)" [ref=e711]':
                  - 'cell "C32: Structuring search strategies for bibliographic databases (Mandatory)" [ref=e712]':
                    - emphasis [ref=e713]: C32
                    - text: ": Structuring search strategies for bibliographic databases ("
                    - strong [ref=e714]: Mandatory
                    - text: )
                - row [ref=e715]:
                  - cell "Inform the structure of search strategies in bibliographic databases around the main concepts of the review, using appropriate elements from PICO and study design. In structuring the search, maximize sensitivity whilst striving for reasonable precision. Ensure correct use of the ‘AND’ and ‘OR’ operators." [ref=e716]:
                    - emphasis [ref=e717]: Inform the structure of search strategies in bibliographic databases around the main concepts of the review, using appropriate elements from PICO and study design. In structuring the search, maximize sensitivity whilst striving for reasonable precision. Ensure correct use of the ‘AND’ and ‘OR’ operators.
                  - cell [ref=e718]
            - paragraph [ref=e719]:
              - text: For some reviews it may not be easy to use the PICO concepts to structure the search in the way described above. This may particularly be the case for reviews addressing complex or unknown interventions or public health interventions (see also
              - link "Chapter 17" [ref=e720] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-17
              - text: on intervention complexity). Furthermore, the PICO framework is generally not suitable for questions around diagnostic test accuracy, prognosis, qualitative data or methods (
              - link "Irvin and Hayden 2006" [ref=e721] [cursor=pointer]:
                - /url: "#_ENREF_141"
              - text: ","
              - link "Booth 2016b" [ref=e722] [cursor=pointer]:
                - /url: "#_ENREF_22"
              - text: ","
              - link "Spijker et al 2023" [ref=e723] [cursor=pointer]:
                - /url: "#_ENREF_256"
              - text: ","
              - link "Hirt et al 2024b" [ref=e724] [cursor=pointer]:
                - /url: "#_ENREF_131"
              - text: ) (see also
              - link "Chapter 21" [ref=e725] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/cochrane-campbell-handbook-qualitative-evidence-synthesis/qeschapter21prev0061123
              - text: on qualitative evidence), and reviews taking specific approaches, such as realist reviews, may require iterative searches and multiple search strategies (
              - link "Booth et al 2020a" [ref=e726] [cursor=pointer]:
                - /url: "#_ENREF_24"
              - text: ). The term ‘tailored approach’ has been suggested for searches for complex topics or review methods that may not fit into a PICO structure (
              - link "Cooper et al 2022b" [ref=e727] [cursor=pointer]:
                - /url: "#_ENREF_61"
              - text: "). Some options to explore for these situations include:"
            - list [ref=e728]:
              - listitem [ref=e729]:
                - text: "consider whether a non-PICO question breakdown may be helpful from which concepts can be selected and tested. A list of question structures and their component concepts is available at:"
                - link "https://gh.bmj.com/content/bmjgh/4/Suppl_1/e001107/DC1/embed/inline-supplementary-material-1.pdf" [ref=e730] [cursor=pointer]:
                  - /url: https://gh.bmj.com/content/bmjgh/4/Suppl_1/e001107/DC1/embed/inline-supplementary-material-1.pdf
                - text: (
                - link "Booth et al 2019" [ref=e731] [cursor=pointer]:
                  - /url: "#_ENREF_23"
                - text: );
              - listitem [ref=e732]:
                - text: use a single concept such as searching for the intervention alone (
                - link "European Food Safety Authority 2010" [ref=e733] [cursor=pointer]:
                  - /url: "#_ENREF_86"
                - text: );
              - listitem [ref=e734]: break a compound concept into two or more subconcepts, for example computer-assisted instruction might be broken down into the concept of computer-assisted and the concept of instruction;
              - listitem [ref=e735]:
                - text: use a multi-stranded or multi-faceted approach that uses a series of searches, with different combinations of concepts, to capture a complex research question (
                - link "Lefebvre et al 2013" [ref=e736] [cursor=pointer]:
                  - /url: "#_ENREF_166"
                - text: );
              - listitem [ref=e737]:
                - text: use a variety of different search approaches to compensate for when a specific concept is difficult to define (
                - link "Shemilt et al 2014" [ref=e738] [cursor=pointer]:
                  - /url: "#_ENREF_247"
                - text: );
              - listitem [ref=e739]:
                - text: use iterative searches (
                - link "Bravata et al 2005" [ref=e740] [cursor=pointer]:
                  - /url: "#_ENREF_30"
                - text: ","
                - link "Zwakman et al 2018" [ref=e741] [cursor=pointer]:
                  - /url: "#_ENREF_296"
                - text: ","
                - link "Booth et al 2020b" [ref=e742] [cursor=pointer]:
                  - /url: "#_ENREF_25"
                - text: );
              - listitem [ref=e743]:
                - text: use citation searching on key articles in addition to a database search (
                - link "Haddaway et al 2015" [ref=e744] [cursor=pointer]:
                  - /url: "#_ENREF_118"
                - text: ","
                - link "Hinde and Spackman 2015" [ref=e745] [cursor=pointer]:
                  - /url: "#_ENREF_129"
                - text: ) (see online
                - link "Technical Supplement" [ref=e746] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - text: );
              - listitem [ref=e747]:
                - text: consider machine learning options whereby broad, sensitive searches are conducted and the search results are categorized or prioritized using machine learning software (
                - link "Muller et al 2021" [ref=e748] [cursor=pointer]:
                  - /url: "#_ENREF_193"
                - text: ","
                - link "Shemilt et al 2021" [ref=e749] [cursor=pointer]:
                  - /url: "#_ENREF_249"
                - text: ","
                - link "Cawley 2022" [ref=e750] [cursor=pointer]:
                  - /url: "#_ENREF_39"
                - text: ","
                - link "Shemilt et al 2022" [ref=e751] [cursor=pointer]:
                  - /url: "#_ENREF_250"
                - text: ","
                - link "Stansfield et al 2022" [ref=e752] [cursor=pointer]:
                  - /url: "#_ENREF_260"
                - text: ) (see online
                - link "Technical Supplement" [ref=e753] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - text: );
              - listitem [ref=e754]:
                - text: consider using visual search strategy building aids such as 2DSearch (
                - link "https://www.2dsearch.com/" [ref=e755] [cursor=pointer]:
                  - /url: https://www.2dsearch.com/
                - text: ), searchrefiner (
                - link "https://ielab.io/searchrefiner/" [ref=e756] [cursor=pointer]:
                  - /url: https://ielab.io/searchrefiner/
                - text: ) or Nested Knowledge (
                - link "https://nested-knowledge.com/" [ref=e757] [cursor=pointer]:
                  - /url: https://nested-knowledge.com/
                - text: ) that may facilitate exploring the impact of searching using different combinations of concepts (
                - link "Scells and Zuccon 2018" [ref=e758] [cursor=pointer]:
                  - /url: "#_ENREF_241"
                - text: ","
                - link "Svarre and Russell-Rose 2022" [ref=e759] [cursor=pointer]:
                  - /url: "#_ENREF_265"
                - text: ); and
              - listitem [ref=e760]:
                - text: consider using AI chatbots such as ChatGPT (
                - link "https://openai.com/chatgpt/" [ref=e761] [cursor=pointer]:
                  - /url: https://openai.com/chatgpt/
                - text: ) or Claude (
                - link "https://claude.ai" [ref=e762] [cursor=pointer]:
                  - /url: https://claude.ai
                - text: ) to ask for suggestions for ways to structure searches, using a detailed explanation of the search question as a prompt (
                - link "Alaniz et al 2023" [ref=e763] [cursor=pointer]:
                  - /url: "#_ENREF_5"
                - text: ","
                - link "Atlas 2023" [ref=e764] [cursor=pointer]:
                  - /url: "#_ENREF_10"
                - text: ","
                - link "Enomoto et al 2023" [ref=e765] [cursor=pointer]:
                  - /url: "#_ENREF_84"
                - text: ","
                - link "Wang et al 2023" [ref=e766] [cursor=pointer]:
                  - /url: "#_ENREF_281"
                - text: ","
                - link "Zhang 2023" [ref=e767] [cursor=pointer]:
                  - /url: "#_ENREF_295"
                - text: ","
                - link "Guimarães et al 2024" [ref=e768] [cursor=pointer]:
                  - /url: "#_ENREF_117"
                - text: ) (see online
                - link "Technical Supplement" [ref=e769] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - text: ).
            - paragraph [ref=e770]:
              - text: In the process of updating reviews, the PICO elements and any impact on search structure should also be reviewed and updated if necessary (
              - link "Bendersky et al 2022" [ref=e771] [cursor=pointer]:
                - /url: "#_ENREF_16"
              - text: ).
            - heading "4.4.3 Sensitivity versus precision#section-4-4-3" [level=3] [ref=e772]
            - paragraph [ref=e773]: Searches for systematic reviews aim to be as extensive as possible in order to ensure that as many of the relevant studies as possible are included in the review. It is, however, necessary to strike a balance between striving for comprehensiveness and maintaining relevance when developing a search strategy.
            - paragraph [ref=e774]:
              - text: The properties of searches are often quantified using ‘sensitivity’ (also called ‘recall’) and ‘precision’ (see
              - link "Table 4.4.a" [ref=e775] [cursor=pointer]:
                - /url: "#table-4.4.a"
              - text: ). Sensitivity is defined as the number of relevant reports identified divided by the total number of relevant reports in the resource. Precision is defined as the number of relevant reports identified divided by the total number of reports identified. Increasing the comprehensiveness (or sensitivity) of a search will reduce its precision and will usually retrieve more non-relevant reports.
            - paragraph [ref=e776]:
              - text: Searches for Cochrane reviews should seek to maximize sensitivity whilst striving for reasonable precision (see
              - link "MECIR Box 4.4.b" [ref=e777] [cursor=pointer]:
                - /url: "#mecir-box-4.4.b"
              - text: ). Article abstracts identified through a database search can usually be screened very quickly to ascertain potential relevance. At a conservatively estimated reading rate of one or two abstracts per minute, the results of a database search can be screened at the rate of 60–120 per hour (or approximately 500–1000 over an 8-hour period), so the high yield and low precision associated with systematic review searching may not be as daunting as it might at first appear in comparison with the total time to be invested in the review.
            - paragraph [ref=e778]:
              - strong [ref=e779]: Table 4.4.a
              - text: Sensitivity and precision of a search
