            - heading "4.4.4 Controlled vocabulary and text words#section-4-4-4" [level=3] [ref=e808]
            - paragraph [ref=e809]:
              - emphasis [ref=e810]: For further details on this topic, please refer to Section 3.2 of the online
              - link "Technical Supplement" [ref=e811] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - emphasis [ref=e812]: Technical Supplement
              - emphasis [ref=e813]: and its subsections.
            - paragraph [ref=e814]:
              - text: MEDLINE and Embase (and many other databases) can be searched using a combination of two retrieval approaches. One is based on text words, that is terms occurring in the title, abstract or other relevant fields available in the database. The other is based on standardized subject terms assigned to the references either by indexers (specialists who appraise the articles and describe their topics by assigning terms from a specific thesaurus or controlled vocabulary) or automatically using automated indexing approaches. Searches for Cochrane reviews should use an appropriate combination of these two approaches, i.e. text words and controlled vocabulary (see
              - link "MECIR Box 4.4.c" [ref=e815] [cursor=pointer]:
                - /url: "#mecir-box-4.4.c"
              - text: ). Approaches for identifying text words and controlled vocabulary to combine appropriately within a search strategy, including text mining approaches, are presented in the online
              - link "Technical Supplement" [ref=e816] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: .
            - paragraph [ref=e817]:
              - strong [ref=e818]: MECIR Box 4.4.c
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e819]:
              - rowgroup [ref=e820]:
                - 'row "C33: Developing search strategies for bibliographic databases (Mandatory)" [ref=e821]':
                  - 'cell "C33: Developing search strategies for bibliographic databases (Mandatory)" [ref=e822]':
                    - emphasis [ref=e823]:
                      - text: C33
                      - strong [ref=e824]: ":"
                    - text: Developing search strategies for bibliographic databases (
                    - strong [ref=e825]: Mandatory
                    - text: )
                - row [ref=e826]:
                  - cell "Identify appropriate controlled vocabulary (e.g. MeSH, Emtree, including 'exploded' terms) and free-text terms (considering, for example, spelling variants, synonyms, acronyms, truncation and proximity operators)." [ref=e827]:
                    - emphasis [ref=e828]: Identify appropriate controlled vocabulary (e.g. MeSH, Emtree, including 'exploded' terms) and free-text terms (considering, for example, spelling variants, synonyms, acronyms, truncation and proximity operators).
                  - cell "Inappropriate or inadequate search strategies may fail to identify records that are included in bibliographic databases. Search strategies need to be customized for each database. It is important that MeSH terms are ‘exploded’ wherever appropriate, in order not to miss relevant articles. The same principle applies to Emtree when searching Embase and also to a number of other databases. The controlled vocabulary search terms for MEDLINE and Embase are not identical, and neither is the approach to indexing. In order to be as comprehensive as possible, it is necessary to include a wide range of free-text terms for each of the concepts selected. This might include the use of truncation and wildcards. Developing a search strategy is an iterative process in which the terms that are used are modified, based on what has already been retrieved." [ref=e829]
            - heading "4.4.5 Language, date and document format restrictions#section-4-4-5" [level=3] [ref=e830]
            - paragraph [ref=e831]:
              - text: Searches should capture as many studies as possible that meet the eligibility criteria, ensuring that relevant time periods and sources are covered and not restricted by language or publication status (see
              - link "MECIR Box 4.3.a" [ref=e832] [cursor=pointer]:
                - /url: "#mecir-box-4.3.a"
              - text: ). Review authors should justify the use of any restrictions in the search strategy on publication date and publication format (see
              - link "MECIR Box 4.4.d" [ref=e833] [cursor=pointer]:
                - /url: "#mecir-box-4.4.d"
              - text: ).
            - paragraph [ref=e834]:
              - text: To reduce the risk of introducing bias, searches should not be restricted by language. By including all languages, conservative search strategies avoid the risk of excluding study records with missing, inconsistent, or incorrect values in their metadata (
              - link "Aali and Shokraneh 2021" [ref=e835] [cursor=pointer]:
                - /url: "#_ENREF_1"
              - text: ). It has also been argued that, when language restrictions are justified, these should not be imposed by limiting the search but by including language as an eligibility criterion during study selection (
              - link "Pieper and Puljak 2021" [ref=e836] [cursor=pointer]:
                - /url: "#_ENREF_216"
              - text: ). Recommendations for rapid reviews searches to limit publication language to English and add other languages only when justified (
              - link "Garritty et al 2021" [ref=e837] [cursor=pointer]:
                - /url: "#_ENREF_102"
              - text: ) are supported by evidence that excluding studies published in languages other than English does not change the conclusions of most systematic reviews (
              - link "Morrison et al 2012" [ref=e838] [cursor=pointer]:
                - /url: "#_ENREF_191"
              - text: ","
              - link "Jiao et al 2013" [ref=e839] [cursor=pointer]:
                - /url: "#_ENREF_147"
              - text: ","
              - link "Hartling et al 2017" [ref=e840] [cursor=pointer]:
                - /url: "#_ENREF_124"
              - text: ","
              - link "Nussbaumer-Streit et al 2020" [ref=e841] [cursor=pointer]:
                - /url: "#_ENREF_205"
              - text: ","
              - link "Dobrescu et al 2021" [ref=e842] [cursor=pointer]:
                - /url: "#_ENREF_70"
              - text: ). However, exceptions that studies published in languages other than English do influence review findings have been observed for complementary and alternative medicine (
              - link "Moher et al 2003" [ref=e843] [cursor=pointer]:
                - /url: "#_ENREF_190"
              - text: ","
              - link "Pham et al 2005" [ref=e844] [cursor=pointer]:
                - /url: "#_ENREF_215"
              - text: ","
              - link "Wu et al 2013" [ref=e845] [cursor=pointer]:
                - /url: "#_ENREF_289"
              - text: ), psychiatry, rheumatology and orthopaedics (
              - link "Egger et al 2003" [ref=e846] [cursor=pointer]:
                - /url: "#_ENREF_78"
              - text: ).
            - paragraph [ref=e847]:
              - text: Studies have identified a risk of introducing bias by including lower quality trials published in languages other than English in systematic reviews (
              - link "Jüni et al 2002" [ref=e848] [cursor=pointer]:
                - /url: "#_ENREF_149"
              - text: ","
              - link "Egger et al 2003" [ref=e849] [cursor=pointer]:
                - /url: "#_ENREF_78"
              - text: ), but similar evaluations found only minor quality differences between reports of trials published in English and those published in languages other than English (
              - link "Moher et al 2003" [ref=e850] [cursor=pointer]:
                - /url: "#_ENREF_190"
              - text: ). Additionally, when searches are limited to English or to databases containing only English-language articles, there is a risk that eligible studies may be missed from countries where a particular intervention of interest is more common (e.g. traditional Chinese medicines) (
              - link "Pilkington et al 2005" [ref=e851] [cursor=pointer]:
                - /url: "#_ENREF_217"
              - text: ","
              - link "Morrison et al 2012" [ref=e852] [cursor=pointer]:
                - /url: "#_ENREF_191"
              - text: ). Searches restricted to English-language databases or trials registers may also fail to retrieve all eligible study records of drug interventions (indexing bias) or those reporting negative results (
              - link "Jia et al 2020" [ref=e853] [cursor=pointer]:
                - /url: "#_ENREF_146"
              - text: ). For further discussion of these issues see
              - link "Chapter 13" [ref=e854] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-13
              - text: .
            - paragraph [ref=e855]:
              - text: Particularly when resources and time are available, the inclusion of studies published in languages other than English in systematic reviews is recommended to minimize the risk of language or indexing bias (
              - link "Egger et al 1997" [ref=e856] [cursor=pointer]:
                - /url: "#_ENREF_76"
              - text: ","
              - link "Pilkington et al 2005" [ref=e857] [cursor=pointer]:
                - /url: "#_ENREF_217"
              - text: ","
              - link "Morrison et al 2012" [ref=e858] [cursor=pointer]:
                - /url: "#_ENREF_191"
              - text: ","
              - link "Jia et al 2020" [ref=e859] [cursor=pointer]:
                - /url: "#_ENREF_146"
              - text: ). Consequently, Cochrane author teams should plan at the protocol stage not to restrict the search by language (see
              - link "MECIR Box 4.3.a" [ref=e860] [cursor=pointer]:
                - /url: "#mecir-box-4.3.a"
              - text: ) and to consider searching databases and trials registers published in languages other than English. If warranted, author teams should engage a medical/healthcare librarian or information specialist who is capable of designing and executing search strategies in these sources.
            - paragraph [ref=e861]:
              - text: If a Cochrane review team requires help with translation of or data extraction from reports of studies published in languages other than English, they should seek assistance to do so (this is a common task for which volunteer assistance can be sought
              - link "via Cochrane Engage" [ref=e862] [cursor=pointer]:
                - /url: https://engage.cochrane.org/
              - text: (previously known as Cochrane’s TaskExchange platform), accessible to both Cochrane and non-Cochrane review teams. Where it is not possible to extract the relevant information and data from reports published in languages other than English, readers should be informed of the existence of other possibly relevant reports by adding such reports to ‘studies awaiting classification’ rather than ‘excluded studies’. This information should be reflected in the PRISMA flow diagram (or, if there is no flow diagram, then in the text of the review) as ‘studies awaiting classification’.
            - paragraph [ref=e863]:
              - text: Date limits may be used to focus searches (
              - link "Cooper et al 2018c" [ref=e864] [cursor=pointer]:
                - /url: "#_ENREF_56"
              - text: ) as long as the restriction is reported and justified (
              - link "Egger et al 2003" [ref=e865] [cursor=pointer]:
                - /url: "#_ENREF_78"
              - text: ) (see
              - link "MECIR Box 4.4.d" [ref=e866] [cursor=pointer]:
                - /url: "#mecir-box-4.4.d"
              - text: ). Further use of a supportive narrative may help explain why a particular date restriction was applied (
              - link "Craven and Levay 2011" [ref=e867] [cursor=pointer]:
                - /url: "#_ENREF_64"
              - text: ","
              - link "Cooper et al 2018a" [ref=e868] [cursor=pointer]:
                - /url: "#_ENREF_54"
              - text: ). For example, a database date restriction of 1989-current for a review of nurse-led community training of epinephrine autoinjectors is justified because this is the approval date of the first device (
              - link "Center for Drug Evaluation and Research 1989" [ref=e869] [cursor=pointer]:
                - /url: "#_ENREF_40"
              - text: ). A date limit may be safely applied in this case as any references published before this date would not meet the review’s selection criteria.
            - paragraph [ref=e870]:
              - text: While evidence supports that arbitrary date restrictions (e.g. last 20 years) have little impact on the results for rapid reviews of diagnostic test accuracy studies (
              - link "Furuya-Kanamori et al 2023" [ref=e871] [cursor=pointer]:
                - /url: "#_ENREF_101"
              - text: ), other research demonstrated comparative effect size changes due to date limits in systematic reviews (
              - link "Marshall et al 2018b" [ref=e872] [cursor=pointer]:
                - /url: "#_ENREF_178"
              - text: ). Given a potential loss of data from eligible studies, the application of arbitrary date limits is not recommended for Cochrane systematic reviews of interventions.
            - paragraph [ref=e873]: Caution should be exercised when designing database search strategies with date restrictions. Information specialists should be aware of the various date fields available from database providers (e.g. create date, entry date, last update date, publication date) as well as the coverage dates of the datafiles searched. It may be necessary to search additional sources or datafiles to ensure adequate coverage of the date period of interest for the review. To account for inconsistent publication dates in database records (e.g. a record for an electronic version of a publication may have an earlier publication date than the print version), search strategies should be restricted to a wider date range than the period of interest for the review.
            - paragraph [ref=e874]:
              - text: As any information about an eligible study may contain valuable details for analysis, document format restrictions should not be applied to systematic review searches. For example, excluding letters is not recommended because letters may contain important additional information relating to an earlier trial report or new information about a trial not reported elsewhere (
              - link "Iansavichene et al 2008" [ref=e875] [cursor=pointer]:
                - /url: "#_ENREF_138"
              - text: ). In addition, articles indexed as ‘Comments’ should not be routinely excluded without further examination as these may contain early warnings of possible future retraction (see Section
              - link "4.4.6" [ref=e876] [cursor=pointer]:
                - /url: "#section-4-4-6"
              - text: ).
            - paragraph [ref=e877]:
              - text: As with comments and letters, preprints (versions of scientific articles that precede formal peer review and publication in a journal) should also be considered a potentially relevant source of study evidence, particularly for emerging topics where little evidence exists. Recent and widespread availability of preprints has resulted from an urgent demand for emerging evidence during the COVID-19 pandemic (
              - link "Gianola et al 2020" [ref=e878] [cursor=pointer]:
                - /url: "#_ENREF_106"
              - text: ","
              - link "Kirkham et al 2020" [ref=e879] [cursor=pointer]:
                - /url: "#_ENREF_154"
              - text: ","
              - link "Callaway 2021" [ref=e880] [cursor=pointer]:
                - /url: "#_ENREF_37"
              - text: ","
              - link "Fraser et al 2021" [ref=e881] [cursor=pointer]:
                - /url: "#_ENREF_100"
              - text: ). Recent studies (
              - link "Zeraatkar et al 2022" [ref=e882] [cursor=pointer]:
                - /url: "#_ENREF_294"
              - text: ","
              - link "Davidson et al 2023" [ref=e883] [cursor=pointer]:
                - /url: "#_ENREF_66"
              - text: ) indicated that there was no compelling evidence that preprints provide results that are inconsistent with published articles. As study data are often reported in multiple publications and may be reported differently in each (
              - link "Oikonomidi et al 2020" [ref=e884] [cursor=pointer]:
                - /url: "#_ENREF_207"
              - text: ), efforts to identify all reports for eligible studies, regardless of publication format, are necessary to support subsequent stages of the review process to select, assess and analyse complete study data.
            - paragraph [ref=e885]:
              - text: However, practical problems have been observed with regard to including preprints in systematic or rapid reviews. These problems include limited search features or download capabilities of preprint archives (
              - link "Hoy 2020" [ref=e886] [cursor=pointer]:
                - /url: "#_ENREF_134"
              - text: ","
              - link "Brietzke et al 2023" [ref=e887] [cursor=pointer]:
                - /url: "#_ENREF_31"
              - text: ), difficulties reporting reproducible strategies (
              - link "Brietzke et al 2023" [ref=e888] [cursor=pointer]:
                - /url: "#_ENREF_31"
              - text: ), and challenges incorporating different versions of preprints and their final publications (
              - link "Clyne et al 2021" [ref=e889] [cursor=pointer]:
                - /url: "#_ENREF_47"
              - text: ). Comparison studies of preprints and their peer-reviewed publications have also revealed differences in authorship, reported funding and conflicts of interests (
              - link "Itani et al 2022" [ref=e890] [cursor=pointer]:
                - /url: "#_ENREF_144"
              - text: ). As pertinent study information may be reported in peer-reviewed publications and missing from the preprint references, searches should be conducted prior to manuscript completion for peer-reviewed references of any included preprint studies.
            - paragraph [ref=e891]:
              - text: Similarly, search limits should not be applied to exclude articles published in presumed ‘predatory journals’. The direction of bias associated with non-inclusion of studies published in predatory journals depends on whether they are publishing valid studies with null results or studies whose results are biased towards finding an effect (see
              - link "Chapter 7" [ref=e892] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-07
              - text: ) (
              - link "Boulos et al 2022" [ref=e893] [cursor=pointer]:
                - /url: "#_ENREF_26"
              - text: ).
            - paragraph [ref=e894]:
              - text: Further evidence-based information about language, date and other limits can be found on the
              - link "SuRe Info portal" [ref=e895] [cursor=pointer]:
                - /url: https://sites.google.com/york.ac.uk/sureinfo
              - text: ", which is updated twice per year ("
              - link "Isojarvi and Glanville 2021" [ref=e896] [cursor=pointer]:
                - /url: "#_ENREF_143"
              - text: ). Assistance with designing strategies in preprint servers is available via
              - link "this updated syntax table" [ref=e897] [cursor=pointer]:
                - /url: https://lib.uvic.ca/preprintsearchsyntax
              - text: from the University of Victoria, Canada.
            - paragraph [ref=e898]:
              - strong [ref=e899]: MECIR Box 4.4.d
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e900]:
              - rowgroup [ref=e901]:
                - 'row "C35: Restricting database searches (Mandatory)" [ref=e902]':
                  - 'cell "C35: Restricting database searches (Mandatory)" [ref=e903]':
                    - emphasis [ref=e904]:
                      - text: C35
                      - strong [ref=e905]: ":"
                    - text: Restricting database searches (
                    - strong [ref=e906]: Mandatory
                    - text: )
                - row "Justify the use of any restrictions in the search strategy on publication date and publication format. Date restrictions in the search should only be used when there are date restrictions in the eligibility criteria for studies. They should be applied only if it is known that relevant studies could only have been reported during a specific time period, for example if the intervention was only available after a certain time point. Searches for updates to reviews might naturally be restricted by date of entry into the database (rather than date of publication) to avoid duplication of effort. Publication format restrictions (e.g. exclusion of letters) should generally not be used in Cochrane reviews, since any information about an eligible study may be of value." [ref=e907]:
                  - cell "Justify the use of any restrictions in the search strategy on publication date and publication format." [ref=e908]:
                    - emphasis [ref=e909]: Justify the use of any restrictions in the search strategy on publication date and publication format.
                  - cell "Date restrictions in the search should only be used when there are date restrictions in the eligibility criteria for studies. They should be applied only if it is known that relevant studies could only have been reported during a specific time period, for example if the intervention was only available after a certain time point. Searches for updates to reviews might naturally be restricted by date of entry into the database (rather than date of publication) to avoid duplication of effort. Publication format restrictions (e.g. exclusion of letters) should generally not be used in Cochrane reviews, since any information about an eligible study may be of value." [ref=e910]
            - heading "4.4.6 Identifying fraudulent studies, other retracted publications, errata and comments#section-4-4-6" [level=3] [ref=e911]
            - paragraph [ref=e912]:
              - emphasis [ref=e913]: For further details on this topic, please refer to Section 3.9 of the online
              - link "Technical Supplement" [ref=e914] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - emphasis [ref=e915]: Technical Supplement
              - emphasis [ref=e916]: .
            - paragraph [ref=e917]:
              - text: When considering the eligibility of studies for inclusion in a Cochrane review, it is important to be aware that publications for some studies may have been found to contain errors or to be fraudulent or may, for other reasons, have been corrected, retracted or had expressions of concern associated with them since publication. Review authors should examine any relevant retraction notices and errata for information (
              - link "MECIR Box 4.4.e" [ref=e918] [cursor=pointer]:
                - /url: "#mecir-box-4.4.e"
              - text: ). This applies both to ‘new’ studies identified for inclusion in a review and to studies that are already included in a review when the review is updated. For review updates, it is important to search MEDLINE and Embase for the latest version of the citations to the records for the (previously) included studies, in case the publications have since been corrected or retracted.
            - paragraph [ref=e919]:
              - text: Errata are published to correct unintended errors (accepted as errors by the author(s)) that do not invalidate the conclusions of the article. Retractions are defined by the Committee on Publication Ethics (COPE) Council’s retraction guidelines (
              - link "Committee on Publication Ethics (COPE) Council 2019" [ref=e920] [cursor=pointer]:
                - /url: "#_ENREF_52"
              - text: ) as “… a mechanism for correcting the literature and alerting readers to articles that contain such seriously flawed or erroneous content or data that their findings and conclusions cannot be relied upon. Unreliable content or data may result from honest error, naïve mistakes, or research misconduct.” Recent studies have shown that scientific misconduct was the most common reason for retractions, specifically duplication, plagiarism and fabrication of data (
              - link "Gaudino et al 2021" [ref=e921] [cursor=pointer]:
                - /url: "#_ENREF_104"
              - text: ","
              - link "Kohl and Faggion 2024" [ref=e922] [cursor=pointer]:
                - /url: "#_ENREF_157"
              - text: ) and that systematic reviews and guidelines were often not corrected to take into account retractions of publications relating to the included studies (
              - link "Kataoka et al 2022" [ref=e923] [cursor=pointer]:
                - /url: "#_ENREF_151"
              - text: ","
              - link "Bakker et al 2024" [ref=e924] [cursor=pointer]:
                - /url: "#_ENREF_12"
              - text: ). Comments are published under a range of circumstances including when errors are suggested by others and also for early concerns regarding suspected misconduct. The US National Library of Medicine, in its
              - link "MeSH Scope Note" [ref=e925] [cursor=pointer]:
                - /url: https://www.ncbi.nlm.nih.gov/mesh/?term=Expression+of+Concern
              - text: ", defines expression of concern as: “A notification about the integrity of a published article that is typically written by an editor and should be labelled prominently in the item title.”"
            - paragraph [ref=e926]:
              - text: Including data from studies that are fraudulent or studies that include errors can have an impact on the overall estimates in systematic reviews. There is an increasing awareness of the importance of not including in systematic reviews studies for which one or more publications has/have been retracted, or those with significant errata and how best to avoid this (
              - link "Royle and Waugh 2004" [ref=e927] [cursor=pointer]:
                - /url: "#_ENREF_232"
              - text: ","
              - link "Wright and McDaid 2011" [ref=e928] [cursor=pointer]:
                - /url: "#_ENREF_288"
              - text: ","
              - link "Decullier et al 2014" [ref=e929] [cursor=pointer]:
                - /url: "#_ENREF_68"
              - text: ","
              - link "Fanelli et al 2022" [ref=e930] [cursor=pointer]:
                - /url: "#_ENREF_91"
              - text: ","
              - link "Bakker et al 2023" [ref=e931] [cursor=pointer]:
                - /url: "#_ENREF_13"
              - text: ","
              - link "Khademizadeh et al 2023" [ref=e932] [cursor=pointer]:
                - /url: "#_ENREF_153"
              - text: ","
              - link "Bakker et al 2024" [ref=e933] [cursor=pointer]:
                - /url: "#_ENREF_12"
              - text: ). Studies have also shown that retractions can decrease the inclusion of such studies in systematic reviews (
              - link "Mott et al 2019" [ref=e934] [cursor=pointer]:
                - /url: "#_ENREF_192"
              - text: ). The retracted status of articles on journal websites and in bibliographic databases, however, is not always consistently displayed (
              - link "Suelzer et al 2021" [ref=e935] [cursor=pointer]:
                - /url: "#_ENREF_264"
              - text: ). A recent study, however, showed that even when review authors suspect research misconduct, including data falsification, in the trials that they are considering including in their systematic reviews, they do not always report it (
              - link "Elia et al 2016" [ref=e936] [cursor=pointer]:
                - /url: "#_ENREF_81"
              - text: ). Details of how to identify fraudulent studies, other retracted publications, errata, comments, and expressions of concern are described in the online
              - link "Technical Supplement" [ref=e937] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: . Cochrane holds a
              - link "policy for managing potentially problematic studies" [ref=e938] [cursor=pointer]:
                - /url: https://www.cochranelibrary.com/cdsr/editorial-policies#problematic-studies
              - text: and provides associated
              - link "implementation guidance" [ref=e939] [cursor=pointer]:
                - /url: https://www.cochranelibrary.com/cdsr/editorial-policies/problematic-studies-implementation-guidance
              - text: .
            - paragraph [ref=e940]:
              - strong [ref=e941]: MECIR Box 4.4.e
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e942]:
              - rowgroup [ref=e943]:
                - 'row "C48: Examining errata (Mandatory)" [ref=e944]':
                  - 'cell "C48: Examining errata (Mandatory)" [ref=e945]':
                    - emphasis [ref=e946]:
                      - text: C48
                      - strong [ref=e947]: ":"
                    - text: Examining errata (
                    - strong [ref=e948]: Mandatory
                    - text: )
                - row "Examine any relevant retraction statements and errata for information. Some studies may have been found to be fraudulent or may have been retracted since publication for other reasons. Errata can reveal important limitations, or even fatal flaws, in included studies. All of these may lead to the potential exclusion of a study from a review or meta-analysis. Care should be taken to ensure that this information is retrieved in all database searches by downloading the appropriate fields, together with the citation data." [ref=e949]:
                  - cell "Examine any relevant retraction statements and errata for information." [ref=e950]:
                    - emphasis [ref=e951]: Examine any relevant retraction statements and errata for information.
                  - cell "Some studies may have been found to be fraudulent or may have been retracted since publication for other reasons. Errata can reveal important limitations, or even fatal flaws, in included studies. All of these may lead to the potential exclusion of a study from a review or meta-analysis. Care should be taken to ensure that this information is retrieved in all database searches by downloading the appropriate fields, together with the citation data." [ref=e952]
            - heading "4.4.7 Search filters#section-4-4-7" [level=3] [ref=e953]
            - paragraph [ref=e954]:
              - emphasis [ref=e955]: For further details on this topic, please refer to Section 3.6 of the online
              - link "Technical Supplement" [ref=e956] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
                - emphasis [ref=e957]: Technical Supplement
              - emphasis [ref=e958]: and its subsections.
            - paragraph [ref=e959]:
              - text: Search filters are search strategies that are designed to retrieve specific types of records, such as those of a particular methodological design. When searching for randomized trials in humans, a validated filter should be used to identify studies with the appropriate design (see
              - link "MECIR Box 4.4.f" [ref=e960] [cursor=pointer]:
                - /url: "#mecir-box-4.4.f"
              - text: ). Filters to identify randomized trials for CENTRAL have been developed specifically for databases such as MEDLINE, Embase and CINAHL Plus. CENTRAL, however, aims to contain only reports with study designs possibly relevant for inclusion in Cochrane reviews, so searches of CENTRAL should not use a trials ‘filter’ or be limited to human studies. The Cochrane MEDLINE and Embase highly sensitive filters are provided here for ease of access; there are also launch links for them on the ISSG Search Filter Resource website (
              - link "https://sites.google.com/a/york.ac.uk/issg-search-filters-resource/home/rcts" [ref=e961] [cursor=pointer]:
                - /url: https://sites.google.com/a/york.ac.uk/issg-search-filters-resource/home/rcts
              - text: ). The online
              - link "Technical Supplement" [ref=e962] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04-technical-supplement-searching-and-selecting-studies
              - text: has other filters including the balanced sensitivity and precision filters for MEDLINE.
