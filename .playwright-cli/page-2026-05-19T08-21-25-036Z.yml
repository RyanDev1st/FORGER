            - paragraph [ref=e324]
            - heading "7.2.3.1 Selective publication of study reports#section-7-2-3-1" [level=4] [ref=e325]
            - paragraph [ref=e326]: There is convincing evidence that the publication of a study report is influenced by the nature and direction of its results (Chan et al 2014). Direct empirical evidence of such selective publication (or ‘publication bias’) is obtained from analysing a cohort of studies in which there is a full accounting of what is published and unpublished (Franco et al 2014). Schmucker and colleagues analysed the proportion of published studies in 39 cohorts (including 5112 studies identified from research ethics committees and 12,660 studies identified from trials registers) (Schmucker et al 2014). Only half of the studies were published, and studies with statistically significant results were more likely to be published than those with non-significant results (odds ratio (OR) 2.8; 95% confidence interval (CI) 2.2 to 3.5) (Schmucker et al 2014). Similar findings were observed by Scherer and colleagues, who conducted a systematic review of 425 studies that explored subsequent full publication of research initially presented at biomedical conferences (Scherer et al 2018). Only 37% of the 307,028 abstracts presented at conferences were published later in full (60% for randomized trials), and abstracts with statistically significant results in favour of the experimental intervention (versus results in favour of the comparator intervention) were more likely to be published in full (OR 1.17; 95% CI 1.07 to 1.28) (Scherer et al 2018). By examining a cohort of 164 trials submitted to the FDA for regulatory approval, Rising and colleagues found that trials with favourable results were more likely than those with unfavourable results to be published (OR 4.7; 95% CI 1.33 to 17.1) (Rising et al 2008).
            - paragraph [ref=e327]: In addition to being more likely than unpublished randomized trials to have statistically significant results, published trials also tend to report larger effect estimates in favour of the experimental intervention than trials disseminated elsewhere (e.g. in conference abstracts, theses, books or government reports) (ratio of odds ratios 0.90; 95% CI 0.82 to 0.98) (Dechartres et al 2018). This bias has been observed in studies in many scientific disciplines, including the medical, biological, physical and social sciences (Polanin et al 2016, Fanelli et al 2017).
            - heading "7.2.3.2 Other types of selective dissemination of study reports#section-7-2-3-2" [level=4] [ref=e328]
            - paragraph [ref=e329]: The length of time between completion of a study and publication of its results can be influenced by the nature and direction of the study results (‘time-lag bias’). Several studies suggest that randomized trials with results that favour the experimental intervention are published in journals about one year earlier on average than trials with unfavourable results (Hopewell et al 2007, Urrutia et al 2016).
            - paragraph [ref=e330]: Investigators working in a non-English speaking country may publish some of their work in local, non-English language journals, which may not be indexed in the major biomedical databases (‘language bias’). It has long been assumed that investigators are more likely to publish positive studies in English-language journals than in local, non-English language journals (Morrison et al 2012). Contrary to this belief, Dechartres and colleagues identified larger intervention effects in randomized trials published in a language other than English than in English (ratio of odds ratios 0.86; 95% CI 0.78 to 0.95), which the authors hypothesized may be related to the higher risk of bias observed in the non-English language trials (Dechartres et al 2018). Several studies have found that in most cases there were no major differences between summary estimates of meta-analyses restricted to English-language studies compared with meta-analyses including studies in languages other than English (Morrison et al 2012, Dechartres et al 2018).
            - paragraph [ref=e331]: The number of times a study report is cited appears to be influenced by the nature and direction of its results (‘citation bias’). In a meta-analysis of 21 methodological studies, Duyx and colleagues observed that articles with statistically significant results were cited 1.57 times the rate of articles with non-significant results (rate ratio 1.57; 95% CI 1.34 to 1.83) (Duyx et al 2017). They also found that articles with results in a positive direction (regardless of their statistical significance) were cited at 2.14 times the rate of articles with results in a negative direction (rate ratio 2.14; 95% CI 1.29 to 3.56) (Duyx et al 2017). In an analysis of 33,355 studies across all areas of science, Fanelli and colleagues found that the number of citations received by a study was positively correlated with the magnitude of effects reported (Fanelli et al 2017). If positive studies are more likely to be cited, they may be more likely to be located, and thus more likely to be included in a systematic review.
            - paragraph [ref=e332]: Investigators may report the results of their study across multiple publications; for example, Blümle and colleagues found that of 807 studies approved by a research ethics committee in Germany from 2000 to 2002, 135 (17%) had more than one corresponding publication (Blümle et al 2014). Evidence suggests that studies with statistically significant results or larger treatment effects are more likely to lead to multiple publications (‘multiple (duplicate) publication bias’) (Easterbrook et al 1991, Tramèr et al 1997), which makes it more likely that they will be located and included in a meta-analysis.
            - paragraph [ref=e333]: Research suggests that the accessibility or level of indexing of journals is associated with effect estimates in trials (‘location bias’). For example, a study of 61 meta-analyses found that trials published in journals indexed in Embase but not MEDLINE yielded smaller effect estimates than trials indexed in MEDLINE (ratio of odds ratios 0.71; 95% CI 0.56 to 0.90); however, the risk of bias due to not searching Embase may be minor, given the lower prevalence of Embase-unique trials (Sampson et al 2003). Also, Moher and colleagues estimate that 18,000 biomedical research studies are tucked away in ‘predatory’ journals, which actively solicit manuscripts and charge publications fees without providing robust editorial services (such as peer review and archiving or indexing of articles) (Moher et al 2017). The direction of bias associated with non-inclusion of studies published in predatory journals depends on whether they are publishing valid studies with null results or studies whose results are biased towards finding an effect.
            - heading "7.2.3.3 Selective dissemination of study results#section-7-2-3-3" [level=4] [ref=e334]
            - paragraph [ref=e335]:
              - text: The need to compress a substantial amount of information into a few journal pages, along with a desire for the most noteworthy findings to be published, can lead to omission from publication of results for some outcomes because of the nature and direction of the findings. Particular results may not be reported at all (
              - strong [ref=e336]: ‘selective non-reporting of results’
              - text: ) or be reported incompletely (
              - strong [ref=e337]: ‘selective under-reporting of results’
              - text: ", e.g. stating only that “P>0.05” rather than providing summary statistics or an effect estimate and measure of precision) (Kirkham et al 2010). In such instances, the data necessary to include the results in a meta-analysis are unavailable. Excluding such studies from the synthesis ignores the information that no significant difference was found, and biases the synthesis towards finding a difference (Schmid 2016)."
            - paragraph [ref=e338]: Evidence of selective non-reporting and under-reporting of results in randomized trials has been obtained by comparing what was pre-specified in a trial protocol with what is available in the final trial report. In two landmark studies, Chan and colleagues found that results were not reported for at least one benefit outcome in 71% of randomized trials in one cohort (Chan et al 2004a) and 88% in another (Chan et al 2004b). Results were under-reported (e.g. stating only that “P>0.05”) for at least one benefit outcome in 92% of randomized trials in one cohort and 96% in another. Statistically significant results for benefit outcomes were twice as likely as non-significant results to be completely reported (range of odds ratios 2.4 to 2.7) (Chan et al 2004a, Chan et al 2004b). Reviews of studies investigating selective non-reporting and under-reporting of results suggest that it is more common for outcomes defined by trialists as secondary rather than primary (Jones et al 2015, Li et al 2018).
            - paragraph [ref=e339]: Selective non-reporting and under-reporting of results occurs for both benefit and harm outcomes. Examining the studies included in a sample of 283 Cochrane reviews, Kirkham and colleagues suspected that 50% of 712 studies with results missing for the primary benefit outcome of the review were missing because of the nature of the results (Kirkham et al 2010). This estimate was slightly higher (63%) in 393 studies with results missing for the primary harm outcome of 322 systematic reviews (Saini et al 2014).
            - heading "7.3 General procedures for risk-of-bias assessment#section-7-3" [level=2] [ref=e340]
            - heading "7.3.1 Collecting information for assessment of risk of bias#section-7-3-1" [level=3] [ref=e341]
            - paragraph [ref=e342]:
              - text: Information for assessing the risk of bias can be found in several sources, including published articles, trials registers, protocols, clinical study reports (i.e. documents prepared by pharmaceutical companies, which provide extensive detail on trial methods and results), and regulatory reviews (see also
              - link "Chapter 5, Section 5.2" [ref=e343] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-05#section-5-2
              - text: ).
            - paragraph [ref=e344]: Published articles are the most frequently used source of information for assessing risk of bias. This source is theoretically very valuable because it has been reviewed by editors and peer reviewers, who ideally will have prompted authors to report their methods transparently. However, the completeness of reporting of published articles is, in general, quite poor, and essential information for assessing risk of bias is frequently missing. For example, across 20,920 randomized trials included in 2001 Cochrane reviews, the percentage of trials at unclear risk of bias was 49% for random sequence generation, 57% for allocation sequence concealment; 31% for blinding and 25% for incomplete outcome data (Dechartres et al 2017). Nevertheless, more recent trials were less likely to be judged at unclear risk of bias, suggesting that reporting is improving over time (Dechartres et al 2017).
            - paragraph [ref=e345]:
              - text: Trials registers can be a useful source of information to obtain results of studies that have not yet been published (Riveros et al 2013). However, registers typically report only limited information about methods used in the trial to inform an assessment of risk of bias (Wieseler et al 2012). Protocols, which outline the objectives, design, methodology, statistical consideration and procedural aspects of a clinical study, may provide more detailed information on the methods used than that provided in the results report of a study. They are increasingly being published or made available by journals who publish the final report of a study. Protocols are also available in some trials registers, particularly
              - link "ClinicalTrials.gov" [ref=e346] [cursor=pointer]:
                - /url: https://clinicaltrials.gov/
              - text: (Zarin et al 2016), on websites dedicated to data sharing such as
              - link "ClinicalStudyDataRequest.com" [ref=e347] [cursor=pointer]:
                - /url: https://clinicalstudydatarequest.com/
              - text: ", or from drug regulatory authorities such as the European Medicines Agency. Clinical study reports are another highly useful source of information (Wieseler et al 2012, Jefferson et al 2014)."
            - paragraph [ref=e348]:
              - strong [ref=e349]: It may be necessary to contact study investigators
              - text: "to request access to the trial protocol, to clarify incompletely reported information or understand discrepant information available in different sources. To reduce the risk that study authors provide overly positive answers to questions about study design and conduct, we suggest review authors use open-ended questions. For example, to obtain information about the randomization process, review authors might consider asking: ‘What process did you use to assign each participant to an intervention?’ To obtain information about blinding of participants, it might be useful to request something like, ‘Please describe any measures used to ensure that trial participants were unaware of the intervention to which they were assigned’. More focused questions can then be asked to clarify remaining uncertainties."
            - heading "7.3.2 Performing assessments of risk of bias#section-7-3-2" [level=3] [ref=e350]
            - paragraph [ref=e351]:
              - text: Risk-of-bias assessments in Cochrane reviews should be performed
              - strong [ref=e352]: independently by at least two people
              - text: (
              - link "MECIR Box 7.3.a" [ref=e353] [cursor=pointer]:
                - /url: "#mecir-box-7-3-a"
              - text: ). Doing so can minimize errors in assessments and ensure that the judgement is not influenced by a single person’s preconceptions. Review authors should also define in advance the process for resolving disagreements. For example, both assessors may attempt to resolve disagreements via discussion, and if that fails, call on another author to adjudicate the final judgement. Review authors assessing risk of bias should have either content or methodological expertise (or both), and an adequate understanding of the relevant methodological issues addressed by the risk-of-bias tool. There is some evidence that intensive, standardized training may significantly improve the reliability of risk-of-bias assessments (da Costa et al 2017). To improve reliability of assessments, a review team could consider piloting the risk-of-bias tool on a sample of articles. This may help ensure that criteria are applied consistently and that consensus can be reached. Three to six papers should provide a suitable sample for this. We do not recommend the use of statistical measures of agreement (such as kappa statistics) to describe the extent to which assessments by multiple authors were the same. It is more important that reasons for any disagreement are explored and resolved.
            - paragraph [ref=e354]:
              - strong [ref=e355]: MECIR Box 7.3.a
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e356]:
              - rowgroup [ref=e357]:
                - 'row "C53: Assessing risk of bias in duplicate (Mandatory)" [ref=e358]':
                  - 'cell "C53: Assessing risk of bias in duplicate (Mandatory)" [ref=e359]':
                    - emphasis [ref=e360]: "C53:"
                    - text: Assessing risk of bias in duplicate (
                    - strong [ref=e361]: Mandatory
                    - text: )
                - row "Use (at least) two people working independently to apply the risk-of-bias tool to each result in each included study, and define in advance the process for resolving disagreements. Duplicating the risk-of-bias assessment reduces both the risk of making mistakes and the possibility that assessments are influenced by a single person’s biases." [ref=e362]:
                  - cell "Use (at least) two people working independently to apply the risk-of-bias tool to each result in each included study, and define in advance the process for resolving disagreements." [ref=e363]:
                    - emphasis [ref=e364]: Use (at least) two people working independently to apply the risk-of-bias tool to each result in each included study, and define in advance the process for resolving disagreements.
                  - cell "Duplicating the risk-of-bias assessment reduces both the risk of making mistakes and the possibility that assessments are influenced by a single person’s biases." [ref=e365]
            - paragraph [ref=e366]:
              - text: The process for reaching risk-of-bias judgements should be transparent. In other words, readers should be able to discern why a particular result was rated at low risk of bias and why another was rated at high risk of bias. This can be achieved by review authors providing information in risk-of-bias tables to justify the judgement made. Such information may include direct quotes from study reports that articulate which methods were used, and an explanation for why such a method is flawed. Cochrane review authors are expected to record the source of information (including the precise location within a document) that informed each risk-of-bias judgement (
              - link "MECIR Box 7.3.b" [ref=e367] [cursor=pointer]:
                - /url: "#mecir-box-7-3-b"
              - text: ).
            - paragraph [ref=e368]:
              - strong [ref=e369]: MECIR Box 7.3.b
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e370]:
              - rowgroup [ref=e371]:
                - 'row "C54: Supporting judgements of risk of bias (Mandatory)" [ref=e372]':
                  - 'cell "C54: Supporting judgements of risk of bias (Mandatory)" [ref=e373]':
                    - emphasis [ref=e374]: "C54:"
                    - text: Supporting judgements of risk of bias (
                    - strong [ref=e375]: Mandatory
                    - text: )
                - row "Justify judgements of risk of bias (high, low and some concerns) and provide this information in the risk-of-bias tables (as ‘Support for judgement’). Providing support for the judgement makes the process transparent." [ref=e376]:
                  - cell "Justify judgements of risk of bias (high, low and some concerns) and provide this information in the risk-of-bias tables (as ‘Support for judgement’)." [ref=e377]:
                    - emphasis [ref=e378]: Justify judgements of risk of bias (high, low and some concerns) and provide this information in the risk-of-bias tables (as ‘Support for judgement’).
                  - cell "Providing support for the judgement makes the process transparent." [ref=e379]
                - 'row "C55: Providing sources of information for risk-of-bias assessments (Mandatory)" [ref=e380]':
                  - 'cell "C55: Providing sources of information for risk-of-bias assessments (Mandatory)" [ref=e381]':
                    - emphasis [ref=e382]: "C55:"
                    - text: Providing sources of information for risk-of-bias assessments (
                    - strong [ref=e383]: Mandatory
                    - text: )
                - row "Collect the source of information for each risk-of-bias judgement (e.g. quotation, summary of information from a trial report, correspondence with investigator, etc). Where judgements are based on assumptions made on the basis of information provided outside publicly available documents, this should be stated. Readers, editors and referees should have the opportunity to see for themselves from where supports for judgements have been obtained." [ref=e384]:
                  - cell "Collect the source of information for each risk-of-bias judgement (e.g. quotation, summary of information from a trial report, correspondence with investigator, etc). Where judgements are based on assumptions made on the basis of information provided outside publicly available documents, this should be stated." [ref=e385]:
                    - emphasis [ref=e386]: Collect the source of information for each risk-of-bias judgement (e.g. quotation, summary of information from a trial report, correspondence with investigator, etc). Where judgements are based on assumptions made on the basis of information provided outside publicly available documents, this should be stated.
                  - cell "Readers, editors and referees should have the opportunity to see for themselves from where supports for judgements have been obtained." [ref=e387]
            - paragraph [ref=e388]:
              - text: Many results are often available in trial reports, so review authors should think carefully about which results to assess for risk of bias. Review authors should assess risk of bias in results for outcomes that are included in the ‘Summary of findings’ table (
              - link "MECIR Box 7.1.a" [ref=e389] [cursor=pointer]:
                - /url: "#mecir-box-7-1-a"
              - text: ). Such tables typically include seven or fewer patient-important outcomes (for more details on constructing a ‘Summary of findings’ table, see
              - link "Chapter 14" [ref=e390] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14
              - text: ).
            - paragraph [ref=e391]: Novel methods for assessing risk of bias are emerging, including machine learning systems designed to semi-automate risk-of-bias assessment (Marshall et al 2016, Millard et al 2016). These methods involve using a sample of previous risk-of-bias assessments to train machine learning models to predict risk of bias from PDFs of study reports, and extract supporting text for the judgements. Some of these approaches showed good performance for identifying relevant sentences to identify information pertinent to risk of bias from the full-text content of research articles describing clinical trials. A study showed that about one-third of articles could be assessed by just one reviewer if such a tool is used instead of the two required reviewers (Millard et al 2016). However, reliability in reaching judgements about risk of bias compared with human reviewers was slight to moderate depending on the domain assessed (Gates et al 2018).
            - heading "7.4 Presentation of assessment of risk of bias#section-7-4" [level=2] [ref=e392]
            - paragraph [ref=e393]:
              - text: Risk-of-bias assessments may be presented in a Cochrane review in various ways. A full risk-of-bias table includes responses to each signalling question within each domain (see
              - link "Chapter 8, Section 8.2" [ref=e394] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-08#section-8-2
              - text: ) and risk-of-bias judgements, along with text to support each judgement. Such full tables are lengthy and are unlikely to be of great interest to readers, so should generally not be included in the main body of the review. It is nevertheless good practice to make these full tables available for reference.
            - paragraph [ref=e395]:
              - text: We recommend the use of forest plots that present risk-of-bias judgements alongside the results of each study included in a meta-analysis (see
              - link "Figure 7.4.a" [ref=e396] [cursor=pointer]:
                - /url: "#figure-7-4-a"
              - text: ). This will give a visual impression of the relative contributions of the studies at different levels of risk of bias, especially when considered in combination with the weight given to each study. This may assist authors in reaching overall conclusions about the risk of bias of the synthesized result, as discussed in Section
              - link "7.6" [ref=e397] [cursor=pointer]:
                - /url: "#section-7-6"
              - text: . Optionally, forest plots or other tables or graphs can be ordered (stratified) by judgements on each risk-of-bias domain or by the overall risk-of-bias judgement for each result.
            - paragraph [ref=e398]: Review authors may wish to generate bar graphs illustrating the relative contributions of studies with each of risk-of-bias judgement (low risk of bias, some concerns, and high risk of bias). When dividing up a bar into three regions for this purpose, it is preferable to determine the regions according to statistical information (e.g. precision, or weight in a meta-analysis) arising from studies in each category, rather than according to the number of studies in each category.
            - paragraph [ref=e399]:
              - strong [ref=e400]: Figure 7.4.a
              - text: Forest plot displaying RoB 2 risk-of-bias judgements for each randomized trial included in a meta-analysis of mental health first aid (MHFA) knowledge scores. Adapted from Morgan et al 2018.
            - generic [ref=e401]: Image
            - heading "7.5 Summary assessments of risk of bias#section-7-5" [level=2] [ref=e402]
            - paragraph [ref=e403]:
              - text: Review authors should make explicit summary judgements about the risk of bias for important results both within studies and across studies (see
              - link "MECIR Box 7.5.a" [ref=e404] [cursor=pointer]:
                - /url: "#mecir-box-7-5-a"
              - text: ). The tools currently recommended by Cochrane for assessing risk of bias within included studies (RoB 2 and ROBINS-I) produce an overall judgement of risk of bias for the result being assessed. These overall judgements are derived from assessments of individual bias domains as described, for example, in
              - link "Chapter 8, Section 8.2" [ref=e405] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-08#section-8-2
              - text: .
            - paragraph [ref=e406]:
              - text: To summarize risk of bias across study results in a synthesis, review authors should follow guidance for assessing certainty in the body of evidence (e.g. using GRADE), as described in
              - link "Chapter 14, Section 14.2.2" [ref=e407] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14#section-14-2-2
              - text: . When a meta-analysis is dominated by study results at high risk of bias, the certainty of the body of evidence may be rated as being lower than if such studies were excluded from the meta-analysis. Section
              - link "7.6" [ref=e408] [cursor=pointer]:
                - /url: "#section-7-6"
              - text: discusses some possible courses of action that may be preferable to retaining such studies in the synthesis.
            - paragraph [ref=e409]:
              - strong [ref=e410]: MECIR Box 7.5.a
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e411]:
              - rowgroup [ref=e412]:
                - 'row "C56: Summarizing risk-of-bias assessments (Highly desirable)" [ref=e413]':
                  - 'cell "C56: Summarizing risk-of-bias assessments (Highly desirable)" [ref=e414]':
                    - emphasis [ref=e415]: "C56:"
                    - text: Summarizing risk-of-bias assessments (
                    - strong [ref=e416]: Highly desirable
                    - text: )
                - row "Summarize the risk of bias for each key outcome for each study. This reinforces the link between the characteristics of the study design and their possible impact on the results of the study, and is an important prerequisite for the GRADE approach to assessing the certainty of the body of evidence." [ref=e417]:
                  - cell "Summarize the risk of bias for each key outcome for each study." [ref=e418]:
                    - emphasis [ref=e419]: Summarize the risk of bias for each key outcome for each study.
                  - cell "This reinforces the link between the characteristics of the study design and their possible impact on the results of the study, and is an important prerequisite for the GRADE approach to assessing the certainty of the body of evidence." [ref=e420]
            - paragraph [ref=e421]
            - heading "7.6 Incorporating assessment of risk of bias into analyses#section-7-6" [level=2] [ref=e422]
            - heading "7.6.1 Introduction#section-7-6-1" [level=3] [ref=e423]
            - paragraph [ref=e424]:
              - text: When performing and presenting meta-analyses, review authors should address risk of bias in the results of included studies (
              - link "MECIR Box 7.6.a" [ref=e425] [cursor=pointer]:
                - /url: "#mecir-box-7-6-a"
              - text: ). It is not appropriate to present analyses and interpretations while ignoring flaws identified during the assessment of risk of bias. In this section we present suitable strategies for addressing risk of bias in results from studies included in a meta-analysis, either in order to understand the impact of bias or to determine a suitable estimate of intervention effect (Section
              - link "7.6.2" [ref=e426] [cursor=pointer]:
                - /url: "#section-7-6-2"
              - text: ). For the latter, decisions often involve a trade-off between bias and precision. A meta-analysis that includes all eligible studies may produce a result with high precision (narrow confidence interval) but be seriously biased because of flaws in the conduct of some of the studies. However, including only the studies at low risk of bias in all domains assessed may produce a result that is unbiased but imprecise (if there are only a few studies at low risk of bias).
            - paragraph [ref=e427]:
              - strong [ref=e428]: MECIR Box 7.6.a
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e429]:
              - rowgroup [ref=e430]:
                - 'row "C57: Addressing risk of bias in the synthesis (Highly desirable)" [ref=e431]':
                  - 'cell "C57: Addressing risk of bias in the synthesis (Highly desirable)" [ref=e432]':
                    - emphasis [ref=e433]: "C57:"
                    - text: Addressing risk of bias in the synthesis (
                    - strong [ref=e434]: Highly desirable
                    - text: )
                - row "Address risk of bias in the synthesis (whether quantitative or non-quantitative). For example, present analyses stratified according to summary risk of bias, or restricted to studies at low risk of bias. Review authors should consider how study biases affect results. This is useful in determining the strength of conclusions and how future research should be designed and conducted." [ref=e435]:
                  - cell "Address risk of bias in the synthesis (whether quantitative or non-quantitative). For example, present analyses stratified according to summary risk of bias, or restricted to studies at low risk of bias." [ref=e436]:
                    - emphasis [ref=e437]: Address risk of bias in the synthesis (whether quantitative or non-quantitative). For example, present analyses stratified according to summary risk of bias, or restricted to studies at low risk of bias.
                  - cell "Review authors should consider how study biases affect results. This is useful in determining the strength of conclusions and how future research should be designed and conducted." [ref=e438]
                - 'row "C58: Incorporating assessments of risk of bias (Mandatory)" [ref=e439]':
                  - 'cell "C58: Incorporating assessments of risk of bias (Mandatory)" [ref=e440]':
                    - emphasis [ref=e441]: "C58:"
                    - text: Incorporating assessments of risk of bias (
                    - strong [ref=e442]: Mandatory
                    - text: )
                - row "If randomized trials have been assessed using one or more tools in addition to the RoB 2 tool, use the RoB 2 tool as the primary assessment of bias for interpreting results, choosing the primary analysis, and drawing conclusions. For consistency of approach across Cochrane reviews of Interventions, the RoB 2 tool should take precedence when two or more tools are used for assessing risk of bias in randomized trials. The RoB 2 tool also feeds directly into the GRADE approach for assessing the certainty of the body of evidence." [ref=e443]:
                  - cell "If randomized trials have been assessed using one or more tools in addition to the RoB 2 tool, use the RoB 2 tool as the primary assessment of bias for interpreting results, choosing the primary analysis, and drawing conclusions." [ref=e444]:
                    - text: If randomized trials have been assessed using one or more tools in addition to the RoB 2 tool
                    - emphasis [ref=e445]: ", use the RoB 2 tool as the primary assessment of bias for interpreting results, choosing the primary analysis, and drawing conclusions."
                  - cell "For consistency of approach across Cochrane reviews of Interventions, the RoB 2 tool should take precedence when two or more tools are used for assessing risk of bias in randomized trials. The RoB 2 tool also feeds directly into the GRADE approach for assessing the certainty of the body of evidence." [ref=e446]
            - paragraph [ref=e447]
            - heading "7.6.2 Including risk-of-bias assessments in analyses#section-7-6-2" [level=3] [ref=e448]
            - paragraph [ref=e449]: Broadly speaking, studies at high risk of bias should be given reduced weight in meta-analyses compared with studies at low risk of bias. However, methodological approaches for weighting studies according to their risk of bias are not sufficiently well developed that they can currently be recommended for use in Cochrane reviews.
            - paragraph [ref=e450]: When risks of bias vary across studies in a meta-analysis, four broad strategies are available to incorporate assessments into the analysis. The choice of strategy will influence which result to present as the main finding for a particular outcome (e.g. in the Abstract). The intended strategy should be described in the protocol for the review.
            - heading "(1) Primary analysis restricted to studies at low risk of bias#a-1-primary-analysis-restricted-to-studies-at-low-risk-of-bias" [level=5] [ref=e451]
            - paragraph [ref=e452]:
              - text: The first approach involves restricting the primary analysis to studies judged to be at low risk of bias overall. Review authors who restrict their primary analysis in this way are encouraged to perform
              - strong [ref=e453]: sensitivity analyses
              - text: to show how conclusions might be affected if studies at a high risk of bias were included.
            - heading "(2) Present multiple (stratified) analyses#a-2-present-multiple-stratified-analyses" [level=5] [ref=e454]
            - paragraph [ref=e455]: "Stratifying according to the overall risk of bias will produce multiple estimates of the intervention effect: for example, one based on all studies, one based on studies at low risk of bias, and one based on studies at high risk of bias. Two or more such estimates might be considered with equal prominence (e.g. the first and second of these). However, presenting the results in this way may be confusing for readers. In particular, people who need to make a decision usually require a single estimate of effect. Furthermore, ‘Summary of findings’ tables typically present only a single result for each outcome. On the other hand, a stratified forest plot presents all the information transparently. Though we would generally recommend stratification is done on the basis of overall risk of bias, review authors may choose to conduct subgroup analyses based on specific bias domains (e.g. risk of bias arising from the randomization process)."
            - paragraph [ref=e456]:
              - text: Formal comparisons of intervention effects according to risk of bias can be done with a test for differences across subgroups (e.g. comparing studies at high risk of bias with studies at low risk of bias), or by using meta-regression (for more details see
              - link "Chapter 10, Section 10.11.4" [ref=e457] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-11-4
              - text: ). However, review authors should be cautious in planning and carrying out such analyses, because an individual review may not have enough studies in each category of risk of bias to identify meaningful differences. Lack of a statistically significant difference between studies at high and low risk of bias should not be interpreted as absence of bias, because these analyses typically have low power.
            - paragraph [ref=e458]: The choice between strategies (1) and (2) should be based to large extent on the balance between the potential for bias and the loss of precision when studies at high or unclear risk of bias are excluded.
            - heading "(3) Present all studies and provide a narrative discussion of risk of bias#a-3-present-all-studies-and-provide-a-narrative-discussion-of-risk-of-bias" [level=5] [ref=e459]
            - paragraph [ref=e460]:
              - text: The simplest approach to incorporating risk-of-bias assessments in results is to present an estimated intervention effect based on all available studies, together with a description of the risk of bias in individual domains, or a description of the summary risk of bias, across studies. This is the only feasible option when all studies are at the same risk of bias. However, when studies have different risks of bias, we
              - strong [ref=e461]: discourage
              - text: such an approach for two reasons. First, detailed descriptions of risk of bias in the Results section, together with a cautious interpretation in the Discussion section, will often be lost in the Authors’ conclusions, Abstract and ‘Summary of findings’ table, so that the final interpretation ignores the risk of bias and decisions continue to be based, at least in part, on compromised evidence. Second, such an analysis fails to down-weight studies at high risk of bias and so will lead to an overall intervention effect that is too precise, as well as being potentially biased.
            - paragraph [ref=e462]:
              - text: When the primary analysis is based on all studies, summary assessments of risk of bias should be incorporated into explicit measures of the certainty of evidence for each important outcome, for example, by using the GRADE system (Guyatt et al 2008). This incorporation can help to ensure that judgements about the risk of bias, as well as other factors affecting the quality of evidence, such as imprecision, heterogeneity and publication bias, are considered appropriately when interpreting the results of the review (see
              - link "Chapter 14" [ref=e463] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14
              - text: and
              - link "Chapter 15" [ref=e464] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-15
              - text: ).
            - heading "(4) Adjust effect estimates for bias#a-4-adjust-effect-estimates-for-bias" [level=5] [ref=e465]
            - paragraph [ref=e466]:
              - text: A final, more sophisticated, option is to adjust the result from each study in an attempt to remove the bias. Adjustments are usually undertaken within a Bayesian framework, with assumptions about the size of the bias and its uncertainty being expressed through prior distributions (see
              - link "Chapter 10, Section 10.13" [ref=e467] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-13
              - text: ). Prior distributions may be based on expert opinion or on meta-epidemiological findings (Turner et al 2009, Welton et al 2009). The approach is increasingly used in decision making, where adjustments can additionally be made for applicability of the evidence to the decision at hand. However, we do not encourage use of bias adjustments in the context of a Cochrane review because the assumptions required are strong, limited methodological expertise is available, and it is not possible to account for issues of applicability due to the diverse intended audiences for Cochrane reviews. The approach might be entertained as a sensitivity analysis in some situations.
            - heading "7.7 Considering risk of bias due to missing results#section-7-7" [level=2] [ref=e468]
            - paragraph [ref=e469]:
              - text: The 2011 Cochrane risk-of-bias tool for randomized trials encouraged a study-level judgement about whether there has been selective reporting, in general, of the trial results. As noted in Section
              - link "7.2.3.3" [ref=e470] [cursor=pointer]:
                - /url: "#section-7-2-3-3"
              - text: ", selective reporting can arise in several ways: (1) selective non-reporting of results, where results for some of the analysed outcomes are selectively omitted from a published report; (2) selective under-reporting of data, where results for some outcomes are selectively reported with inadequate detail for the data to be included in a meta-analysis; and (3) bias in selection of the reported result, where a result has been selected for reporting by the study authors, on the basis of the results, from multiple measurements or analyses that have been generated for the outcome domain (Page and Higgins 2016)."
            - paragraph [ref=e471]:
              - text: The RoB 2 and ROBINS-I tools focus solely on risk of bias as it pertains to a specific trial result. With respect to selective reporting, RoB 2 and ROBINS-I examine whether a specific result from the trial is likely to have been selected from multiple possible results on the basis of the findings (scenario 3 above). Guidance on assessing the risk of bias in selection of the reported result is available in
              - link "Chapter 8" [ref=e472] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-08
              - text: (for randomized trials) and
              - link "Chapter 25" [ref=e473] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-25
              - text: (for non-randomized studies of interventions).
            - paragraph [ref=e474]:
              - text: "If there is no result (i.e. it has been omitted selectively from the report or under-reported), then a risk-of-bias assessment at the level of the study result is not applicable. Selective non-reporting of results and selective under-reporting of data are therefore not covered by the RoB 2 and ROBINS-I tools. Instead, selective non-reporting of results and under-reporting of data should be assessed at the level of the synthesis across studies. Both practices lead to a situation similar to that when an entire study report is unavailable because of the nature of the results (also known as publication bias). Regardless of whether an entire study report or only a particular result of a study is unavailable, the same consequence can arise: bias in a synthesis because available results differ systematically from missing results (Page et al 2018)."
              - strong [ref=e475]
              - link "Chapter 13" [ref=e476] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-13
              - text: provides detailed guidance on assessing risk of bias due to missing results in a systematic review.
            - heading "7.8 Considering source of funding and conflict of interest of authors of included studies#section-7-8" [level=2] [ref=e477]
            - paragraph [ref=e478]: Readers of a trial report often need to reflect on whether conflicts of interest have influenced the design, conduct, analysis and reporting of a trial. It is therefore now common for scientific journals to require authors of trial reports to provide a declaration of conflicts of interest (sometimes called ‘competing’ or ‘declarations of’ interest), to report funding sources and to describe any funder’s role in the trial.
            - paragraph [ref=e479]: "In this section, we characterize conflicts of interest in randomized trials and discuss how conflicts of interest may impact on trial design and effect estimates. We also suggest how review authors can collect, process and use information on conflicts of interest in the assessment of:"
            - list [ref=e480]:
              - listitem [ref=e481]: directness of studies to the review’s research question;
              - listitem [ref=e482]: heterogeneity in results due to differences in the designs of eligible studies;
              - listitem [ref=e483]: risk of bias in results of included studies;
              - listitem [ref=e484]: risk of bias in a synthesis due to missing results.
            - paragraph [ref=e485]:
              - text: At the time of writing, a formal Tool for Addressing Conflicts of Interest in Trials (TACIT) is being developed under the auspices of the Cochrane Bias Methods Group. The TACIT development process has informed the content of this section, and we encourage readers to check
              - link "http://tacit.one" [ref=e486] [cursor=pointer]:
                - /url: http://tacit.one
              - text: for more detailed guidance that will become available.
            - heading "7.8.1 Characteristics of conflicts of interest#section-7-8-1" [level=3] [ref=e487]
            - paragraph [ref=e488]:
              - text: The Institute of Medicine defined conflicts of interest as
              - emphasis [ref=e489]: “
              - text: a set of circumstances that creates a risk that professional judgment or actions regarding a primary interest will be unduly influenced by a secondary interest” (Lo et al 2009). In a clinical trial, the primary interest is to provide patients, clinicians and health policy makers with an unbiased and clinically relevant estimate of an intervention effect. Secondary interest may be both financial and non-financial.
            - paragraph [ref=e490]: Financial conflicts of interest involve both financial interests related to a specific trial (for example, a company funding a trial of a drug produced by the same company) and financial interests related to the authors of a trial report (for example, authors’ ownership of stocks or employment by a drug company).
            - paragraph [ref=e491]: For drug and device companies and other manufacturers, the financial difference between a negative and positive pivotal trial can be considerable. For example, the mean stock price of the companies funding 23 positive pivotal oncology trials increased by 14% after disclosure of the results (Rothenstein et al 2011). Industry funding is common, especially in drug trials. In a study of 200 trial publications from 2015, 68 (38%) of 178 trials with funding declarations were industry funded (Hakoum et al 2017). Also, in a cohort of oncology drug trials, industry funded 44% of trials and authors declared conflicts of interest in 69% of trials (Riechelmann et al 2007).
            - paragraph [ref=e492]: The degree of funding, and the type of the involvement of industry funders, may differ across trials. In some situations, involvement includes only the provision of free study medication for a trial that has otherwise been planned and conducted independently, and funded largely, by public means. In other situations, a company fully funds and controls a trial. In rarer cases, head-to-head trials comparing two drugs may be funded by the two different companies producing the drugs.
            - paragraph [ref=e493]: A Cochrane Methodology Review analysed 75 studies of the association between industry funding and trial results (Lundh et al 2017). The authors concluded that trials funded by a drug or device company were more likely to have positive conclusions and statistically significant results, and that this association could not be explained by differences in risk of bias between industry and non-industry funded trials. However, industry and non-industry trials may differ in ways that may confound the association; for example due to choice of patient population, comparator interventions or outcomes. Only one of the included studies used a meta-epidemiological design and found no clear association between industry funding and the magnitude of intervention effects (Als-Nielsen et al 2003). Similar to the association with industry funding, other studies have reported that results of trials conducted by authors with a financial conflict of interest were more likely to be positive (Ahn et al 2017).
            - paragraph [ref=e494]: Conflicts of interest may also be non-financial (Viswanathan et al 2014). Characterizations of non-financial conflicts of interest differ somewhat, but typically distinguish between conflicts related mainly to an individual (e.g. adherence to a theory or ideology), relationships to other individuals (e.g. loyalty to friends, family members or close colleagues), or relationship to groups (e.g. work place or professional groups). In medicine, non-financial conflicts of interest have received less attention than financial conflicts of interest. In addition, financial and non-financial conflicts are often intertwined; for example, non-financial conflicts related to institutional association can be considered as indirect financial conflicts linked to employment. Definitions of what should be characterized as a ‘non-financial’ conflict of interest, and, in particular, whether personal beliefs, experiences or intellectual commitments should be considered conflicts of interest, have been debated (Bero and Grundy 2016).
            - paragraph [ref=e495]: It is useful to differentiate between non-financial conflicts of interest of a trial researcher and the basic interests and hopes involved in doing good trial research. Most researchers conducting a trial will have an interest in the scientific problem addressed, a well-articulated theoretical position, anticipation for a specific trial result, and hopes for publication in a respectable journal. This is not a conflict of interest but a basic condition for doing health research. However, individual researchers may lose sight of the primacy of the methodological neutrality at the heart of a scientific enquiry, and become unduly occupied with the secondary interest of how trial results may affect academic appearance or chances of future funding. Extreme examples are the publication of fabricated trial data or trials, some of which have had an impact on systematic reviews (Marret et al 2009).
            - paragraph [ref=e496]: Few empirical studies of non-financial conflicts of interest in randomized trials have been published, and to our knowledge there are none that assess the impact of non-financial conflicts of interest on trial results and conclusions. However, non-financial conflicts of interests have been investigated in other types of clinical research; for example, guideline authors’ specialty appears to have influenced their voting behaviour while developing guidelines for mammography screening (Norris et al 2012).
            - heading "7.8.2 Conflict of interest and trial design#section-7-8-2" [level=3] [ref=e497]
            - paragraph [ref=e498]: Core decisions on designing a trial involve defining the type of participants to be included, the type of experimental intervention, the type of comparator, the outcomes (and timing of outcome assessments) and the choice of analysis. Such decisions will often reflect a compromise between what is clinically and scientifically ideal and what is practically possible. However, when investigators have important conflicts of interest, a trial may be designed in a way that increases its chances of detecting a positive trial result, at the expense of clinical applicability. For example, narrow eligibility criteria may exclude older and frail patients, thus reducing the possibility of detecting clinically relevant harms. Alternatively, trial designers may choose placebo as a comparator despite an effective intervention being in regular use, or they may focus on short-term surrogate outcomes rather than clinically relevant long-term outcomes (Estellat and Ravaud 2012, Wieland et al 2017).
            - paragraph [ref=e499]:
              - text: Trial design choices may be more subtle. For example, a trial may be designed to favour an experimental drug by using an inferior comparator drug when better alternatives exist (Safer 2002) or by using a low dose of the comparator drug when the focus is efficacy and a high dose of the comparator drug when the focus is harms (Mann and Djulbegovic 2013). In a typical Cochrane review with fairly broad eligibility criteria aiming to identify and summarize all relevant trials, it is pertinent to consider the degree to which a given trial result directly relates to the question posed by the review. If all or most identified trials have narrow eligibility criteria and short-term outcomes, a review question focusing on broad patient categories and long-term effects can only be answered indirectly by the included studies. This has implications for the assessment of the certainty of the evidence provided by the review, which is addressed through the concept of indirectness in the GRADE framework (see
              - link "Chapter 14, Section 14.2" [ref=e500] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14#section-14-2
              - text: ).
            - paragraph [ref=e501]: If results in a meta-analysis display heterogeneity, then differences in design choices that are driven by conflicts of interest may be one reason for this. Thus, conflicts of interest may also affect reflections on the certainty of the evidence through the GRADE concept of inconsistency.
            - heading "7.8.3 Conflicts of interest and risk of bias in a trial’s effect estimate#section-7-8-3" [level=3] [ref=e502]
            - paragraph [ref=e503]:
              - text: Authors of Cochrane reviews have sometimes included conflicts of interest as an ‘other source of bias’ while using the previous versions of the risk-of-bias tool (Jørgensen et al 2016). Consistent with previous versions of the
              - emphasis [ref=e504]: Handbook
              - text: ", we discourage the inclusion of conflicts of interest"
              - emphasis [ref=e505]: directly
              - text: in the risk-of-bias assessment. Adding conflicts of interest to the bias tool is inconsistent with the conceptual structure of the tool, which is built on mechanistically defined bias domains. Also, restricting consideration of the potential impact of conflicts of interest to a question of risk of bias in an individual trial result overlooks other important aspects, such as the design of the trial (see Section
              - link "7.8.2" [ref=e506] [cursor=pointer]:
                - /url: "#section-7-8-2"
              - text: ) and potential bias in a meta-analysis due to missing results (see Section
              - link "7.8.4" [ref=e507] [cursor=pointer]:
                - /url: "#section-7-8-4"
              - text: ).
            - paragraph [ref=e508]: Conflicts of interest may lead to bias in effect estimates from a trial through several mechanisms. For example, if those recruiting participants into a trial have important conflicts of interest and the allocation sequence is not concealed, then they may be more likely to subvert the allocation process to produce intervention groups that are systematically unbalanced in favour of their preferred intervention. Similarly, investigators with important conflicts of interests may decide to exclude from the analysis some patients who did not respond as anticipated to the experimental intervention, resulting in bias due to missing outcome data. Furthermore, selective reporting of a favourable result may be strongly associated with conflicts of interest (McGauran et al 2010), due to either selective reporting of particular outcome measurements or selective reporting of particular analyses (Eyding et al 2010, Vedula et al 2013). One study found that use of modified-intention-to-treat analysis and post-randomization exclusions occurred more often in trials with industry funding or author conflicts of interest (Montedori et al 2011). Accessing the trial protocol and statistical analysis plan to determine which outcomes and analyses were pre-specified is therefore especially important for a trial with relevant conflicts of interest.
            - paragraph [ref=e509]: Review authors should explain how consideration of conflicts of interest informed their risk-of-bias judgements. For example, when information on the analysis plans is lacking, review authors may judge the risk of bias in selection of the reported result to be high if the study investigators had important financial conflicts of interest. Conversely, if trial investigators have clearly used methods that are likely to minimize bias, review authors should not judge the risk of bias for each domain higher just because the investigators happen to have conflicts of interest. In addition, as an optional component in the revised risk-of-bias tool, review authors may reflect on the direction of bias (e.g. bias in favour of the experimental intervention). Information on conflicts of interest may inform the assessment of direction of bias.
            - heading "7.8.4 Conflicts of interest and risk of bias in a synthesis of trial results#section-7-8-4" [level=3] [ref=e510]
            - paragraph [ref=e511]:
              - text: Conflicts of interest may also affect the decision not to report trial results. Conflicts of interest are probably one of several important reasons for decisions not to publish trials with negative findings, and not to publish unfavourable results (Sterne 2013). When relevant trial results are systematically missing from a meta-analysis because of the nature of the findings, the synthesis is at risk of bias due to missing results.
              - link "Chapter 13" [ref=e512] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-13
              - text: provides detailed guidance on assessing risk of bias due to missing results in a systematic review.
            - heading "7.8.5 Practical approach to identifying and extracting information on conflicts of interest#section-7-8-5" [level=3] [ref=e513]
            - paragraph [ref=e514]:
              - text: When assessing conflicts of interest in a trial, review authors will, to a large degree, rely on declared conflicts. Source of funding may be reported in a trial publication, and conflicts of interest may be reported in an accompanying declaration, for example the International Committee of Medical Journal Editors (
              - link "ICMJE" [ref=e515] [cursor=pointer]:
                - /url: http://www.icmje.org/recommendations/browse/publishing-and-editorial-issues/clinical-trial-registration.html
              - text: ) declaration. In a random sample of 1002 articles published in 2016, authors of 229 (23%) declared having a conflict of interest (Grundy et al 2018). Unfortunately, undeclared conflicts of interest and sources of funding are fairly common (Rasmussen et al 2015, Patel et al 2018).
            - paragraph [ref=e516]: It is always prudent to examine closely the conflicts of interest of lead and corresponding authors, based on information reported in the trial publication and the author declaration (for example, the ICMJE declaration form). Review authors should also consider examining conflicts of interest of trial co-authors and any commercial collaborators with conflicts of interest; for example, a commercial contract research organization hired by the funder to collect and analyse trial data or the involvement of a medical writing agency. Due to the high prevalence of undisclosed conflicts of interest, review authors should consider expanding their search for conflicts of interest data from other sources (e.g. disclosure in other publications by the authors, the trial protocol, the clinical study report, and public conflicts of interest registries (e.g. Open Payments database)).
            - paragraph [ref=e517]:
              - text: We suggest that review authors balance the workload involved with the expected gain, and search additional sources of information on conflicts of interest when there is reason to suspect important conflicts of interest
              - emphasis [ref=e518]: .
              - text: As a rule of thumb, in trials with unclear funding source and no declaration of conflicts of interest from lead or corresponding authors, we suggest review authors search the Open Payments database,
              - link "ClinicalTrials.gov" [ref=e519] [cursor=pointer]:
                - /url: https://clinicaltrials.gov/
              - text: ", and conflicts of interest declarations in a few previous publications by the study authors. In trials with no commercial funding (including no company employee co-authors) and no declared conflicts of interest for lead or corresponding authors, we suggest review authors not bother to consult additional sources. Also, for trials where lead or corresponding authors have clear conflicts of interest, little additional information may be gained from checking conflicts of interest of co-authors."
            - paragraph [ref=e520]: Gaining access to relevant information on financial conflicts of interest is possible for a considerable number of trials, despite inherent problems of undeclared conflicts. We expect that the proportion of trials with relevant declarations will increase further.
            - paragraph [ref=e521]: Access to relevant information on non-financial conflicts of interest is more difficult to gain. Declaration of non-financial conflicts of interest is requested by approximately 50% of journals (Shawwa et al 2016). The term was deleted from ICMJE’s declaration in 2010 in exchange for a broad category of “Other relationships or activities” (Drazen et al 2010). Therefore, non-financial conflicts of interests are seldom self-declared, although if available, such information should be considered.
            - paragraph [ref=e522]: Non-financial conflicts of interest are difficult to address due to lack of relevant empirical studies on their impact on study results, lack of relevant thresholds for importance, and lack of declaration in many previous trials. However, as a rule of thumb, we suggest that review authors assume trial authors have no non-financial conflicts of interest unless there are clear suggestions of the opposite. Examples of such clues could be a considerable spin in trial publications (Boutron et al 2010), an institutional relationship pertinent to the intervention tested, or external evidence of a fixated ideological or theoretical position.
            - heading "7.8.6 Judgement of notable concern about conflict of interest#section-7-8-6" [level=3] [ref=e523]
            - paragraph [ref=e524]:
              - text: Review authors should describe funding information and conflicts of interest of authors for all studies in the ‘Characteristics of included studies’ table (
              - link "MECIR Box 7.8.a" [ref=e525] [cursor=pointer]:
                - /url: "#mecir-box-7-8-a"
              - text: ). Also, review authors may want to explore (e.g. in a subgroup analysis) whether trials with conflicts of interest have different intervention effect estimates, or more variable effect estimates, than trials without conflicts of interest. In both cases, review authors need to aim for a relevant threshold for when any conflict of interest is deemed important. If put too low, there is a risk that trivial conflicts of interest will cloud important ones; if set too high, there is the risk that important conflicts of interest are downplayed or ignored.
            - paragraph [ref=e526]: "This judgement should take into account both the degree of conflicts of interest of study authors and also the extent of their involvement in the study. We pragmatically suggest review authors aim for a judgement about whether or not there is reason for ‘notable concern’ about conflicts of interest. This information could be displayed in a table with three columns:"
            - list [ref=e527]:
              - listitem [ref=e528]: trial identifier;
              - listitem [ref=e529]: judgement (e.g. ‘notable concern about conflict of interest’ versus ‘no notable concern about conflict of interest’); and
              - listitem [ref=e530]: rationale for judgement, potentially subdivided according to who had conflicts of interest (e.g. lead or corresponding authors, other authors) and stage(s) of the trial to which they contributed (design, conduct, analysis, reporting).
            - paragraph [ref=e531]: A judgement of ‘notable concern about conflict of interest’ should be based on reflected assessment of identified conflicts of interest. A hypothetical possibility for undeclared conflicts of interest is, as a rule of thumb, not considered sufficient reason for ‘notable concern’. By ‘notable concern’ we imply important conflicts of interest expected to have a potential impact on study design, risk of bias in study results or risk of bias in a synthesis due to missing results. For example, financial conflicts of interest are important in a trial initiated, designed, analysed and reported by drug or device company employees. Conversely, financial conflicts of interest are less important in a trial initiated, designed, analysed and reported by academics adhering to the arm’s length principle when acquiring free trial medication from a drug company, and where lead authors have no conflicts of interest. Similarly, non-financial conflicts of interest may be important in a trial of a highly controversial and ideologically loaded question such as the adverse effect of male circumcision. Non-financial conflicts of interest are less concerning in a trial comparing two treatments in general use with no connotation to highly controversial scientific theories, ideology or professional groups. Mixing trivial conflicts of interest with important ones may mask the latter and will expand review author workload considerably.
            - paragraph [ref=e532]:
              - strong [ref=e533]: MECIR Box 7.8.a
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e534]:
              - rowgroup [ref=e535]:
                - 'row "C59: Addressing conflicts of interest in included trials (Highly desirable)" [ref=e536]':
                  - 'cell "C59: Addressing conflicts of interest in included trials (Highly desirable)" [ref=e537]':
                    - emphasis [ref=e538]: "C59:"
                    - text: Addressing conflicts of interest in included trials (
                    - strong [ref=e539]: Highly desirable
                    - text: )
                - 'row "Address conflict of interests in included trials, and reflect on possible impact on: (a) differences in study design; (b) risk of bias in trial result, and (c) risk of bias in synthesis result. Review authors should consider assessing whether they judge a trial to be of ‘notable concern about conflicts of interest’. This assessment is useful for exploration of possible heterogeneity between trials (e.g. in a subgroup analysis), and for reflection on relevant mechanisms for how conflict of interest may have biased trial results and synthesis results. Concerns about conflicts of interest can be reported in the ‘Characteristics of included studies’ table." [ref=e540]':
                  - 'cell "Address conflict of interests in included trials, and reflect on possible impact on: (a) differences in study design; (b) risk of bias in trial result, and (c) risk of bias in synthesis result." [ref=e541]':
                    - paragraph [ref=e542]:
                      - emphasis [ref=e543]: "Address conflict of interests in included trials, and reflect on possible impact on: (a) differences in study design; (b) risk of bias in trial result, and (c) risk of bias in synthesis result."
                    - paragraph [ref=e544]
                  - cell "Review authors should consider assessing whether they judge a trial to be of ‘notable concern about conflicts of interest’. This assessment is useful for exploration of possible heterogeneity between trials (e.g. in a subgroup analysis), and for reflection on relevant mechanisms for how conflict of interest may have biased trial results and synthesis results. Concerns about conflicts of interest can be reported in the ‘Characteristics of included studies’ table." [ref=e545]
