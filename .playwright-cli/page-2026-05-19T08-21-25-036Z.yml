              - text: A list of the key types of non-reporting biases is provided in
              - link "Table 7.2.a" [ref=e281] [cursor=pointer]:
                - /url: "#table-7-2-a"
              - text: . In the sections that follow, we provide some of the evidence that underlies this list.
            - paragraph [ref=e282]:
              - strong [ref=e283]: Table 7.2.a
