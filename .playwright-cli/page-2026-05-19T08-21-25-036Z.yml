        - article [ref=e194]:
          - generic [ref=e200]:
            - paragraph [ref=e201]: Isabelle Boutron, Matthew J Page, Julian PT Higgins, Douglas G Altman, Andreas Lundh, Asbjørn Hróbjartsson; on behalf of the Cochrane Bias Methods Group
            - heading "Key Points:#a-key-points" [level=5] [ref=e202]
            - list [ref=e203]:
              - listitem [ref=e204]: Review authors should seek to minimize bias. We draw a distinction between two places in which bias should be considered. The first is in the results of the individual studies included in a systematic review. The second is in the result of the meta-analysis (or other synthesis) of findings from the included studies.
              - listitem [ref=e205]: Problems with the design and execution of individual studies of healthcare interventions raise questions about the internal validity of their findings; empirical evidence provides support for this concern.
              - listitem [ref=e206]: An assessment of the internal validity of studies included in a Cochrane review should emphasize the risk of bias in their results, that is, the risk that they will over-estimate or under-estimate the true intervention effect.
              - listitem [ref=e207]: Results of meta-analyses (or other syntheses) across studies may additionally be affected by bias due to the absence of results from studies that should have been included in the synthesis.
              - listitem [ref=e208]: Review authors should consider source of funding and conflicts of interest of authors of the study, which may inform the exploration of directness and heterogeneity of study results, assessment of risk of bias within studies, and assessment of risk of bias in syntheses owing to missing results.
            - paragraph [ref=e209]:
              - text: "Cite this chapter as: Boutron I, Page MJ, Higgins JP, Altman DG, Lundh A, Hróbjartsson A. Chapter 7: Considering bias and conflicts of interest among the included studies [last updated August 2022]. In: Higgins JP, Thomas J, Chandler J, Cumpston M, Li T, Page MJ, et al, editor(s)."
              - emphasis [ref=e210]: Cochrane Handbook for Systematic Reviews of Interventions
              - text: version 6.5. Cochrane, 2024. Available from
              - emphasis [ref=e211]: cochrane.org/handbook
              - text: .
            - heading "7.1 Introduction#section-7-1" [level=2] [ref=e212]
            - paragraph [ref=e213]:
              - text: Cochrane reviews seek to minimize bias. We define bias as a
              - strong [ref=e214]: systematic error
              - text: ", or deviation from the truth, in results. Biases can lead to under-estimation or over-estimation of the true intervention effect and can vary in magnitude: some are small (and trivial compared with the observed effect) and some are substantial (so that an apparent finding may be due entirely to bias). A source of bias may even vary in direction across studies. For example, bias due to a particular design flaw such as lack of allocation sequence concealment may lead to under-estimation of an effect in one study but over-estimation in another (Jüni et al 2001)."
            - paragraph [ref=e215]:
              - text: Bias can arise because of the actions of primary study investigators or because of the actions of review authors, or may be unavoidable due to constraints on how research can be undertaken in practice. Actions of authors can, in turn, be influenced by conflicts of interest. In this chapter we introduce issues of bias in the context of a Cochrane review, covering both biases in the results of included studies and biases in the results of a synthesis. We introduce the general principles of assessing the risk that bias may be present, as well as the presentation of such assessments and their incorporation into analyses. Finally, we address how source of funding and conflicts of interest of study authors may impact on study design, conduct and reporting. Conflicts of interest held by review authors are also of concern; these should be addressed using editorial procedures and are not covered by this chapter (see
              - link "Chapter 1, Section 1.3" [ref=e216] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-01#section-1-3
              - text: ).
            - paragraph [ref=e217]:
              - text: We draw a distinction between two places in which bias should be considered. The first is in the results of the
              - emphasis [ref=e218]: individual studies included in a systematic review
              - text: . Since the conclusions drawn in a review depend on the results of the included studies, if these results are biased, then a meta-analysis of the studies will produce a misleading conclusion. Therefore, review authors should systematically take into account
              - strong [ref=e219]: risk of bias in results of included studies
              - text: when interpreting the results of their review.
            - paragraph [ref=e220]:
              - text: The second place in which bias should be considered is the result of the
              - emphasis [ref=e221]: meta-analysis (or other synthesis) of findings from the included studies
              - text: . This result will be affected by biases in the included studies, and may
              - strong [ref=e222]: additionally
              - text: be affected by bias due to the absence of results from studies that should have been included in the synthesis. Specifically, the conclusions of the review may be compromised when decisions about how, when and where to report results of eligible studies are influenced by the nature and direction of the results. This is the problem of ‘non-reporting bias’ (also described as ‘publication bias’ and ‘selective reporting bias’). There is convincing evidence that results that are statistically non-significant and unfavourable to the experimental intervention are less likely to be published than statistically significant results, and hence are less easily identified by systematic reviews (see Section
              - link "7.2.3" [ref=e223] [cursor=pointer]:
                - /url: "#section-7-2-3"
              - text: ). This leads to results being missing systematically from syntheses, which can lead to syntheses over-estimating or under-estimating the effects of an intervention. For this reason, the assessment of
              - strong [ref=e224]: risk of bias due to missing results
              - text: is another essential component of a Cochrane review.
            - paragraph [ref=e225]:
              - text: Both the risk of bias in included studies and risk of bias due to missing results may be influenced by
              - strong [ref=e226]: conflicts of interest of study investigators or funders
              - text: . For example, investigators with a financial interest in showing that a particular drug works may exclude participants who did not respond favourably to the drug from the analysis, or fail to report unfavourable results of the drug in a manuscript.
            - paragraph [ref=e227]:
              - text: Further discussion of assessing risk of bias in the results of an individual randomized trial is available in
              - link "Chapter 8" [ref=e228] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-08
              - text: ", and of a non-randomized study in"
              - link "Chapter 25" [ref=e229] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-25
              - text: . Further discussion of assessing risk of bias due to missing results is available in
              - link "Chapter 13" [ref=e230] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-13
              - text: .
            - heading "7.1.1 Why consider risk of bias?#section-7-1-1" [level=3] [ref=e231]:
              - text: 7.1.1 Why consider
              - emphasis [ref=e232]: risk
              - text: of bias?#section-7-1-1
            - paragraph [ref=e233]:
              - text: There is good empirical evidence that particular features of the design, conduct and analysis of randomized trials lead to bias on average, and that some results of randomized trials are suppressed from dissemination because of their nature. However, it is usually impossible to know to what extent biases have affected the results of a particular study or analysis (Savović et al 2012). For these reasons, it is more appropriate to consider whether a result is at
              - strong [ref=e234]: risk of bias
              - text: rather than claiming with certainty that it is biased. Most recent tools for assessing the internal validity of findings from quantitative studies in health now focus on risk of bias, whereas previous tools targeted the broader notion of ‘methodological quality’ (see also Section
              - link "7.1.2" [ref=e235] [cursor=pointer]:
                - /url: "#section-7-1-2"
              - text: ).
            - paragraph [ref=e236]:
              - text: Bias should not be confused with
              - strong [ref=e237]: imprecision
              - text: . Bias refers to
              - emphasis [ref=e238]: systematic error
              - text: ", meaning that multiple replications of the same study would reach the wrong answer on average. Imprecision refers to"
              - emphasis [ref=e239]: random error
              - text: ", meaning that multiple replications of the same study will produce different effect estimates because of sampling variation, but would give the right answer on average. Precision depends on the number of participants and (for dichotomous outcomes) the number of events in a study, and is reflected in the confidence interval around the intervention effect estimate from each study. The results of smaller studies are subject to greater sampling variation and hence are less precise. A small trial may be at low risk of bias yet its result may be estimated very imprecisely, with a wide confidence interval. Conversely, the results of a large trial may be precise (narrow confidence interval) but also at a high risk of bias."
            - paragraph [ref=e240]:
              - text: Bias should also not be confused with the
              - strong [ref=e241]: external validity
              - text: of a study, that is, the extent to which the results of a study can be generalized to other populations and settings. For example, a study may enrol participants who are not representative of the population who most commonly experience a particular clinical condition. The results of this study may have limited generalizability to the wider population, but will not necessarily give a biased estimate of the effect in the highly specific population on which it is based. Factors influencing the applicability of an included study to the review question are covered in
              - link "Chapter 14" [ref=e242] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14
              - text: and
              - link "Chapter 15" [ref=e243] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-15
              - text: .
            - heading "7.1.2 From quality scales to domain-based tools#section-7-1-2" [level=3] [ref=e244]
            - paragraph [ref=e245]: Critical assessment of included studies has long been an important component of a systematic review or meta-analysis, and methods have evolved greatly over time. Early appraisal tools were structured as quality ‘scales’, which combined information on several features into a single score. However, this approach was questioned after it was revealed that the type of quality scale used could significantly influence the interpretation of the meta-analysis results (Jüni et al 1999). That is, risk ratios of trials deemed ‘high quality’ by some scales suggested that the experimental intervention was superior, whereas when trials were deemed ‘high quality’ by other scales, the opposite was the case. The lack of a theoretical framework underlying the concept of ‘quality’ assessed by these scales resulted in tools mixing different concepts such as risk of bias, imprecision, relevance, applicability, ethics, and completeness of reporting. Furthermore, the summary score combining these components is difficult to interpret (Jüni et al 2001).
            - paragraph [ref=e246]: "In 2008, Cochrane released the Cochrane risk-of-bias (RoB) tool, which was slightly revised in 2011 (Higgins et al 2011). The tool was built on the following key principles:"
            - list [ref=e247]:
              - listitem [ref=e248]: "The tool focused on a single concept: risk of bias. It did not consider other concepts such as the quality of reporting, precision (the extent to which results are free of random errors), or external validity (directness, applicability or generalizability)."
              - listitem [ref=e249]: "The tool was based on a domain-based (or component) approach, in which different types of bias are considered in turn. Users were asked to assess seven domains: random sequence generation, allocation sequence concealment, blinding of participants and personnel, blinding of outcome assessment, incomplete outcome data, selective outcome reporting, and other sources of bias. There was no scoring system in the tool."
              - listitem [ref=e250]: The domains were selected to characterize mechanisms through which bias may be introduced into a trial, based on a combination of theoretical considerations and empirical evidence.
              - listitem [ref=e251]: The assessment of risk of bias required judgement and should thus be completely transparent. Review authors provided a judgement for each domain, rated as ‘low’, ‘high’ or ‘unclear’ risk of bias, and provided reasons to support their judgement.
            - paragraph [ref=e252]: This tool has been implemented widely both in Cochrane reviews and non-Cochrane reviews (Jørgensen et al 2016). However, user testing has raised some concerns related to the modest inter-rater reliability of some domains (Hartling et al 2013), the need to rethink the theoretical background of the ‘selective outcome reporting’ domain (Page and Higgins 2016), the misuse of the ‘other sources of bias’ domain (Jørgensen et al 2016), and the lack of appropriate consideration of the risk-of-bias assessment in the analyses and interpretation of results (Hopewell et al 2013).
            - paragraph [ref=e253]:
              - text: To address these concerns, a new version of the Cochrane risk-of-bias tool, RoB 2, has been developed, and this should be used for all randomized trials in Cochrane reviews (
              - link "MECIR Box 7.1.a" [ref=e254] [cursor=pointer]:
                - /url: "#mecir-box-7-1-a"
              - text: ). The tool, described in
              - link "Chapter 8" [ref=e255] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-08
              - text: ", includes important innovations in the assessment of risk of bias in randomized trials. The structure of the tool is similar to that of the ROBINS-I tool for non-randomized studies of interventions (described in"
              - link "Chapter 25" [ref=e256] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-25
              - text: ). Both tools include a fixed set of bias domains, which are intended to cover all issues that might lead to a risk of bias. To help reach risk-of-bias judgements, a series of ‘signalling questions’ are included within each domain. Also, the assessment is typically specific to a particular result. This is because the risk of bias may differ depending on how an outcome is measured and how the data for the outcome are analysed. For example, if two analyses for a single outcome are presented, one adjusted for baseline prognostic factors and the other not, then the risk of bias in the two results may be different.
            - paragraph [ref=e257]:
              - strong [ref=e258]: MECIR Box 7.1.a
              - text: Relevant expectations for conduct of intervention reviews
            - table [ref=e259]:
              - rowgroup [ref=e260]:
                - 'row "C52: Assessing risk of bias (Mandatory)" [ref=e261]':
                  - 'cell "C52: Assessing risk of bias (Mandatory)" [ref=e262]':
                    - emphasis [ref=e263]: "C52:"
                    - text: Assessing risk of bias (
                    - strong [ref=e264]: Mandatory
                    - text: )
                - row [ref=e265]:
                  - cell "Assess the risk of bias for each study result contributing to an outcome in the ‘summary of findings’ table. For randomized trials, the RoB 2 tool should be used, involving judgements and support for those judgements across a series of domains of bias, as described in the Handbook." [ref=e266]:
                    - emphasis [ref=e267]: Assess the risk of bias for each study result contributing to an outcome in the ‘summary of findings’ table. For randomized trials, the RoB 2 tool should be used, involving judgements and support for those judgements across a series of domains of bias, as described in the Handbook.
                  - cell [ref=e268]:
                    - text: Risk of bias in individual study results for the included studies should be explicitly considered to determine the extent to which findings of the studies can be believed. Risks of bias might vary by result. It may not be feasible to assess the risk of bias in every single result available across the included studies, particularly if a large number of studies and results are available. Review author should therefore assess risk of bias in the results of outcomes included in their ‘summary of findings’ tables, which present the findings of seven or fewer outcomes that are most important to patients. The RoB 2 tool – as described in the
                    - emphasis [ref=e269]: Handbook
                    - text: – is the preferred tool for all randomized trials in new reviews. The Cochrane Evidence Production and Methods Directorate is, however, aware that there remain challenges in learning and implementation of the tool, and use of the original Cochrane risk of bias tool is acceptable for the time being.
            - paragraph [ref=e270]
            - heading "7.2 Empirical evidence of bias#section-7-2" [level=2] [ref=e271]
            - paragraph [ref=e272]: Where possible, assessments of risk of bias in a systematic review should be informed by evidence. The following sections summarize some of the key evidence about bias that informs our guidance on risk-of-bias assessments in Cochrane reviews.
            - 'heading "7.2.1 Empirical evidence of bias in randomized trials: meta-epidemiologic studies#section-7-2-1" [level=3] [ref=e273]'
            - paragraph [ref=e274]: Many empirical studies have shown that methodological features of the design, conduct and reporting of studies are associated with biased intervention effect estimates. This evidence is mainly based on meta-epidemiologic studies using a large collection of meta-analyses to investigate the association between a reported methodological characteristic and intervention effect estimates in randomized trials. The first meta-epidemiologic study was published in 1995. It showed exaggerated intervention effect estimates when intervention allocation methods were inadequate or unclear and when trials were not described as double-blinded (Schulz et al 1995). These results were subsequently confirmed in several meta-epidemiologic studies, showing that lack of reporting of adequate random sequence generation, allocation sequence concealment, double blinding and more specifically blinding of outcome assessors tend to yield higher intervention effect estimates on average (Dechartres et al 2016a, Page et al 2016).
            - paragraph [ref=e275]: Evidence from meta-epidemiologic studies suggests that the influence of methodological characteristics such as lack of blinding and inadequate allocation sequence concealment varies by the type of outcome. For example, the extent of over-estimation is larger when the outcome is subjectively measured (e.g. pain) and therefore likely to be influenced by knowledge of the intervention received, and lower when the outcome is objectively measured (e.g. death) and therefore unlikely to be influenced by knowledge of the intervention received (Wood et al 2008, Savović et al 2012).
            - heading "7.2.2 Trial characteristics explored in meta-epidemiologic studies that are not considered sources of bias#section-7-2-2" [level=3] [ref=e276]
            - paragraph [ref=e277]: Researchers have also explored the influence of other trial characteristics that are not typically considered a threat to a direct causal inference for intervention effect estimates. Recent meta-epidemiologic studies have shown that effect estimates were lower in prospectively registered trials compared with trials not registered or registered retrospectively (Dechartres et al 2016b, Odutayo et al 2017). Others have shown an association between sample size and effect estimates, with larger effects observed in smaller trials (Dechartres et al 2013). Studies have also shown a consistent association between intervention effect and single or multiple centre status, with single-centre trials showing larger effect estimates, even after controlling for sample size (Dechartres et al 2011).
            - paragraph [ref=e278]: In some of these cases, plausible bias mechanisms can be hypothesized. For example, both the number of centres and sample size may be associated with intervention effect estimates because of non-reporting bias (e.g. single-centre studies and small studies may be more likely to be published when they have larger, statistically significant effects than when they have smaller, non-significant effects); or single-centre and small studies may be subject to less stringent controls and checks. However, alternative explanations are possible, such as differences in factors relating to external validity (e.g. participants in small, single-centre trials may be more homogenous than participants in other trials). Because of this, these factors are not directly captured by the risk-of-bias tools recommended by Cochrane. Review authors should record these characteristics systematically for each study included in the systematic review (e.g. in the ‘Characteristics of included studies’ table) where appropriate. For example, trial registration status should be recorded for all randomized trials identified.
            - heading "7.2.3 Empirical evidence of non-reporting biases#section-7-2-3" [level=3] [ref=e279]
