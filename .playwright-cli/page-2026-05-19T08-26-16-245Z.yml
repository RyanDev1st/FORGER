        - article [ref=e172]:
          - generic [ref=e178]:
            - paragraph [ref=e179]: Miranda Cumpston and Ella Flemyng
            - heading "Key Points:#a-key-points" [level=5] [ref=e180]
            - list [ref=e181]:
              - listitem [ref=e182]: As new studies are completed, the results of reviews may become out of date and thereby provide misleading information to decision makers.
              - listitem [ref=e183]: Cochrane reviews should be assessed periodically to determine whether an update is needed. The decision to update should be based on the continuing importance of the review question to decision makers and the availability of new data or new methods that would have a meaningful impact on the review findings.
              - listitem [ref=e184]: A review update provides an opportunity for the scope, eligibility criteria and methods used in the review to be revised.
              - listitem [ref=e185]: An update should be conducted according to the standards required for any review, with some additional requirements to ensure that any changes are managed appropriately and reported clearly to readers.
            - paragraph [ref=e186]:
              - text: "Cite this chapter as: Cumpston M, Flemyng E. Chapter IV: Updating a review [last updated August 2023]. In: Higgins JP, Thomas J, Chandler J, Cumpston M, Li T, Page MJ, et al, editor(s)."
              - emphasis [ref=e187]: Cochrane Handbook for Systematic Reviews of Interventions
              - text: version 6.5. Cochrane, 2024. Available from
              - emphasis [ref=e188]: cochrane.org/handbook
              - text: .
            - heading "IV.1 Introduction#section-iv-1" [level=2] [ref=e189]
            - paragraph [ref=e190]: Since its inception, Cochrane has sought to maintain its reviews to ensure they are updated to include the most recent evidence. Reviews that are out of date and do not incorporate all the available evidence risk providing misleading information to decision makers and other stakeholders.
            - paragraph [ref=e191]:
              - text: Garner and colleagues define an update as “a new edition of a published systematic review with changes that can include new data, new methods, or new analyses to the previous edition” (Garner et al 2016). Adding new studies and new data can substantively change the findings of the review. Even where the new studies observe results consistent with the existing data, increasing the number of studies can improve precision of effect estimates, demonstrate wider applicability of the effect, or enable additional comparisons or subgroup analyses to be performed. The introduction of new review methods, such as updated risk of bias assessment tools or improved statistical analysis methods, can also change both the results and the certainty of the review’s findings. Examples of the impact of incorporating new information and methods are illustrated in
              - link "Box IV.1.a" [ref=e192] [cursor=pointer]:
                - /url: "#box-iv-1-a"
              - text: .
            - paragraph [ref=e193]:
              - text: All Cochrane reviews should be assessed periodically to determine whether an update is needed. Some areas of research evolve rapidly, whereas others are more stable, and some research questions stop being relevant to decision makers. A report assessing 100 systematic reviews published between 1995 and 2005 concluded the median time to require an update was 5.5 years, although 23% of reviews were out of date within two years, 15% within one year, and 7% were already out of date at the time of publication (Shojania et al 2007). Authors of Cochrane reviews should therefore consider both
              - emphasis [ref=e194]: whether
              - text: an update is warranted, and
              - emphasis [ref=e195]: when
              - text: it will be most beneficial for each specific review (see Section
              - link "IV.2" [ref=e196] [cursor=pointer]:
                - /url: "#section-iv-2"
              - text: ).
            - paragraph [ref=e197]:
              - text: In some areas, authors are establishing
              - link "‘living’ systematic reviews" [ref=e198] [cursor=pointer]:
                - /url: /about-us/news/cochranes-pioneering-role-living-evidence
              - text: that adopt a
              - emphasis [ref=e199]: continual
              - text: updating process, such as monthly searching followed by rapid incorporation of new evidence into the published review. Living systematic reviews are most likely to be appropriate for questions that are of high importance to decision makers, and for which new evidence is likely to be frequently published and to have an important impact on the review’s findings (Elliott et al 2017). Considerable resources are required to support such an ongoing process. Further discussion of living systematic reviews is presented in
              - link "Chapter 22, Section 22.2.3" [ref=e200] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22#section-22-2-3
              - text: .
            - paragraph [ref=e201]:
              - text: Cochrane’s
              - link "Methodological Expectations of Cochrane Intervention Reviews (MECIR)" [ref=e202] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/mecir-manual
              - text: ", which guide the conduct of Cochrane reviews, include expectations for updating reviews. See the online"
              - link "MECIR Manual" [ref=e203] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/mecir-manual
              - text: for the 11 expectations specifically relevant to updates, although updated reviews should also meet the expectations that apply to all reviews. This chapter elaborates on the recommendations for the planning, conduct and reporting of Cochrane review updates.
            - paragraph [ref=e204]:
              - strong [ref=e206]: Box
              - strong [ref=e207]: IV.1.a
              - text: "Examples of what factors might change in an updated systematic review (Garner et al 2016). Reproduced from Garner P, Hopewell S, Chandler J, MacLehose H, Akl EA, Beyene J, et al. When and how to update systematic reviews: consensus and checklist."
              - 'link "BMJ 2016; 354: i3507" [ref=e208] [cursor=pointer]':
                - /url: https://www.bmj.com/content/354/bmj.i3507
                - emphasis [ref=e209]: BMJ
                - text: "2016; 354: i3507"
              - emphasis
              - text: licensed under
              - link "CC BY 3.0" [ref=e210] [cursor=pointer]:
                - /url: https://creativecommons.org/licenses/by/3.0/
              - text: .
            - table [ref=e211]:
              - rowgroup [ref=e212]:
                - row [ref=e213]:
                  - cell [ref=e214]:
                    - list [ref=e215]:
                      - listitem [ref=e216]: A systematic review of steroid treatment in tuberculosis meningitis used GRADE methods and split the composite outcome in the original review of death plus disability into its two components. This improved the clarity of the review’s findings in relation to the effects and the importance of the effects of steroids on death and on disability (Prasad et al 2016).
                      - listitem [ref=e217]: A systematic review of dihydroartemisinin-piperaquine (DHAP) for treating malaria was updated with much more detailed analysis of the adverse effect data from the existing trials as a result of questions raised by the European Medicines Agency. Because the original review included other comparisons, the update required extracting only the DHAP comparisons from the original review, and a modification of the title and the PICO (Zani et al 2014)
                      - listitem [ref=e218]: A systematic review of atorvastatin was updated with simple uncontrolled studies (Adams et al 2012). This update allowed comparisons with trials and strengthened the review findings (Higgins 2012).
            - heading "IV.2 Deciding whether and when to update#section-iv-1" [level=2] [ref=e219]
            - paragraph [ref=e220]:
              - text: The decision to undertake an update of a review requires consideration of a number of different factors. Garner and colleagues conducted an international consensus process to establish good practice guidance for determining when a systematic review should be updated (Garner et al 2016). Their published framework and checklist can assist authors in thinking through these issues in a structured way (see
              - link "Figure IV.2.a" [ref=e221] [cursor=pointer]:
                - /url: "#figure-iv-2-a"
              - text: ).
            - paragraph [ref=e222]:
              - strong [ref=e224]: Figure
              - strong [ref=e225]: IV.2.a
              - text: "Decision framework to assess systematic reviews for updating, with standard terms to report such decisions (Garner et al 2016). Reproduced from Garner P, Hopewell S, Chandler J, MacLehose H, Akl EA, Beyene J, et al. When and how to update systematic reviews: consensus and checklist."
              - 'link "BMJ 2016; 354: i3507" [ref=e226] [cursor=pointer]':
                - /url: https://www.bmj.com/content/354/bmj.i3507
                - emphasis [ref=e227]: BMJ
                - text: "2016; 354: i3507"
              - emphasis [ref=e228]
              - text: licensed under
              - link "CC BY 3.0" [ref=e229] [cursor=pointer]:
                - /url: https://creativecommons.org/licenses/by/3.0/
              - text: .
            - generic [ref=e230]: Image
            - paragraph [ref=e231]:
              - text: When deciding whether to update a particular review, the first consideration should be to determine whether the review question remains relevant to decision makers, and is well-targeted to answer current questions in policy and practice. Knowledge of the particular field will be required to answer this question. Checking whether the existing review is frequently accessed or cited can also be useful to indicate whether there is a need to update. A second aspect to this question is whether the original review was conducted well and used appropriate methods (Garner et al 2016). If the review question remains fundamentally of interest, additions and improvements may be possible to enhance the review’s methods (see Section
              - link "IV.3.4" [ref=e232] [cursor=pointer]:
                - /url: "#section-iv-3-4"
              - text: ). Depending on the changes required, it may be more appropriate to conduct a new review from scratch meeting current standards. A comparison between currently recommended methods and the methods used in the review can identify any important changes required.
            - paragraph [ref=e233]: If the review remains important and is of a sufficient standard, then the next step is to consider whether there are any new studies, newly available information, or newly recommended methods that could be incorporated into the review. The existing version of the review may include details of ongoing studies identified at the time of its publication, for example through searches of trials registers, and these trials may now be complete. Some authors may choose to monitor the literature continually for new studies (e.g. through automated alerts), or may conduct a rapid scoping search for this purpose.
            - paragraph [ref=e234]:
              - text: If either new information or new methodology is available, a critical next step is to evaluate whether incorporating these into the review would be likely to impact on its findings (Garner et al 2016). In some cases, this decision can be very straightforward, for example when the existing reviews findings are considered very uncertain (for example, using the GRADE approach to assessment, see
              - link "Chapter 14" [ref=e235] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14
              - text: ). For some reviews, the findings are of very high certainty, and it is unlikely that new information will meaningfully impact the conclusions. In some cases, maintaining credibility through the incorporation of additional information and new methods is sufficient in itself to warrant updating (Garner et al 2016).
            - paragraph [ref=e236]: In some cases, although the main findings of the review may be unaffected, additional information may shed light on more nuanced effects of different variations on the intervention, different settings, additional outcomes, or population subgroups. In other cases, it may not be clear whether the extent of new information available will be enough to impact meaningfully on the results (Garner et al 2016).
            - paragraph [ref=e237]:
              - text: To date there is no consensus on
              - emphasis [ref=e238]: when
              - text: to update a review (Tsertsvadze et al 2011), although several methods have been proposed (e.g. Sampson et al (2008), Shekelle et al (2011), Tovey et al (2011), Ahmadzai et al (2013), Takwoingi et al (2013)). These methods use signals to indicate the need for an update and the likely impact of new studies on existing conclusions. They include surveillance searches, contact with experts, and quantitative or qualitative assessments, or both.
              - link "Chapter 22, Section 22.2" [ref=e239] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22#section-22-2
              - text: ", outlines a range of methods for surveillance of the literature and the interpretation of signals for updating, including statistical methods based on sample size calculations or the application of prediction equations to assess the impact of new evidence. Garner and colleagues also summarize a series of available methods (Garner et al 2016). Ultimately, review authors should make a judgement based on an individual assessment and their knowledge of the field covered by the review."
            - heading "IV.3 Planning an update#section-iv-3" [level=2] [ref=e240]
            - paragraph [ref=e241]: Before embarking on an updated review, it is important to take the time to plan the process. Any proposed modifications or additions to the existing review should be planned in detail, and on occasion may require drafting a new protocol for the review. In addition, there are several issues unique to updates that should be considered.
            - paragraph [ref=e242]:
              - text: Many of the approaches using new technologies designed to facilitate the review process are intended to support easier and more frequent updates. Further information is available in
              - link "Chapter 4" [ref=e243] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04
              - link ", Section 4.6.6" [ref=e244] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04#section-4-6-6
              - text: ", and"
              - link "Chapter 22" [ref=e245] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22
              - link ", Section 22.2.4" [ref=e246] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22#section-22-2-4
              - text: .
            - paragraph [ref=e247]:
              - text: See the online
              - link "MECIR Manual" [ref=e248] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/mecir-manual
              - text: for expectations relevant to planning an update.
            - heading "IV.3.1 Reconsidering review questions and eligibility criteria#section-iv-3-1" [level=3] [ref=e249]
            - paragraph [ref=e250]:
              - text: Even when the overall review question has been agreed to remain relevant, an update is an opportunity to consider changes to the question and its scope. Authors should reconsider all elements of the review question (PICO), the eligibility criteria, comparisons and outcomes of interest. For example, evolving understanding of the problem may lead to the inclusion of a new comparison, an additional category of patients (e.g. children in addition to adults) or an important new outcome (e.g. adverse effects) that may not have been adequately addressed in the original review. Review authors may also wish to include additional objectives, such as addressing the economic aspects of the intervention or its implementation. Additional engagement with stakeholders may reveal current issues around which there is uncertainty (see
              - link "Chapter 2" [ref=e251] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-02
              - text: ).
            - paragraph [ref=e252]:
              - text: Irrespective of whether the review question(s) change, there may be reason to amend the eligibility criteria for the review (see
              - link "Chapter 3" [ref=e253] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-03
              - text: ). For example, new intervention options may have become available since the publication of the original review. As the number of available studies increases over time, this may also affect decisions about eligibility. For example, if the original review included both randomized trials and non-randomized studies, and the former provide sufficient evidence to answer the review questions, it may be reasonable to decide to exclude non-randomized studies from subsequent updates of the review. Conversely, it may be reasonable to add non-randomized studies to a review that was previously restricted to randomized trials, to widen the evidence base, making use of methodological developments in critical evaluation of the validity of non-randomized studies (see
              - link "Chapter 24" [ref=e254] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-24
              - text: ).
            - heading "IV.3.2 Splitting and merging reviews#section-iv-3-2" [level=3] [ref=e255]
            - paragraph [ref=e256]: As the body of evidence accumulates over time, a review may become too large for authors to manage (some of the largest Cochrane reviews include hundreds of studies across multiple comparisons). It is sometimes appropriate to consider splitting the review into two or more reviews with more narrowly defined questions. For example, an early Cochrane review investigated all interventions for shoulder pain. As this review became large and unwieldy over time, it was split into multiple separate reviews, each looking at an intervention category. One of these reviews looked at physiotherapy interventions for shoulder pain (Green et al 2003). As time went on, this review also became too large to manage, and was split into a number of reviews examining different physiotherapy interventions and specific types of shoulder pain (e.g. Page et al (2014a), Page et al (2014b), Page et al (2016a), Page et al (2016b)).
            - paragraph [ref=e257]:
              - text: Narrower reviews may allow deeper investigation of specific intervention types, and more focused information for stakeholders, and may distribute the updating burden between several review author teams. On the other hand, narrower reviews can sometimes prevent readers from considering findings across all the interventions relevant to a decision (see
              - link "Chapter 2, Section 2.3" [ref=e258] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-02#section-2-3
              - text: ). Overviews of Reviews are an alternative option, allowing authors to summarize several more narrowly defined reviews that may have been split from a larger review (see
              - link "Chapter V" [ref=e259] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-v
              - text: ).
            - paragraph [ref=e260]:
              - text: It is also possible for one or more narrower Cochrane reviews to be merged into a larger review, where agreed by all authors that this would present a more useful synthesis for decision makers. For example, it might be concluded that a network meta-analysis to compare multiple intervention options for a particular condition would be more useful than an existing series of separate reviews of specific interventions (see
              - link "Chapter 11" [ref=e261] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-11
              - text: ).
            - heading "IV.3.3 Planning the search strategy for an update#section-iv-3-3" [level=3] [ref=e262]
            - paragraph [ref=e263]: Once the scope and eligibility criteria for the update have been agreed, authors will prepare for an update by deciding on the appropriate search process and strategy.
            - paragraph [ref=e264]: A starting point for identifying new studies for inclusion may be those already identified as ongoing studies at the time of the existing version of the review. Following this, in some cases, the search strategy can be re-run as specified in the existing review, with the addition of date limits set to the period following the most recent search. However, an information specialist or healthcare librarian should be consulted to ensure the strategy remains appropriate. Changes to electronic databases, their access mechanisms and controlled vocabulary can require expert amendments to the search strategies. In addition, informed by the experience of the search for the original review, a decision may be made to modify the list of sources to be searched or search terms to be used (Garner et al 2016).
            - paragraph [ref=e265]: If important changes to the PICO for the review or the eligibility criteria have been made since the original search, or developments in the field have led to the emergence of new terms to be added to the search, it may be necessary to re-run parts of the search back to the earliest records, to ensure that any records relevant to new search terms were not missed in the original search.
            - heading "IV.3.4 Planning the methods for an update#section-iv-3-4" [level=3] [ref=e266]
            - paragraph [ref=e267]: Methodological advances in systematic review conduct since publication of the original review may result in a need to revise or extend the methods of the review update (Shea et al 2006). Authors are encouraged to consult current guidance on review methods and compare these with the methods used in the existing review to identify important changes.
            - paragraph [ref=e268]: "Examples of situations in which review methodology might be updated include:"
            - list [ref=e269]:
              - listitem [ref=e270]:
                - text: incorporating updated guidance on risk of bias assessment (see
                - link "Chapter 7" [ref=e271] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-07
                - text: and
                - link "Chapter 8" [ref=e272] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-08
                - text: );
              - listitem [ref=e273]:
                - text: using a new synthesis strategy, such as an improved method to perform a random-effects meta-analysis (see
                - link "Chapter 10" [ref=e274] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10
                - text: ), or alternative methods for synthesis where meta-analysis is not possible (see
                - link "Chapter 12" [ref=e275] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-12
                - text: ).
              - listitem [ref=e276]:
                - text: incorporating GRADE assessments and ‘Summary of findings’ tables if not already included (see
                - link "Chapter 14" [ref=e277] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14
                - text: ); and
              - listitem [ref=e278]:
                - text: adopting new guidance on the structure and presentation of findings, such as structured tabulation of results or alternative methods for visual presentation of results in reviews where meta-analysis is not used (see
                - link "Chapter 12" [ref=e279] [cursor=pointer]:
                  - /url: /authors/handbooks-and-manuals/handbook/current/chapter-12
                - text: ).
            - paragraph [ref=e280]: Changes to the scope of the review, such as expansion to include different study designs or outcome data, will require planning for new methods appropriate to the data expected.
            - paragraph [ref=e281]:
              - strong [ref=e282]: Where changes to the review methods are substantive, authors are encouraged to write a complete, updated protocol to guide the conduct of the review update
              - text: . In some cases, it may be more appropriate to consider the work as a new review, rather than an update.
            - paragraph [ref=e283]:
              - text: Specific methods developed for systematic reviews that conduct ongoing and prospective approaches to accumulating evidence to maintain review currency are outlined in
              - link "Chapter 22" [ref=e284] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22
              - text: . Formal sequential statistical methods that aim to address errors associated with repeating meta-analyses over time have been developed. However, such approaches are explicitly discouraged for updated meta-analyses in Cochrane reviews, except in the context of a prospectively planned series of primary research studies (see
              - link "Chapter 22, Section 22.4" [ref=e285] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22#section-22-4
              - text: ).
            - heading "IV.3.5 Incorporating feedback and comments#section-iv-3-5" [level=3] [ref=e286]
            - paragraph [ref=e287]:
              - text: Updating a published review provides an opportunity to consider any
              - link "feedback or comments" [ref=e288] [cursor=pointer]:
                - /url: https://www.cochranelibrary.com/cdsr/comments-submission
              - text: submitted to Cochrane or directly to the authors. Review authors are expected to be responsive to comments on their reviews, in the spirit of the scientific process and publication ethics. Comments may represent valid concerns and can usefully identify additional studies that were overlooked by the review authors.
            - heading "IV.4 Conducting an update#section-iv-4" [level=2] [ref=e289]
            - paragraph [ref=e290]:
              - text: An update of a review should be conducted according to the protocol, as closely as possible to the methods of the existing review while incorporating any planned changes (see Section
              - link "IV.3" [ref=e291] [cursor=pointer]:
                - /url: "#section-iv-3"
              - text: ). All steps should be conducted in accordance with the guidance presented throughout this
              - emphasis [ref=e292]: Handbook
              - text: .
            - paragraph [ref=e293]:
              - text: A systematic search should be conducted for new studies (see
              - link "Chapter 4" [ref=e294] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04
              - text: ), and the date of the search should be within 12 months of publication of the update. If new, potentially relevant studies are found, they should be assessed for inclusion in the review according to the eligibility criteria. If the existing review included records of any ongoing studies that are now complete, or studies for which classification as included or excluded was pending, newly available information should be sought and, where possible, final inclusion decisions made.
            - paragraph [ref=e295]:
              - text: If new studies are to be included in the updated review, data should be collected (see
              - link "Chapter 5" [ref=e296] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-05
              - text: ) and risk of bias assessments completed for all new studies (see
              - link "Chapter 7" [ref=e297] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-07
              - text: ). On a practical note, when changes have been made to the scope or PICO of the review, tools such as the original data collection forms may need to be altered or extended and piloted again to ensure they are fit for purpose. This may also be needed if new software tools are to be used for data collection, or if a new author team has taken on the review, although existing templates and forms may be available from the original review authors or repositories such as the
              - link "Systematic Review Data Repository" [ref=e298] [cursor=pointer]:
                - /url: https://www.ahrq.gov/cpi/about/otherwebsites/srdr.ahrq.gov/index.html
              - text: .
            - paragraph [ref=e299]:
              - text: The findings of any new studies should be integrated into the synthesis of the review (see
              - link "Chapter 10" [ref=e300] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-10
              - text: ","
              - link "Chapter 11" [ref=e301] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-11
              - text: ", and"
              - link "Chapter 12" [ref=e302] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-12
              - text: ), and GRADE assessments completed (or revised), taking full account of the new body of evidence (see
              - link "Chapter 14" [ref=e303] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-14
              - text: ).
            - paragraph [ref=e304]:
              - text: If no new studies are found to be included in the review, authors should complete and publish the updated review (see Section
              - link "IV.5" [ref=e305] [cursor=pointer]:
                - /url: "#section-iv-5"
              - text: ). While not modifying the findings, including the details of an updated search will reassure readers and decision makers of the currency of the review.
            - paragraph [ref=e306]:
              - text: See the online
              - link "MECIR Manual" [ref=e307] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/mecir-manual
              - text: for expectations relevant to conducting an update.
            - heading "IV.4.1 Updating data from previously included studies#section-iv-4-1" [level=3] [ref=e308]
            - paragraph [ref=e309]: Since the time of publication, additional information may be available about one or more studies included in the existing review. For example, additional outcome data measured at later time points may now be available, or the study may have been corrected or retracted due to errors, fraud or a range of other reasons. It is important to search online journals or databases such as MEDLINE (if the study is indexed there) for any notifications, corrections or retractions.
            - paragraph [ref=e310]:
              - text: Any additions or corrections should be incorporated into the information contained in the review, if relevant. The reasons for retraction of any included studies should be considered. In addition to the publication record, this information may be available in reports of investigations, such as by the authors’ institutions or funders. In those cases where data appear to be incorrect or possibly fabricated, they should be removed from the review analysis and this decision should be reported in the review. Other studies by the same author(s) which would also be eligible for inclusion should be checked for similar issues, and a decision made as to whether they should similarly be removed. Further guidance on identifying corrected or retracted studies is provided in
              - link "Chapter 4, section 4.4.6" [ref=e311] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04#section-4-4-6
              - text: ", and in the"
              - link "Cochrane policy for managing potentially problematic studies" [ref=e312] [cursor=pointer]:
                - /url: https://www.cochranelibrary.com/cdsr/editorial-policies#problematic-studies
              - text: .
            - paragraph [ref=e313]: If a new comparison or a new outcome has been added to the review, it may be necessary to go back to the original included studies and check whether they included any information not previously collected that would be relevant to the update.
            - heading "IV.5 Reporting an updated review#section-iv-5" [level=2] [ref=e314]
            - paragraph [ref=e315]:
              - text: An updated review should meet the same standards of reporting as any review (see
              - link "Chapter III" [ref=e316] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-iii
              - text: ), while ensuring that all updated information and changes made to the scope and methods of the review are reported clearly. The details of any changes, including justifications for the decisions made, can be briefly documented at the beginning of the Methods section of the review and elaborated on additional supplementary material if they are significant. Authors should clearly alert readers that this is an update of an earlier version, including statements in the Abstract, Background and Protocol and registration sections of the review.
            - paragraph [ref=e317]: Appearing at the beginning of the review, the Background section is not directly impacted by an update, but authors may wish to review the content of the Background to ensure that it remains fit for purpose. Discussions of the prevalence or incidence of a condition, new insights into the mechanism of action or impact on populations, or descriptions of current practice or policy options may be updated. Up-to-date references should be supplied to support this information. Any references to time, such as words like ‘recently’ or ‘in the next five years’, should be amended or, if possible, removed.
            - paragraph [ref=e318]: "Reporting the details of the updated search alongside the search information in the existing review can become quite complex, especially if there have been several updates to the review over time. Detailed information on search strategies will be reported in Cochrane reviews as supplementary material, so does not need to be described at length in the text of the review. There are several approaches to reporting the results of an updated search:"
            - paragraph [ref=e319]: 1. An integrated approach describes all searches together, which may be most feasible if the same search was repeated.
            - paragraph [ref=e320]: 2. An incremental approach adds information at each update to describe explicitly which searches were done for the update, retaining all information about previous searches.
            - paragraph [ref=e321]: 3. A replacement approach describes only the searches done for the update, using the previous review as one source of studies.
            - paragraph [ref=e322]: If any of the sources originally searched were not searched for the update, this should be explained and justified.
            - paragraph [ref=e323]:
              - text: The updated search should also be presented in a PRISMA-type flow diagram (see
              - link "Chapter 4, Section 4.5" [ref=e324] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-04#section-4-5
              - text: ). Again, there are options as to how to present the results of multiple searches coherently in the diagram. Authors can retain the results of previous searches in the review and supplement with information about studies identified in the update or, alternatively, present only information about searches in the current update, with the previous version of the review serving as one particular source of studies. If taking the latter approach, the flow diagram should show one box for the number of studies included in the original review or previous update and an additional box for the new studies retrieved for the current update. If multiple searches have been conducted for the current update, the results of all the searches should be added together. It may be helpful to consider the clarity of the diagram as a summary for readers when selecting an approach.
            - paragraph [ref=e325]:
              - text: The methods and results described throughout the review and its summaries (including the ‘Summary of findings’ table, Abstract and Plain Language Summaries) should be checked to ensure they still reflect the methods used accurately. Where the review is considered a ‘living’ systematic review, and regular updates are planned, additional methods should be included to describe the timing and nature of this process (see
              - link "Chapter 22, Section 22.2" [ref=e326] [cursor=pointer]:
                - /url: /authors/handbooks-and-manuals/handbook/current/chapter-22#section-22-2
              - text: ).
            - paragraph [ref=e327]: "The extent of revision to the Results of the review will depend on the influence of the new data on the results of the review. Examples include:"
            - list [ref=e328]:
              - listitem [ref=e329]: the addition of small studies bringing about no change in the results or conclusions of the review (and so requiring very little revision of the text);
              - listitem [ref=e330]: increased certainty of pre-existing results and conclusions (requiring some modification of the text); and
              - listitem [ref=e331]: a change in the conclusion of a review (requiring a major rewrite of the Results, Discussion, Conclusion, ‘Summary of findings’ table, Abstract and Plain Language Summary).
            - paragraph [ref=e332]: When reporting the results, it is more helpful to readers to present an integrated picture of the overall results, rather than sequential or separate results for the update (especially where there has been more than one update), although any particularly notable changes to the review’s conclusions may be of interest to discuss when interpreting the results.
            - paragraph [ref=e333]: Authors should check that nothing else in the review requires editing, such as references to other Cochrane reviews that may have been updated, or additions to the Acknowledgements. The ‘Declarations of interest’ sections of the review should be updated.
            - paragraph [ref=e334]: Finally, to inform returning readers, authors should summarize key changes in the ‘What’s new’ section. This should include the number of new studies and participants in those studies, and the nature of any changes in findings, the certainty of the evidence (e.g. using GRADE) and in the implications for practice.
            - heading "IV.5.1 Changes in authorship#section-iv-5-1" [level=3] [ref=e335]
            - paragraph [ref=e336]: If there is a change in the authorship of the review, such as new authors joining the team, or an entirely new team of authors updating the review, the by-line (list of authors) may need to be changed. The decision regarding who is named in the by-line of an updated review, and in what order, should be assessed in terms of contributions to content in the updated version of the review (which will include historical content), and responsibility for approving the final content of the manuscript. If an author is no longer actively contributing to or involved in the approval of an updated review, the author should not be listed in the by-line of the new version and should be named in the Acknowledgements section. In addition, the contributions of all authors to both the update and earlier versions of the review should be described in the ‘Contributions of authors’ section.
            - paragraph [ref=e337]:
              - text: See Cochrane’s
              - link "policy on authorship and contributorship" [ref=e338] [cursor=pointer]:
                - /url: https://www.cochranelibrary.com/cdsr/editorial-policies#authorship
              - text: for Cochrane reviews for more information.
            - heading "IV.6 Chapter information#section-iv-6" [level=2] [ref=e339]
            - paragraph [ref=e340]:
              - strong [ref=e341]: "Authors:"
              - text: Miranda Cumpston and Ella Flemyng
            - paragraph [ref=e342]:
