      - generic [ref=e19]:
        - heading "Cynefin framework" [level=2] [ref=e20]
        - text: DECISION MAKING
        - generic [ref=e21]: Make sense of different situations to choose an appropriate response.
      - generic [ref=e22]:
        - paragraph [ref=e23]: Different situations typically require different responses. The Cynefin framework (pronounced /kəˈnɛvɪn/ - "kuh-nev-in") is there to help you make sense of the situation in front of you and make a decision that's appropriate for the type of situation you're dealing with. It was developed by Dave Snowden in 1999.
        - heading "How to use it" [level=2] [ref=e24]
        - paragraph [ref=e25]: "The framework identifies five domains to categorise problems or situations: clear, complicated, complex, chaotic and disorder."
        - paragraph [ref=e26]:
          - text: The idea is to
          - strong [ref=e27]: identify which domain you're in and then choose the appropriate action based on its characteristics
          - text: . So let's look at each domain in detail.
        - img "Cynefin framework consisting of Complex, Complicated, Chaotic and Clear quadrants" [ref=e30] [cursor=pointer]
        - heading "Clear" [level=3] [ref=e31]
        - paragraph [ref=e32]: Also known as obvious or simple, this is the domain of best practices. This is where problems are familiar and clearly defined, cause-and-effect relationships are clear and the situations are stable. Many process-oriented situations and problems would fall into this domain. It's a domain of "known knowns".
        - paragraph [ref=e33]: Solutions are usually clear in these situations and don't require much expertise.
        - paragraph [ref=e34]:
          - text: The right approach would be
          - emphasis [ref=e35]: sense–categorise–respond
          - text: ": understand the situation (sense), categorize it, then respond by applying a best-practice solution."
        - heading "Complicated" [level=3] [ref=e36]
        - paragraph [ref=e37]: In this domain, there might be multiple right answers but aren't immediately visible. It's a domain of "known unknowns" – when questions are clear but it takes work to answer them.
        - paragraph [ref=e38]:
          - text: That's why the best approach is to
          - emphasis [ref=e39]: sense-analyze-respond
          - text: . Because analysis is needed, the situations here typically require expert knowledge. Experts should assess the situation, investigate possible options and choose a course of action.
        - heading "Complex" [level=3] [ref=e40]
        - paragraph [ref=e41]: In this domain, there are "unknown unknowns". The situation cannot be understood by analysis because we don't yet know enough about it. It's not clear what needs to be answered in the first place.
        - paragraph [ref=e42]: So the right approach is to experiment first, learn about the problem. Then sense what you're dealing with and respond appropriately. The goal should be to understand enough so that the problem or situation moves to the complicated domain where it's easier to deal with.
        - heading "Chaotic" [level=3] [ref=e43]
        - paragraph [ref=e44]: When things aren't under control, the situation falls into the chaotic domain. It's when cause and effect relationships are unclear. Here it's necessary to first act to establish some stability, to contain the situation. Only then assess the situation and work on bringing enough order to it to move it into the complex domain. Act–sense–respond.
        - paragraph [ref=e45]: The chaotic domain also presents an opportunity to try novel solutions as people might be more open to them in this context.
        - heading "Disorder" [level=3] [ref=e46]
        - paragraph [ref=e47]: If you don't know where you stand, you're in the disorder domain. The goal should be to quickly identify the right domain and move forward from there. It can be helpful to break down the problem or situation into multiple parts and assign each to a specific domain.
        - heading "Determining which domain you're in" [level=2] [ref=e48]
        - paragraph [ref=e49]: It's best to get more familiar with each domain to learn when characteristics of a problem/situation apply to a particular domain. The sources below are a good place to start.
        - paragraph [ref=e50]: "Here's a set of questions that can also help point you to the right domain:"
        - list [ref=e51]:
          - listitem [ref=e52]: Do you know what causes the situation?
          - listitem [ref=e53]: Is the situation under control?
          - listitem [ref=e54]: How much do you know about it?
          - listitem [ref=e55]: Does solving it require expert knowledge?
        - heading "Takeaway" [level=2] [ref=e56]
        - paragraph [ref=e57]:
          - text: The key idea of the Cynefin framework is that
          - strong [ref=e58]: different kinds of situations or problems require different kinds of responses
          - text: . You should identify what kind of a situation you're dealing with and—with the help of this framework—choose an appropriate response.
