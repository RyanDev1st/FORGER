    - generic [ref=e17]:
      - generic [ref=e19]:
        - heading "Issue trees" [level=2] [ref=e20]
        - text: PROBLEM SOLVING
        - generic [ref=e21]: Structure and solve problems in a systematic way.
      - generic [ref=e22]:
        - paragraph [ref=e23]: Issue trees are basically maps of problems. They give you a clear and systematic way of looking at the problem you need to solve. They help you break down a big problem into smaller, more manageable ones, and prioritize certain parts of the problem. In other words, they're useful for the "divide and conquer" strategy.
        - img "Example of an issue tree" [ref=e26] [cursor=pointer]
        - paragraph [ref=e27]: Issue trees are also great for communicating about a problem with others since they provide a map of the problem.
        - paragraph [ref=e28]: "There are two basic kinds of issue trees:"
        - list [ref=e29]:
          - listitem [ref=e30]: Problem trees – created by answering "Why?"
          - listitem [ref=e31]: Solution trees – created by answering "How?"
        - heading "How to create an issue tree" [level=2] [ref=e32]
        - heading "Problem tree" [level=3] [ref=e33]
        - paragraph [ref=e34]: A good issue tree must cover the whole problem. It has to be rigorous. Here are some basic principles for creating an issue tree.
        - list [ref=e35]:
          - listitem [ref=e36]: Start breaking down the problem into separate categories/branches.
          - listitem [ref=e37]:
            - text: "Use the MECE principle: mutually exclusive, collectively exhaustive."
            - list [ref=e38]:
              - listitem [ref=e39]: Mutually exclusive means there is no overlap between different parts of the tree. Collectively exhaustive means they cover the whole problem.
          - listitem [ref=e40]: "Do not go into the small details (specific hypotheses): focus on capturing the broad categories that make up the problem."
          - listitem [ref=e41]:
            - text: "Apply the 80/20 rule: focus on the few parts of the problem that are most impactful."
            - list [ref=e42]:
              - listitem [ref=e43]: This is best to base on data, rather than your own hypotheses.
        - heading "Solution tree" [level=3] [ref=e44]
        - paragraph [ref=e45]: When you have singled out some specific parts of the problem that you want to focus on, you can follow up with creating a solution tree.
        - list [ref=e46]:
          - listitem [ref=e47]: Take the problem part you want to focus on and ask "How might we improve/fix this?"
          - listitem [ref=e48]: Map out potential categories of the solution
          - listitem [ref=e49]: Generate ideas within each category
        - paragraph [ref=e50]: The advantage of this structured way of thinking is that working with constraints will actually help you generate more ideas.
        - heading "Example" [level=2] [ref=e51]
        - paragraph [ref=e52]: Let's see an example of creating an issue tree. Suppose you're working on a product and you're seeing customers not adopting one of your key features. That will be the tree starting point.
        - paragraph [ref=e53]: "We'll break it down to smaller branches that cover possible causes:"
        - img "Example of an issue tree" [ref=e56] [cursor=pointer]
        - list [ref=e57]:
          - listitem [ref=e58]:
            - text: Low adoption of feature X
            - list [ref=e59]:
              - listitem [ref=e60]: Customers don't know about the feature.
              - listitem [ref=e61]: Customers know about it, but still don't use it.
        - paragraph [ref=e62]: For a first level of the tree, it's incredibly basic, but it's actually MECE – it's mutually exclusive yet covers the whole problem.
        - paragraph [ref=e63]: "Branching out further, we can eventually get this tree:"
        - img "Example of an issue tree" [ref=e66] [cursor=pointer]
        - list [ref=e67]:
          - listitem [ref=e68]:
            - text: Low adoption of feature X
            - list [ref=e69]:
              - listitem [ref=e70]:
                - text: Customers don't know about the feature
                - list [ref=e71]:
                  - listitem [ref=e72]: The feature is not discoverable in the product
                  - listitem [ref=e73]: Customer's don't learn about the feature outside of the product
              - listitem [ref=e74]:
                - text: Customers know about it, but still don't use it
                - list [ref=e75]:
                  - listitem [ref=e76]:
                    - text: Customers haven't tried it yet
                    - list [ref=e77]:
                      - listitem [ref=e78]: They don't believe the feature can help them
                  - listitem [ref=e79]:
                    - text: Customers tried it but decided not to use it
                    - list [ref=e80]:
                      - listitem [ref=e81]: The feature is not usable
                      - listitem [ref=e82]: The feature is not working properly
                      - listitem [ref=e83]: The feature doesn't support customer needs
        - paragraph [ref=e84]: We could investigate even further, but already we can see which part of the problem to start with. In this case, focusing on the knowledge about the feature should be a high priority – there might be nothing wrong with the feature, customers just don't know about it.
        - paragraph [ref=e85]: This is a nice example of how a very simple issue tree can help you break down a problem and give you a starting point for solving it.
        - heading "Takeaway" [level=2] [ref=e86]
        - paragraph [ref=e87]: Issue trees are a great tool for approaching problems systematically by breaking them down. You can create problem issue trees (by asking "why?") or solution issue trees (by asking "how?") depending on where you are in the process of problem-solving.
