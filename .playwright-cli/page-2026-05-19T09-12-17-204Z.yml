      - generic [ref=e19]:
        - heading "Abstraction laddering" [level=2] [ref=e20]
        - text: PROBLEM SOLVING
        - generic [ref=e21]: Frame your problem better with different levels of abstraction.
      - generic [ref=e22]:
        - paragraph [ref=e23]: Abstraction laddering is a tool for framing problems more skillfully. It helps with defining a problem that you need to solve more clearly. It helps you to move beyond an initial problem statement.
        - paragraph [ref=e24]: This tool provides you with the ability to ask the right questions to move up and down the ladder.
        - paragraph [ref=e25]: Move up to expand the scope, to "see the forest for the trees". Move down to develop concrete solutions.
        - heading "How to use it" [level=2] [ref=e26]
        - list [ref=e27]:
          - listitem [ref=e28]: Start with an initial problem statement in the middle of the ladder.
          - listitem [ref=e29]: Ask "why" questions to get more abstract problem statements. This can help you frame the problem differently.
          - listitem [ref=e30]: Ask "how" questions to step toward a more concrete statement or solution. This helps you come up with different problem statements than the one you started with. It enables you to find more innovative solutions.
        - img "Illustration of how to use abstraction laddering" [ref=e33] [cursor=pointer]
        - paragraph [ref=e34]: The great thing about this tool is that you can use it anywhere in the design process. It can be used fairly quickly—in mere minutes—whether you're working alone or in a workshop setting with your team.
        - heading "What does it look like in practice?" [level=2] [ref=e35]
        - paragraph [ref=e36]: "Here's a simple example from Wes O'Haire from Dropbox:"
        - img "Abstraction laddering example by Wes O'Haire" [ref=e39] [cursor=pointer]
        - paragraph [ref=e40]: "He starts with an initial problem statement: \"Design a better can opener\". Initially asking \"how?\", he gets to a more concrete statement \"Make it more appealing\"."
        - paragraph [ref=e41]: "But he can also go up the ladder: \"Why do we need a better can opener?\""
        - paragraph [ref=e42]: "This leads him to the more abstract problem statement: \"Get soup out of the can\". From there, he might ask \"How might we get the soup out of the can?\". That enables defining a different problem statement: \"Make it more convenient.\""
        - heading "Put this tool to practice" [level=2] [ref=e43]
        - paragraph [ref=e44]: I've created a template (in PDF and Miro) for applying Abstraction laddering in practice. It includes a step-by-step reference guide with an example.
        - paragraph [ref=e45]: You can get it with Untools Vault which gives you instant access to all Untools premium templates and monthly exclusive deep-dives about thinking tools.
        - link "Get the template with Untools Vault" [ref=e47] [cursor=pointer]:
          - /url: https://untools.gumroad.com/l/vault-lifetime
