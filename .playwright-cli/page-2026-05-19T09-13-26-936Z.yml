    - article [ref=e61]:
      - generic [ref=e62]:
        - heading "Problem Statements in UX Discovery" [level=1] [ref=e63]
        - generic [ref=e67]:
          - link "Maria Rosala" [ref=e69] [cursor=pointer]:
            - /url: /articles/author/maria-rosala/
          - paragraph [ref=e70]: August 22, 2021
        - link "Share" [ref=e72] [cursor=pointer]:
          - /url: "#"
          - paragraph [ref=e74]: Share
      - generic [ref=e75]:
        - generic [ref=e76]:
          - generic [ref=e77]: "Summary: In the discovery phase of a UX project, a problem statement is used to identify and frame the problem to be explored and solved, as well as to communicate the discovery’s scope and focus."
          - generic [ref=e78]:
            - paragraph [ref=e79]:
              - text: Running
              - link "discoveries" [ref=e80] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/discovery-phase/
              - text: "can be challenging. Many teams start discovery research with little direction as to what problem they want to solve. When this happens, discoveries meander and result in dwindling team and stakeholder morale. Worse still, some discoveries begin with investigating solutions, rather than the problems those solutions are intended to solve. (Remember: if you’re"
              - link "investigating only solutions in a discovery, you’re not doing a true discovery!" [ref=e81] [cursor=pointer]:
                - /url: https://www.nngroup.com/videos/real-ux-discoveries/
              - text: )
            - paragraph [ref=e82]:
              - text: To avoid these issues, spend time upfront to
              - strong [ref=e83]: identify and frame the problem
              - text: . If you don’t know the problem, you’re not going to have much luck solving it! The better a problem is articulated, the easier and more effectively it can be solved. One device that help teams to frame a problem is a problem statement.
            - generic [ref=e85]:
              - heading "In This Article:" [level=2] [ref=e88]
              - list [ref=e89]:
                - listitem [ref=e90]:
                  - link "What’s a Problem Statement?" [ref=e91] [cursor=pointer]:
                    - /url: "#toc-whats-a-problem-statement-1"
                - listitem [ref=e92]:
                  - link "How to Write a Problem Statement" [ref=e93] [cursor=pointer]:
                    - /url: "#toc-how-to-write-a-problem-statement-2"
                - listitem [ref=e94]:
                  - link "Problem Statements Don’t Need to Be Negative" [ref=e95] [cursor=pointer]:
                    - /url: "#toc-problem-statements-dont-need-to-be-negative-3"
                - listitem [ref=e96]:
                  - link "How to Use Problem Statements" [ref=e97] [cursor=pointer]:
                    - /url: "#toc-how-to-use-problem-statements-4"
                - listitem [ref=e98]:
                  - link "Summary" [ref=e99] [cursor=pointer]:
                    - /url: "#toc-summary-5"
            - heading "What’s a Problem Statement?" [level=2] [ref=e100]
            - blockquote [ref=e101]:
              - paragraph [ref=e102]:
                - strong [ref=e103]: "Problem statement:"
                - text: A concise description of the problem that needs to be solved.
            - paragraph [ref=e104]: It’s a helpful scoping device, focusing the team on the problem it needs to explore and subsequently solve. A problem statement makes clear what needs to be done in discovery and what’s out of scope. Problem statements are also great communication tools; well-written ones can be used to gain buy-in from stakeholders on why it’s important to explore and solve the problem.
            - paragraph [ref=e105]: Here are some examples of problem statements.
            - list [ref=e106]:
              - listitem [ref=e107]: Users of our newspaper app often export content from our app, rather than sharing content through our app. This is a problem because target audiences are less likely to know that the content came from our app, leading to lower conversion rates. This is also a problem for app users, as exporting content is time-consuming and could lead to a decrease in app usage.
              - listitem [ref=e108]: Sales reps spend a long time planning which leads to visit each month. Because planning is done manually — using Excel spreadsheets and printed paper lists — sales reps find it difficult to meet their targets. Many have complained that keeping track of which leads to visit takes away from the time they can spend with them. This is a problem because, when targets are not met, the business risks losing revenue.
              - listitem [ref=e109]: Each year, many applicants call the contact center seeking an update on their application. Applicants often spend a long time waiting to speak to an agent. Because contact-center staff members lack access to case information, they are unable to answer queries from applicants. This situation causes frustration for both applicants and customer-contact staff and represents an avoidable cost to the department.
            - paragraph [ref=e110]:
              - text: It's a good idea to write a problem statement as early as possible in your discovery, as it can help set discovery goals and objectives. Many teams will compose their problem statement in a
              - strong [ref=e111]: discovery kick-off workshop.
            - heading "How to Write a Problem Statement" [level=2] [ref=e112]
            - paragraph [ref=e113]: "A problem statement should include:"
            - list [ref=e114]:
              - listitem [ref=e115]:
                - strong [ref=e116]: The background of a problem.
                - text: "Which organization or department has the problem and what is the problem? Why has the problem arisen? Note that in some cases you may not know the exact causes of the problem. This is what discoveries are for: to uncover root causes. (In this case, you may add this aspect once you’ve done your research)"
              - listitem [ref=e117]:
                - strong [ref=e118]: The people affected by the problem.
                - text: There could be multiple user groups affected by a specific problem in different ways. In the problem statement, you should call out how the problem affects users. In some cases, internal employees (particularly customer-support staff) can be affected by a problem, as they often bear the brunt of poor user experiences –- for example, by handling disgruntled customers.
              - listitem [ref=e119]:
                - strong [ref=e120]: The impact of the problem on the organization.
                - text: If the problem is not fixed, what will be the effect on the organization? Reputational damage? Paying unavoidable costs? Losing out-of-market share? In some cases, you may want to quantify the impact in order to convince your organization to fix the problem. Your discovery could involve working out how much this problem costs the organization, and this information could end up in your problem statement.
            - paragraph [ref=e121]:
              - text: To gather the relevant facts for your problem statement, you can use a simple technique called the
              - strong [ref=e122]: 5 Ws
              - text: ", which involves answering the questions below. This activity can be included in a discovery kick"
              - strong [ref=e123]: "-"
              - text: "off"
              - strong [ref=e124]
              - text: workshop with your team and stakeholders.
            - list [ref=e125]:
              - listitem [ref=e126]:
                - strong [ref=e127]: Who
                - text: is affected by the problem?
              - listitem [ref=e128]:
                - strong [ref=e129]: What
                - text: is the problem?
              - listitem [ref=e130]:
                - strong [ref=e131]: Where
                - text: does this problem occur?
              - listitem [ref=e132]:
                - strong [ref=e133]: When
                - text: does the problem occur?
              - listitem [ref=e134]:
                - strong [ref=e135]: Why
                - text: does the problem occur? Why is the problem important?
            - paragraph [ref=e136]: If you don’t have all the answers to the above, don’t panic! While you should know what the problem is, you may not know exactly why it came about. This is what your discovery should tackle. Throughout the discovery process, you can return to your problem statement and add to it.
            - paragraph [ref=e137]:
              - text: It’s important that problem statements are written well to serve their purpose.
              - strong [ref=e138]: A problem statement
              - strong [ref=e139]: should
              - text: ":"
            - list [ref=e140]:
              - listitem [ref=e141]:
                - strong [ref=e142]: Not be a laundry list of unrelated problems
                - text: . A discovery effort should have one problem statement, and the problem statement should be focused on one problem. Of course, a single problem could cause further problems, and those related problems can be added to your problem statement. But listing many unrelated problems is a sign that you’re tackling too much.
              - listitem [ref=e143]:
                - strong [ref=e144]: Not contain a solution
                - text: . Leave solutions out of your problem statement. At the beginning of discovery, there are too many unknowns, so the the best solution is not obvious. At the end of your discovery, you’ll be in a good position to confidently put forward solution ideas that address the problem and take into account what you’ve learned.
              - listitem [ref=e145]:
                - strong [ref=e146]: Be brief
                - text: . Problem statements are effective when they’re concise. If you can condense your problem statement down to a few sentences, others will quickly understand what you focus on and why, and what’s out of scope. Spend some time to draft and redraft the problem statement with your team.
            - heading "Problem Statements Don’t Need to Be Negative" [level=2] [ref=e147]
            - paragraph [ref=e148]:
              - text: The examples I’ve given so far are negative — talking about something that needs fixing. However, problem statements can also capture opportunities (in which case they are sometimes referred to as
              - strong [ref=e149]: opportunity statements
              - text: instead of problem statements, although they are written and used in the same way).
            - paragraph [ref=e150]: "Here’s an example of a problem statement that highlights an opportunity, rather than a problem that needs to be fixed:"
            - paragraph [ref=e151]: The process of purchasing a newly built home can take a long time and requires many offline activities. This means sales often take a long time to close. There’s an opportunity to make home buying quicker and easier, and thus improve customer-satisfaction ratings and sales.
            - paragraph [ref=e152]: "In an opportunity statement, we need to highlight the gap between where we are now (the present state) and where we want to be in the future (the desired state). A good question to ask to highlight this gap is: What do we want to achieve?"
            - heading "How to Use Problem Statements" [level=2] [ref=e153]
            - paragraph [ref=e154]: "Your problem statement can be used as the starting point for structuring your discovery work. For example, if the problem statement was about improving the home-buying process, the goal for the discovery should be to learn about opportunities to make home buying quicker and easier. Once we have a discovery goal, it becomes easier to know what unknowns need research. For example, in this case, we probably want to know things like:"
            - list [ref=e155]:
              - listitem [ref=e156]: Which activities do homebuyers perceive as difficult or time-consuming?
              - listitem [ref=e157]: Which activities or use cases can slow down the home-buying process and why?
              - listitem [ref=e158]: What does the end-to-end journey currently look like?
            - paragraph [ref=e159]: As you begin discovery, you can return to your problem statement and refine it — particularly if you’ve learned root causes or how much a problem costs your organization. Another reason to update your problem statement is if the discovery changes direction — which can happen when new areas of interest are highlighted through exploratory research. Finally, at the end of the discovery process, the problem statement can be communicated alongside your findings and recommendations to provide the full narrative of the discovery process.
            - heading "Summary" [level=2] [ref=e160]
            - paragraph [ref=e161]: A problem statement is a concise description of the problem to be solved. Writing problem statements at the beginning of the discovery process can create alignment and buy-in around the problem to be solved and provide direction in subsequent discovery activities. To construct problem statements, focus on who the problem affects, how it does so, and why it’s important to solve the problem.
