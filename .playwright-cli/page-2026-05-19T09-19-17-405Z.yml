                                                      - generic [ref=e2014]: "What is normality exactly? It's not the ideas and intuitions I came to the table with, unless the theory actually proposes to teach me nothing. My questions is this: \"what do I learn when I learn that the universe is deterministic?\" Do I learn anything that has to do with deliberation? One reasonable answer (and one way to explain the normality point) would just be 'no, it has nothing to do with action.' But this would strike many people as odd, since we recognize in our deliberation a distinction between future events we can bring about or prevent, and future states we cannot bring about or prevent. [...] I find I have an extremely hard time understanding some of the arguments in that sequence, after several attempts. I would dearly love to have some of it explained in response to my questions. I find this argument in parcticular to be very confusing: [...] This argument (which reappears in the 'timeless control' article) seems to hang on a very weird idea of 'changing the future'. No one I have ever talked to believes that they can literally change a future moment from having one property to having another, and that this change is distinct from a change that takes place over an extent of time. I certainly don't see how anyone could take this as a way to treat the world as undetermined. This seems like very much a strawman view, born from an equivocation on the word 'change'. But I expect I am missing something (perhaps something revealed later on in the more technical stage of the article). Can you help me?"
                                                  - generic [ref=e2017]:
                                                    - generic [ref=e2020] [cursor=pointer]:
                                                      - generic:
                                                        - generic [ref=e2021]: "4"
                                                        - generic [ref=e2022]: orthonormal
                                                        - time [ref=e2024]: 14y
                                                        - generic [ref=e2025]: "I meant that learning the universe is deterministic should not turn one into a fatalist who doesn't care about making good decisions (which is the intuition that many people have about determinism), because goals and choices mean something even in a deterministic universe. As an analogy, note that all of the agents in my decision theory sequence are deterministic (with one kind-of exception: they can make a deterministic choice to adopt a mixed strategy), but some of them characteristically do better than others. Regarding the \"changing the future\" idea, let's think of what it means in the context of two deterministic computer programs playing chess. It is a fact that only one game actually gets played, but many alternate moves are explored in hypotheticals (within the programs) along the way. When one program decides to make a particular move, it's not that \"the future changed\" (since someone with a faster computer could have predicted in advance what moves the programs make, the future is in that sense fixed), but rather that of all the hypothetical moves it explored, the program chose one according to a particular set of criteria. Other programs would have chosen another moves in those circumstances, which would have led to different games in the end. When you or I are deciding what to do, the different hypothetical options all feel like they're on an equal basis, because we haven't figured out what to choose. That doesn't mean that different possible futures are all real, and that all but one vanish when we make our decision. The hypothetical futures exist on our map, not in the territory; it may be that no version of you anywhere chooses option X, even though you considered it. Does that make more sense?"
