                                        - generic [ref=e1834]: Agreed, but so much is packed into that 'if'. We all seek pleasure, but not one of us believes it is an unqualified good. The implication of Swimmer's post was that atheists have reasons to obey the ten commandments (well, 4 or 5 of them) comparable in formal terms to the reasons Christians have (God'll burn me if I don't, or whatever). That is, the claim seems to be that atheists can justify their actions. Now, if someone does something nice for me, and I ask her why she did that, she can reply with some facts about evolutionary biology. This might explain her behavior, but it doesn't justify it. If we imagine someone committing a murder and then telling us something about her (perhaps defective) neurobiology, we might take this to explain their behavior, but never to justify it. We would never say 'Yeah, I guess now that you make those observations about your brain, it was reasonable of you to kill that guy." The point is that the murderer hasn't just given us a bad reason, she hasn't given us a reason at all. We cannot call her rational if this is all she has.
