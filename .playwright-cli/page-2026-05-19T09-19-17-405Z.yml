                                          - generic [ref=e1845]: I didn't claim that, and if I implied it, it was by accident. (Although I do think that a lot of atheists have just as strong if not stronger reasons to obey certain moral rules, the examples I gave weren't those examples.) I was trying to point out that if someone decides one day to stop believing in God, and realizes that this means God won't smite them if they break one of the Ten Commandments, that doesn't mean they'll go out and murder someone. Their moral instincts, and the positive/negative reinforcement to obey them (i.e. pleasure or guilt), keep existing regardless of external laws. [...] So we ask her why, and she says "oh, he took the seat that I wanted on the bus three weeks in a row, and his humming is annoying, and he always copies my exams." Which might not be a good reason to murder someone according to you, with your normal neurobiology–you would content yourself with fuming and making rude comments about him to your friends–but she considers it a good reason, because her mental 'brakes' are off.
