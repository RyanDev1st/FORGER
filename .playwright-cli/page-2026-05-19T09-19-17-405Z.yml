                                                  - time [ref=e1990]: 14y
                                                  - generic [ref=e1991]: "So I'd like to argue that it makes at least a little difference. When we engage in practical deliberation, when we think about what to do, we are thinking about what is possible and about ourselves as sources of what is possible. No one deliberates about the necessary, or about anything over which we have no control: we don't deliberate about what the size of the sun should be, or whether or not modus tollens should be valid. If we realize that the universe is deterministic, then we may still decide that we can deliberate, but we do now qualify this as a matter of 'viewpoints' or something like that. So the little difference this makes is in the way we qualify the idea of deliberation. So do you agree that there is at least this little difference? Perhaps it is inconsequential, but it does mean that we learn something about what it means to deliberate when we learn we are living in a deterministic universe as opposed to one with a bunch of spontaneous free causes running around."
