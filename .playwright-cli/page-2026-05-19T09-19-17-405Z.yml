          - generic [ref=e143]:
            - paragraph [ref=e144]: "Imagine that you have a peculiar job in a peculiar factory: Your task is to take objects from a mysterious conveyor belt, and sort the objects into two bins. When you first arrive, Susan the Senior Sorter explains to you that blue egg-shaped objects are called \"bleggs\" and go in the \"blegg bin\", while red cubes are called \"rubes\" and go in the \"rube bin\"."
            - paragraph [ref=e145]: Once you start working, you notice that bleggs and rubes differ in ways besides color and shape. Bleggs have fur on their surface, while rubes are smooth. Bleggs flex slightly to the touch; rubes are hard. Bleggs are opaque; the rube's surface slightly translucent.
            - paragraph [ref=e146]: Soon after you begin working, you encounter a blegg shaded an unusually dark blue—in fact, on closer examination, the color proves to be purple, halfway between red and blue.
            - paragraph [ref=e147]: Yet wait! Why are you calling this object a "blegg"? A "blegg" was originally defined as blue and egg-shaped—the qualification of blueness appears in the very name "blegg", in fact. This object is not blue. One of the necessary qualifications is missing; you should call this a "purple egg-shaped object", not a "blegg".
            - paragraph [ref=e148]: But it so happens that, in addition to being purple and egg-shaped, the object is also furred, flexible, and opaque. So when you saw the object, you thought, "Oh, a strangely colored blegg." It certainly isn't a rube... right?
            - paragraph [ref=e149]: Still, you aren't quite sure what to do next. So you call over Susan the Senior Sorter.
            - paragraph
            - blockquote [ref=e150]:
              - paragraph [ref=e151]:
                - text: "\"Oh, yes, it's a blegg,\" Susan says, \"you can put it in the blegg bin.\""
                - text: You start to toss the purple blegg into the blegg bin, but pause for a moment. "Susan," you say, "how do you
                - emphasis [ref=e152]: know
                - text: this is a blegg?"
                - text: Susan looks at you oddly. "Isn't it obvious? This object may be purple, but it's still egg-shaped, furred, flexible, and opaque, like all the other bleggs. You've got to expect a few color defects. Or is this one of those philosophical conundrums, like 'How do you know the world wasn't created five minutes ago complete with false memories?' In a philosophical sense I'm not
                - emphasis [ref=e153]: absolutely certain
                - text: that this is a blegg, but it seems like a good guess."
                - text: "\"No, I mean...\" You pause, searching for words. \""
                - emphasis [ref=e154]: Why
                - text: is there a blegg bin and a rube bin? What's the
                - emphasis [ref=e155]: difference
                - text: between bleggs and rubes?"
                - text: "\"Bleggs are blue and egg-shaped, rubes are red and cube-shaped,\" Susan says patiently. \"You got the standard orientation lecture, right?\""
                - text: "\"Why do bleggs and rubes"
                - emphasis [ref=e156]: need
                - text: to be sorted?"
                - text: "\"Er... because otherwise they'd be all mixed up?\" says Susan. \"Because nobody will pay us to sit around all day and"
                - emphasis [ref=e157]: not
                - text: sort bleggs and rubes?"
                - text: "\"Who originally determined that the first blue egg-shaped object was a 'blegg', and how did they determine that?\""
                - text: Susan shrugs. "I suppose you could just as easily call the red cube-shaped objects 'bleggs' and the blue egg-shaped objects 'rubes', but it seems easier to remember this way."
                - text: You think for a moment. "Suppose a completely mixed-up object came off the conveyor. Like, an orange sphere-shaped furred translucent object with writhing green tentacles. How could I tell whether it was a blegg or a rube?"
                - text: "\"Wow, no one's ever found an object"
                - emphasis [ref=e158]: that
                - text: mixed up," says Susan, "but I guess we'd take it to the sorting scanner."
                - text: "\"How does the sorting scanner work?\" you inquire. \"X-rays? Magnetic resonance imaging? Fast neutron transmission spectroscopy?\""
                - text: "\"I'm told it works by Bayes's Rule, but I don't quite understand how,\" says Susan. \"I like to say it, though. Bayes Bayes Bayes Bayes Bayes.\""
                - text: "\"What does the sorting scanner"
                - emphasis [ref=e159]: tell
                - text: you?"
                - text: "\"It tells you whether to put the object into the blegg bin or the rube bin. That's why it's called a sorting scanner.\""
                - text: At this point you fall silent.
                - text: "\"Incidentally,\" Susan says casually, \"it may interest you to know that bleggs contain small nuggets of vanadium ore, and rubes contain shreds of palladium, both of which are useful industrially.\""
                - text: "\"Susan, you are pure evil.\""
                - text: "\"Thank you.\""
            - paragraph [ref=e160]:
              - text: "So now it seems we've discovered the heart and essence of bleggness: a blegg is an object that contains a nugget of vanadium ore. Surface characteristics, like blue color and furredness, do not"
              - emphasis [ref=e161]: determine
              - text: whether an object is a blegg; surface characteristics only matter because they help you
              - emphasis [ref=e162]: infer
              - text: whether an object is a blegg, that is, whether the object contains vanadium.
            - paragraph [ref=e163]: "Containing vanadium is a necessary and sufficient definition: all bleggs contain vanadium and everything that contains vanadium is a blegg: \"blegg\" is just a shorthand way of saying \"vanadium-containing object.\" Right?"
            - paragraph [ref=e164]: "Not so fast, says Susan: Around 98% of bleggs contain vanadium, but 2% contain palladium instead. To be precise (Susan continues) around 98% of blue egg-shaped furred flexible opaque objects contain vanadium. For unusual bleggs, it may be a different percentage: 95% of purple bleggs contain vanadium, 92% of hard bleggs contain vanadium, etc."
            - paragraph [ref=e165]: Now suppose you find a blue egg-shaped furred flexible opaque object, an ordinary blegg in every visible way, and just for kicks you take it to the sorting scanner, and the scanner says "palladium"—this is one of the rare 2%. Is it a blegg?
            - paragraph [ref=e166]: At first you might answer that, since you intend to throw this object in the rube bin, you might as well call it a "rube". However, it turns out that almost all bleggs, if you switch off the lights, glow faintly in the dark; while almost all rubes do not glow in the dark. And the percentage of bleggs that glow in the dark is not significantly different for blue egg-shaped furred flexible opaque objects that contain palladium, instead of vanadium. Thus, if you want to guess whether the object glows like a blegg, or remains dark like a rube, you should guess that it glows like a blegg.
            - paragraph [ref=e167]:
              - text: So is the object
              - emphasis [ref=e168]: really
              - text: a blegg or a rube?
            - paragraph [ref=e169]: On one hand, you'll throw the object in the rube bin no matter what else you learn. On the other hand, if there are any unknown characteristics of the object you need to infer, you'll infer them as if the object were a blegg, not a rube—group it into the similarity cluster of blue egg-shaped furred flexible opaque things, and not the similarity cluster of red cube-shaped smooth hard translucent things.
            - paragraph [ref=e170]: The question "Is this object a blegg?" may stand in for different queries on different occasions.
            - paragraph [ref=e171]:
              - text: If it weren't standing in for
              - emphasis [ref=e172]: some
              - text: query, you'd have no reason to care.
            - paragraph [ref=e173]:
              - link "Is atheism a \"religion\"" [ref=e175] [cursor=pointer]:
                - /url: /lw/lo/uncritical_supercriticality
              - text: "?"
              - link "Is transhumanism a \"cult\"" [ref=e177] [cursor=pointer]:
                - /url: /lw/md/cultish_countercultishness
              - text: "? People who argue that atheism is a religion \"because it states beliefs about God\" are really trying to argue (I think) that the reasoning methods used in atheism are on a par with the reasoning methods used in religion, or that atheism is no safer than religion in terms of the probability of causally engendering violence, etc... What's really at stake is an atheist's claim of substantial difference and superiority relative to religion, which the religious person is trying to reject by denying the difference rather than the superiority(!)"
            - paragraph [ref=e178]:
              - text: "But that's not the a priori irrational part: The a priori irrational part is where, in the course of the argument, someone pulls out a dictionary and looks up the definition of \"atheism\" or \"religion\". (And yes, it's just as silly whether an atheist or religionist does it.) How could a dictionary"
              - emphasis [ref=e179]: possibly
              - text: decide whether an empirical cluster of atheists is really substantially different from an empirical cluster of theologians? How can reality vary with the meaning of a word? The points in thingspace don't move around when we redraw a boundary.
            - paragraph [ref=e180]:
              - text: But people often don't
              - emphasis [ref=e181]: realize
              - text: that their argument about where to draw a definitional boundary, is really a dispute over whether to infer a characteristic shared by most things inside an empirical cluster...
            - paragraph [ref=e182]: Hence the phrase, "disguised query".
