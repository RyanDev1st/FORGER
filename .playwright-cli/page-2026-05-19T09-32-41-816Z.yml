          - generic [ref=e124]:
            - generic [ref=e125]:
              - heading "What is the Planning Fallacy?" [level=2] [ref=e127]
              - generic [ref=e128]:
                - paragraph [ref=e129]: The planning fallacy describes our tendency to underestimate the amount of time it will take to complete a task, as well as the costs and risks associated with that task—even if it contradicts our experiences. First identified by psychologists Daniel Kahneman and Amos Tversky, this bias affects individuals, teams, and organizations alike. Whether it's building a house, launching a product, or studying for an exam, people tend to create overly optimistic timelines and budgets. This happens because we focus too much on the best-case scenario and ignore relevant historical data or potential setbacks.
                - paragraph [ref=e130]:
                  - img "planning falacy" [ref=e131]
            - generic [ref=e132]:
              - generic [ref=e133]:
                - heading "Where this bias occurs" [level=2] [ref=e135]
                - generic [ref=e136]:
                  - paragraph [ref=e137]: John, a university student, has a paper due in one week. He’s written many papers of a similar length before, and it generally takes him about a week to get it done. Nevertheless, as he is dividing up his time, John is positive that he can finish the assignment in three days, so he puts off starting. However, in the end, he doesn’t have the paper finished in time, and needs to ask for an extension. This is a prime example of the planning fallacy at work.
                  - paragraph [ref=e138]:
                    - text: A hallmark of the planning fallacy is that we tend to maintain our optimism about how long a task will take despite historical evidence that contradicts it.
                    - superscript [ref=e139]: "15"
                    - text: Even though John acknowledges that his previous papers took longer, he is still convinced that he can finish his current paper in less time. Lo and behold, his paper ends up taking just as long as all those previous papers. Research suggests that this is to be expected. Although we hold overly optimistic intentions about our future performance, our future behavior tends to match our past behavior—and sometimes tasks end up taking even
                    - emphasis [ref=e140]: longer
                    - text: than we thought they did in the past.
                    - superscript [ref=e141]: "15"
                  - paragraph [ref=e142]:
                    - text: Interestingly, the planning fallacy only affects estimations about one’s own task completion times. Outside observers tend to lean in the opposite direction,
                    - emphasis [ref=e143]: overestimating
                    - text: the time needed to complete a task.
                    - superscript [ref=e144]: "13"
                    - text: Had John asked a friend how long they thought it would take him to complete his paper, his friend likely would have suggested that he get started much earlier.
                  - paragraph [ref=e145]: Unfortunately, we don’t have the benefit of this objective perspective when estimating our own project timelines. Despite past evidence suggesting the contrary, we tend to think—like John—that we can get things done faster the next time around. This results in a cycle where history repeats itself time and time again, as we continuously underestimate our time requirements and end up missing deadlines, blowing through budgets, and rushing to complete projects at the last minute.
              - generic [ref=e146]:
                - heading "Related Biases" [level=3] [ref=e147]
                - list [ref=e148]:
                  - listitem [ref=e149]:
                    - link "Optimism Bias" [ref=e150] [cursor=pointer]:
                      - /url: /biases/optimism-bias
            - generic [ref=e152]:
              - heading "Individual effects" [level=2] [ref=e154]
              - generic [ref=e155]:
                - paragraph [ref=e156]: Just as the name suggests, the planning fallacy can lead to poor planning, causing us to make decisions that ignore the realistic demands of a task (be it time, money, energy, or something else). It also leads us to downplay the elements of risk and luck; instead, we focus only on our own abilities—and an overly optimistic assessment of our abilities at that. This can make it difficult to meet deadlines and divide up our available resources effectively. Let’s take a closer look at these common consequences.
                - heading "Trouble meeting deadlines" [level=3] [ref=e157]:
                  - strong [ref=e158]: Trouble meeting deadlines
                - paragraph [ref=e159]: One of the most obvious impacts of the planning fallacy is that it can cause us to miss deadlines. While missing self-imposed deadlines can lead to frustration and disappointment, missing important deadlines at work or in our interpersonal lives can have more lasting impacts, straining our professional and personal relationships—we all have that one friend who is chronically late because they’re perpetually optimistic about how quickly they can get ready. At work, the consequences can be even more serious. Continuously blowing through deadlines because we underestimate how long it takes to complete work projects can damage our reputation with colleagues and managers, making us seem unreliable and perhaps even hurting our career prospects.
                - heading "Poor resource allocation" [level=3] [ref=e160]:
                  - strong [ref=e161]: Poor resource allocation
                - paragraph [ref=e162]:
                  - text: Another consequence of the planning fallacy is that we often fail to allocate enough time, money, and energy to projects when we assume they’ll get done faster than our previous experiences suggest. This is why home renovation projects almost always take longer and cost more than expected.
                  - superscript [ref=e163]: "15"
                  - text: When we underestimate the resources required to complete a personal project, we risk underbudgeting our time and money during the project planning phase, resulting in budget overruns and lower-quality outcomes.
                - paragraph [ref=e164]:
                  - text: Our tendency toward poor planning can significantly disrupt our ability to schedule our lives. For example, a telephone survey of Canadian taxpayers found that people largely expected to mail in their tax forms about a week earlier than their typical date, but actually got their forms out around the same time they they always did.
                  - superscript [ref=e165]: "15"
                  - text: In this case, failing to realistically budget our time and effort can lead to last-minute rushing and projects running over into other commitments or plans. Whether it's filing taxes, holiday shopping, cooking dinner, or getting ready for a night out, the planning fallacy constantly causes us to misjudge our schedules, leading to unnecessary stress and a feeling of being perpetually behind.
            - generic [ref=e167]:
              - heading "Systemic effects" [level=2] [ref=e169]
              - generic [ref=e170]:
                - paragraph [ref=e171]:
                  - text: The planning fallacy affects everybody, from students and taxpayers to city planners and CEOs, influencing predictions about group tasks as much as individual projects.
                  - superscript [ref=e172]: "16"
                  - text: When it comes to large-scale ventures, such as disruptive construction projects and expensive business mergers, the livelihoods of many people (not to mention a whole lot of money) are at stake, and there are widespread economic and social consequences of poor planning.
                - heading "Project delays and cost overruns" [level=3] [ref=e173]:
                  - strong [ref=e174]: Project delays and cost overruns
                - paragraph [ref=e175]:
                  - text: Just as the planning fallacy can lead to delays and budget overruns in our personal lives, it can also result in large-scale setbacks in organizational and public projects. Some high-profile examples include the Sydney Opera House and the Canadian Pacific Railway, both of which ran years late and massively over budget. Check out our
                  - emphasis [ref=e176]: Examples
                  - text: section below for a closer look at these case studies.
                - paragraph [ref=e177]:
                  - text: Often, large projects like these fall victim to the planning fallacy because project teams underestimate the probability of negative events throwing a wrench in their optimistic plans. Instead of planning for the worst-case scenario, project managers tend to make time estimates based on optimistic performance scenarios where everything goes right.
                  - superscript [ref=e178]: "15"
                  - text: As a result, teams are often ill-prepared to weather setbacks and end up scrambling to solve problems, cutting corners to rush work, or implementing costly emergency measures that push projects even further over budget.
                - heading "Team morale" [level=3] [ref=e179]:
                  - strong [ref=e180]: Team morale
                - paragraph [ref=e181]:
                  - text: Within organizations, the planning fallacy can have a significant impact on team morale. When a team’s projected completion times don’t match their actual completion times, it's easy for employees to feel frustrated and unmotivated. Not only that, but employees who are consistently expected to meet unrealistic deadlines can feel an immense sense of pressure and stress, leading to lower job satisfaction and higher turnover rates.
                  - superscript [ref=e182]: "17"
            - generic [ref=e184]:
              - heading "Why it happens" [level=2] [ref=e186]
              - generic [ref=e187]:
                - paragraph [ref=e188]: The planning fallacy is rooted in several cognitive biases and psychological factors that influence how we make predictions about the future. Overall, this fallacy arises when we focus too much on the specifics of the current project and overlook characteristics of previous tasks, causing us to imagine overly optimistic scenarios while overlooking the potential that things could go wrong.
                - heading "We prefer to focus on the positive" [level=3] [ref=e189]:
                  - strong [ref=e190]: We prefer to focus on the positive
                - paragraph [ref=e191]:
                  - text: The planning fallacy stems from our overall bias towards optimism, especially when our own abilities are concerned.
                  - superscript [ref=e192]: 11,12
                  - text: In general, we are oriented towards positivity. We have optimistic expectations of the world and other people; we are more likely to remember positive events than negative ones; and, most relevantly, we tend to favor positive information in our decision-making processes.
                  - superscript [ref=e193]: 1,2
                - paragraph [ref=e194]:
                  - text: When it comes to our own capabilities, we are particularly bad at making accurate judgments. Take one study that asked incoming university students to estimate how they would perform academically compared to their classmates. On average, participants believed they would outperform 84% of their peers.
                  - superscript [ref=e195]: "3"
                  - text: Of course, this estimate may have been accurate for some students, but it is mathematically impossible for
                  - emphasis [ref=e196]: everybody
                  - text: to be in the top 16%.
                - paragraph [ref=e197]: All of this means that when we set out to plan a project, we are likely to focus on imagined successful outcomes rather than potential pitfalls, and we are likely to overestimate how capable we (and our team members) are of meeting certain goals. While enthusiasm is certainly important for any venture, it can become problematic if it comes at the expense of being realistic.
                - heading "We become anchored to our original plan" [level=3] [ref=e198]:
                  - strong [ref=e199]: We become anchored to our original plan
                - paragraph [ref=e200]:
                  - strong [ref=e201]:
                    - link "Anchoring" [ref=e202] [cursor=pointer]:
                      - /url: https://thedecisionlab.com/biases/anchoring-bias
                  - text: is another type of cognitive bias that plays a big role in the planning fallacy. Coined by Muzafer Sherif, Daniel Taub, and Carl Hovland, anchoring is the tendency to rely too heavily on initial information when we are making decisions.
                  - superscript [ref=e203]: "6"
                  - text: When we draw up a plan for a project, we are biased to continue thinking about those initial values—deadlines, budgets, and so on.
                - paragraph [ref=e204]: Anchoring is especially problematic if our original plans were unrealistically optimistic. Even if our initial predictions were massively inaccurate, we still feel tethered to those numbers even as we try to reassess. This leads us to make insufficient adjustments to our plans as we go along, preferring to make minor tweaks rather than major changes (even if major changes are necessary).
                - heading "We write off negative information" [level=3] [ref=e205]:
                  - strong [ref=e206]: We write off negative information
                - paragraph [ref=e207]: "Even if we do take outside information into account, we have a tendency to discount pessimistic views or data that challenges our optimistic outlook. This is the flip side of our positivity bias: our preference for affirmative information also makes us reluctant to consider the downsides."
                - paragraph [ref=e208]:
                  - text: In the business world, one example of this is known as
                  - strong [ref=e209]: competitor neglect
                  - text: ", which describes how company executives fail to anticipate how their rivals will behave because they are focused on their own organization."
                  - superscript [ref=e210]: "3"
                  - text: For example, when a company decides to break into a fast-growing market, it often forgets to consider its competitors are likely to do the same, leading to an underestimation of risk.
                - paragraph [ref=e211]:
                  - text: More generally, we often make
                  - strong [ref=e212]:
                    - link "attribution errors" [ref=e213] [cursor=pointer]:
                      - /url: https://thedecisionlab.com/biases/fundamental-attribution-error
                  - text: "when considering our successes and failures. Whereas we tend to ascribe positive outcomes to our talents and hard work, we attribute negative outcomes to factors beyond our control. This makes us less likely to consider previous failures: we believe those instances were not our fault, and we convince ourselves that the external factors that caused us to fail will not reoccur."
                  - superscript [ref=e214]: "4"
                - heading "We face social pressure" [level=3] [ref=e215]:
                  - strong [ref=e216]: We face social pressure
                - paragraph [ref=e217]:
                  - text: Organizational pressure to finish projects quickly and without hiccups is a major reason that the planning fallacy can be so detrimental. Workplace cultures can often be highly competitive, and there may be hidden costs for individuals who voice less enthusiastic opinions about a project or who insist on a longer timeline than others. At the same time, executives might favor the most overly optimistic predictions over others,
                  - strong [ref=e218]:
                    - link "incentivizing" [ref=e219] [cursor=pointer]:
                      - /url: https://thedecisionlab.com/biases/incentivization
                  - text: individuals to engage in inaccurate, intuition-based planning.
            - generic [ref=e220]:
