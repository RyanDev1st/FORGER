            - generic [ref=e288]:
              - heading "Why it is important" [level=2] [ref=e290]
              - generic [ref=e291]:
                - paragraph [ref=e292]:
                  - text: The planning fallacy has consequences for both our professional and personal lives,
                  - strong [ref=e293]:
                    - link "nudging" [ref=e294] [cursor=pointer]:
                      - /url: https://thedecisionlab.com/newsletters/the-continued-controversy-of-nudging
                  - text: "us to invest our time and money in ill-fated ventures and keeping us tethered to those projects for far too long. Research has demonstrated how widespread this bias is: In the business world, it has been found that more than 80% of start-up ventures fail to achieve their initial market-share targets."
                  - superscript [ref=e295]: "3"
                  - text: Meanwhile, in classrooms, students report finishing about two-thirds of their assignments later than expected.
                  - superscript [ref=e296]: "4"
                - paragraph [ref=e297]:
                  - text: In some fields, such as venture capital, high failure rates are often ascribed to normal levels of risk and seen as proof that the system is working as it should. However, cognitive scientists such as Dan Lovallo and
                  - strong [ref=e298]:
                    - link "Daniel Kahneman" [ref=e299] [cursor=pointer]:
                      - /url: https://thedecisionlab.com/thinkers/economics/daniel-kahneman
                  - text: believe that these figures have much more to do with cognitive biases such as the planning fallacy.
                  - superscript [ref=e300]: "3"
                  - text: If more people were aware of the planning fallacy, they could take steps to counteract it, such as the ones described below.
            - generic [ref=e302]:
              - heading "How to avoid it" [level=2] [ref=e304]
              - generic [ref=e305]:
                - paragraph [ref=e306]:
                  - text: Merely being aware of the planning fallacy is not enough to stop it from happening.
                  - superscript [ref=e307]: "5"
                  - text: Even if we have this knowledge, we still risk falling into the trap of believing that this time, the rules won’t apply to us. Most of us strongly prefer to follow our gut, even if its forecasts have been wrong in the past. What we can do is plan around the planning fallacy and build steps into the planning process that can help us avoid it.
                - heading "Take the outside view" [level=3] [ref=e308]:
                  - strong [ref=e309]: Take the outside view
                - paragraph [ref=e310]:
                  - text: "When planning, we use two “types” of information:"
                  - strong [ref=e311]: singular information
                  - text: and
                  - strong [ref=e312]: distributional information
                  - text: . Singular information is evidence related to the specific case under consideration, whereas distributional information is evidence related to similar tasks completed in the past.
                  - superscript [ref=e313]: "5"
                  - text: These perspectives are also referred to as the inside and outside views, respectively.
                  - superscript [ref=e314]: "3"
                - paragraph [ref=e315]:
                  - text: Ideally, we should consider both singular and distributional information when planning. The planning fallacy is more likely to arise when we rely solely on the inside view—that is when we disregard external information about how likely we are to succeed and instead trust our intuitive predictions about how costly a project will be. Unfortunately, this is exactly what many of us tend to do. Because planning is an inherently future-oriented process, we are inclined to look forward, rather than backward, in time. This leads us to disregard our past experiences.
                  - superscript [ref=e316]: "4"
                - paragraph [ref=e317]:
                  - text: Supplementing planning processes with outside data, wherever possible, is a solid way to temper expectations for a project.
                  - superscript [ref=e318]: "3"
                  - text: If an organization or individual has completed similar projects in the past, they can use the outcomes of those previous experiences to set goals for new ones. It is just as useful to look outside one’s own experiences and see how others have fared.
                - paragraph [ref=e319]:
                  - text: The strategy of taking an outside view is the basis behind reference class forecasting, which requires forecasters to make predictions based on the outcomes of comparable projects rather than relying on goal-based plans for the current project. Reference class forecasting has been shown effective at reducing both time and cost overruns in both small-scale personal tasks and large-scale construction projects.
                  - superscript [ref=e320]: "15"
                  - text: The main point is to make a deliberate effort not to rely solely on intuition when making predictions about a project.
                - heading "Set implementation intentions" [level=3] [ref=e321]:
                  - strong [ref=e322]: Set implementation intentions
                - paragraph [ref=e323]: Another strategy for combating the planning fallacy is illustrated by a study from the Netherlands, where study participants were given a writing assignment and told to complete it within a week. The participants were split into two groups. Both groups were instructed to set goal intentions, indicating what day they intended to start writing the paper and what day they believed they would finish. However, the second group also set implementation instructions, specifying what time of day and in what location they would write. They were asked to visualize themselves following through on their plan.
                - paragraph [ref=e324]:
                  - text: Researchers found that setting specific implementation intentions resulted in significantly more realistic goal-setting.
                  - superscript [ref=e325]: "7"
                  - text: At the same time, doing so did not lessen the participants’ optimism; on the contrary, they were even more confident in their ability to meet their goals. They also reported fewer interruptions while they were working. This may be because the process of thinking through the specifics of completing the task at hand resulted in a stronger commitment to following through with one’s plan. These results show that optimism is not incompatible with realism as long as it is combined with a carefully thought-out plan.
                - heading "Use the segmentation effect for better estimates" [level=3] [ref=e326]:
                  - strong [ref=e327]: Use the segmentation effect for better estimates
                - paragraph [ref=e328]:
                  - text: "A related strategy involves breaking up big projects into their component parts, and then planning for the completion of the smaller subtasks instead of the project as a whole. As bad as we are at estimating the amount of time required for relatively large tasks, research has shown that we are much better at planning for small ones: often, our estimates are remarkably accurate, and at worst, they are overestimates."
                  - superscript [ref=e329]: "9"
                  - text: "This is a much safer strategy: In practice, it’s much better to overestimate the amount of time needed for a project than to allocate too little."
            - generic [ref=e331]:
              - heading "FAQ" [level=2] [ref=e333]
              - generic [ref=e334]:
                - heading "What is the difference between the planning fallacy and optimism bias?" [level=3] [ref=e335]:
                  - strong [ref=e336]: What is the difference between the planning fallacy and optimism bias?
                - paragraph [ref=e337]:
                  - text: Both the planning fallacy and
                  - strong [ref=e338]:
                    - link "optimism bias" [ref=e339] [cursor=pointer]:
                      - /url: https://thedecisionlab.com/biases/optimism-bias
                  - text: describe our tendency to overestimate the likelihood of experiencing positive outcomes. While closely related, these two biases influence our behavior a little differently. The planning fallacy causes us to underestimate the time or cost required to complete a task (despite past experience suggesting otherwise), while the optimism bias describes our broader tendency to be overly optimistic, especially when estimating the probability of experiencing positive vs. negative events. For instance, university students tend to expect higher starting salaries and more job offers than they end up getting.
                  - superscript [ref=e340]: "18"
                  - text: That’s the optimism bias at work. Although the planning fallacy is often driven partly by optimism bias—focusing on best-case scenarios and overlooking potential setbacks—it is specific to project planning and predicting task outcomes rather than a broadly optimistic view of the future.
                - heading "What is a potential positive outcome of the planning fallacy?" [level=3] [ref=e341]:
                  - strong [ref=e342]: What is a potential positive outcome of the planning fallacy?
                - paragraph [ref=e343]:
                  - text: While the planning fallacy most frequently leads to negative outcomes like project delays or cost overruns, it
                  - emphasis [ref=e344]: can
                  - text: sometimes have positive effects. More specifically, the optimistic aspect of the planning fallacy can be motivating, especially when facing complex projects. Maintaining a positive outlook can help us pursue challenging tasks that we might otherwise have avoided after a close look at the potential obstacles. For example, people who are optimistic are more motivated to engage in beneficial behaviors like healthy eating and exercise, suggesting that an optimistic attitude—and slightly underestimating the work involved—can motivate us to tackle high-effort personal goals.
                  - superscript [ref=e345]: "19"
                - paragraph [ref=e346]: The problem is that this initial optimism can backfire when we realize that a task is taking longer than we initially anticipated, ultimately leading to feelings of overwhelm and discouragement. In other words, a little optimism can help us get the ball rolling, but without grounding our plans in reality, too much optimism can set us up for disappointment.
            - generic [ref=e348]:
              - heading "How it all started" [level=2] [ref=e350]
              - generic [ref=e351]:
                - paragraph [ref=e352]:
                  - text: The planning fallacy was first proposed by
                  - strong [ref=e353]:
                    - link "Daniel Kahneman" [ref=e354] [cursor=pointer]:
                      - /url: https://thedecisionlab.com/thinkers/economics/daniel-kahneman
                  - text: and
                  - strong [ref=e355]:
                    - link "Amos Tversky" [ref=e356] [cursor=pointer]:
                      - /url: https://thedecisionlab.com/thinkers/economics/amos-tversky
                  - text: ", two foundational figures in the field of behavioral economics. In a 1977 paper, Kahneman and Tversky argued that, when making predictions about the future, people tend to rely largely on intuitive judgments that are often inaccurate. However, the types of errors that people make are not random, but systematic, indicating that they result from uniform cognitive biases."
                - paragraph [ref=e357]:
                  - text: In this paper, Kahnemany & Tversky brought up planning as an example of how bias interferes with our forecasts for the future. “Scientists and writers,” they said, drawing from experience, “are notoriously prone to underestimate the time required to complete a project, even when they have considerable experience of past failures to live up to planned schedules.” They named this phenomenon the “planning fallacy” and argued that it arose from our tendency to ignore distributional (outside) data.
                  - superscript [ref=e358]: "5"
                - paragraph [ref=e359]:
                  - text: Following Kahneman and Tversky’s introduction of the planning fallacy, researchers Roger Buehler and Dale Griffin conducted one of the first experimental studies on the phenomenon in 1994.
                  - superscript [ref=e360]: "4"
                  - text: In this early study, psychology students were asked to estimate how long it would take to finish their senior thesis. Overwhelmingly, the students’ average completion time was much longer than their estimated time, even when they planned for the worst-case scenario. In the end, only 30% of students completed their projects in the time they predicted.
            - generic [ref=e362]:
              - heading "How it affects product" [level=2] [ref=e364]
              - generic [ref=e365]:
                - paragraph [ref=e366]: The planning fallacy can create issues at any stage of product development. For many companies, a major concern is budgeting for new ventures. Whether it's a need for additional resources, changes in material costs, or unexpected technical challenges, costs can escalate far beyond initial budgets.
                - paragraph [ref=e367]
                - paragraph [ref=e368]:
                  - text: Though findings are mixed, various techniques have been proposed to avoid the planning fallacy during product development. Instructing those involved in a particular project to imagine both the “best case” as well as possible pitfalls and obstacles can be effective. However, it is also likely that individuals will still be hesitant to incorporate negative information. More successfully, encouraging individuals to imagine aggregate sets of events rather than making predictions based on a sole instance can mitigate the fallacy’s effects. For example, in the context of a project timeline, a team would want to look at temporal data for similar ventures rather than one past project.
                  - superscript [ref=e369]: "13"
            - generic [ref=e371]:
              - heading "The planning fallacy and AI" [level=2] [ref=e373]
              - generic [ref=e374]:
                - paragraph [ref=e375]:
                  - text: When provided with accurate data, artificial intelligence can help to limit the effects of the planning fallacy. For example, machine learning models can be trained on past project data to predict the duration and costs of similar projects. Researchers have already formed mathematical models in order to account for human
                  - link "biases" [ref=e376] [cursor=pointer]:
                    - /url: https://thedecisionlab.com/biases
                  - text: in planning and optimism.
                  - superscript [ref=e377]: "14"
                  - text: The inclusion of AI could not only speed this process along, but provide a more accurate and integrated approach to planning.
                - paragraph [ref=e378]: While AI can aid in mitigating the planning fallacy, it's crucial to remember that AI models themselves can be overly optimistic or biased based on the data they're trained on. This can create an entirely new version of the planning fallacy wherein we trust AI predictions prior to critically evaluating them – trusting them as an entirely unbiased source.
            - generic [ref=e380]:
              - heading "Example 1 – The Sydney Opera House" [level=2] [ref=e382]
              - generic [ref=e383]:
                - paragraph [ref=e384]:
                  - text: Now one of the most iconic man-made structures in the world, the construction of the Sydney Opera House was mired with delays and unforeseen difficulties that caused the project to drag on for a decade longer than planned. The original projected cost was $7 million; by the time it was done, it had cost $102 million.
                  - superscript [ref=e385]: "4"
                - paragraph [ref=e386]: "The Australian Government insisted that construction begin early, wanting to break ground, while public opinion about the Opera House was still favorable and funding was still in place. However, the architect had not yet completed the final plans, leading to major structural issues that had to be addressed down the road, slowing the project down and inflating the budget. One major problem: the original podium was not strong enough to support the House’s famous shell-shaped roof and had to be rebuilt entirely."
                - paragraph [ref=e387]:
                  - text: Joseph Cahill, the politician who had championed the Opera House, rushed construction along out of fear that political opposition would try to stop it.
                  - superscript [ref=e388]: "9"
                  - text: In his enthusiasm, he disregarded criticisms of the project and relied on intuitive forecasts for its costs. While the building, when it was eventually finished, was beautiful and distinctive, it would have been prudent to slow down and take the outside view in planning.
            - generic [ref=e390]:
              - heading "Example 2 – The Canadian Pacific Railway" [level=2] [ref=e392]
              - generic [ref=e393]:
                - paragraph [ref=e394]:
                  - text: In 1871, the colony of British Columbia agreed to become a part of Canada. In exchange for joining the Confederation, it was promised that a transcontinental railway connecting BC to Eastern Canada would be completed by 1881.
                  - superscript [ref=e395]: "4"
                  - text: In the end, the railway was not completed until 1885 and would require an additional $22.5 million in loans than originally predicted.
                  - superscript [ref=e396]: "10"
                - paragraph [ref=e397]: In initially planning the railway, its proponents had apparently not considered how difficult it would be to build through the Canadian Shield, as well as through the mountains of BC. Additionally, there was an inadequate supply of workers to build the railroad in British Columbia. The railroad was eventually built by around 15,000 Chinese laborers, who worked in extremely harsh conditions for very little pay.
            - generic [ref=e399]:
              - heading "Summary" [level=2] [ref=e401]
              - generic [ref=e402]:
                - heading "What it is" [level=5] [ref=e403]
                - paragraph [ref=e404]: The planning fallacy describes how we are likely to underestimate the costs of a project, such as how long it will take and how much it will cost.
                - heading "Why it happens" [level=5] [ref=e405]
                - paragraph [ref=e406]: The human brain is generally biased towards positivity, leading us to make overly optimistic predictions about our projects, as well as to disregard information that contradicts our optimistic beliefs. Once we have set unrealistic plans, other biases, such as anchoring, compel us to stick with them. Pressure from team members, superiors, or shareholders to get things done quickly and smoothly also makes it more costly for us to revise our plans partway through a project.
                - 'heading "Example #1 – The Sydney Opera House" [level=5] [ref=e407]'
                - paragraph [ref=e408]: The Sydney Opera House is a famous example of the planning fallacy because it took 10 years longer and nearly $100 million more to complete than was originally planned. One major reason was the government’s insistence on starting construction early, despite the fact that plans were not yet finished.
                - 'heading "Example #2 – The Canadian Pacific Railway" [level=5] [ref=e409]'
                - paragraph [ref=e410]: The Canadian Pacific Railway was finished four years late and more than $20 million over budget, largely because of a failure to plan for the difficulties of building through mountain ranges and over the Canadian Shield.
                - heading "How to avoid it" [level=5] [ref=e411]
                - paragraph [ref=e412]: The planning fallacy is best avoided by incorporating outside information into the planning process rather than relying solely on intuition. Other strategies, such as setting specific intentions to implement a plan, envisioning oneself carrying out the plan, and segmenting large projects into smaller subtasks, can also help generate more accurate estimates of how costly something will be.
            - generic [ref=e414]:
              - heading "Related TDL articles" [level=2] [ref=e416]
              - generic [ref=e417]:
                - heading "Why You Might Not Be Sticking To Your Plans" [level=5] [ref=e418]:
                  - link "Why You Might Not Be Sticking To Your Plans" [ref=e419] [cursor=pointer]:
                    - /url: /insights/health/might-not-sticking-plans
                - paragraph [ref=e420]: This article explores a few reasons why people often fail to follow through with their plans, including the planning fallacy. Another potential explanation is the Dunning-Kruger effect, which describes how people with low ability tend to overestimate their own skills. The author also discusses the importance of planning for less-than-ideal scenarios, as well as setting implementation intentions.
                - heading "The Key to Effective Teammates Isn’t Them. It’s You." [level=5] [ref=e421]:
                  - link "The Key to Effective Teammates Isn’t Them. It’s You." [ref=e422] [cursor=pointer]:
                    - /url: /insights/hr/the-key-to-effective-teammates-isnt-them-its-you
                - paragraph [ref=e423]: As discussed above, one reason the planning fallacy is so common is because of pressures in the workplace and other environments to overachieve, and to always strive for perfection. This article discusses the importance of being authentically ourselves, at work and elsewhere. When we act in a way that prioritizes genuine social connection over our own egos, we help others feel safe to do the same. By checking in with ourselves and our motivations, asking ourselves whether we are acting in accordance with our values and beliefs, we can create an atmosphere more accepting of imperfections.
