$schema: 'http://json-schema.org/draft-07/schema#'
$id: 'forger://schemas/risk_map'
type: object
required: [assumptions, mechanisms, known_failure_modes]
properties:
  assumptions:
    type: array
    items:
      type: object
      required: [id, description, severity, resolution_required, status]
      properties:
        id:                  { type: string }
        description:         { type: string }
        severity:            { enum: [trivial, low, medium, high, critical] }
        evidence_refs:       { type: array, items: { type: string } }
        resolution_required:
          enum:
            - none
            - source
            - source+reasoning
            - source+probe
            - source+probe+acceptance_test
        status:
          enum:
            - unresolved
            - probed_ok
            - probed_fail
            - waived
            - verified
        probe_id:      { type: string }
        waiver_reason: { type: string }
  mechanisms:
    type: array
    items:
      type: object
      required: [id, name, description, source_refs]
      properties:
        id:          { type: string }
        name:        { type: string }
        description: { type: string }
        source_refs: { type: array, items: { type: string } }
  known_failure_modes:
    type: array
    items:
      type: object
      required: [id, description, conditions, detection_method]
      properties:
        id:               { type: string }
        description:      { type: string }
        conditions:       { type: string }
        detection_method: { type: string }
