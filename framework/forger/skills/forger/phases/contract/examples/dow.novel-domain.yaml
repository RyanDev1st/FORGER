# schema: ../../../schemas/definition_of_works.schema.yaml
# Worked example: novel-domain DoW.
# Scenario: clinical pilot of a medication-dose calculator for a small
# nursing team. Novel domain (no KB), several safety-critical failure modes.
# Mode: deep (auto-picked via mode_select_heuristic Rule 2).
meta:
  id: medication-dose-calculator-pilot
  created_at: '2026-05-20T15:08:47Z'
  user_query_verbatim: |
    Build us a medication-dose calculator for a clinical pilot at one ward.
    Three nurses will use it on a shared tablet. Input is patient weight,
    drug name, indication; output is the suggested dose with the rule that
    produced it. Needs to be reliable enough for a supervised pilot.
  mode: deep
  domain_slug: medication-dose-calculator
  mode_picked_by: auto

artifact:
  type: system
  format: 'Web app served from a single low-traffic instance, with a paper-trail audit log file.'
  description: |
    A web app that takes patient weight (kg), drug (from a curated list),
    and indication, and returns the suggested dose plus the literal rule
    used and its source citation. Every calculation is appended to an
    append-only audit log with timestamp, inputs, output, and the rule ID.
    No prescription is executed automatically; the nurse always
    countersigns on paper.

audience:
  who: 'Three registered nurses on Ward 4 during a supervised six-week pilot, with one supervising physician on call.'
  use_case: |
    A nurse types the patient weight, drug, and indication into the tablet
    at the medication trolley. The app returns the suggested dose and the
    rule it used. The nurse compares against the paper drug chart and the
    on-call physician's expectation before administering. The audit log is
    reviewed weekly by the pilot lead.

hard_constraints:
  - id: hc-1
    description: |
      Every calculation must display the rule applied (e.g., "0.5 mg / kg up
      to a 50 mg ceiling for adults >= 18") and a citation of its source.
      No dose may be shown without its rule.
    verification_method: |
      Acceptance test asserts that every response includes non-empty rule
      text and a citation_id resolvable to a record in the curated rule set.
  - id: hc-2
    description: |
      The app must refuse to calculate a dose when any input is missing,
      out of the validated range, or when the patient/drug combination is
      not in the curated rule set. Refusals must be explicit, not silent.
    verification_method: |
      Acceptance test exercises out-of-range weights, blank fields, and
      unknown drugs; asserts the response carries an explicit refusal code
      and a human-readable reason.
  - id: hc-3
    description: |
      All calculations are appended to an append-only audit log persisted
      to disk before the response returns to the user.
    verification_method: |
      Acceptance test issues N calculations, kills the server, restarts,
      and verifies the audit log contains exactly N entries in order.
  - id: hc-4
    description: |
      No identifiable patient data leaves the device. The app runs on a
      single trusted server inside the hospital network and stores only
      patient weight, never name or identifier.
    verification_method: |
      Inspect the schema of audit log + database; assert no name / ID /
      MRN fields. Network egress test asserts the app makes no outbound
      requests during a calculation.

success_criteria_measurable:
  - id: sc-m-1
    metric: 'agreement with the curated rule set on a held-out validation table of 200 (drug, indication, weight) triples'
    threshold: '200/200 exact match on dose AND rule cited'
    test_method: |
      A pytest run iterates the validation table and asserts dose and
      rule_id match; any divergence fails the suite.
  - id: sc-m-2
    metric: 'p99 response latency from button press to dose displayed, on the pilot tablet over wifi'
    threshold: '<= 800 ms'
    test_method: |
      A Playwright script drives the pilot tablet through 100 calculations
      with realistic input; p99 of measured render-completion times is
      computed and asserted.
  - id: sc-m-3
    metric: 'percentage of audit-log entries that survive a forced restart mid-write'
    threshold: '100% of entries that received a 2xx response are present after restart'
    test_method: |
      A fault-injection test issues 50 calculations, with each second
      calculation triggering a process kill 50 ms after the response; on
      restart, every entry that completed must be replayable from the log.

success_criteria_subjective:
  - id: sc-s-1
    criterion: |
      The three pilot nurses report the UI as "no harder to use than the
      existing paper chart" in the week-two and week-four pilot surveys.
    measurement_protocol: |
      Anonymous 5-point Likert survey administered at end of week 2 and
      week 4; median response >= 4 on both rounds. Free-text comments
      reviewed by pilot lead for blocking concerns.
  - id: sc-s-2
    criterion: |
      The supervising physician judges the rule-citation display
      sufficient to override any single calculation without consulting the
      developer.
    measurement_protocol: |
      Pilot lead walks the physician through 20 sample outputs in week 1;
      physician confirms each is interpretable on its own.

unacceptable_failure_modes:
  - id: ufm-1
    description: |
      The app returns a numerically incorrect dose for any input within
      the validated range. A wrong dose administered to a patient is a
      direct safety event.
    detection_method: |
      sc-m-1 (validation-table test) is the primary canary. In production,
      every audit-log entry is re-checked nightly against the curated rule
      set; any divergence triggers a pilot pause.
    safety_critical: true
  - id: ufm-2
    description: |
      The app silently accepts an input outside the validated range
      (e.g., negative weight, weight above the curated table's ceiling)
      and returns a dose anyway, instead of refusing.
    detection_method: |
      Acceptance tests under hc-2 cover all known boundary inputs. Audit
      log review flags any calculation whose input falls outside the
      validated range.
    safety_critical: true
  - id: ufm-3
    description: |
      An audit log entry is lost: a dose is administered for which no
      record exists, breaking the supervisory trail.
    detection_method: |
      sc-m-3 (fault-injection test) covers the crash case. In production,
      the nurse's paper countersignature is reconciled against the audit
      log at end of shift; any missing entry triggers an investigation.
    safety_critical: true
  - id: ufm-4
    description: |
      Identifiable patient data leaks into the audit log or off the device.
    detection_method: |
      hc-4 verification (schema inspection + egress test) is the canary.
      Quarterly security review re-runs the egress test.
    safety_critical: true

reframe_memo:
  original_framing: |
    A medication-dose calculator app that nurses use on a tablet during
    the medication round.
  alternative_framings:
    - |
      A paper rule-card laminator: print the curated rule set onto a
      laminated reference card and skip the app entirely. Pilot tests
      whether the new rule set is correct; the app is added only if
      paper proves insufficient.
    - |
      A read-only rule-lookup tool: the nurse types drug + indication and
      sees the rule, but computes the dose mentally from the displayed
      formula. The app never displays a numeric dose, so it cannot
      mis-calculate one.
    - |
      A double-entry calculator that asks the nurse to type the dose they
      expect, then shows agreement / disagreement with the curated rule.
      The app does not propose a dose; it cross-checks the nurse's.
  chosen_framing: |
    Keep the original framing (app proposes a dose), but treat the
    read-only and double-entry alternatives as fall-back designs to
    pivot to if any safety-critical failure mode proves hard to suppress
    during pilot.
  rationale: |
    The original framing matches the clinical workflow the pilot lead
    asked for and gives the audit trail a clear shape. The alternatives
    were preserved because two of the four unacceptable failure modes are
    safety-critical; if mitigation proves brittle, retreating to "read-only
    rule lookup" or "double-entry cross-check" removes the
    silent-mis-calculation risk entirely. Deep mode is mandatory here.

assumptions:
  - id: a-1
    description: |
      The curated rule set provided by the pharmacy is itself correct and
      authoritative for the drugs in scope.
    severity: critical
    status: unverified
  - id: a-2
    description: |
      The pilot tablet's wifi is reliable enough that 800 ms p99 latency
      is achievable; if not, sc-m-2 must be re-thought.
    severity: medium
    status: unverified
  - id: a-3
    description: |
      "Append-only" on the hospital's tablet filesystem is genuinely
      atomic for our payload size; we have not verified the storage class
      of the issued device.
    severity: high
    status: unverified
