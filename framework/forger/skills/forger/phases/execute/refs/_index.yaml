# EXECUTE refs router — load-on-demand catalogue.
#
# Phase SKILL.md and procedure files point here before reading any ref.
# Load only entries whose `triggers` match the current situation.

refs:
  - file: tdd_micro_cycle.md
    summary: RED-GREEN-IMPROVE discipline with concrete examples of "right reason" RED, minimal GREEN, and bounded IMPROVE plus the anti-pattern list.
    load_when: >
      You are inside the code/system branch loop (`procedure/branch_code.md`)
      and the criterion-under-test is non-trivial (no single obvious
      one-liner that would pass it). Especially useful when the
      criterion crosses module boundaries or asserts behavior under a
      condition the existing code does not currently encounter.
    triggers: [step_2_RED, non_trivial_criterion, branch_code_first_loop]
    worked_examples:
      - "Criterion asserts behavior under a race condition. Need to write a deterministic RED first — load to see the patterns for deterministic concurrency assertions."
      - "Criterion crosses 3 modules. Single test? Multiple tests? — load for the boundary heuristic."
      - "First criterion of the run, no muscle memory yet for what 'minimal GREEN' means in this codebase — load."

  - file: done_means_ran_rubric.md
    summary: Completion checklist per artifact branch, mirroring exactly what the Stop hook enforce_done_means_ran.mjs checks.
    load_when: >
      You are about to claim the run is complete in your final
      message and want to triple-check the Stop hook won't block.
      Always load before the final completion message in your turn;
      the cost of loading is trivial compared to a Stop block.
    triggers: [before_final_completion_claim, every_run]
    worked_examples:
      - "All gates report green but you want to confirm the Stop hook sees the same. Load to walk the exact check the hook does."
      - "Criterion landed `passed: true` on attempt 3 of 3 but you suspect the line might have been from a stale acceptance run. Load to see what 'latest line' means in the hook's view."

  - file: escalation_protocol.md
    summary: When to write escalation.md, the template for its content, and the orchestrator's handling rules.
    load_when: >
      You are at the 3rd failed retry on a stuck criterion, OR you
      are at the 3rd fact-gap attempt (cap exceeded), OR the failure
      mode is one the user would want to decide on rather than the
      executor.
    triggers: [retry_exhausted, fact_gap_cap_exceeded, user_decision_required]
    worked_examples:
      - "3rd RED attempt on the same criterion keeps failing for a different reason each time — load to see the escalation template."
      - "Re-entry counter hit 3 and the addendum mechanism refuses to take a 3rd — load to write escalation.md."
      - "Criterion can't be met without changing the DoW. DoW is immutable inside the run — load to escalate."
