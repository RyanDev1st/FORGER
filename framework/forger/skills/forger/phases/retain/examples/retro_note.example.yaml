failed_assumptions:
  - id: asm-destroyed-writable-leak-magnitude
    description: |
      OBSERVE assumed the destroyed-writable memory leak reported in
      community issues would grow fast enough for our one-minute
      regression canary to catch it. EXECUTE's actual benchmark showed
      the leak grew at roughly half the assumed rate; the one-minute
      window missed it on three of five runs.
    lesson_learned: |
      The leak-detection canary needs a five-minute window for this
      pattern, not one minute. Future tasks in node-streams that wire
      memory-regression detection should default to a longer canary
      window and treat one minute as an explicit lower bound only when
      the leak rate is independently established.
    scope: domain-wide

