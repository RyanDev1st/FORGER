# GRILL refs router — load-on-demand catalogue.
#
# Phase SKILL.md and procedure files point here before reading any ref.
# Load only entries whose `triggers` match the current situation.

refs:
  - file: adversary_mandate.md
    summary: Non-blind reviewer system prompt — full text concatenated with workspace artifacts to drive the reviewer.
    load_when: >
      You are at step 2 of `procedure/main.md` composing the system
      prompt. Load verbatim (do not summarize, do not paraphrase) —
      the prompt is calibrated to the response shape the parser in
      step 4 expects.
    triggers: [step_2_compose_prompt, reviewer_invocation]
    worked_examples:
      - "First reviewer call of this run — load the mandate to get the verbatim system prompt and the expected YAML response shape."

  - file: blind_adversary_mandate.md
    summary: Deep-mode blind reviewer system prompt — DoW-only context, no proposal exposure.
    load_when: >
      You are at step B1 of `procedure/blind_reviewer.md` (deep mode
      only). Load verbatim. The mandate explicitly tells the
      reviewer to ignore the absence of a proposal and generate
      failure modes from the DoW alone.
    triggers: [deep_mode_blind_pass, blind_invocation]
    worked_examples:
      - "Deep mode, blind reviewer about to be called. Load the blind mandate (not the non-blind one) so the prompt does not accidentally reference proposal context."

  - file: failure_hypothesis_template.md
    summary: Canonical failure_hypothesis entry shape with field-by-field commentary; mirrors the schema for easy human reference.
    load_when: >
      You are parsing the reviewer's response in step 4 of
      `procedure/main.md` (or step B3 of blind_reviewer.md) and the
      reviewer's structure does not cleanly map to the schema fields
      (`hypothesis`, `what_disproves`, `minimal_test`,
      `severity_if_wrong`, `confidence`).
    triggers: [parsing_reviewer_response, field_mapping_ambiguous]
    worked_examples:
      - "Reviewer returned prose, not YAML — load template to translate each prose paragraph into the canonical entry shape."
      - "Reviewer's `severity_if_wrong` uses different language than the schema enum — load to find the closest mapping."
