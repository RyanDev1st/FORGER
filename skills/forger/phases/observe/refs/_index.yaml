# OBSERVE refs router — load-on-demand catalogue.
#
# Phase SKILL.md and procedure files point here before reading any ref.
# Load only entries whose `triggers` match the current situation.

refs:
  - file: feynman_gate_template.md
    summary: Section headers and content requirements for ground_truth_brief.md (≥200-word plain-language domain brief).
    load_when: >
      You are at step 2 of `procedure/main.md` and about to write the
      Feynman brief. Especially useful when the domain has dense jargon
      you have not had to define from memory before.
    triggers: [step_2_feynman, brief_template_needed, jargon_dense_domain]
    worked_examples:
      - "Domain is distributed-consensus algorithms — terms like 'leader election', 'quorum', 'log replication' all need inline definition. Load template."
      - "Domain is a vendor-specific API — first time writing a brief for it, no muscle memory for section structure yet. Load."
      - "You started writing but hit 150 words and ran out of substance — load to see what required sections you're missing."

  - file: risk_map_construction.md
    summary: Five-step algorithm for turning claim_ledger into risk_map.yaml + worked examples for each severity row.
    load_when: >
      You are at step 3 of `procedure/main.md` and need to decide
      `resolution_required` for a borderline assumption, OR a claim's
      severity is ambiguous and you need the algorithm to walk the
      decision.
    triggers: [step_3_risk_mapping, resolution_required_ambiguous, borderline_severity]
    worked_examples:
      - "Assumption has severity 'medium' but `weakly_supported` entailment from a single source — does `source+reasoning` suffice or does it need a probe? Load."
      - "Claim is `critical` severity but you have 3 independent sources all directly_supported — does it still need a probe? Load (probably yes, but algorithm clarifies)."

  - file: probe_design_patterns.md
    summary: Six probe patterns (script / repo_clone / web_search / prototype_fn / benchmark / api_test) with command shapes, evidence capture, and pitfalls.
    load_when: >
      You are at step 4 of `procedure/main.md` and about to design a
      probe — and the pattern is not obvious from the assumption's
      shape. Always load for your first probe of a run; reuse the
      pattern table from memory for subsequent probes if the shape
      matches.
    triggers: [step_4_probe_design, first_probe_of_run, unfamiliar_probe_shape]
    worked_examples:
      - "Assumption is 'library X handles 10k concurrent connections' — benchmark pattern. Load to see the evidence-capture requirements (latency histogram, error rate, resource use)."
      - "Assumption is 'API endpoint Y returns shape Z' — api_test pattern. Load to confirm the --cmd shape for curl + JSON-schema assertion."
      - "Assumption is 'algorithm Z converges in O(log n)' — prototype_fn pattern. Load to see how to design the minimal reproduction."
