# RECOMBINE refs router — load-on-demand catalogue.
#
# Phase SKILL.md and procedure files point here before reading any ref.
# Load only entries whose `triggers` match the current situation.

refs:
  - file: mechanism_fit_checklist.md
    summary: Five-question checklist every Tier 1 idea must answer before promotion — anchors what `ok` vs `partial` vs `broken` means per question.
    load_when: >
      You are at step 2 of `procedure/main.md` and the
      `mechanism_fit_check` verdict is ambiguous — the source-domain
      and target-domain look similar but the transfer evidence is
      thin, OR the transfer risks list multiple conditions and you
      cannot tell if any one is disqualifying.
    triggers: [step_2_fit_check, fit_verdict_ambiguous, partial_vs_broken_decision]
    worked_examples:
      - "Source: 'cache hit ratio drops with high entropy keys'. Target: 'our incoming user-id keys are hashed, low entropy'. Fit ok or partial? — load to walk the checklist."
      - "Source mechanism cited by 3 claims, target mechanism cited by 1 weakly_supported claim. Fit verdict feels like partial but transfer_risks is empty — load."

  - file: tier_ladder.md
    summary: Boden's three creativity tiers (combinational / exploratory / transformational) mapped to the FORGER tier files plus practical disposition notes.
    load_when: >
      You are unsure which tier an idea belongs in — especially when
      it has Tier 1 mechanism support but also challenges a DoW
      assumption (looks like Tier 3), OR when you are tempted to
      promote a Tier 2 entry inline (you cannot — orchestrator/user
      only).
    triggers: [tier_assignment_ambiguous, promotion_question, boden_taxonomy_needed]
    worked_examples:
      - "Idea recombines two well-grounded mechanisms AND assumes a DoW assumption is wrong. Tier 1 + Tier 3 simultaneously? — load."
      - "Idea has 1 claim_ref + a strong validation plan. Tier 1 (below gate 3 floor) or Tier 2 (with the plan)? — load."

  - file: blending_patterns.md
    summary: Fauconnier-Turner four-space conceptual blending model with three worked blends as templates.
    load_when: >
      You are at step 1 of `procedure/main.md` building the element
      catalog, and have plenty of raw blocks but no obvious way to
      combine them, OR a Tier 1 candidate is sterile (mechanism fits
      but the idea is just a restatement of one source) and you need
      a generative pattern.
    triggers: [combination_block, sterile_recombination, blending_template_needed]
    worked_examples:
      - "Element catalog has 15 blocks but every Tier 1 candidate is a single-block restatement. Need a true cross-domain blend — load."
      - "You're forcing two unrelated mechanisms together and the fit_check keeps coming back broken — load to see if a different blending shape fits."
